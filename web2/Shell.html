<script>
/**
 * What ERP 2.0 adds to the new design's shell. Loaded after web/Shell.html, on the 2.0 face
 * only (server/page.js).
 *
 * Like web/Shell.html it reaches the portal only through the DOM and changes no behaviour:
 * every screen, button, permission and document is JavaScript.html's. So far it does three
 * things:
 *
 *   - names the Service Due Calls screen "SDR", as PIE asked for 2.0: in the menu, on the
 *     screen's heading, in the breadcrumb and in the browser tab;
 *   - marks the app's name "2.0";
 *   - adds the light/dark switch to the top bar. The choice is the person's, kept on their
 *     browser (localStorage "erp.theme"); web2/Theme.html applies it before the page is drawn.
 *
 * Every part is wrapped, as in web/Shell.html, so a fault here costs a decoration and never a
 * screen. What 2.0 changes in how a screen is worked (the SDR rows) is JavaScript.html's, behind
 * its FACE_V2 flag — see web2/README.md.
 */
(function () {
  "use strict";

  /** Screens 2.0 names differently. The screen, its server calls and its address are unchanged. */
  var RENAME = {
    servicedue: { from: "Service Due Calls", to: "SDR" },
    // The demo's names for these screens, on their headings too (JavaScript.html names them in the menu).
    service: { from: "Service Jobs", to: "Service Desk" },
    amc: { from: "AMC", to: "AMC & Dues" },
    catalog: { from: "Catalog", to: "Catalogue" }
  };

  function $(id) { return document.getElementById(id); }
  function safely(what, fn) {
    try { fn(); } catch (e) { if (window.console) console.warn("[2.0 shell] " + what + ": " + (e && e.message)); }
  }

  /** The text node a menu button carries its words in — after the icon web/Shell.html adds. */
  function setButtonText(btn, words) {
    var nodes = Array.prototype.slice.call(btn.childNodes).filter(function (n) {
      return n.nodeType === 3 && n.nodeValue.trim();
    });
    if (nodes.length) {
      if (nodes[0].nodeValue.trim() !== words) nodes[0].nodeValue = words;
      nodes.slice(1).forEach(function (n) { n.nodeValue = ""; });
    } else {
      btn.appendChild(document.createTextNode(words));
    }
    if (btn.title && btn.title !== words) btn.title = words;
  }

  function renameMenu() {
    Object.keys(RENAME).forEach(function (view) {
      document.querySelectorAll('#tabs [data-view="' + view + '"]').forEach(function (b) {
        setButtonText(b, RENAME[view].to);
      });
      var head = document.querySelector("#view-" + view + " .page-head h2");
      if (head && head.textContent.trim() !== RENAME[view].to) head.textContent = RENAME[view].to;
    });
    var crumb = $("ws-crumb-page");
    if (crumb) {
      Object.keys(RENAME).forEach(function (view) {
        if (crumb.textContent.trim() === RENAME[view].from) crumb.textContent = RENAME[view].to;
      });
    }
  }

  function renameTitle() {
    var t = document.title;
    Object.keys(RENAME).forEach(function (view) {
      if (t.indexOf(RENAME[view].from) === 0 && t.indexOf(RENAME[view].to) !== 0) t = RENAME[view].to + t.slice(RENAME[view].from.length);
    });
    if (t !== document.title) document.title = t;
  }

  /**
   * "2.0" after the app's name — re-added whenever JavaScript.html writes the name again. The
   * name goes in a box of its own, so a long company name is what gets cut short, never the mark.
   */
  function markBrand() {
    var name = $("app-name");
    if (!name || !name.textContent.trim()) return;
    var loose = Array.prototype.filter.call(name.childNodes, function (n) {
      return n.nodeType === 3 && n.nodeValue.trim();
    });
    if (loose.length) {
      var words = name.querySelector(".v2-name") || document.createElement("span");
      words.className = "v2-name";
      words.textContent = loose.map(function (n) { return n.nodeValue; }).join("").trim();
      loose.forEach(function (n) { name.removeChild(n); });
      name.insertBefore(words, name.firstChild);
    }
    if (!name.querySelector(".v2-tag")) {
      var tag = document.createElement("span");
      tag.className = "v2-tag";
      tag.textContent = "2.0";
      name.appendChild(tag);
    }
  }

  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

  function isDark() { return document.documentElement.getAttribute("data-theme") === "dark"; }

  /** The switch shows where it would take you: a moon in light mode, a sun in dark. */
  function paintThemeSwitch(btn) {
    var dark = isDark();
    var say = dark ? "Switch to light mode" : "Switch to dark mode";
    btn.innerHTML = dark ? SUN : MOON;
    btn.title = say;
    btn.setAttribute("aria-label", say);
    btn.setAttribute("aria-pressed", String(dark));
  }

  function addThemeSwitch() {
    var tools = document.querySelector("#ws-bar .ws-tools");
    if (!tools || $("v2-theme")) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.id = "v2-theme";
    btn.className = "v2-theme";
    paintThemeSwitch(btn);
    btn.addEventListener("click", function () {
      var dark = !isDark();
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.removeAttribute("data-theme");
      try { localStorage.setItem("erp.theme", dark ? "dark" : "light"); } catch (e) { /* this visit only */ }
      paintThemeSwitch(btn);
    });
    tools.insertBefore(btn, tools.querySelector(".ws-date"));
  }

  // A screen printed from the browser goes on white paper: light for the print, then back.
  var printedDark = false;
  window.addEventListener("beforeprint", function () {
    printedDark = isDark();
    if (printedDark) document.documentElement.removeAttribute("data-theme");
  });
  window.addEventListener("afterprint", function () {
    if (printedDark) document.documentElement.setAttribute("data-theme", "dark");
    printedDark = false;
  });

  var pending = false;
  function soon() {
    if (pending) return;
    pending = true;
    setTimeout(function () {
      pending = false;
      safely("rename", renameMenu);
      safely("title", renameTitle);
      safely("brand", markBrand);
      safely("theme", addThemeSwitch);
    }, 0);
  }

  safely("start", function () {
    var tabs = $("tabs");
    if (tabs) new MutationObserver(soon).observe(tabs, { childList: true, subtree: true, characterData: true });
    var crumb = $("ws-crumb-page");
    if (crumb) new MutationObserver(soon).observe(crumb, { childList: true, characterData: true, subtree: true });
    var name = $("app-name");
    if (name) new MutationObserver(soon).observe(name, { childList: true });
    var title = document.querySelector("title");
    if (title) new MutationObserver(soon).observe(title, { childList: true, characterData: true, subtree: true });
    addThemeSwitch();
    soon();
  });

  document.documentElement.classList.add("v2");
})();
</script>
