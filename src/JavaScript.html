  // ================= CUSTOMERS =================
  var customersCache = [];
  var customersLoaded = false;
  var configLists = null;

  function initCustomersView() {
    $("btn-new-customer").style.display = canEditCustomers() ? "inline-flex" : "none";
    if (!configLists) loadConfigLists();
    if (customersLoaded) { renderCustomers(); return; }
    google.script.run.withSuccessHandler(function (rows) {
      customersCache = rows; customersLoaded = true; renderCustomers();
    }).withFailureHandler(onServerError).listCustomers();
  }

  function canEditCustomers() {
    return ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }
  function canEditCommercials() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  function loadConfigLists() {
    google.script.run.withSuccessHandler(function (lists) {
      configLists = lists;
      fillDatalist("industry-list", (lists.Industry || []).map(function (i) { return i.label; }));
      fillDatalist("paymentterms-list", (lists.PaymentTerms || []).map(function (i) { return i.label; }));
    }).withFailureHandler(function () { configLists = {}; }).getConfigLists();

    google.script.run.withSuccessHandler(function (users) {
      fillDatalist("users-list", users.map(function (u) { return u.email; }));
    }).withFailureHandler(function () {}).listActiveUsers();
  }

  function fillDatalist(id, values) {
    $(id).innerHTML = values.map(function (v) { return '<option value="' + escapeHtml(v) + '">'; }).join("");
  }

  function renderCustomers() {
    var q = ($("customer-search").value || "").toLowerCase();
    var rows = customersCache.filter(function (c) {
      var hay = [c.customerCode, c.name, c.gstin, c.assignedSalesperson, c.territory,
        (c.addresses[0] || {}).city].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    var tbody = $("customers-tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty">' +
        (customersCache.length ? "No customers match your search." : "No customers yet — add the first one.") +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (c) {
      var addr = c.addresses.filter(function (a) { return String(a.isDefault).toUpperCase() === "TRUE"; })[0] || c.addresses[0] || {};
      var contact = c.primaryContact || {};
      return "<tr>" +
        '<td class="mono">' + escapeHtml(c.customerCode || "—") + "</td>" +
        "<td>" + escapeHtml(c.name) + "</td>" +
        '<td class="mono">' + escapeHtml(c.gstin || "—") + "</td>" +
        "<td>" + escapeHtml(addr.city || "—") + "</td>" +
        "<td>" + (contact.name ? escapeHtml(contact.name) + (contact.phone ? " · " + escapeHtml(contact.phone) : "") : "—") + "</td>" +
        "<td>" + escapeHtml(c.assignedSalesperson || "—") + "</td>" +
        '<td class="num mono">' + (c.creditLimit === "" || c.creditLimit === null ? "—" : fmt(c.creditLimit)) + "</td>" +
        '<td class="num">' + (c.creditDays === "" || c.creditDays === null ? "—" : c.creditDays) + "</td>" +
        '<td class="center"><button class="btn-ghost" data-edit-cust="' + c.id + '" title="Open">✎</button></td>' +
        "</tr>";
    }).join("");

    tbody.querySelectorAll("[data-edit-cust]").forEach(function (btn) {
      btn.addEventListener("click", function () { openCustomerModal(btn.dataset.editCust); });
    });
  }

  $("customer-search").addEventListener("input", renderCustomers);
  $("btn-new-customer").addEventListener("click", function () { openCustomerModal(null); });
  $("btn-cancel-customer").addEventListener("click", function () {
    $("customer-modal-backdrop").classList.remove("show");
  });

  function currentCustomer() {
    var id = $("cm-id").value;
    return id ? customersCache.find(function (c) { return c.id === id; }) : null;
  }

  function openCustomerModal(id) {
    var c = id ? customersCache.find(function (x) { return x.id === id; }) : null;
    $("customer-modal-title").textContent = id ? "Edit Customer" : "Add Customer";
    $("cm-code").textContent = c ? c.customerCode : "A customer code is assigned on save.";
    $("cm-id").value = id || "";
    $("cm-duplicate-warning").innerHTML = "";

    $("cm-name").value = c ? c.name : "";
    $("cm-legalname").value = c ? (c.legalName || "") : "";
    $("cm-gstin").value = c ? (c.gstin || "") : "";
    $("cm-pan").value = c ? (c.pan || "") : "";
    $("cm-industry").value = c ? (c.industry || "") : "";
    $("cm-territory").value = c ? (c.territory || "") : "";
    $("cm-salesperson").value = c ? (c.assignedSalesperson || "") : "";
    $("cm-notes").value = c ? (c.notes || "") : "";
    $("cm-paymentterms").value = c ? (c.paymentTerms || "") : "";
    $("cm-creditlimit").value = c && c.creditLimit !== "" ? c.creditLimit : "";
    $("cm-creditdays").value = c && c.creditDays !== "" ? c.creditDays : "";
    $("cm-riskstatus").value = c ? (c.riskStatus || "") : "";

    // Commercial terms are read-only unless Management/ERP Admin (FR-003).
    var locked = !canEditCommercials();
    ["cm-paymentterms", "cm-creditlimit", "cm-creditdays", "cm-riskstatus"].forEach(function (f) {
      $(f).disabled = locked;
    });
    $("cm-commercial-lock").textContent = locked ? "Set by Management only" : "";

    $("btn-deactivate-customer").style.display =
      (id && (currentUser.role === "Management" || currentUser.role === "ERP Admin")) ? "inline-flex" : "none";
    $("btn-save-customer").disabled = !canEditCustomers();

    hideContactForm();
    hideAddressForm();
    renderContacts(c);
    renderAddresses(c);
    $("customer-modal-backdrop").classList.add("show");
  }

  function renderContacts(c) {
    var zone = $("cm-contacts");
    if (!c) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">Save the customer first, then add contacts.</div>';
      $("btn-add-contact").disabled = true;
      return;
    }
    $("btn-add-contact").disabled = !canEditCustomers();
    if (!c.contacts.length) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">No contacts yet.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Email</th><th>Primary</th><th></th></tr></thead><tbody>' +
      c.contacts.map(function (x) {
        return "<tr>" +
          "<td>" + escapeHtml(x.name) + "</td>" +
          "<td>" + escapeHtml(x.contactRole || "—") + "</td>" +
          "<td>" + escapeHtml(x.phone || "—") + "</td>" +
          "<td>" + escapeHtml(x.email || "—") + "</td>" +
          "<td>" + (String(x.isPrimary).toUpperCase() === "TRUE" ? '<span class="badge badge-active">Primary</span>' : "") + "</td>" +
          '<td class="center" style="white-space:nowrap;">' +
            '<button class="btn-ghost" data-edit-contact="' + x.id + '" title="Edit">✎</button>' +
            '<button class="btn-ghost" data-del-contact="' + x.id + '" title="Remove">✕</button></td>' +
          "</tr>";
      }).join("") + "</tbody></table>";

    zone.querySelectorAll("[data-edit-contact]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        showContactForm(c.contacts.find(function (x) { return x.id === btn.dataset.editContact; }));
      });
    });
    zone.querySelectorAll("[data-del-contact]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({
          title: "Remove this contact?", okLabel: "Remove", danger: true
        }, function (ok) {
          if (ok === null) return;
          google.script.run.withSuccessHandler(function () {
            reloadCustomersKeepingModal();
            showMsg("Contact removed.", "success");
          }).withFailureHandler(onServerError).deleteCustomerContact(btn.dataset.delContact);
        });
      });
    });
  }

  function renderAddresses(c) {
    var zone = $("cm-addresses");
    if (!c) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">Save the customer first, then add addresses.</div>';
      $("btn-add-address").disabled = true;
      return;
    }
    $("btn-add-address").disabled = !canEditCustomers();
    if (!c.addresses.length) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">No addresses yet.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>Type</th><th>Address</th><th>City</th><th>State</th><th>Pincode</th><th>Default</th><th></th></tr></thead><tbody>' +
      c.addresses.map(function (a) {
        return "<tr>" +
          "<td>" + escapeHtml(a.addressType) + "</td>" +
          "<td>" + escapeHtml([a.line1, a.line2].filter(Boolean).join(", ")) + "</td>" +
          "<td>" + escapeHtml(a.city || "—") + "</td>" +
          "<td>" + escapeHtml(a.state || "—") + "</td>" +
          "<td>" + escapeHtml(a.pincode || "—") + "</td>" +
          "<td>" + (String(a.isDefault).toUpperCase() === "TRUE" ? '<span class="badge badge-active">Default</span>' : "") + "</td>" +
          '<td class="center" style="white-space:nowrap;">' +
            '<button class="btn-ghost" data-edit-addr="' + a.id + '" title="Edit">✎</button>' +
            '<button class="btn-ghost" data-del-addr="' + a.id + '" title="Remove">✕</button></td>' +
          "</tr>";
      }).join("") + "</tbody></table>";

    zone.querySelectorAll("[data-edit-addr]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        showAddressForm(c.addresses.find(function (x) { return x.id === btn.dataset.editAddr; }));
      });
    });
    zone.querySelectorAll("[data-del-addr]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({
          title: "Remove this address?", okLabel: "Remove", danger: true
        }, function (ok) {
          if (ok === null) return;
          google.script.run.withSuccessHandler(function () {
            reloadCustomersKeepingModal();
            showMsg("Address removed.", "success");
          }).withFailureHandler(onServerError).deleteCustomerAddress(btn.dataset.delAddr);
        });
      });
    });
  }

  /** Refreshes the cache and re-renders the open modal, so nested edits appear immediately. */
  function reloadCustomersKeepingModal() {
    var openId = $("cm-id").value;
    google.script.run.withSuccessHandler(function (rows) {
      customersCache = rows;
      renderCustomers();
      if (openId) {
        var c = customersCache.find(function (x) { return x.id === openId; });
        renderContacts(c);
        renderAddresses(c);
      }
    }).withFailureHandler(onServerError).listCustomers();
  }

  $("btn-save-customer").addEventListener("click", function () {
    var obj = {
      id: $("cm-id").value || null,
      name: $("cm-name").value.trim(),
      legalName: $("cm-legalname").value.trim(),
      gstin: $("cm-gstin").value.trim(),
      pan: $("cm-pan").value.trim(),
      industry: $("cm-industry").value.trim(),
      territory: $("cm-territory").value.trim(),
      assignedSalesperson: $("cm-salesperson").value.trim(),
      notes: $("cm-notes").value.trim(),
      paymentTerms: $("cm-paymentterms").value.trim(),
      creditLimit: $("cm-creditlimit").value,
      creditDays: $("cm-creditdays").value,
      riskStatus: $("cm-riskstatus").value
    };
    if (!obj.name) { showMsg("Customer name is required.", "error"); return; }

    // Advisory duplicate check first — a GSTIN clash is refused server-side regardless.
    google.script.run.withSuccessHandler(function (dupes) {
      var advisory = dupes.filter(function (d) { return !d.blocking; });
      if (advisory.length && !$("cm-id").value) {
        var names = advisory.map(function (d) { return "• " + d.name + " (" + d.reasons + ")"; }).join("\n");
        askDialog({
          title: "This customer may already exist",
          message: names + "\n\nCreate a new record anyway?",
          okLabel: "Create anyway"
        }, function (ok) {
          if (ok === null) return;
          commitCustomer(obj);
        });
        return;
      }
      commitCustomer(obj);
    }).withFailureHandler(function () { commitCustomer(obj); })
      .findDuplicateCustomers(obj, $("cm-id").value || null);
  });

  function commitCustomer(obj) {
    google.script.run.withSuccessHandler(function (saved) {
      customersLoaded = false;
      google.script.run.withSuccessHandler(function (rows) {
        customersCache = rows; customersLoaded = true; renderCustomers();
        // Stay open on a new record so contacts/addresses can be added straight away.
        $("cm-id").value = saved.id;
        $("customer-modal-title").textContent = "Edit Customer";
        $("cm-code").textContent = saved.customerCode || "";
        var c = customersCache.find(function (x) { return x.id === saved.id; });
        renderContacts(c);
        renderAddresses(c);
        showMsg("Customer " + saved.name + " saved.", "success");
      }).withFailureHandler(onServerError).listCustomers();
    }).withFailureHandler(onServerError).saveCustomer(obj);
  }

  $("btn-deactivate-customer").addEventListener("click", function () {
    var id = $("cm-id").value;
    if (!id) return;
    askDialog({
      title: "Deactivate this customer?",
      message: "Their quotations, orders and invoices stay intact.",
      input: true, inputLabel: "Reason", okLabel: "Deactivate", danger: true
    }, function (reason) {
      if (reason === null) return;
      google.script.run.withSuccessHandler(function () {
        customersLoaded = false;
        $("customer-modal-backdrop").classList.remove("show");
        initCustomersView();
        showMsg("Customer deactivated.", "success");
      }).withFailureHandler(onServerError).deactivateCustomer(id, reason);
    });
  });

  // ---- Inline contact form ----
  function showContactForm(contact) {
    $("cf-id").value = contact ? contact.id : "";
    $("cf-name").value = contact ? contact.name : "";
    $("cf-role").value = contact ? (contact.contactRole || "Purchase") : "Purchase";
    $("cf-designation").value = contact ? (contact.designation || "") : "";
    $("cf-phone").value = contact ? (contact.phone || "") : "";
    $("cf-email").value = contact ? (contact.email || "") : "";
    $("cf-primary").checked = contact ? String(contact.isPrimary).toUpperCase() === "TRUE" : false;
    $("cm-contact-form").style.display = "";
    $("cf-name").focus();
  }
  function hideContactForm() { $("cm-contact-form").style.display = "none"; }

  $("btn-add-contact").addEventListener("click", function () {
    var c = currentCustomer();
    if (!c) return;
    showContactForm(null);
    // First contact for a customer becomes the primary by default.
    $("cf-primary").checked = c.contacts.length === 0;
  });
  $("btn-cancel-contact").addEventListener("click", hideContactForm);

  $("btn-save-contact").addEventListener("click", function () {
    var c = currentCustomer();
    if (!c) return;
    var name = $("cf-name").value.trim();
    if (!name) { showMsg("Contact name is required.", "error"); $("cf-name").focus(); return; }

    google.script.run.withSuccessHandler(function () {
      hideContactForm();
      reloadCustomersKeepingModal();
      showMsg("Contact saved.", "success");
    }).withFailureHandler(onServerError).saveCustomerContact({
      id: $("cf-id").value || null,
      customerId: c.id,
      name: name,
      contactRole: $("cf-role").value,
      designation: $("cf-designation").value.trim(),
      phone: $("cf-phone").value.trim(),
      email: $("cf-email").value.trim(),
      isPrimary: $("cf-primary").checked
    });
  });

  // ---- Inline address form ----
  function showAddressForm(addr) {
    $("af-id").value = addr ? addr.id : "";
    $("af-type").value = addr ? addr.addressType : "Billing";
    $("af-label").value = addr ? (addr.label || "") : "";
    $("af-line1").value = addr ? addr.line1 : "";
    $("af-line2").value = addr ? (addr.line2 || "") : "";
    $("af-city").value = addr ? (addr.city || "") : "";
    $("af-state").value = addr ? (addr.state || "") : "";
    $("af-pincode").value = addr ? (addr.pincode || "") : "";
    $("af-gstin").value = addr ? (addr.gstin || "") : "";
    $("af-default").checked = addr ? String(addr.isDefault).toUpperCase() === "TRUE" : false;
    $("cm-address-form").style.display = "";
    $("af-line1").focus();
  }
  function hideAddressForm() { $("cm-address-form").style.display = "none"; }

  $("btn-add-address").addEventListener("click", function () {
    var c = currentCustomer();
    if (!c) return;
    showAddressForm(null);
    // First address of a given type becomes that type's default.
    $("af-default").checked = !c.addresses.some(function (a) { return a.addressType === "Billing"; });
  });
  $("btn-cancel-address").addEventListener("click", hideAddressForm);

  $("btn-save-address").addEventListener("click", function () {
    var c = currentCustomer();
    if (!c) return;
    var line1 = $("af-line1").value.trim();
    if (!line1) { showMsg("Address line 1 is required.", "error"); $("af-line1").focus(); return; }

    google.script.run.withSuccessHandler(function () {
      hideAddressForm();
      reloadCustomersKeepingModal();
      showMsg("Address saved.", "success");
    }).withFailureHandler(onServerError).saveCustomerAddress({
      id: $("af-id").value || null,
      customerId: c.id,
      addressType: $("af-type").value,
      label: $("af-label").value.trim(),
      line1: line1,
      line2: $("af-line2").value.trim(),
      city: $("af-city").value.trim(),
      state: $("af-state").value.trim(),
      pincode: $("af-pincode").value.trim(),
      gstin: $("af-gstin").value.trim(),
      isDefault: $("af-default").checked
    });
  });


  // ================= SPARE ENQUIRIES =================
  var enquiriesCache = [];
  var lostReasonsCache = [];
  var identifySearchTimer = null;

  function initEnquiriesView() {
    $("btn-new-enquiry").style.display = canEditEnquiries() ? "inline-flex" : "none";
    if (!customersLoaded) {
      google.script.run.withSuccessHandler(function (rows) {
        customersCache = rows; customersLoaded = true; fillCustomerDatalist();
      }).withFailureHandler(function () {}).listCustomers();
    } else {
      fillCustomerDatalist();
    }
    if (!lostReasonsCache.length) {
      google.script.run.withSuccessHandler(function (rows) {
        lostReasonsCache = rows;
      }).withFailureHandler(function () {}).listLostReasons();
    }
    google.script.run.withSuccessHandler(function (models) {
      fillDatalist("models-list", models);
    }).withFailureHandler(function () {}).listKnownModels();
    if (!configLists) loadConfigLists();
    loadEnquiries();
  }

  function canEditEnquiries() {
    return ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function fillCustomerDatalist() {
    fillDatalist("customers-list", customersCache.map(function (c) { return c.name; }));
  }

  function loadEnquiries() {
    google.script.run.withSuccessHandler(function (rows) {
      enquiriesCache = rows; renderEnquiries();
    }).withFailureHandler(onServerError).listSpareEnquiries({
      mineOnly: $("enquiry-mine").checked,
      includeClosed: $("enquiry-closed").checked
    });
  }

  var STATUS_BADGE = {
    "New": "badge-new", "Identifying": "badge-followup", "Quoted": "badge-quoted",
    "Won": "badge-won", "Lost": "badge-lost", "Dropped": "badge-draft"
  };

  function renderEnquiries() {
    var q = ($("enquiry-search").value || "").toLowerCase();
    var rows = enquiriesCache.filter(function (e) {
      return [e.enquiryNo, e.customerName, e.productModel, e.serialNo, e.requirementText]
        .join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var tbody = $("enquiries-tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty">' +
        (enquiriesCache.length ? "No enquiries match your search." : "No open enquiries — log the first one.") +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (e) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(e.enquiryNo || "—") + "</td>" +
        "<td>" + escapeHtml(e.date) + "</td>" +
        "<td>" + escapeHtml(e.customerName || "—") + "</td>" +
        "<td>" + escapeHtml(e.productModel || "—") + (e.serialNo ? ' <span class="mono" style="color:var(--steel);">· ' + escapeHtml(e.serialNo) + "</span>" : "") + "</td>" +
        "<td>" + escapeHtml(e.urgency || "Normal") + "</td>" +
        '<td class="num">' + e.itemCount + "</td>" +
        '<td><span class="badge ' + (STATUS_BADGE[e.status] || "badge-draft") + '">' + escapeHtml(e.status) + "</span></td>" +
        "<td>" + (e.nextActionDate
          ? (e.overdue ? '<span class="badge badge-overdue">' + escapeHtml(e.nextActionDate) + "</span>" : escapeHtml(e.nextActionDate))
          : "—") + "</td>" +
        '<td class="center"><button class="btn-ghost" data-open-enq="' + e.id + '" title="Open">✎</button></td>' +
        "</tr>";
    }).join("");

    tbody.querySelectorAll("[data-open-enq]").forEach(function (btn) {
      btn.addEventListener("click", function () { openEnquiryModal(btn.dataset.openEnq); });
    });
  }

  $("enquiry-search").addEventListener("input", renderEnquiries);
  $("enquiry-mine").addEventListener("change", loadEnquiries);
  $("enquiry-closed").addEventListener("change", loadEnquiries);
  $("btn-new-enquiry").addEventListener("click", function () { openEnquiryModal(null); });
  $("btn-cancel-enquiry").addEventListener("click", function () {
    $("enquiry-modal-backdrop").classList.remove("show");
  });

  function currentEnquiry() {
    var id = $("em-id").value;
    return id ? enquiriesCache.find(function (e) { return e.id === id; }) : null;
  }

  function openEnquiryModal(id) {
    var e = id ? enquiriesCache.find(function (x) { return x.id === id; }) : null;
    $("enquiry-modal-title").textContent = id ? "Spare Enquiry" : "Log Spare Enquiry";
    $("em-no").textContent = e ? e.enquiryNo : "An enquiry number is assigned on save.";
    $("em-id").value = id || "";

    var cust = e ? customersCache.find(function (c) { return c.id === e.customerId; }) : null;
    $("em-customer").value = cust ? cust.name : (e ? (e.customerName || "") : "");
    $("em-contact").value = e ? (e.contactName || "") : "";
    $("em-source").value = e ? (e.source || "") : "";
    $("em-model").value = e ? (e.productModel || "") : "";
    $("em-serial").value = e ? (e.serialNo || "") : "";
    $("em-urgency").value = e ? (e.urgency || "Normal") : "Normal";
    $("em-nextaction").value = e ? (e.nextActionDate || "") : "";
    $("em-requirement").value = e ? (e.requirementText || "") : "";
    $("em-owner").value = e ? (e.ownerEmail || currentUser.email) : currentUser.email;
    $("em-status").value = e ? e.status : "New";

    $("em-lostreason").innerHTML = '<option value="">—</option>' +
      lostReasonsCache.map(function (r) {
        return '<option value="' + r.id + '">' + escapeHtml(r.reasonText) + "</option>";
      }).join("");
    if (e && e.lostReasonId) $("em-lostreason").value = e.lostReasonId;
    toggleLostReason();

    fillDatalist("leadsource-list", ((configLists || {}).LeadSource || []).map(function (i) { return i.label; }));

    $("btn-quote-enquiry").style.display =
      (e && e.items.length && canEditQuotes()) ? "inline-flex" : "none";
    hideIdentifyPanel();
    renderEnquiryItems(e);
    $("enquiry-modal-backdrop").classList.add("show");
  }

  $("btn-quote-enquiry").addEventListener("click", function () {
    var e = currentEnquiry();
    if (!e) return;
    google.script.run.withSuccessHandler(function (q) {
      openQuote = q;
      $("enquiry-modal-backdrop").classList.remove("show");
      renderQuoteBuilder();
      goToTab("quote");
      showMsg("Quotation " + q.quoteNo + " created from " + e.enquiryNo + ".", "success");
    }).withFailureHandler(onServerError).createQuotationFromEnquiry(e.id);
  });

  function toggleLostReason() {
    $("em-lostreason-wrap").style.display = $("em-status").value === "Lost" ? "" : "none";
  }
  $("em-status").addEventListener("change", toggleLostReason);

  function renderEnquiryItems(e) {
    var zone = $("em-items");
    if (!e) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">Save the enquiry first, then identify parts against it.</div>';
      $("btn-identify-part").disabled = true;
      return;
    }
    $("btn-identify-part").disabled = !canEditEnquiries();
    if (!e.items.length) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">No parts identified yet.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>#</th><th>Part No.</th><th>Description</th>' +
      '<th class="num">Qty</th><th>Fit</th><th>Availability</th><th></th></tr></thead><tbody>' +
      e.items.map(function (i) {
        var confirmed = String(i.compatibilityConfirmed).toUpperCase() === "TRUE";
        return "<tr>" +
          "<td>" + i.lineNo + "</td>" +
          '<td class="mono">' + escapeHtml(i.partNo || "—") + "</td>" +
          "<td>" + escapeHtml(i.description || "—") + "</td>" +
          '<td class="num">' + i.qty + "</td>" +
          "<td>" + (confirmed
            ? '<span class="badge badge-won">Confirmed</span>'
            : '<span class="badge badge-overdue">Unverified</span>') + "</td>" +
          "<td>" + escapeHtml(i.availabilityNote || "—") + "</td>" +
          '<td class="center"><button class="btn-ghost" data-del-item="' + i.id + '" title="Remove">✕</button></td>' +
          "</tr>";
      }).join("") + "</tbody></table>";

    zone.querySelectorAll("[data-del-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({ title: "Remove this part from the enquiry?", okLabel: "Remove", danger: true },
          function (ok) {
            if (ok === null) return;
            google.script.run.withSuccessHandler(function () {
              reloadEnquiriesKeepingModal();
              showMsg("Part removed.", "success");
            }).withFailureHandler(onServerError).deleteSpareEnquiryItem(btn.dataset.delItem);
          });
      });
    });
  }

  function reloadEnquiriesKeepingModal() {
    var openId = $("em-id").value;
    google.script.run.withSuccessHandler(function (rows) {
      enquiriesCache = rows;
      renderEnquiries();
      if (openId) {
        var e = enquiriesCache.find(function (x) { return x.id === openId; });
        if (e) { $("em-status").value = e.status; toggleLostReason(); }
        renderEnquiryItems(e);
      }
    }).withFailureHandler(onServerError).listSpareEnquiries({
      mineOnly: $("enquiry-mine").checked, includeClosed: true
    });
  }

  $("btn-save-enquiry").addEventListener("click", function () {
    var name = $("em-customer").value.trim();
    var cust = customersCache.find(function (c) { return c.name.toLowerCase() === name.toLowerCase(); });
    if (!cust) {
      showMsg("Pick an existing customer. Add them on the Customers tab first if they are new.", "error");
      return;
    }
    if ($("em-status").value === "Lost" && !$("em-lostreason").value) {
      showMsg("Pick a lost reason before marking this enquiry Lost.", "error");
      return;
    }

    google.script.run.withSuccessHandler(function (saved) {
      $("em-id").value = saved.id;
      $("em-no").textContent = saved.enquiryNo || "";
      $("enquiry-modal-title").textContent = "Spare Enquiry";
      reloadEnquiriesKeepingModal();
      showMsg("Enquiry " + (saved.enquiryNo || "") + " saved.", "success");
    }).withFailureHandler(onServerError).saveSpareEnquiry({
      id: $("em-id").value || null,
      customerId: cust.id,
      customerName: cust.name,
      contactName: $("em-contact").value.trim(),
      source: $("em-source").value.trim(),
      productModel: $("em-model").value.trim(),
      serialNo: $("em-serial").value.trim(),
      urgency: $("em-urgency").value,
      nextActionDate: $("em-nextaction").value,
      requirementText: $("em-requirement").value.trim(),
      ownerEmail: $("em-owner").value.trim(),
      status: $("em-status").value,
      lostReasonId: $("em-lostreason").value
    });
  });

  // ---- Part identification ----
  function hideIdentifyPanel() {
    $("em-identify-panel").style.display = "none";
    $("idf-results").innerHTML = "";
    $("idf-search").value = "";
    $("idf-qty").value = 1;
  }

  $("btn-identify-part").addEventListener("click", function () {
    if (!currentEnquiry()) return;
    $("em-identify-panel").style.display = "";
    $("idf-search").focus();
    runIdentifySearch();
  });
  $("btn-cancel-identify").addEventListener("click", hideIdentifyPanel);

  $("idf-search").addEventListener("input", function () {
    if (identifySearchTimer) clearTimeout(identifySearchTimer);
    identifySearchTimer = setTimeout(runIdentifySearch, 250);
  });

  function runIdentifySearch() {
    var e = currentEnquiry();
    if (!e) return;
    $("idf-results").innerHTML = '<div class="empty" style="padding:14px;">Searching…</div>';
    google.script.run.withSuccessHandler(renderIdentifyResults)
      .withFailureHandler(onServerError)
      .suggestSpares($("idf-search").value.trim(), $("em-model").value.trim());
  }

  function renderIdentifyResults(rows) {
    var zone = $("idf-results");
    if (!rows.length) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">No matching parts. Try a different term, or check the model on the enquiry.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>Part No.</th><th>Description</th><th>Fit</th>' +
      '<th class="num">Price</th><th class="num">Available</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        return "<tr>" +
          '<td class="mono">' + escapeHtml(r.partNo) + "</td>" +
          "<td>" + escapeHtml(r.description) + (r.isServiceKit ? ' <span class="badge badge-active">Kit</span>' : "") + "</td>" +
          "<td>" + (r.compatibilityConfirmed
            ? '<span class="badge badge-won">Fits model</span>'
            : '<span class="badge badge-overdue">Unverified</span>') + "</td>" +
          '<td class="num mono">' + (r.price ? fmt(r.price) : "—") + "</td>" +
          '<td class="num mono" style="color:' + (r.available > 0 ? "var(--green)" : "var(--red)") + ';">' + r.available + "</td>" +
          '<td class="center"><button class="btn btn-sm" data-pick="' + r.id + '">Add</button></td>' +
          "</tr>";
      }).join("") + "</tbody></table>";

    zone.querySelectorAll("[data-pick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var r = rows.find(function (x) { return x.id === btn.dataset.pick; });
        var qty = Math.max(1, Number($("idf-qty").value) || 1);
        var note = r.available >= qty
          ? "In stock (" + r.available + " available)"
          : (r.available > 0 ? "Short — only " + r.available + " available" : "Out of stock");
        google.script.run.withSuccessHandler(function () {
          reloadEnquiriesKeepingModal();
          showMsg(r.partNo + " added to the enquiry.", "success");
        }).withFailureHandler(onServerError).saveSpareEnquiryItem({
          spareEnquiryId: $("em-id").value,
          spareId: r.id, partNo: r.partNo, description: r.description, qty: qty,
          compatibilityConfirmed: r.compatibilityConfirmed,
          availabilityNote: note
        });
      });
    });
  }


  // ================= QUOTATIONS =================
  var quotationsCache = [];
  var openQuote = null;
  var quoteSearchTimer = null;

  var QUOTE_BADGE = {
    "Draft": "badge-draft", "Approved": "badge-active", "Submitted": "badge-sent",
    "Revised": "badge-followup", "Won": "badge-won", "Lost": "badge-lost", "Expired": "badge-overdue"
  };

  function canEditQuotes() {
    return ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  // ---- History list ----
  function initQuotationsView() {
    if (!configLists) loadConfigLists();
    if (!lostReasonsCache.length) {
      google.script.run.withSuccessHandler(function (rows) { lostReasonsCache = rows; })
        .withFailureHandler(function () {}).listLostReasons();
    }
    loadQuotations();
  }

  function loadQuotations() {
    google.script.run.withSuccessHandler(function (rows) {
      quotationsCache = rows; renderQuotations();
    }).withFailureHandler(onServerError).listQuotations({
      mineOnly: $("quotations-mine").checked,
      includeClosed: $("quotations-closed").checked
    });
  }

  function renderQuotations() {
    var q = ($("quotations-search").value || "").toLowerCase();
    var rows = quotationsCache.filter(function (r) {
      return [r.quoteNo, r.customerName, r.machineModel, r.serialNo].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var tbody = $("quotations-tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="10"><div class="empty">' +
        (quotationsCache.length ? "No quotations match your search." : "No quotations yet — raise one from an enquiry.") +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.quoteNo) + "</td>" +
        '<td class="mono">' + escapeHtml(r.revision || "R0") + "</td>" +
        "<td>" + escapeHtml(r.date) + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        "<td>" + escapeHtml(r.machineModel || "—") + "</td>" +
        '<td class="num">' + r.itemCount + "</td>" +
        '<td class="num mono">' + fmt(r.grand) + "</td>" +
        '<td><span class="badge ' + (QUOTE_BADGE[r.status] || "badge-draft") + '">' + escapeHtml(r.status) +
          (r.locked ? " 🔒" : "") + "</span></td>" +
        "<td>" + (r.validUntil
          ? (r.expired ? '<span class="badge badge-overdue">' + escapeHtml(r.validUntil) + "</span>" : escapeHtml(r.validUntil))
          : "—") + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-quote="' + r.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    tbody.querySelectorAll("[data-open-quote]").forEach(function (btn) {
      btn.addEventListener("click", function () { openQuotation(btn.dataset.openQuote); });
    });
  }

  $("quotations-search").addEventListener("input", renderQuotations);
  $("quotations-mine").addEventListener("change", loadQuotations);
  $("quotations-closed").addEventListener("change", loadQuotations);

  // ---- Builder ----
  function openQuotation(id) {
    google.script.run.withSuccessHandler(function (q) {
      openQuote = q;
      renderQuoteBuilder();
      goToTab("quote");
    }).withFailureHandler(onServerError).getQuotation(id);
  }

  function initQuoteView() {
    if (openQuote) renderQuoteBuilder(); else renderQuoteEmpty();
  }

  function renderQuoteEmpty() {
    $("qb-empty").style.display = "";
    $("qb-body").style.display = "none";
    $("qb-actions").innerHTML = "";
    $("qb-title").textContent = "Quotation";
    $("qb-subtitle").textContent = "Open a quotation from the Quotations tab, or raise one from an enquiry.";
  }

  function renderQuoteBuilder() {
    var q = openQuote;
    if (!q) { renderQuoteEmpty(); return; }

    $("qb-empty").style.display = "none";
    $("qb-body").style.display = "";
    $("qb-title").textContent = q.quoteNo + " " + (q.revision || "R0");
    $("qb-subtitle").textContent = q.customerName + (q.machineModel ? " · " + q.machineModel : "");

    // A locked quotation is read-only by design: it is what the customer received.
    var editable = canEditQuotes() && !q.locked;
    $("qb-locked-banner").innerHTML = q.locked
      ? '<div class="compare-strip" style="margin-bottom:16px;">This quotation is <b>' +
        escapeHtml(q.status) + '</b> and locked. Use <b>Revise</b> to create the next revision — ' +
        'the version already sent stays untouched.</div>'
      : "";

    $("qb-customer").value = q.customerName || "";
    $("qb-gstin").value = q.customerGstin || "";
    $("qb-model").value = q.machineModel || "";
    $("qb-serial").value = q.serialNo || "";
    $("qb-date").value = q.date || "";
    $("qb-validity").value = q.validityDays || 7;
    $("qb-validuntil").value = q.validUntil || "";
    $("qb-paymentterms").value = q.paymentTerms || "";
    $("qb-deliveryterms").value = q.deliveryTerms || "";
    $("qb-warrantyterms").value = q.warrantyTerms || "";
    $("qb-notes").value = q.notes || "";

    ["qb-model", "qb-serial", "qb-date", "qb-validity", "qb-paymentterms",
     "qb-deliveryterms", "qb-warrantyterms", "qb-notes"].forEach(function (f) {
      $(f).disabled = !editable;
    });
    $("btn-qb-save-header").style.display = editable ? "" : "none";
    $("btn-qb-add-item").style.display = editable ? "" : "none";
    if (!editable) $("qb-add-panel").style.display = "none";

    renderQuoteActions(q, editable);
    renderQuoteItems(q, editable);
    renderQuoteTotals(q);
  }

  function renderQuoteActions(q, editable) {
    var zone = $("qb-actions");
    var buttons = [];
    if (editable && q.status === "Draft") {
      buttons.push('<button class="btn btn-sm" data-qs="Approved">Mark Approved</button>');
    }
    if (editable && ["Draft", "Approved"].indexOf(q.status) !== -1) {
      buttons.push('<button class="btn btn-sm btn-primary" data-qs="Submitted">Mark Submitted</button>');
    }
    if (q.locked && ["Won", "Lost"].indexOf(q.status) === -1) {
      buttons.push('<button class="btn btn-sm" data-qs="Won">Mark Won</button>');
      buttons.push('<button class="btn btn-sm" data-qs="Lost">Mark Lost</button>');
    }
    if (canEditQuotes() && q.locked) {
      buttons.push('<button class="btn btn-sm btn-amber" id="btn-qb-revise">Revise</button>');
    }
    zone.innerHTML = buttons.join("");

    zone.querySelectorAll("[data-qs]").forEach(function (btn) {
      btn.addEventListener("click", function () { changeQuoteStatus(btn.dataset.qs); });
    });
    if ($("btn-qb-revise")) {
      $("btn-qb-revise").addEventListener("click", function () {
        askDialog({
          title: "Create the next revision?",
          message: "The current version is kept exactly as it is and marked Revised. " +
            "A copy opens for editing as the next revision.",
          okLabel: "Revise"
        }, function (ok) {
          if (ok === null) return;
          google.script.run.withSuccessHandler(function (nq) {
            openQuote = nq;
            renderQuoteBuilder();
            showMsg("Now editing " + nq.quoteNo + " " + nq.revision + ".", "success");
          }).withFailureHandler(onServerError).reviseQuotation(openQuote.id);
        });
      });
    }
  }

  function changeQuoteStatus(status) {
    if (status !== "Lost") { applyQuoteStatus(status, ""); return; }

    // A lost quotation must record why, so lost-order analysis has something to work with.
    if (!lostReasonsCache.length) {
      showMsg("No lost reasons are configured yet — add them on the LostReasons tab.", "error");
      return;
    }
    askDialog({
      title: "Mark this quotation Lost?",
      message: "The reason feeds lost-order analysis.",
      options: lostReasonsCache.map(function (r) { return { value: r.id, label: r.reasonText }; }),
      optionsLabel: "Lost reason",
      okLabel: "Mark Lost",
      danger: true
    }, function (reasonId) {
      if (reasonId === null) return;
      applyQuoteStatus("Lost", reasonId);
    });
  }

  function applyQuoteStatus(status, reasonId) {
    google.script.run.withSuccessHandler(function (q) {
      openQuote = q;
      renderQuoteBuilder();
      showMsg("Quotation marked " + status + ".", "success");
    }).withFailureHandler(onServerError).setQuotationStatus(openQuote.id, status, reasonId);
  }

  $("btn-qb-save-header").addEventListener("click", function () {
    google.script.run.withSuccessHandler(function (q) {
      openQuote = q;
      renderQuoteBuilder();
      showMsg("Quotation details saved.", "success");
    }).withFailureHandler(onServerError).saveQuotationHeader({
      id: openQuote.id,
      date: $("qb-date").value,
      validityDays: $("qb-validity").value,
      paymentTerms: $("qb-paymentterms").value.trim(),
      deliveryTerms: $("qb-deliveryterms").value.trim(),
      warrantyTerms: $("qb-warrantyterms").value.trim(),
      machineModel: $("qb-model").value.trim(),
      serialNo: $("qb-serial").value.trim(),
      notes: $("qb-notes").value.trim()
    });
  });

  function renderQuoteItems(q, editable) {
    var zone = $("qb-items");
    if (!q.items.length) {
      zone.innerHTML = '<div class="empty">No items yet.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>#</th><th>Code</th><th>Description</th>' +
      '<th class="num">Qty</th><th class="num">Price</th><th class="num">Disc %</th>' +
      '<th class="num">Tax %</th><th class="num">Line Total</th><th></th></tr></thead><tbody>' +
      q.items.map(function (i) {
        return "<tr>" +
          "<td>" + i.lineNo + "</td>" +
          '<td class="mono">' + escapeHtml(i.itemCode || "—") + "</td>" +
          "<td>" + escapeHtml(i.description || "—") +
            (i.availabilityNote ? '<br><span style="font-size:11px; color:var(--ink-soft);">' +
              escapeHtml(i.availabilityNote) + "</span>" : "") + "</td>" +
          '<td class="num">' + i.qty + "</td>" +
          '<td class="num mono">' + fmt(i.unitPrice) + "</td>" +
          '<td class="num">' + (Number(i.discountPct) || 0) + "%</td>" +
          '<td class="num">' + (Number(i.taxPct) || 0) + "%</td>" +
          '<td class="num mono">' + fmt(i.lineTotal) + "</td>" +
          '<td class="center">' + (editable
            ? '<button class="btn-ghost" data-edit-line="' + i.id + '" title="Edit">✎</button>' +
              '<button class="btn-ghost" data-del-line="' + i.id + '" title="Remove">✕</button>'
            : "") + "</td>" +
          "</tr>";
      }).join("") + "</tbody></table>";

    zone.querySelectorAll("[data-del-line]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({ title: "Remove this line?", okLabel: "Remove", danger: true }, function (ok) {
          if (ok === null) return;
          google.script.run.withSuccessHandler(function (nq) {
            openQuote = nq; renderQuoteBuilder(); showMsg("Line removed.", "success");
          }).withFailureHandler(onServerError).deleteQuotationItem(btn.dataset.delLine);
        });
      });
    });

    zone.querySelectorAll("[data-edit-line]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var line = q.items.find(function (x) { return x.id === btn.dataset.editLine; });
        askDialog({
          title: "Line " + line.lineNo + " — " + (line.itemCode || ""),
          message: "Catalog price is " + fmt(line.listPrice) + ". Enter quantity, price and " +
            "discount separated by commas — for example  2, 1450, 5",
          input: true, inputLabel: "Qty, Price, Discount %",
          value: line.qty + ", " + line.unitPrice + ", " + (Number(line.discountPct) || 0),
          okLabel: "Update line"
        }, function (val) {
          if (val === null) return;
          var parts = val.split(",").map(function (x) { return x.trim(); });
          google.script.run.withSuccessHandler(function (nq) {
            openQuote = nq; renderQuoteBuilder(); showMsg("Line updated.", "success");
          }).withFailureHandler(onServerError).saveQuotationItem({
            id: line.id, quotationId: q.id, lineNo: line.lineNo,
            itemType: line.itemType, itemId: line.itemId, itemCode: line.itemCode,
            description: line.description, uom: line.uom,
            qty: parts[0], unitPrice: parts[1], discountPct: parts[2] || 0, taxPct: line.taxPct
          });
        });
      });
    });
  }

  function renderQuoteTotals(q) {
    $("qb-totals").innerHTML =
      '<div class="totals-row"><span>Subtotal</span><span class="mono">' + fmt(q.subtotal) + "</span></div>" +
      '<div class="totals-row"><span>Discount</span><span class="mono">− ' + fmt(q.discountAmt) + "</span></div>" +
      '<div class="totals-row"><span>Tax</span><span class="mono">' + fmt(q.taxAmt) + "</span></div>" +
      '<div class="totals-row grand"><span>Grand Total</span><span>' + fmt(q.grand) + "</span></div>";
  }

  // ---- Adding items to a quotation ----
  $("btn-qb-add-item").addEventListener("click", function () {
    $("qb-add-panel").style.display = "";
    $("qi-search").value = "";
    $("qi-qty").value = 1;
    $("qi-search").focus();
    runQuoteItemSearch();
  });
  $("btn-qb-close-add").addEventListener("click", function () {
    $("qb-add-panel").style.display = "none";
  });
  $("qi-type").addEventListener("change", runQuoteItemSearch);
  $("qi-search").addEventListener("input", function () {
    if (quoteSearchTimer) clearTimeout(quoteSearchTimer);
    quoteSearchTimer = setTimeout(runQuoteItemSearch, 250);
  });

  function runQuoteItemSearch() {
    var type = $("qi-type").value;
    $("qi-results").innerHTML = '<div class="empty" style="padding:12px;">Searching…</div>';
    if (type === "Spare") {
      google.script.run.withSuccessHandler(function (rows) { renderQuoteItemResults(rows, "Spare"); })
        .withFailureHandler(onServerError)
        .suggestSpares($("qi-search").value.trim(), openQuote ? openQuote.machineModel : "");
    } else {
      google.script.run.withSuccessHandler(function (rows) {
        var q = $("qi-search").value.trim().toLowerCase();
        renderQuoteItemResults(rows.filter(function (p) {
          return !q || [p.productCode, p.model, p.family].join(" ").toLowerCase().indexOf(q) !== -1;
        }).slice(0, 50), "Product");
      }).withFailureHandler(onServerError).listProducts();
    }
  }

  function renderQuoteItemResults(rows, type) {
    var zone = $("qi-results");
    if (!rows.length) {
      zone.innerHTML = '<div class="empty" style="padding:12px;">Nothing matched.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>Code</th><th>Description</th>' +
      (type === "Spare" ? "<th>Fit</th>" : "") +
      '<th class="num">Price</th><th class="num">Available</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        var code = type === "Spare" ? r.partNo : r.productCode;
        var desc = type === "Spare" ? r.description : (r.model || r.description);
        return "<tr>" +
          '<td class="mono">' + escapeHtml(code) + "</td>" +
          "<td>" + escapeHtml(desc) + "</td>" +
          (type === "Spare" ? "<td>" + (r.compatibilityConfirmed
            ? '<span class="badge badge-won">Fits model</span>'
            : '<span class="badge badge-overdue">Unverified</span>') + "</td>" : "") +
          '<td class="num mono">' + (r.price ? fmt(r.price) : "—") + "</td>" +
          '<td class="num mono">' + (r.available === undefined ? "—" : r.available) + "</td>" +
          '<td class="center"><button class="btn btn-sm" data-add-line="' + r.id + '">Add</button></td>' +
          "</tr>";
      }).join("") + "</tbody></table>";

    zone.querySelectorAll("[data-add-line]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var r = rows.find(function (x) { return x.id === btn.dataset.addLine; });
        google.script.run.withSuccessHandler(function (nq) {
          openQuote = nq;
          renderQuoteBuilder();
          showMsg("Added to the quotation.", "success");
        }).withFailureHandler(onServerError).saveQuotationItem({
          quotationId: openQuote.id,
          itemType: type,
          itemId: r.id,
          itemCode: type === "Spare" ? r.partNo : r.productCode,
          description: type === "Spare" ? r.description : (r.model || r.description),
          qty: Math.max(1, Number($("qi-qty").value) || 1),
          availabilityNote: r.available !== undefined
            ? (r.available > 0 ? r.available + " available" : "Out of stock") : ""
        });
      });
    });
  }


  // ================= COMPRESSOR SALES =================
  var CS_MODE = "leads";
  var leadsCache = [];
  var opportunitiesCache = [];
  var openOpportunity = null;

  var LEAD_BADGE = {
    "New": "badge-new", "Contacted": "badge-followup", "Qualified": "badge-quoted",
    "Converted": "badge-won", "Disqualified": "badge-lost"
  };
  var STAGE_BADGE = {
    "Requirement Identified": "badge-new", "Technical Discussion": "badge-followup",
    "Quotation": "badge-quoted", "Negotiation": "badge-sent", "PO Expected": "badge-active",
    "Won": "badge-won", "Lost": "badge-lost"
  };
  var STAGES = ["Requirement Identified", "Technical Discussion", "Quotation",
    "Negotiation", "PO Expected", "Won", "Lost"];

  function canEditLeads() {
    return ["Sales Engineer", "Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initCompressorView() {
    $("btn-new-lead").style.display = canEditLeads() ? "inline-flex" : "none";
    if (!customersLoaded) {
      google.script.run.withSuccessHandler(function (rows) {
        customersCache = rows; customersLoaded = true; fillCustomerDatalist();
      }).withFailureHandler(function () {}).listCustomers();
    } else {
      fillCustomerDatalist();
    }
    if (!lostReasonsCache.length) {
      google.script.run.withSuccessHandler(function (rows) { lostReasonsCache = rows; })
        .withFailureHandler(function () {}).listLostReasons();
    }
    if (!configLists) loadConfigLists();
    switchCsMode(CS_MODE);
  }

  function switchCsMode(mode) {
    CS_MODE = mode;
    $("subtab-leads").className = "btn btn-sm" + (mode === "leads" ? " btn-primary" : "");
    $("subtab-pipeline").className = "btn btn-sm" + (mode === "pipeline" ? " btn-primary" : "");
    $("cs-search").placeholder = mode === "leads"
      ? "Search by lead no., customer or requirement…"
      : "Search by opportunity no., customer or title…";
    $("pipeline-summary").style.display = mode === "pipeline" ? "" : "none";
    $("btn-new-lead").style.display = (mode === "leads" && canEditLeads()) ? "inline-flex" : "none";
    loadCsRows();
  }

  $("subtab-leads").addEventListener("click", function () { switchCsMode("leads"); });
  $("subtab-pipeline").addEventListener("click", function () { switchCsMode("pipeline"); });
  $("cs-search").addEventListener("input", renderCsRows);
  $("cs-mine").addEventListener("change", loadCsRows);
  $("cs-closed").addEventListener("change", loadCsRows);

  function loadCsRows() {
    var opts = { mineOnly: $("cs-mine").checked, includeClosed: $("cs-closed").checked };
    if (CS_MODE === "leads") {
      google.script.run.withSuccessHandler(function (rows) {
        leadsCache = rows; renderCsRows();
      }).withFailureHandler(onServerError).listLeads(opts);
    } else {
      google.script.run.withSuccessHandler(function (rows) {
        opportunitiesCache = rows; renderCsRows();
      }).withFailureHandler(onServerError).listOpportunities(opts);
    }
  }

  function renderCsRows() {
    if (CS_MODE === "leads") renderLeads(); else renderPipeline();
  }

  function renderLeads() {
    var q = ($("cs-search").value || "").toLowerCase();
    var rows = leadsCache.filter(function (l) {
      return [l.leadNo, l.customerName, l.requirementSummary, l.contactName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    $("cs-thead").innerHTML = "<tr><th>Lead No.</th><th>Date</th><th>Customer</th><th>Requirement</th>" +
      "<th>Source</th><th>Owner</th><th>Status</th><th>Next Action</th><th></th></tr>";

    if (!rows.length) {
      $("cs-tbody").innerHTML = '<tr><td colspan="9"><div class="empty">' +
        (leadsCache.length ? "No leads match your search." : "No open leads — log the first one.") +
        "</div></td></tr>";
      return;
    }

    $("cs-tbody").innerHTML = rows.map(function (l) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(l.leadNo || "—") + "</td>" +
        "<td>" + escapeHtml(l.date) + "</td>" +
        "<td>" + escapeHtml(l.customerName || "—") + "</td>" +
        "<td>" + escapeHtml((l.requirementSummary || "—").slice(0, 60)) + "</td>" +
        "<td>" + escapeHtml(l.source || "—") + "</td>" +
        "<td>" + escapeHtml(l.ownerEmail || "—") + "</td>" +
        '<td><span class="badge ' + (LEAD_BADGE[l.status] || "badge-draft") + '">' + escapeHtml(l.status) + "</span></td>" +
        "<td>" + (l.nextActionDate
          ? (l.overdue ? '<span class="badge badge-overdue">' + escapeHtml(l.nextActionDate) + "</span>" : escapeHtml(l.nextActionDate))
          : "—") + "</td>" +
        '<td class="center"><button class="btn-ghost" data-open-lead="' + l.id + '" title="Open">✎</button></td>' +
        "</tr>";
    }).join("");

    $("cs-tbody").querySelectorAll("[data-open-lead]").forEach(function (btn) {
      btn.addEventListener("click", function () { openLeadModal(btn.dataset.openLead); });
    });
  }

  function renderPipeline() {
    var q = ($("cs-search").value || "").toLowerCase();
    var rows = opportunitiesCache.filter(function (o) {
      return [o.opportunityNo, o.customerName, o.title].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    // Weighted pipeline by stage (FR-012) — what the funnel is actually worth.
    var open = rows.filter(function (o) { return ["Won", "Lost"].indexOf(o.stage) === -1; });
    var total = open.reduce(function (sum, o) { return sum + (Number(o.expectedValue) || 0); }, 0);
    var weighted = open.reduce(function (sum, o) { return sum + (Number(o.weightedValue) || 0); }, 0);
    var byStage = {};
    open.forEach(function (o) { byStage[o.stage] = (byStage[o.stage] || 0) + 1; });

    $("pipeline-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Open Opportunities</div><div class="kpi-value">' + open.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Pipeline Value</div><div class="kpi-value" style="font-size:20px;">' + fmt(total) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Weighted Pipeline</div><div class="kpi-value" style="font-size:20px;">' + fmt(weighted) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Needs Follow-up</div><div class="kpi-value" ' +
        'style="color:' + (open.filter(function (o) { return o.overdue; }).length ? "var(--red)" : "var(--navy)") + ';">' +
        open.filter(function (o) { return o.overdue; }).length + "</div></div>" +
      "</div>" +
      '<div class="compare-strip" style="margin-bottom:14px;">' +
        STAGES.filter(function (st) { return ["Won", "Lost"].indexOf(st) === -1; }).map(function (st) {
          return '<span class="badge ' + STAGE_BADGE[st] + '" style="margin-right:6px;">' +
            escapeHtml(st) + ": " + (byStage[st] || 0) + "</span>";
        }).join("") +
      "</div>";

    $("cs-thead").innerHTML = "<tr><th>Opp No.</th><th>Customer</th><th>Title</th><th>Stage</th>" +
      '<th class="num">Value</th><th class="num">Prob.</th><th class="num">Weighted</th>' +
      "<th>Expected Close</th><th>Next Action</th><th></th></tr>";

    if (!rows.length) {
      $("cs-tbody").innerHTML = '<tr><td colspan="10"><div class="empty">' +
        (opportunitiesCache.length ? "No opportunities match your search." : "No open opportunities — convert a qualified lead.") +
        "</div></td></tr>";
      return;
    }

    $("cs-tbody").innerHTML = rows.map(function (o) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(o.opportunityNo || "—") + "</td>" +
        "<td>" + escapeHtml(o.customerName || "—") + "</td>" +
        "<td>" + escapeHtml(o.title || "—") +
          (o.hasTechnicalRequirement ? "" : ' <span class="badge badge-overdue">No tech sheet</span>') + "</td>" +
        '<td><span class="badge ' + (STAGE_BADGE[o.stage] || "badge-draft") + '">' + escapeHtml(o.stage) + "</span></td>" +
        '<td class="num mono">' + (o.expectedValue ? fmt(o.expectedValue) : "—") + "</td>" +
        '<td class="num">' + o.probability + "%</td>" +
        '<td class="num mono">' + fmt(o.weightedValue) + "</td>" +
        "<td>" + escapeHtml(o.expectedCloseDate || "—") + "</td>" +
        "<td>" + (o.nextActionDate
          ? (o.overdue ? '<span class="badge badge-overdue">' + escapeHtml(o.nextActionDate) + "</span>" : escapeHtml(o.nextActionDate))
          : "—") + "</td>" +
        '<td class="center"><button class="btn-ghost" data-open-opp="' + o.id + '" title="Open">✎</button></td>' +
        "</tr>";
    }).join("");

    $("cs-tbody").querySelectorAll("[data-open-opp]").forEach(function (btn) {
      btn.addEventListener("click", function () { openOpportunityModal(btn.dataset.openOpp); });
    });
  }

  function openLeadModal(id) {
    var l = id ? leadsCache.find(function (x) { return x.id === id; }) : null;
    $("lead-modal-title").textContent = id ? "Lead" : "Log Lead";
    $("lm-no").textContent = l ? l.leadNo : "A lead number is assigned on save.";
    $("lm-id").value = id || "";

    var cust = l ? customersCache.find(function (c) { return c.id === l.customerId; }) : null;
    $("lm-customer").value = cust ? cust.name : "";
    $("lm-contact").value = l ? (l.contactName || "") : "";
    $("lm-phone").value = l ? (l.contactPhone || "") : "";
    $("lm-source").value = l ? (l.source || "") : "";
    $("lm-industry").value = l ? (l.industry || "") : "";
    $("lm-application").value = l ? (l.application || "") : "";
    $("lm-requirement").value = l ? (l.requirementSummary || "") : "";
    $("lm-urgency").value = l ? (l.urgency || "Normal") : "Normal";
    $("lm-budget").value = l && l.budget !== "" ? l.budget : "";
    $("lm-owner").value = l ? (l.ownerEmail || currentUser.email) : currentUser.email;
    $("lm-nextaction").value = l ? (l.nextActionDate || "") : "";

        return '<option value="' + r.id + '">' + escapeHtml(r.reasonText) + "</option>";
      }).join("");

    fillDatalist("industry-list", ((configLists || {}).Industry || []).map(function (i) { return i.label; }));

    $("btn-convert-lead").style.display =

      source: $("lm-source").value.trim(),
      industry: $("lm-industry").value.trim(),
      application: $("lm-application").value.trim(),
      requirementSummary: $("lm-requirement").value.trim(),

  $("btn-convert-lead").addEventListener("click", function () {

    askDialog({

    }, function (ok) {

  $("btn-cancel-opp").addEventListener("click", function () {
    $("opp-modal-backdrop").classList.remove("show");
    loadCsRows();

    $("opp-modal-title").textContent = o.title || "Opportunity";
    $("om-no").textContent = o.opportunityNo + " · " + (o.customerName || "");
    $("om-id").value = o.id;
    $("om-customer").value = o.customerName || "";
    $("om-title").value = o.title || "";
    $("om-owner").value = o.ownerEmail || "";
    $("om-stage").innerHTML = STAGES.map(function (st) {
      return '<option value="' + st + '"' + (st === o.stage ? " selected" : "") + ">" + st + "</option>";

  function renderSelections(o) {

        "<th>Accessories</th><th></th></tr></thead><tbody>" +
        o.selections.map(function (sel) {
          var acc = [sel.dryer, sel.receiver, sel.filters, sel.accessories]
            .filter(function (x) { return String(x || "").trim(); }).join(", ");
          return "<tr>" +
            '<td class="mono">' + escapeHtml(sel.productCode) + "</td>" +
            "<td>" + escapeHtml(sel.hpRating || "—") + "</td>" +
            "<td>" + escapeHtml(sel.workingPressure || "—") + "</td>" +
            "<td>" + escapeHtml(sel.fad || "—") + "</td>" +
            "<td>" + escapeHtml(acc || "—") + "</td>" +
            '<td class="center"><button class="btn-ghost" data-del-sel="' + sel.id + '" title="Remove">✕</button></td>' +
            "</tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty" style="padding:14px;">No compressor selected yet.</div>';

    $("om-selections").querySelectorAll("[data-del-sel]").forEach(function (btn) {
      btn.addEventListener("click", function () {

  // ================= SALES ORDERS =================
  var ordersCache = [];
  var openOrder = null;

  var ORDER_BADGE = {
    "Draft": "badge-draft", "Approval Pending": "badge-pending", "Credit Hold": "badge-lost",
    "Material Pending": "badge-followup", "Ready for Dispatch": "badge-active",
    "Dispatched": "badge-dispatched", "Invoiced": "badge-quoted", "Closed": "badge-won"
  };

  function canEditOrders() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }
  function canReleaseCredit() {
    return ["Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initOrdersView() {
    $("btn-new-order").style.display = canEditOrders() ? "inline-flex" : "none";
    loadOrders();
  }

  function loadOrders() {
    google.script.run.withSuccessHandler(function (rows) {
      ordersCache = rows; renderOrders();
    }).withFailureHandler(onServerError).listSalesOrders({
      mineOnly: $("orders-mine").checked,
      includeClosed: $("orders-closed").checked,
      creditHoldOnly: $("orders-hold").checked
    });
  }

  $("orders-search").addEventListener("input", renderOrders);
  $("orders-mine").addEventListener("change", loadOrders);
  $("orders-hold").addEventListener("change", loadOrders);
  $("orders-closed").addEventListener("change", loadOrders);

  function renderOrders() {
    var q = ($("orders-search").value || "").toLowerCase();
    var rows = ordersCache.filter(function (o) {
      return [o.orderNo, o.poNo, o.customerName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var holds = ordersCache.filter(function (o) { return o.creditHold || o.orderStatus === "Credit Hold"; });
    var ready = ordersCache.filter(function (o) { return o.orderStatus === "Ready for Dispatch"; });
    var late = ordersCache.filter(function (o) { return o.overdueDispatch; });
    $("orders-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Open Orders</div><div class="kpi-value">' + ordersCache.length + "</div></div>" +
      '<div class="kpi-card' + (holds.length ? " alert" : "") + '"><div class="kpi-label">Credit Holds</div><div class="kpi-value">' + holds.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Ready for Dispatch</div><div class="kpi-value">' + ready.length + "</div></div>" +
      '<div class="kpi-card' + (late.length ? " alert" : "") + '"><div class="kpi-label">Past Promised Date</div><div class="kpi-value">' + late.length + "</div></div>" +
      "</div>";

    if (!rows.length) {
      $("orders-tbody").innerHTML = '<tr><td colspan="8"><div class="empty">' +
        (ordersCache.length ? "No orders match your search." : "No orders yet — convert a won quotation.") +
        "</div></td></tr>";
      return;
    }

    $("orders-tbody").innerHTML = rows.map(function (o) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(o.orderNo) + "</td>" +
        "<td>" + escapeHtml(o.date) + "</td>" +
        "<td>" + escapeHtml(o.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(o.poNo || "—") +
          (String(o.poVerified).toUpperCase() === "FALSE" ? ' <span class="badge badge-overdue">PO variance</span>' : "") + "</td>" +
        '<td class="num mono">' + fmt(o.grand) + "</td>" +
        '<td><span class="badge ' + (ORDER_BADGE[o.orderStatus] || "badge-draft") + '">' +
          escapeHtml(o.orderStatus) + "</span></td>" +
        "<td>" + (o.promisedDispatchDate
          ? (o.overdueDispatch ? '<span class="badge badge-overdue">' + escapeHtml(o.promisedDispatchDate) + "</span>" : escapeHtml(o.promisedDispatchDate))
          : "—") + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-order="' + o.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("orders-tbody").querySelectorAll("[data-open-order]").forEach(function (btn) {
      btn.addEventListener("click", function () { openOrderModal(btn.dataset.openOrder); });
    });
  }

  // ---- Create from quotation ----
  $("btn-new-order").addEventListener("click", function () {
    google.script.run.withSuccessHandler(function (quotes) {
      if (!quotes.length) {
        showMsg("No won quotations are waiting to be converted. Mark a quotation Won first.", "error");
        return;

          "</option>";

      $("no-pono").value = "";
      $("no-podate").value = new Date().toISOString().slice(0, 10);

      $("no-advance").value = "";
      $("no-promised").value = "";

    });

  $("btn-cancel-order").addEventListener("click", function () {

  function openOrderModal(id) {

  function renderOrderModal() {
    var o = openOrder;
    if (!o) return;
    var editable = canEditOrders() && o.orderStatus !== "Closed";

    $("order-modal-title").textContent = o.orderNo + " — " + (o.customerName || "");
    $("om2-sub").textContent = o.businessStream + " · " + o.orderStatus + " · " + fmt(o.grand);
    $("om2-id").value = o.id;

    $("om2-credit-banner").innerHTML = o.creditHold
      ? '<div class="msg msg-error show" style="margin-bottom:14px;"><span class="msg-text">' +
        "<b>On credit hold.</b> " + escapeHtml(o.creditHoldReason || "") +
        (canReleaseCredit()
          ? " You can release it below."
          : " Management must release it before dispatch.") +
        "</span></div>"
      : "";

    $("om2-variance-banner").innerHTML = String(o.poVerified).toUpperCase() === "FALSE"
      ? '<div class="compare-strip" style="margin-bottom:14px;"><b>PO variance:</b> ' +
        escapeHtml(o.poVarianceNotes || "") + "</div>"
      : "";

    $("om2-pono").value = o.poNo || "";
    $("om2-podate").value = o.poDate || "";
    $("om2-povalue").value = o.poValue !== "" ? o.poValue : "";
    $("om2-paymentterms").value = o.paymentTerms || "";
    $("om2-advreq").value = o.advanceRequired !== "" ? o.advanceRequired : "";
    $("om2-advrec").value = o.advanceReceived !== "" ? o.advanceReceived : "";
    $("om2-promised").value = o.promisedDispatchDate || "";
    $("om2-attachment").value = o.poAttachmentUrl || "";
    $("om2-notes").value = o.notes || "";

    ["om2-pono", "om2-podate", "om2-povalue", "om2-paymentterms", "om2-advreq",
     "om2-advrec", "om2-promised", "om2-attachment", "om2-notes"].forEach(function (f) {
      $(f).disabled = !editable;
    });
    $("btn-om2-save").style.display = editable ? "" : "none";

    renderCreditPanel(o);
    renderOrderItems(o);
    renderStatusPanel(o, editable);
    renderCreditChecks(o);
  }

  function renderCreditPanel(o) {
    var latest = o.creditChecks[0];
    if (!latest) {
      $("om2-credit-panel").innerHTML = '<div class="empty" style="padding:14px;">No credit check run yet.</div>';
      return;
    }
    var limit = latest.creditLimit === "" ? null : Number(latest.creditLimit);
    $("om2-credit-panel").innerHTML = '<div class="grid grid-4">' +
      '<div class="kpi-card"><div class="kpi-label">Credit Limit</div><div class="kpi-value" style="font-size:18px;">' +
        (limit === null ? "Not set" : fmt(limit)) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Outstanding Invoices</div><div class="kpi-value" style="font-size:18px;">' +
        fmt(latest.outstandingAmt) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Open Orders</div><div class="kpi-value" style="font-size:18px;">' +
        fmt(latest.openOrderExposure) + "</div></div>" +
      '<div class="kpi-card' + (latest.result === "Hold" ? " alert" : "") + '">' +
        '<div class="kpi-label">Total Exposure</div><div class="kpi-value" style="font-size:18px;">' +
        fmt(latest.totalExposure) + "</div>" +
        '<div class="kpi-sub">' + (latest.availableCredit === ""
          ? "No limit set"
          : "Available: " + fmt(latest.availableCredit)) + "</div></div>" +
      "</div>";
  }

  function renderOrderItems(o) {
    $("om2-items").innerHTML = o.items.length
      ? '<table><thead><tr><th>#</th><th>Code</th><th>Description</th><th class="num">Qty</th>' +
        '<th class="num">Price</th><th class="num">Line Total</th>' +
        '<th class="num">Reserved</th><th class="num">Dispatched</th></tr></thead><tbody>' +
        o.items.map(function (i) {
          return "<tr><td>" + i.lineNo + '</td><td class="mono">' + escapeHtml(i.itemCode || "—") +
            "</td><td>" + escapeHtml(i.description || "—") +
            '</td><td class="num">' + i.qty +
            '</td><td class="num mono">' + fmt(i.unitPrice) +
            '</td><td class="num mono">' + fmt(i.lineTotal) +
            '</td><td class="num">' + (i.qtyReserved || 0) +
            '</td><td class="num">' + (i.qtyDispatched || 0) + "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty" style="padding:14px;">No items.</div>';
  }

  function renderStatusPanel(o, editable) {
    var zone = $("om2-status-panel");
    var buttons = "";

    if (o.creditHold && canReleaseCredit()) {
      buttons += '<button class="btn btn-sm btn-amber" id="btn-release-hold">Release Credit Hold</button> ';
    }
    if (editable && !o.creditHold && ["Draft", "Approval Pending", "Material Pending"].indexOf(o.orderStatus) !== -1) {
      buttons += '<button class="btn btn-sm btn-amber" id="btn-reserve-stock">Reserve Stock</button> ';
    }
    if (editable && !o.creditHold) {
      buttons += o.allowedTransitions.map(function (st) {
        return '<button class="btn btn-sm" data-order-status="' + st + '">→ ' + st + "</button>";
      }).join(" ");
    }
    if (!buttons) {
      buttons = '<span style="color:var(--ink-soft); font-size:13px;">' +
        (o.orderStatus === "Closed" ? "This order is closed." : "No status change available to you.") +
        "</span>";
    }

    zone.innerHTML = '<p style="font-size:12px; color:var(--ink-soft); margin:0 0 10px;">Current: <b>' +
      escapeHtml(o.orderStatus) + "</b>. Moving to Ready for Dispatch or Dispatched re-runs the " +
      "credit check automatically.</p>" + buttons;

    zone.querySelectorAll("[data-order-status]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var target = btn.dataset.orderStatus;
        google.script.run.withSuccessHandler(function (updated) {
          openOrder = updated; renderOrderModal(); loadOrders();
          showMsg("Order moved to " + target + ".", "success");
        }).withFailureHandler(onServerError).setOrderStatus(o.id, target, "");
      });
    });

    if ($("btn-reserve-stock")) {
      $("btn-reserve-stock").addEventListener("click", function () {
        google.script.run.withSuccessHandler(function (res) {
          openOrderModal(o.id);
          loadOrders();
          var msg = res.reserved.length
            ? "Reserved " + res.reserved.map(function (r) { return r.qty + " × " + r.itemCode; }).join(", ")
            : "Nothing could be reserved";
          if (res.shortfalls.length) {
            msg += ". Short: " + res.shortfalls.map(function (sf) {
              return sf.itemCode + " (need " + sf.shortBy + " more)";
            }).join(", ");
          }
          showMsg(msg + ".", res.shortfalls.length ? "error" : "success");
        }).withFailureHandler(onServerError).reserveStockForOrder(o.id);
      });
    }

    if ($("btn-release-hold")) {
      $("btn-release-hold").addEventListener("click", function () {
        askDialog({
          title: "Release this credit hold?",
          message: "The reason is recorded against the order, the credit check and the " +
            "approvals register. This is a logged commercial exception.",
          input: true, inputLabel: "Reason for release", okLabel: "Release hold", danger: true
        }, function (reason) {
          if (reason === null) return;
          google.script.run.withSuccessHandler(function (updated) {
            openOrder = updated; renderOrderModal(); loadOrders();
            showMsg("Credit hold released.", "success");
          }).withFailureHandler(onServerError).releaseCreditHold(o.id, reason, "Material Pending");
        });
      });
    }
  }

    $("om2-checks").innerHTML = o.creditChecks.length

  // ================= INVENTORY & INWARD =================
  var INV_MODE = "stock";

    switchInvMode(INV_MODE);
