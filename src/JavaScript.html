  // ================= COLLECTIONS =================
  var COL_SUBTABS = ["ageing", "receivables", "followups", "receipts"];
  var colMode = "ageing";
  var colCache = [];
  var colSummary = null;
  var riPreview = null;

  var BUCKET_LABELS = [
    { key: "notDue", label: "Not Due" },
    { key: "d0_30", label: "1–30" },
    { key: "d31_60", label: "31–60" },
    { key: "d61_90", label: "61–90" },
    { key: "d90plus", label: "90+" }
  ];

  var RECEIPT_MODE_OPTIONS = ["NEFT/RTGS", "Cheque", "Cash", "UPI", "Adjustment", "Other"];

  function canCollect() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initCollectionsView() {
    $("col-actions").innerHTML = canCollect()
      ? '<button class="btn btn-primary" id="btn-new-receipt">+ Record Receipt</button>' +
        '<button class="btn btn-amber" id="btn-import-receipts">Import Receipts</button>'
      : "";
    if (canCollect()) {
      $("btn-new-receipt").addEventListener("click", startReceipt);
      $("btn-import-receipts").addEventListener("click", startReceiptImport);
    }
    setColMode(colMode);
  }

  COL_SUBTABS.forEach(function (mode) {
    $("subtab-" + mode).addEventListener("click", function () { setColMode(mode); });
  });

  function setColMode(mode) {
    colMode = mode;
    COL_SUBTABS.forEach(function (m) {
      $("subtab-" + m).className = "btn btn-sm" + (m === mode ? " btn-primary" : "");
    });
    loadCollections();
  }

  $("col-search").addEventListener("input", function () { renderColTable(); });
  $("col-overdue").addEventListener("change", loadCollections);

  function loadCollections() {
    // The ageing strip is the same for every sub-tab, so it is fetched once alongside the rows.
    google.script.run.withSuccessHandler(function (summary) {
      colSummary = summary;
      renderColSummary();
    }).withFailureHandler(onServerError).getAgeingSummary();

    var done = function (rows) { colCache = rows; renderColTable(); };
    var overdue = $("col-overdue").checked;

    if (colMode === "ageing") {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError).getAgeingByCustomer();
    } else if (colMode === "receivables") {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError)
        .getReceivables({ overdueOnly: overdue });
    } else if (colMode === "followups") {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError)
        .listFollowups({ openOnly: true });
    } else {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError).listReceipts({});
    }
  }

  function renderColSummary() {
    if (!colSummary) return;
    var s = colSummary;
    $("col-summary").innerHTML =
      '<div class="grid grid-2" style="margin-bottom:12px;">' +
        '<div class="kpi-card"><div class="kpi-label">Total Outstanding</div>' +
          '<div class="kpi-value">' + fmt(s.totalOutstanding) + "</div>" +
          '<div class="kpi-sub">' + s.invoiceCount + " open invoice(s)</div></div>" +
        '<div class="kpi-card' + (s.overdueAmount > 0 ? " alert" : "") + '">' +
          '<div class="kpi-label">Overdue</div><div class="kpi-value">' + fmt(s.overdueAmount) + "</div>" +
          '<div class="kpi-sub">past the agreed due date</div></div>' +
      "</div>" +
      '<div class="grid grid-5" style="margin-bottom:14px;">' +
        s.buckets.map(function (b) {
          var bad = b.key !== "notDue" && b.amount > 0;
          return '<div class="kpi-card' + (b.key === "d90plus" && b.amount > 0 ? " alert" : "") + '">' +
            '<div class="kpi-label">' + escapeHtml(b.label) + "</div>" +
            '<div class="kpi-value" style="font-size:17px;' + (bad ? " color:var(--red);" : "") + '">' +
              fmt(b.amount) + "</div>" +
            '<div class="kpi-sub">' + b.count + " invoice(s)</div></div>";
        }).join("") +
      "</div>";
  }

  function colEmpty(cols, text) {
    $("col-tbody").innerHTML = '<tr><td colspan="' + cols + '"><div class="empty">' +
      escapeHtml(text) + "</div></td></tr>";
  }

  function renderColTable() {
    var q = ($("col-search").value || "").toLowerCase();
    var rows = colCache.filter(function (r) {
      return [r.customerName, r.invoiceNo, r.receiptNo, r.reference].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    if (colMode === "ageing") renderAgeingTable(rows);
    else if (colMode === "receivables") renderReceivablesTable(rows);
    else if (colMode === "followups") renderFollowupsTable(rows);
    else renderReceiptsTable(rows);
  }

  function renderAgeingTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Customer</th>" +
      BUCKET_LABELS.map(function (b) { return '<th class="num">' + b.label + "</th>"; }).join("") +
      '<th class="num">Total</th><th class="num">Oldest</th><th></th></tr>';

    if (!rows.length) { colEmpty(9, "Nothing outstanding. Every issued invoice is paid."); return; }

    $("col-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        "<td><b>" + escapeHtml(r.customerName || "—") + "</b>" +
          (r.overLimit ? ' <span class="badge badge-overdue">Over limit</span>' : "") +
          (r.brokenCommitments ? ' <span class="badge badge-lost">' + r.brokenCommitments +
            " broken promise(s)</span>" : "") +
          '<br><span style="font-size:11px; color:var(--ink-soft);">' + r.invoiceCount +
          " invoice(s)" + (r.creditLimit !== null && r.creditLimit !== undefined
            ? " · limit " + fmt(r.creditLimit) : "") + "</span></td>" +
        BUCKET_LABELS.map(function (b) {
          var v = r[b.key] || 0;
          var bad = b.key === "d61_90" || b.key === "d90plus";
          return '<td class="num mono"' + (bad && v > 0 ? ' style="color:var(--red);"' : "") + ">" +
            (v ? fmt(v) : "—") + "</td>";
        }).join("") +
        '<td class="num mono"><b>' + fmt(r.totalOutstanding) + "</b></td>" +
        '<td class="num">' + (r.oldestOverdueDays > 0
          ? '<span class="badge badge-overdue">' + r.oldestOverdueDays + "d</span>" : "—") + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-statement="' + r.customerId + '">Statement</button></td>' +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-statement]").forEach(function (btn) {
      btn.addEventListener("click", function () { openStatement(btn.dataset.statement); });
    });
  }

  function renderReceivablesTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Invoice No.</th><th>Customer</th><th>Invoiced</th><th>Due</th>" +
      '<th class="num">Value</th><th class="num">Received</th><th class="num">Balance</th>' +
      "<th>Ageing</th><th>Commitment</th><th></th></tr>";

    if (!rows.length) { colEmpty(10, "No open invoices match."); return; }

    $("col-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.invoiceNo) + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        "<td>" + escapeHtml(r.invoiceDate) + "</td>" +
        "<td>" + escapeHtml(r.dueDate || "—") + "</td>" +
        '<td class="num mono">' + fmt(r.grand) + "</td>" +
        '<td class="num mono">' + fmt(r.receivedAmt) + "</td>" +
        '<td class="num mono"><b>' + fmt(r.balanceAmt) + "</b></td>" +
        "<td>" + (r.overdueDays > 0
          ? '<span class="badge badge-overdue">' + r.overdueDays + " days</span>"
          : '<span class="badge badge-active">Not due</span>') + "</td>" +
        "<td>" + (r.commitmentAmount
          ? (r.commitmentOverdue
              ? '<span class="badge badge-lost">' + fmt(r.commitmentAmount) + " by " + escapeHtml(r.commitmentDate) + "</span>"
              : '<span class="badge badge-followup">' + fmt(r.commitmentAmount) + " by " + escapeHtml(r.commitmentDate) + "</span>")
          : "—") + "</td>" +
        '<td class="center" style="white-space:nowrap;">' +
          '<button class="btn btn-sm" data-followup="' + r.invoiceId + '">Follow up</button> ' +
          '<button class="btn btn-sm btn-primary" data-receipt="' + r.invoiceId + '">Receipt</button></td>' +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-followup]").forEach(function (btn) {
      btn.addEventListener("click", function () { startFollowup(btn.dataset.followup); });
    });
    $("col-tbody").querySelectorAll("[data-receipt]").forEach(function (btn) {
      btn.addEventListener("click", function () { startReceipt(btn.dataset.receipt); });
    });
  }

  function renderFollowupsTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Date</th><th>Customer</th><th>Invoice</th><th>Discussion</th>" +
      '<th class="num">Balance</th><th>Commitment</th><th>Next</th><th>Status</th><th></th></tr>';

    if (!rows.length) { colEmpty(9, "No open follow-ups. Log one from an open invoice."); return; }

    $("col-tbody").innerHTML = rows.map(function (f) {
      return "<tr>" +
        "<td>" + escapeHtml(f.contactDate) + "</td>" +
        "<td>" + escapeHtml(f.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(f.invoiceNo || "—") + "</td>" +
        '<td style="max-width:280px;">' + escapeHtml(f.discussion || "") +
          (f.contactPerson ? '<br><span style="font-size:11px; color:var(--ink-soft);">with ' +
            escapeHtml(f.contactPerson) + "</span>" : "") + "</td>" +
        '<td class="num mono">' + fmt(f.balanceAmt) + "</td>" +
        "<td>" + (f.commitmentAmount
          ? (f.commitmentOverdue
              ? '<span class="badge badge-lost">' + fmt(f.commitmentAmount) + " — broken</span>"
              : '<span class="badge badge-followup">' + fmt(f.commitmentAmount) + " by " + escapeHtml(f.commitmentDate) + "</span>")
          : "—") + "</td>" +
        "<td>" + (f.nextFollowupDate
          ? (f.followupDue ? '<span class="badge badge-overdue">' + escapeHtml(f.nextFollowupDate) + "</span>"
                           : escapeHtml(f.nextFollowupDate))
          : "—") + "</td>" +
        '<td><span class="badge ' + (f.status === "Broken" ? "badge-lost"
          : f.status === "Closed" ? "badge-won" : "badge-followup") + '">' +
          escapeHtml(f.status || "Open") + "</span></td>" +
        '<td class="center"><button class="btn btn-sm" data-editfu="' + f.id + '">Edit</button></td>' +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-editfu]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var f = colCache.filter(function (x) { return String(x.id) === String(btn.dataset.editfu); })[0];
        if (f) startFollowup(f.invoiceId, f);
      });
    });
  }

  function renderReceiptsTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Receipt No.</th><th>Date</th><th>Customer</th><th>Invoice</th>" +
      '<th>Mode</th><th>Reference</th><th class="num">Amount</th><th></th></tr>';

    if (!rows.length) { colEmpty(8, "No receipts recorded yet."); return; }

    $("col-tbody").innerHTML = rows.map(function (r) {
      var reversal = (Number(r.amount) || 0) < 0;
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.receiptNo || "—") +
          (r.importedDate ? ' <span class="badge badge-dormant">imported</span>' : "") + "</td>" +
        "<td>" + escapeHtml(r.receiptDate) + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(r.invoiceNo || "—") + "</td>" +
        "<td>" + escapeHtml(r.mode || "—") + "</td>" +
        '<td class="mono" style="font-size:11.5px;">' + escapeHtml(r.reference || r.tallyRef || "—") + "</td>" +
        '<td class="num mono"' + (reversal ? ' style="color:var(--red);"' : "") + ">" + fmt(r.amount) + "</td>" +
        '<td class="center">' + (!reversal && canOverrideDispatch()
          ? '<button class="btn btn-sm btn-danger" data-reverse="' + r.id + '">Reverse</button>' : "") + "</td>" +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-reverse]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({
          title: "Reverse this receipt?",
          message: "The original stays in the ledger and an offsetting entry is added, so the " +
            "history of what was believed and when survives.",
          input: true, inputLabel: "Reason *", okLabel: "Reverse Receipt", danger: true
        }, function (reason) {
          if (reason === null) return;
          google.script.run.withSuccessHandler(function () {
            loadCollections();
            showMsg("Receipt reversed.", "success");
          }).withFailureHandler(onServerError).reverseReceipt(btn.dataset.reverse, reason);
        });
      });
    });
  }

  // ---- Record a receipt ----
  var receivablesForPicker = [];

  function startReceipt(invoiceId) {
    google.script.run.withSuccessHandler(function (rows) {
      receivablesForPicker = rows;
      if (!rows.length) {
        showMsg("There are no unpaid invoices to receipt against.", "error");
        return;
      }
      $("rcp-invoice").innerHTML = rows.map(function (r) {
        return '<option value="' + r.invoiceId + '">' +
          escapeHtml(r.invoiceNo + " · " + r.customerName + " · balance " + fmt(r.balanceAmt)) +
          "</option>";
      }).join("");
      if (typeof invoiceId === "string" && invoiceId) $("rcp-invoice").value = invoiceId;

      $("rcp-mode").innerHTML = RECEIPT_MODE_OPTIONS.map(function (m) {
        return "<option>" + escapeHtml(m) + "</option>";
      }).join("");
      $("rcp-date").value = new Date().toISOString().slice(0, 10);
      ["rcp-reference", "rcp-tallyref", "rcp-notes"].forEach(function (f) { $(f).value = ""; });
      onReceiptInvoiceChange();
      $("receipt-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).getReceivables({});
  }

  // Default the amount to the full balance — part payments are the exception, not the rule.
  function onReceiptInvoiceChange() {
    var row = receivablesForPicker.filter(function (r) {
      return String(r.invoiceId) === String($("rcp-invoice").value);
    })[0];
    if (!row) { $("rcp-balance").textContent = ""; return; }
    $("rcp-balance").textContent = "Outstanding on " + row.invoiceNo + ": " + fmt(row.balanceAmt) +
      (row.overdueDays > 0 ? "  ·  " + row.overdueDays + " days overdue" : "  ·  not yet due");
    $("rcp-amount").value = row.balanceAmt;
  }

  $("rcp-invoice").addEventListener("change", onReceiptInvoiceChange);

  $("btn-cancel-receipt").addEventListener("click", function () {
    $("receipt-modal-backdrop").classList.remove("show");
  });

  $("btn-save-receipt").addEventListener("click", function () {
    google.script.run.withSuccessHandler(function () {
      $("receipt-modal-backdrop").classList.remove("show");
      loadCollections();
      showMsg("Receipt recorded.", "success");
    }).withFailureHandler(onServerError).saveReceipt({
      invoiceId: $("rcp-invoice").value,
      receiptDate: $("rcp-date").value,
      amount: $("rcp-amount").value,
      mode: $("rcp-mode").value,
      reference: $("rcp-reference").value.trim(),
      tallyRef: $("rcp-tallyref").value.trim(),
      notes: $("rcp-notes").value.trim()
    });
  });

  // ---- Follow-ups ----
  function startFollowup(invoiceId, existing) {
    $("fu-id").value = existing ? existing.id : "";
    $("fu-invoiceid").value = invoiceId;
    $("followup-modal-title").textContent = existing ? "Edit Follow-up" : "Log a Follow-up";

    var row = colCache.filter(function (r) {
      return String(r.invoiceId) === String(invoiceId);
    })[0];
    $("fu-context").textContent = existing
      ? (existing.invoiceNo || "") + " · " + (existing.customerName || "")
      : (row ? row.invoiceNo + " · " + row.customerName + " · balance " + fmt(row.balanceAmt) : "");

    $("fu-date").value = existing ? existing.contactDate : new Date().toISOString().slice(0, 10);
    $("fu-person").value = existing ? existing.contactPerson || "" : "";
    $("fu-discussion").value = existing ? existing.discussion || "" : "";
    $("fu-commitamount").value = existing && existing.commitmentAmount ? existing.commitmentAmount : "";
    $("fu-commitdate").value = existing ? existing.commitmentDate || "" : "";
    $("fu-next").value = existing ? existing.nextFollowupDate || "" : "";
    $("fu-status").value = existing ? existing.status || "Open" : "Open";
    $("followup-modal-backdrop").classList.add("show");
  }

  $("btn-cancel-followup").addEventListener("click", function () {
    $("followup-modal-backdrop").classList.remove("show");
  });

  $("btn-save-followup").addEventListener("click", function () {
    google.script.run.withSuccessHandler(function () {
      $("followup-modal-backdrop").classList.remove("show");
      loadCollections();
      showMsg("Follow-up saved.", "success");
    }).withFailureHandler(onServerError).saveFollowup({
      id: $("fu-id").value || null,
      invoiceId: $("fu-invoiceid").value,
      contactDate: $("fu-date").value,
      contactPerson: $("fu-person").value.trim(),
      discussion: $("fu-discussion").value.trim(),
      commitmentAmount: $("fu-commitamount").value,
      commitmentDate: $("fu-commitdate").value,
      nextFollowupDate: $("fu-next").value,
      status: $("fu-status").value
    });
  });

  // ---- Receipt import ----
  // Some people have a file; some have a few rows in a mail from the accounts desk. The modal
  // takes either, and both end up as the same text going to the same validator.
  var riMode = "file";

  function startReceiptImport() {
    riPreview = null;
    $("ri-csv").value = "";
    $("ri-preview").innerHTML = "";
    $("btn-ri-commit").style.display = "none";
    setRiMode("file");
    clearRiFile();
    google.script.run.withSuccessHandler(function (tpl) {
      $("ri-header").textContent = tpl.split("\n")[0];
    }).withFailureHandler(onServerError).getReceiptImportTemplate();
    $("rcpimport-modal-backdrop").classList.add("show");
  }

  function setRiMode(mode) {
    riMode = mode;
    $("btn-ri-mode-file").classList.toggle("active", mode === "file");
    $("btn-ri-mode-paste").classList.toggle("active", mode === "paste");
    $("ri-file-wrap").style.display = mode === "file" ? "" : "none";
    $("ri-paste-wrap").style.display = mode === "paste" ? "" : "none";
    // A preview built from the other input would no longer match what is on screen.
    $("ri-preview").innerHTML = "";
    $("btn-ri-commit").style.display = "none";
    riPreview = null;
  }

  $("btn-ri-mode-file").addEventListener("click", function () { setRiMode("file"); });
  $("btn-ri-mode-paste").addEventListener("click", function () { setRiMode("paste"); });

  function clearRiFile() {
    riFileText = null;
    $("ri-file").value = "";
    $("ri-filecard").innerHTML = "";
    $("ri-drop").style.display = "";
    $("btn-ri-clear").style.display = "none";
  }

  var riFileText = null;

  $("btn-ri-clear").addEventListener("click", function () {
    clearRiFile();
    $("ri-preview").innerHTML = "";
    $("btn-ri-commit").style.display = "none";
    riPreview = null;
  });

  $("ri-drop").addEventListener("click", function () { $("ri-file").click(); });
  $("ri-file").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) readRiFile(e.target.files[0]);
  });
  ["dragenter", "dragover"].forEach(function (evt) {
    $("ri-drop").addEventListener(evt, function (e) {
      e.preventDefault(); e.stopPropagation(); $("ri-drop").classList.add("dragging");
    });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    $("ri-drop").addEventListener(evt, function (e) {
      e.preventDefault(); e.stopPropagation(); $("ri-drop").classList.remove("dragging");
    });
  });
  $("ri-drop").addEventListener("drop", function (e) {
    var f = e.dataTransfer && e.dataTransfer.files;
    if (f && f[0]) readRiFile(f[0]);
  });

  function readRiFile(file) {
    if (!/\.csv$/i.test(file.name) && file.type !== "text/csv") {
      showMsg("That is not a .csv file. Save the sheet as CSV and try again.", "error");
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () {
      showMsg("The file could not be read. Try saving it again as CSV.", "error");
    };
    reader.onload = function (e) {
      // Excel prefixes a byte-order mark that would make the first column read as missing.
      riFileText = String(e.target.result || "").replace(/^\uFEFF/, "");
      var lines = riFileText.replace(/\r\n/g, "\n").split("\n")
        .filter(function (l) { return l.trim() !== ""; });
      $("ri-drop").style.display = "none";
      $("btn-ri-clear").style.display = "";
      $("ri-filecard").innerHTML = '<div class="file-card"><div>' +
        '<div class="file-name">' + escapeHtml(file.name) + "</div>" +
        '<div class="file-meta">' + Math.max(0, lines.length - 1) + " data row(s) · " +
        Math.max(1, Math.round(file.size / 1024)) + " KB</div></div></div>";
    };
    reader.readAsText(file);
  }

  /** Whichever input the user chose, the server only ever sees text. */
  function riCsvText() {
    return riMode === "file" ? riFileText : $("ri-csv").value;
  }

  $("btn-cancel-rcpimport").addEventListener("click", function () {
    $("rcpimport-modal-backdrop").classList.remove("show");
    loadCollections();
  });

  $("btn-ri-preview").addEventListener("click", function () {
    var text = riCsvText();
    if (!text || !text.trim()) {
      showMsg(riMode === "file" ? "Choose a CSV file first." : "Paste the CSV first.", "error");
      return;
    }
    google.script.run.withSuccessHandler(renderImportPreview)
      .withFailureHandler(onServerError).previewReceiptImport(text);
  });

  $("btn-ri-pull").addEventListener("click", function () {
    askDialog({
      title: "Pull receipts from Tally",
      message: "This asks Tally for its receipt vouchers and shows them as a preview — nothing " +
        "is written yet. It only works once PMT's IT have made Tally reachable.",
      input: true, inputLabel: "From date (YYYY-MM-DD)",
      value: new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10),
      okLabel: "Pull"
    }, function (from) {
      if (from === null) return;
      google.script.run.withSuccessHandler(function (result) {
        // Importing sends the text, not the preview. Drop what Tally returned into the paste
        // box and switch to it, so the rows on screen are the rows Import will actually write
        // — and so anyone can see and correct them before committing.
        setRiMode("paste");
        $("ri-csv").value = result.csv || "";
        renderImportPreview(result);
      }).withFailureHandler(onServerError)
        .pullReceiptsFromTally(from, new Date().toISOString().slice(0, 10));
    });
  });

  function renderImportPreview(result) {
    riPreview = result;
    var ok = result.valid.length;

    $("ri-preview").innerHTML =
      '<div class="grid grid-3" style="margin:14px 0;">' +
        '<div class="kpi-card"><div class="kpi-label">Rows Read</div><div class="kpi-value">' + result.totalRows + "</div></div>" +
        '<div class="kpi-card"><div class="kpi-label">Will Import</div><div class="kpi-value">' + ok + "</div>" +
          '<div class="kpi-sub">' + fmt(result.totalAmount) + "</div></div>" +
        '<div class="kpi-card' + (result.errors.length ? " alert" : "") + '">' +
          '<div class="kpi-label">Rejected</div><div class="kpi-value">' + result.errors.length + "</div></div>" +
      "</div>" +
      (ok ? '<div class="card" style="padding:0; overflow-x:auto; max-height:260px;"><table>' +
        "<thead><tr><th>Line</th><th>Invoice</th><th>Date</th>" +
        '<th class="num">Amount</th><th class="num">New Balance</th><th>Tally Ref</th></tr></thead><tbody>' +
        result.valid.map(function (r) {
          return "<tr><td>" + r.line + "</td>" +
            '<td class="mono">' + escapeHtml(r.invoiceNo) + "</td>" +
            "<td>" + escapeHtml(r.receiptDate) + "</td>" +
            '<td class="num mono">' + fmt(r.amount) + "</td>" +
            '<td class="num mono">' + fmt(r.newBalance) + "</td>" +
            '<td class="mono" style="font-size:11.5px;">' + escapeHtml(r.tallyRef || "—") + "</td></tr>";
        }).join("") + "</tbody></table></div>" : "") +
      (result.errors.length ? '<div class="card-title" style="margin-top:16px;">Rejected rows</div>' +
        '<div class="card" style="padding:0; overflow-x:auto; max-height:200px;"><table>' +
        "<thead><tr><th>Line</th><th>Invoice</th><th>Why</th></tr></thead><tbody>" +
        result.errors.map(function (e) {
          return "<tr><td>" + e.line + "</td>" +
            '<td class="mono">' + escapeHtml(e.invoiceNo || "—") + "</td>" +
            '<td style="color:var(--red);">' + escapeHtml(e.message) + "</td></tr>";
        }).join("") + "</tbody></table></div>" : "");

  // ================= DASHBOARD (control tower) =================
  //
  // Chart colours come from the design tokens in the stylesheet, which were validated
  // against the white card surface rather than picked by eye. Two rules hold everywhere
  // here: the exception severities are the reserved status colours and are never used as a
  // series colour, and no chart carries meaning by colour alone — every bar is labelled.

  var dashStream = "";
  var dashData = null;

  var ORD_RAMP = ["var(--ord-1)", "var(--ord-2)", "var(--ord-3)", "var(--ord-4)", "var(--ord-5)"];
  var SEV_ICON = { critical: "!", serious: "▲", warning: "•" };
  var SEV_WORD = { critical: "Critical", serious: "Serious", warning: "Watch" };

  function initDashboardView() { loadDashboard(false); }

  $("dash-stream").querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      dashStream = btn.dataset.stream;
      $("dash-stream").querySelectorAll("button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      loadDashboard(false);
    });
  });

  $("btn-dash-refresh").addEventListener("click", function () { loadDashboard(true); });

  function loadDashboard(refresh) {
    $("dash-stamp").textContent = "Loading…";
    google.script.run.withSuccessHandler(function (data) {
      dashData = data;
      clearMsg();
      renderDashboard();
    }).withFailureHandler(function (err) {
      $("dash-body").innerHTML = '<div class="empty">Could not load the dashboard.</div>';
      onServerError(err);
    }).getDashboard({ stream: dashStream, refresh: !!refresh });
  }

  /** Compact Indian-format money for tiles, where the full figure would not fit. */
  function fmtShort(n) {
    var v = Number(n) || 0;
    var sign = v < 0 ? "-" : "";
    v = Math.abs(v);
    if (v >= 10000000) return sign + "₹" + (v / 10000000).toFixed(2) + " Cr";
    if (v >= 100000) return sign + "₹" + (v / 100000).toFixed(2) + " L";
    if (v >= 1000) return sign + "₹" + Math.round(v / 1000) + "K";
    return fmt(v);
  }

  function renderDashboard() {
    var d = dashData;
    if (!d) return;

    var stamp = new Date(d.generatedAt);
    $("dash-stamp").textContent = "As at " + stamp.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
      (d.fromCache ? " (cached)" : "");

    $("dash-body").innerHTML =
      renderHeadline(d) +
      renderExceptions(d) +
      '<div class="two-col">' + renderPipeline(d) + renderAgeingChart(d) + "</div>" +
      renderTrend(d) +
      '<div class="two-col">' + renderFunnels(d) + renderTopCustomers(d) + "</div>";

    wireDashboardLinks();
  }

  // ---- Headline: stat tiles, because these are single numbers, not charts ----
  function renderHeadline(d) {
    var h = d.headline;
    var collectionRate = h.invoicedThisMonth > 0
      ? Math.round(h.collectedThisMonth / h.invoicedThisMonth * 100) : null;

    return '<div class="grid grid-4" style="margin-bottom:16px;">' +
      '<div class="hero-card"><div class="kpi-label">Outstanding</div>' +
        '<div class="hero-figure">' + fmtShort(h.outstanding) + "</div>" +
        '<div class="kpi-sub">' + (h.overduePct
          ? '<span style="color:var(--st-critical); font-weight:600;">' + h.overduePct +
            "% overdue</span> · " + fmtShort(h.overdueAmount)
          : "nothing overdue") + "</div></div>" +

      '<div class="hero-card"><div class="kpi-label">Open Order Book</div>' +
        '<div class="hero-figure">' + fmtShort(h.openOrderValue) + "</div>" +
        '<div class="kpi-sub">' + h.openOrderCount + " order(s) not yet closed</div></div>" +

      '<div class="hero-card"><div class="kpi-label">Invoiced This Month</div>' +
        '<div class="hero-figure">' + fmtShort(h.invoicedThisMonth) + "</div>" +
        '<div class="kpi-sub">collected ' + fmtShort(h.collectedThisMonth) +
          (collectionRate !== null ? " · " + collectionRate + "% of billing" : "") + "</div></div>" +

      '<div class="hero-card"><div class="kpi-label">' +
        (d.stream === "Spare" ? "Open Quotations" : "Weighted Pipeline") + "</div>" +
        '<div class="hero-figure">' + fmtShort(d.stream === "Spare"
          ? h.openQuotationValue : h.weightedPipeline) + "</div>" +
        '<div class="kpi-sub">' + (d.stream === "Spare"
          ? h.openQuotationCount + " quotation(s) live"
          : h.openQuotationCount + " quotation(s) · " + fmtShort(h.openQuotationValue)) +
        "</div></div>" +
      "</div>";
  }

  // ---- Exceptions: the reason this screen exists ----
  function renderExceptions(d) {
    if (!d.exceptions.length) {
      return '<div class="card"><div class="card-title" style="margin-top:0;">Exceptions</div>' +
        '<div class="empty">Nothing is stuck. Every order, dispatch and invoice is moving.</div></div>';
    }

    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Needs Attention</div>' +
      d.exceptions.map(function (e) {
        return '<div class="exc-row">' +
          '<span class="exc-dot sev-' + e.severity + '"></span>' +
          '<span class="exc-icon" style="color:var(--st-' + e.severity + ');">' +
            SEV_ICON[e.severity] + "</span>" +
          '<span class="exc-body">' +
            '<span class="exc-label">' + escapeHtml(e.label) + "</span>" +
            '<span class="exc-detail"><b style="color:var(--st-' + e.severity + ');">' +
              escapeHtml(SEV_WORD[e.severity]) + "</b> · " + escapeHtml(e.detail) +
              (e.oldestDays ? " · oldest " + e.oldestDays + " days" : "") + "</span>" +
          "</span>" +
          '<span><span class="exc-count">' + e.count + "</span>" +
            (e.value ? '<div class="exc-value">' + fmtShort(e.value) + "</div>" : "") + "</span>" +
          '<button class="btn btn-sm" data-goto="' + e.view + '">Open</button>' +
          "</div>";
      }).join("") +
      "</div>";
  }

  /**
   * Horizontal bars on a shared baseline. `colors` is either one hue for a magnitude
   * comparison or the ordinal ramp where the categories are genuinely ordered.
   */
  function barChart(rows, opts) {
    var max = Math.max.apply(null, rows.map(function (r) { return Number(r[opts.field]) || 0; }).concat([1]));
    var last = ORD_RAMP.length - 1;

    return rows.map(function (r, i) {
      var v = Number(r[opts.field]) || 0;
      var pct = max > 0 ? (v / max) * 100 : 0;

      // Stretch the five ramp steps across however many rows there are, rather than
      // clamping — with eight order states, clamping painted the last four identically.
      var color = opts.color;
      if (opts.ramp) {
        var step = rows.length > 1 ? Math.round((i / (rows.length - 1)) * last) : 0;
        color = ORD_RAMP[step];
      }

      return '<div class="bar-row">' +
        '<span class="bar-name" title="' + escapeHtml(r.label) + '">' + escapeHtml(r.label) + "</span>" +
        '<span class="bar-track">' +
          // A zero value draws nothing; a 2px sliver reads as "a little", which is a lie.
          (v > 0
            ? '<span class="bar-fill" style="width:' + Math.max(pct, 0.6).toFixed(1) +
              "%; background:" + color + ';"></span>'
            : "") +
        "</span>" +
        '<span class="bar-figure">' + opts.format(r) + "</span>" +
        "</div>";
    }).join("");
  }

  function renderPipeline(d) {
    var hasAny = d.orderPipeline.some(function (r) { return r.count > 0; });
    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Order Pipeline</div>' +
      (hasAny
        ? barChart(d.orderPipeline, {
            field: "count", ramp: true,
            format: function (r) { return r.count + (r.value ? "  " + fmtShort(r.value) : ""); }
          }) + '<div class="kpi-sub" style="margin-top:10px;">Count per state, darker as the ' +
            "order gets closer to done.</div>"
        : '<div class="empty">No orders yet.</div>') +
      "</div>";
  }

  function renderAgeingChart(d) {
    var hasAny = d.ageing.some(function (r) { return r.value > 0; });
    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Receivables Ageing</div>' +
      (hasAny
        ? barChart(d.ageing, {
            field: "value", ramp: true,
            format: function (r) { return fmtShort(r.value); }
          }) + '<div class="kpi-sub" style="margin-top:10px;">Darker is older. ' +
            "Bars are amounts, not invoice counts.</div>"
        : '<div class="empty">Nothing outstanding.</div>') +
      "</div>";
  }

  // ---- Six-month trend: two series, one axis (both are rupees) ----
  function renderTrend(d) {
    var max = Math.max.apply(null, d.trend.map(function (m) {
      return Math.max(m.invoiced, m.collected);
    }).concat([1]));

    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Invoiced vs Collected</div>' +
      '<div class="trend-wrap">' +
        d.trend.map(function (m) {
          var hi = max > 0 ? (m.invoiced / max) * 100 : 0;
          var hc = max > 0 ? (m.collected / max) * 100 : 0;
          return '<div class="trend-month">' +
            '<div class="trend-bars">' +
              '<div class="trend-bar" style="height:' + hi.toFixed(1) +
                '%; background:var(--series-1);" title="Invoiced ' + escapeHtml(fmtShort(m.invoiced)) + '"></div>' +
              '<div class="trend-bar" style="height:' + hc.toFixed(1) +
                '%; background:var(--series-2);" title="Collected ' + escapeHtml(fmtShort(m.collected)) + '"></div>' +
            "</div>" +
            '<div class="trend-label">' + escapeHtml(m.label) + "</div>" +
            "</div>";
        }).join("") +
      "</div>" +
      '<div class="legend">' +
        '<span class="legend-key"><span class="legend-swatch" style="background:var(--series-1);"></span>Invoiced</span>' +
        '<span class="legend-key"><span class="legend-swatch" style="background:var(--series-2);"></span>Collected</span>' +
      "</div>" +
      // The numbers themselves, because a bar you cannot read is not a report.
      '<div class="card" style="padding:0; overflow-x:auto; margin:14px 0 0; box-shadow:none;"><table>' +
        "<thead><tr><th>Month</th>" +
        d.trend.map(function (m) { return '<th class="num">' + escapeHtml(m.label) + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        '<tr><td>Invoiced</td>' + d.trend.map(function (m) {
          return '<td class="num mono">' + fmtShort(m.invoiced) + "</td>"; }).join("") + "</tr>" +
        '<tr><td>Collected</td>' + d.trend.map(function (m) {
          return '<td class="num mono">' + fmtShort(m.collected) + "</td>"; }).join("") + "</tr>" +
      "</tbody></table></div>" +
      "</div>";
  }

  function renderFunnels(d) {
    var blocks = "";
    if (d.funnel && d.funnel.length) {
      blocks += '<div class="card-title" style="margin-top:0;">Compressor Funnel</div>' +
        (d.funnel.some(function (r) { return r.count > 0; })
          ? barChart(d.funnel, {
              field: "count", ramp: true,
              format: function (r) { return r.count + (r.value ? "  " + fmtShort(r.value) : ""); }
            })
          : '<div class="empty">No open opportunities.</div>');
    }
    if (d.enquiryFunnel && d.enquiryFunnel.length) {
      blocks += '<div class="card-title" style="margin-top:' + (blocks ? "20px" : "0") +
        ';">Spare Enquiries</div>' +
        (d.enquiryFunnel.some(function (r) { return r.count > 0; })
          ? barChart(d.enquiryFunnel, {
              field: "count", ramp: true,
              format: function (r) { return String(r.count); }
            })
          : '<div class="empty">No enquiries yet.</div>');
    }
    return '<div class="card">' + (blocks || '<div class="empty">Nothing in the funnel.</div>') + "</div>";
  }

  function renderTopCustomers(d) {
    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Who Holds Our Money</div>' +
      (d.topCustomers.length
        ? '<div style="overflow-x:auto;"><table><thead><tr><th>Customer</th>' +
          '<th class="num">Outstanding</th><th class="num">Overdue</th><th class="num">Oldest</th>' +
          "</tr></thead><tbody>" +
          d.topCustomers.map(function (c) {
            return "<tr>" +
              "<td>" + escapeHtml(c.customerName || "—") +
                '<br><span style="font-size:11px; color:var(--ink-soft);">' + c.invoiceCount +
                " invoice(s)</span></td>" +
              '<td class="num mono">' + fmtShort(c.outstanding) + "</td>" +
              '<td class="num mono"' + (c.overdue > 0 ? ' style="color:var(--st-critical);"' : "") + ">" +
                (c.overdue > 0 ? fmtShort(c.overdue) : "—") + "</td>" +
              '<td class="num">' + (c.oldestOverdueDays > 0
                ? '<span class="badge badge-overdue">' + c.oldestOverdueDays + "d</span>" : "—") + "</td>" +
              "</tr>";
          }).join("") + "</tbody></table></div>"
        : '<div class="empty">No outstanding invoices.</div>') +
      "</div>";

  var setData = null;

  function openUserModal(id) {
    var u = id ? setData.users.filter(function (x) { return String(x.id) === String(id); })[0] : null;
    $("user-modal-title").textContent = u ? "Edit User" : "Add User";
    $("usr-id").value = u ? u.id : "";
    $("usr-email").value = u ? u.email : "";
    $("usr-email").disabled = !!u;   // the email is the identity; changing it makes a new person
    $("usr-name").value = u ? u.name : "";
    $("usr-role").innerHTML = setData.roles.map(function (r) {
      return '<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + "</option>";

  /**
   * Reads the file in the browser and checks its header before anything reaches the server.
   * A missing column is worth saying plainly here rather than as a server error after an
   * upload — and Excel's byte-order mark is stripped so a column that is visibly present
   * does not read as missing.
   */
  function readImportFile(file) {
    if (!/\.csv$/i.test(file.name) && file.type !== "text/csv") {
      showMsg("That is not a .csv file. Save the sheet as CSV and try again.", "error");
      return;
    }

    var reader = new FileReader();
    reader.onerror = function () {
      showMsg("The file could not be read. Try saving it again as CSV.", "error");
    };
    reader.onload = function (e) {
      var text = String(e.target.result || "").replace(/^\uFEFF/, "");
      importFileName = file.name;
      renderFileCheck(text, file);
    };
    reader.readAsText(file);
  }

  function renderFileCheck(text, file) {
    var spec = currentImportSpec();
    var lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n")
      .filter(function (l) { return l.trim() !== ""; });

    if (lines.length < 2) {
      importCsvText = null;
      $("ti-filecard").innerHTML = '<div class="file-card bad"><div>' +
        '<div class="file-name">' + escapeHtml(file.name) + "</div>" +
        '<div class="file-meta">The file needs a header row and at least one row of data.</div>' +
        "</div></div>";
      $("btn-ti-preview").disabled = true;
      $("btn-ti-clear").style.display = "";
      $("ti-drop").style.display = "none";
      return;
    }

    // Header comparison is by name, not position — column order does not matter.
    var found = lines[0].split(",").map(function (h) {
      return h.trim().replace(/^"|"$/g, "");
    });
    var expected = spec.header.split(",");
    var missing = spec.required.filter(function (c) { return found.indexOf(c) === -1; });
    var extra = found.filter(function (c) { return expected.indexOf(c) === -1 && c !== ""; });
    var ok = missing.length === 0;

    importCsvText = ok ? text : null;
    $("btn-ti-preview").disabled = !ok;
    $("btn-ti-clear").style.display = "";
    $("ti-drop").style.display = "none";

    var chips = expected.map(function (c) {
      var present = found.indexOf(c) !== -1;
      var isRequired = spec.required.indexOf(c) !== -1;
      var cls = present ? "col-ok" : (isRequired ? "col-missing" : "col-extra");
      return '<span class="col-chip ' + cls + '">' + escapeHtml(c) +
        (present ? "" : (isRequired ? " ✕" : " –")) + "</span>";
    }).join("") +
      extra.map(function (c) {
        return '<span class="col-chip col-extra">' + escapeHtml(c) + " (ignored)</span>";
      }).join("");

    $("ti-filecard").innerHTML = '<div class="file-card' + (ok ? "" : " bad") + '"><div style="flex:1;">' +
      '<div class="file-name">' + escapeHtml(file.name) + "</div>" +
      '<div class="file-meta">' + (lines.length - 1) + " data row(s) · " +
        Math.max(1, Math.round(file.size / 1024)) + " KB" +
        (ok ? "" : ' · <b style="color:var(--st-critical);">missing required column(s): ' +
          escapeHtml(missing.join(", ")) + "</b>") + "</div>" +
      '<div style="margin-top:8px;">' + chips + "</div>" +
      (ok ? "" : '<div class="file-meta" style="margin-top:8px;">Add the missing column(s) to ' +
        "the header row and choose the file again. Column order does not matter.</div>") +
      "</div></div>";
  }

  $("btn-ti-close").addEventListener("click", function () {
    $("tallyimport-modal-backdrop").classList.remove("show");
  });

  $("btn-ti-preview").addEventListener("click", function () {
    if (!importCsvText) { showMsg("Choose a CSV file first.", "error"); return; }
    $("ti-preview").innerHTML = '<p style="font-size:12.5px; margin-top:14px;">Checking…</p>';
    google.script.run.withSuccessHandler(function (result) {

  function renderTallyPreview(result) {
    var rec = result.reconciliation;
    var ok = result.valid.length;

    // Column set differs per import; keep the preview honest to what will actually be written.
    var head, body;
    if (result.kind === "Customer") {
      head = "<tr><th>Line</th><th>Customer</th><th>GSTIN</th>" +
        '<th class="num">Credit Limit</th><th>Action</th></tr>';
      body = result.valid.map(function (r) {
        return "<tr><td>" + r.line + "</td><td>" + escapeHtml(r.name) + "</td>" +
          '<td class="mono" style="font-size:11.5px;">' + escapeHtml(r.gstin || "—") + "</td>" +
          '<td class="num mono">' + (r.creditLimit === "" ? "—" : fmt(r.creditLimit)) + "</td>" +
          '<td><span class="badge ' + (r.action === "Create" ? "badge-new" : "badge-followup") +
            '">' + r.action + "</span></td></tr>";
      }).join("");
    } else if (result.kind === "OpeningStock") {
      head = "<tr><th>Line</th><th>Item</th><th>Description</th><th class=\"num\">Qty</th></tr>";
      body = result.valid.map(function (r) {
        return "<tr><td>" + r.line + "</td>" +
          '<td class="mono">' + escapeHtml(r.itemCode) + "</td>" +
          "<td>" + escapeHtml(r.description || "") + "</td>" +
          '<td class="num mono">' + escapeHtml(r.qty) + "</td></tr>";
      }).join("");
    } else {
      head = "<tr><th>Line</th><th>Invoice</th><th>Date</th><th>Customer</th>" +
        '<th class="num">Amount</th><th class="num">Balance</th></tr>';
      body = result.valid.map(function (r) {
        return "<tr><td>" + r.line + "</td>" +
          '<td class="mono">' + escapeHtml(r.invoiceNo) + "</td>" +
          "<td>" + escapeHtml(r.invoiceDate) + "</td>" +
          "<td>" + escapeHtml(r.customerName) + "</td>" +
          '<td class="num mono">' + fmt(r.amount) + "</td>" +
          '<td class="num mono">' + fmt(r.balance) + "</td></tr>";
      }).join("");
    }

    $("ti-preview").innerHTML =
      '<div class="grid grid-3" style="margin:14px 0;">' +
        '<div class="kpi-card"><div class="kpi-label">Rows Read</div>' +
          '<div class="kpi-value">' + result.totalRows + "</div></div>" +
        '<div class="kpi-card"><div class="kpi-label">Will Import</div>' +
          '<div class="kpi-value">' + ok + "</div>" +
          '<div class="kpi-sub">' + escapeHtml(rec.detail || "") + "</div></div>" +
        '<div class="kpi-card' + (result.errors.length ? " alert" : "") + '">' +
          '<div class="kpi-label">Rejected</div>' +
          '<div class="kpi-value">' + result.errors.length + "</div></div>" +
      "</div>" +
      (rec.total !== undefined
        ? '<div class="compare-strip" style="margin-bottom:14px;"><b>' + escapeHtml(rec.label) +
          ": " + (result.kind === "OpeningStock" ? escapeHtml(String(rec.total)) + " units" : fmt(rec.total)) +
          "</b> — check this against the same total in Tally before you go live. If the two " +
          "disagree, something is wrong with the export and it is much cheaper to find out now.</div>"
        : "") +
      (ok ? '<div class="card" style="padding:0; overflow-x:auto; max-height:280px;"><table>' +
        "<thead>" + head + "</thead><tbody>" + body + "</tbody></table></div>" : "") +
      (result.errors.length
        ? '<div class="card-title" style="margin-top:16px;">Rejected rows</div>' +
          '<div class="card" style="padding:0; overflow-x:auto; max-height:220px;"><table>' +
          "<thead><tr><th>Line</th><th></th><th>Why</th></tr></thead><tbody>" +
          result.errors.map(function (e) {
            return "<tr><td>" + e.line + "</td>" +
              '<td class="mono" style="font-size:11.5px;">' + escapeHtml(e.key || "—") + "</td>" +
              '<td style="color:var(--st-critical);">' + escapeHtml(e.message) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : "");

    $("btn-ti-commit").style.display = ok ? "" : "none";
  }

  $("btn-ti-commit").addEventListener("click", function () {
    if (!importPreview || !importPreview.valid.length) return;
    var spec = currentImportSpec();
    askDialog({
      title: "Import " + importPreview.valid.length + " row(s)?",
      message: "This writes to the sheet. " + spec.label + " can be corrected afterwards, but " +
        "an opening balance imported twice is a real mess — make sure this file has not " +
        "already been imported.",
      okLabel: "Import"
    }, function (ok) {
      if (ok === null) return;
      var kind = $("ti-kind").value;
      google.script.run.withSuccessHandler(function (result) {
        showMsg(result.imported + " row(s) imported from " + importFileName +
          (result.rejected ? ", " + result.rejected + " rejected." : "."), "success");
        $("tallyimport-modal-backdrop").classList.remove("show");
        clearImportFile();
        // Refresh whichever screen asked for the import.
        if (kind === "Customer" && document.getElementById("view-customers").classList.contains("active")) {
          loadCustomers();
        }
      }).withFailureHandler(onServerError).commitTallyImport(kind, importCsvText);
    });
  });

  /** The Settings panel is now just the three doors into the modal above. */
  function renderImportPanel() {
    var doors = [
      { kind: "Customer", label: "Customers",
        note: "Names, GSTIN, credit limits from the Tally ledger" },
      { kind: "OpeningStock", label: "Opening Stock",
        note: "Quantities on hand at go-live, from a stock count" },
      { kind: "OpenInvoice", label: "Open Receivables",
        note: "What customers already owe, from Bills Receivable" }
    ];

    $("set-panel").innerHTML = panelCard(
      "Data Import",
      "Bring the opening position over from Tally rather than typing it. Every one of these " +
        "is a standard Tally report with a built-in export — nothing here needs re-keying.",
      "",
      '<div class="compare-strip" style="margin-bottom:14px;">' +
        "<b>Do these in order.</b> Customers first, then opening stock, then open receivables — " +
        "each one refers to the one before it. Import the spares and product catalogs from the " +
        "Catalog screen before the stock." +
      "</div>" +
      '<div class="grid grid-3">' +
        doors.map(function (d, i) {
          return '<div class="kpi-card">' +
            '<div class="kpi-label">Step ' + (i + 1) + "</div>" +
            '<div style="font-size:15px; font-weight:700; color:var(--navy); margin:4px 0 6px;">' +
              escapeHtml(d.label) + "</div>" +
            '<div class="kpi-sub" style="margin-bottom:12px;">' + escapeHtml(d.note) + "</div>" +
            '<button class="btn btn-sm btn-primary" data-import="' + d.kind + '">Open</button>' +
            "</div>";
        }).join("") +
      "</div>");

    $("set-panel").querySelectorAll("[data-import]").forEach(function (btn) {
      btn.addEventListener("click", function () { openImportModal(btn.dataset.import); });
    });
  }

  // ---- System ----

  // ---- Letterhead (the seller, as printed) ----
  /**
   * Everything on this panel appears on a document a customer reads, so it is edited here
   * rather than sitting in the code where a changed phone number would need a developer.
   */
  var COMPANY_FIELDS = [
    ["legalName", "Company Name *", "The name that appears on the letterhead"],
    ["tradeName", "Trading Name", "If different from the legal name"],
    ["partnerLine", "Partner Line", "Printed above the name"],
    ["addressLine1", "Address Line 1", ""],
    ["addressLine2", "Address Line 2", ""],
    ["city", "City", ""],
    ["state", "State", ""],
    ["pincode", "PIN Code", ""],
    ["gstin", "GSTIN", "15 characters"],
    ["pan", "PAN", ""],
    ["phone", "Phone", ""],
    ["altPhone", "Alternate Phone", ""],
    ["email", "Email", ""],
    ["website", "Website", ""],
    ["logoUrl", "Logo URL", "A publicly readable image link, printed at the top"],
    ["bankName", "Bank Name", ""],
    ["bankAccount", "Bank Account No.", ""],
    ["bankIfsc", "IFSC", ""],
    ["quotePrefix", "Quotation Prefix", "Quote numbers are built from this"],
    ["jurisdiction", "Jurisdiction", "Printed in the terms"]
  ];

  function renderCompanyPanel() {
    var co = setData.companyProfile || {};
    var editable = canAdminister();

    var body = '<div class="grid grid-3">' + COMPANY_FIELDS.map(function (f) {
      return '<div class="field"><label>' + escapeHtml(f[1]) + "</label>" +
        '<input id="co-' + f[0] + '" value="' + escapeHtml(co[f[0]] || "") + '"' +
        (f[2] ? ' placeholder="' + escapeHtml(f[2]) + '"' : "") +
        (editable ? "" : " disabled") + " /></div>";
    }).join("") + "</div>" +
      (editable
        ? '<div style="display:flex; justify-content:flex-end; margin-top:16px;">' +
          '<button class="btn btn-primary btn-sm" id="btn-save-company">Save Letterhead</button></div>'
        : "");

    $("set-panel").innerHTML = panelCard(
      "Letterhead",
      "The seller, as it is printed at the top of every quotation. Change it here and every " +
        "document printed afterwards carries the new details — documents already saved as PDFs " +
        "keep what they had.",
      "", body);

    if (editable) {
      $("btn-save-company").addEventListener("click", function () {
        var payload = {};
        COMPANY_FIELDS.forEach(function (f) { payload[f[0]] = $("co-" + f[0]).value.trim(); });
        google.script.run.withSuccessHandler(function () {
          loadSettings();
          showMsg("Letterhead saved.", "success");
        }).withFailureHandler(onServerError).saveCompanyProfile(payload);
      });
    }
  }

  // ---- Standing quotation text ----
  var QTPL_SECTION_LABELS = {
    CoverLetter: "Cover letter",
    WhyBrand: "Why ELGi",
    ScopeOfSupply: "Scope of supply",
    Terms: "Terms & conditions",
    InstallationNotes: "Installation guidelines"
  };

  function qtplSectionLabel(section) {
    return QTPL_SECTION_LABELS[section] || section;
  }

  function renderQuoteTextPanel() {
    var rows = setData.quoteTemplates || [];
    var editable = canAdminister();

    var body = rows.length
      ? '<div style="overflow-x:auto;"><table><thead><tr><th>Section</th><th>Applies To</th>' +
        "<th>Heading</th><th>Lines</th><th>Status</th><th></th></tr></thead><tbody>" +
        rows.map(function (t) {
          var live = String(t.active).toUpperCase() !== "FALSE";
          var lines = String(t.body || "").split("\n").filter(function (l) {
            return l.trim() !== "";
          }).length;
          return "<tr>" +
            "<td><b>" + escapeHtml(qtplSectionLabel(t.section)) + "</b></td>" +
            "<td>" + escapeHtml(t.businessStream || "Both streams") + "</td>" +
            "<td>" + escapeHtml(t.title || "—") + "</td>" +
            '<td class="num">' + lines + "</td>" +
            '<td><span class="badge ' + (live ? "badge-won" : "badge-lost") + '">' +
              (live ? "Printed" : "Hidden") + "</span></td>" +
            '<td class="center">' + (editable
              ? '<button class="btn btn-sm" data-qtpl="' + escapeHtml(t.id) + '">Edit</button>'
              : "") + "</td>" +
            "</tr>";
        }).join("") + "</tbody></table></div>"
      : '<div class="empty">Nothing yet. Run Setup on the System tab to install the ' +
        "standard sections.</div>";

    $("set-panel").innerHTML = panelCard(
      "Quotation Text",
      "The wording that is the same on every quotation — the covering letter, why ELGi, the " +
        "scope of supply, the terms. Reword it here; the next quotation printed uses the new " +
        "wording. A section left blank for a stream is printed on both.",
      editable ? '<button class="btn btn-primary btn-sm" id="btn-add-qtpl">+ Add Section</button>' : "",
      body);

    if (editable) {
      $("btn-add-qtpl").addEventListener("click", function () { openQtplModal(null); });
      $("set-panel").querySelectorAll("[data-qtpl]").forEach(function (btn) {
        btn.addEventListener("click", function () { openQtplModal(btn.dataset.qtpl); });
      });
    }
  }

  function openQtplModal(id) {
    var t = id
      ? (setData.quoteTemplates || []).filter(function (x) { return String(x.id) === String(id); })[0]
      : null;

    $("qtpl-modal-title").textContent = t ? "Edit — " + qtplSectionLabel(t.section) : "Add Section";
    $("qtpl-id").value = t ? t.id : "";
    $("qtpl-section").innerHTML = (setData.quoteSections || []).map(function (sec) {
      return '<option value="' + escapeHtml(sec) + '">' + escapeHtml(qtplSectionLabel(sec)) + "</option>";
    }).join("");
    $("qtpl-section").value = t ? t.section : "Terms";
    $("qtpl-stream").innerHTML = '<option value="">Both streams</option>' +
      BUSINESS_STREAMS.map(function (st) {
        return '<option value="' + escapeHtml(st) + '">' + escapeHtml(st) + "</option>";
      }).join("");
    $("qtpl-stream").value = t ? (t.businessStream || "") : "";
    $("qtpl-sort").value = t ? (Number(t.sortOrder) || 0) : 0;
    $("qtpl-title").value = t ? (t.title || "") : "";
    $("qtpl-body").value = t ? (t.body || "") : "";
    $("qtpl-active").checked = !t || String(t.active).toUpperCase() !== "FALSE";
    $("qtpl-modal-backdrop").classList.add("show");
  }

  $("btn-cancel-qtpl").addEventListener("click", function () {
    $("qtpl-modal-backdrop").classList.remove("show");
  });

  $("btn-save-qtpl").addEventListener("click", function () {
    if (!$("qtpl-body").value.trim()) {
      showMsg("The text cannot be empty.", "error");
      return;
    }
    google.script.run.withSuccessHandler(function () {
      $("qtpl-modal-backdrop").classList.remove("show");
      loadSettings();
      showMsg("Quotation text saved.", "success");
    }).withFailureHandler(onServerError).saveQuoteTemplate({
      id: $("qtpl-id").value || "",
      section: $("qtpl-section").value,
      businessStream: $("qtpl-stream").value,
      sortOrder: $("qtpl-sort").value,
      title: $("qtpl-title").value.trim(),
      body: $("qtpl-body").value,
      active: $("qtpl-active").checked
    });
  });

  function renderSystemPanel() {
    var sys = setData.system;
    $("set-panel").innerHTML = panelCard(
      "System",
      "The spreadsheet behind the app, and the tools for keeping its structure in step with " +
        "the code.",
      "",
      '<div class="grid grid-3" style="margin-bottom:16px;">' +
        '<div class="kpi-card"><div class="kpi-label">Spreadsheet</div>' +
          '<div style="font-size:14px; font-weight:600; color:var(--navy); margin-top:4px;">' +
          escapeHtml(sys.spreadsheetName) + "</div></div>" +
        '<div class="kpi-card"><div class="kpi-label">Tabs Declared</div>' +
          '<div class="kpi-value">' + sys.declaredTabs + "</div></div>" +
        '<div class="kpi-card"><div class="kpi-label">Time Zone</div>' +
          '<div style="font-size:14px; font-weight:600; color:var(--navy); margin-top:4px;">' +
          escapeHtml(sys.timeZone) + "</div></div>" +
      "</div>" +
      '<div class="compare-strip" style="margin-bottom:14px;">' +
        "<b>Run Setup</b> creates any tab or column the code expects and the sheet does not " +
        "yet have. It only ever adds — it never reorders, renames or deletes — so it is safe " +
        "to run whenever something looks missing." +
      "</div>" +
      '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
        (currentUser.role === "ERP Admin"
          ? '<button class="btn btn-amber btn-sm" id="btn-run-setup">Run Setup</button>' : "") +
        '<button class="btn btn-sm" id="btn-view-audit">View Audit Log</button>' +
      "</div>" +
      '<div id="sys-result"></div>');

    if ($("btn-run-setup")) {
      $("btn-run-setup").addEventListener("click", function () {
        askDialog({
          title: "Run setup now?",
          message: "Missing tabs and columns are added. Nothing existing is renamed, reordered " +
            "or deleted, and no data is touched.",
          okLabel: "Run Setup"
        }, function (ok) {
          if (ok === null) return;
          $("sys-result").innerHTML = '<p style="font-size:12.5px; margin-top:14px;">Running…</p>';
          google.script.run.withSuccessHandler(function (report) {
            var line = function (label, arr) {
              return arr && arr.length
                ? "<div><b>" + label + ":</b> " + escapeHtml(arr.join(", ")) + "</div>" : "";
            };
            $("sys-result").innerHTML = '<div class="card" style="margin-top:14px; font-size:12.5px;">' +
              "<b>Setup complete.</b>" +
              line("Tabs created", report.created) +
              line("Columns added", report.columnsAdded) +
              line("Seeded", report.seeded) +
              line("Migrated", report.migrated) +
              (!(report.created || []).length && !(report.columnsAdded || []).length
                ? "<div>Nothing was missing — the sheet already matches the code.</div>" : "") +
              "</div>";
            showMsg("Setup complete.", "success");
          }).withFailureHandler(onServerError).runSetupFromSettings();
        });
      });
    }

    $("btn-view-audit").addEventListener("click", function () {
      $("sys-result").innerHTML = '<p style="font-size:12.5px; margin-top:14px;">Loading…</p>';
      google.script.run.withSuccessHandler(function (rows) {
        $("sys-result").innerHTML = rows.length
          ? '<div class="card" style="padding:0; overflow-x:auto; max-height:420px; margin-top:14px;">' +
            "<table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Table</th>" +
            "<th>Field</th><th>Old</th><th>New</th></tr></thead><tbody>" +
            rows.map(function (a) {
              return "<tr>" +
                '<td style="font-size:11.5px; white-space:nowrap;">' + escapeHtml(a.timestamp) + "</td>" +
                '<td style="font-size:11.5px;">' + escapeHtml(a.userEmail) + "</td>" +
                "<td>" + escapeHtml(a.action) + "</td>" +
                "<td>" + escapeHtml(a.tableName) + "</td>" +
                "<td>" + escapeHtml(a.fieldName || "—") + "</td>" +
                '<td style="font-size:11.5px; color:var(--ink-soft);">' + escapeHtml(a.oldValue || "—") + "</td>" +
                '<td style="font-size:11.5px;">' + escapeHtml(a.newValue || "—") + "</td></tr>";
            }).join("") + "</tbody></table></div>"
          : '<div class="empty">Nothing logged yet.</div>';
      }).withFailureHandler(onServerError).listAuditLog({ limit: 100 });
    });
  }

  // ---------------- Boot ----------------
  function onBootSuccess(user) {
    currentUser = user;
    var initials = String(user.name || user.email || "?").trim().split(/\s+/)
      .slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
    $("whoami").innerHTML =
      '<span class="user-avatar" title="' + escapeHtml(user.name + " — " + user.role) + '">' +
        escapeHtml(initials) + "</span>" +
      '<span class="user-meta"><b>' + escapeHtml(user.name) + "</b>" +
        "<span>" + escapeHtml(user.role) + "</span></span>";
    renderTabs();
    $("boot-screen").style.display = "none";
    $("app").style.display = "block";
  }

  function onBootFailure(err) {
    $("boot-screen").style.display = "none";
    $("error-screen").style.display = "flex";
    $("error-text").textContent = err && err.message ? err.message : String(err);
  }

  function init() {
    google.script.run.withSuccessHandler(onBootSuccess).withFailureHandler(onBootFailure).bootstrap();
  }

  init();
})();
</script>
