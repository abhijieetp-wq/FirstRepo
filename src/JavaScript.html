  // ================= DISPATCH & BILLING =================
  var DSP_SUBTABS = ["dispatches", "invoices", "uninvoiced", "tally"];
  var dspMode = "dispatches";
  var dspCache = [];
  var openDispatch = null;
  var openInvoice = null;

  /** Mirrors BILLING_ROLES in Billing.gs, which is where the rule is actually enforced. */
  function canDoBilling() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  var DISPATCH_BADGE = {
    "Planned": "badge-draft", "Dispatched": "badge-dispatched", "Cancelled": "badge-lost"
  };
  var INVOICE_BADGE = {
    "Draft": "badge-draft", "Issued": "badge-sent", "Cancelled": "badge-lost"
  };
  var TALLY_BADGE = {
    "Pending": "badge-pending", "Synced": "badge-won", "Failed": "badge-overdue",
    "Not Required": "badge-dormant"
  };

  function canDispatch() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }
  function canOverrideDispatch() {
    return ["Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initDispatchView() {
    $("dsp-actions").innerHTML = canDispatch()
      ? '<button class="btn btn-amber" id="btn-new-dispatch">+ New Dispatch</button>' +
        '<button class="btn btn-primary" id="btn-new-invoice">+ Raise Invoice</button>'
      : "";
    if (canDispatch()) {
      $("btn-new-dispatch").addEventListener("click", startNewDispatch);
      $("btn-new-invoice").addEventListener("click", startNewInvoice);
    }
    setDspMode(dspMode);
  }

  DSP_SUBTABS.forEach(function (mode) {
    $("subtab-" + mode).addEventListener("click", function () { setDspMode(mode); });
  });

  function setDspMode(mode) {
    dspMode = mode;
    DSP_SUBTABS.forEach(function (m) {
      $("subtab-" + m).className = "btn btn-sm" + (m === mode ? " btn-primary" : "");
    });
    loadDispatchData();
  }

  $("dsp-search").addEventListener("input", function () { renderDspTable(); });

  function loadDispatchData() {
    var done = function (rows) { dspCache = rows; renderDspTable(); };
    if (dspMode === "dispatches") {
      srv.withSuccessHandler(done).withFailureHandler(onServerError).listDispatches({});
    } else if (dspMode === "invoices") {
      srv.withSuccessHandler(done).withFailureHandler(onServerError).listInvoices({});
    } else if (dspMode === "uninvoiced") {
      srv.withSuccessHandler(done).withFailureHandler(onServerError).listDispatchedNotInvoiced();
    } else {
      srv.withSuccessHandler(done).withFailureHandler(onServerError).listTallySyncQueue();
    }
  }

  function renderDspTable() {
    var q = ($("dsp-search").value || "").toLowerCase();
    var rows = dspCache.filter(function (r) {
      return [r.dispatchNo, r.invoiceNo, r.orderNo, r.customerName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    if (dspMode === "dispatches") renderDispatchesTable(rows);
    else if (dspMode === "invoices") renderInvoicesTable(rows);
    else if (dspMode === "uninvoiced") renderUninvoicedTable(rows);
    else renderTallyTable(rows);
  }

  function dspEmpty(cols, text) {
    $("dsp-tbody").innerHTML = '<tr><td colspan="' + cols + '"><div class="empty">' +
      escapeHtml(text) + "</div></td></tr>";
  }

  function renderDispatchesTable(rows) {
    var planned = dspCache.filter(function (d) { return d.status === "Planned"; });
    var awaiting = dspCache.filter(function (d) { return d.awaitingInvoice; });
    var undelivered = dspCache.filter(function (d) {
      return d.status === "Dispatched" && d.deliveryConfirmed !== "Yes";
    });
    $("dsp-summary").innerHTML = '<div class="grid grid-3" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Open Dispatches</div><div class="kpi-value">' + planned.length + "</div></div>" +
      '<div class="kpi-card' + (awaiting.length ? " alert" : "") + '"><div class="kpi-label">Awaiting Invoice</div><div class="kpi-value">' + awaiting.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Delivery Unconfirmed</div><div class="kpi-value">' + undelivered.length + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Dispatch No.</th><th>Date</th><th>Order</th><th>Customer</th>" +
      '<th class="num">Lines</th><th>LR No.</th><th>Status</th><th>Invoice</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(9, dspCache.length ? "No dispatches match your search." : "No dispatches yet — open one from a ready order.");
      return;
    }

    $("dsp-tbody").innerHTML = rows.map(function (d) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(d.dispatchNo) + "</td>" +
        "<td>" + escapeHtml(d.dispatchDate) + "</td>" +
        '<td class="mono">' + escapeHtml(d.orderNo || "—") + "</td>" +
        "<td>" + escapeHtml(d.customerName || "—") + "</td>" +
        '<td class="num">' + (d.itemCount || 0) + "</td>" +
        '<td class="mono">' + escapeHtml(d.lrNumber || "—") + "</td>" +
        '<td><span class="badge ' + (DISPATCH_BADGE[d.status] || "badge-draft") + '">' + escapeHtml(d.status) + "</span>" +
          (String(d.checklistComplete).toUpperCase() === "FALSE" ? ' <span class="badge badge-overdue">Override</span>' : "") + "</td>" +
        '<td class="mono">' + (d.invoiceNo ? escapeHtml(d.invoiceNo)
          : (d.awaitingInvoice ? '<span class="badge badge-overdue">Not invoiced</span>' : "—")) + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-dispatch="' + d.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("dsp-tbody").querySelectorAll("[data-open-dispatch]").forEach(function (btn) {
      btn.addEventListener("click", function () { openDispatchModal(btn.dataset.openDispatch); });
    });
  }

  function renderInvoicesTable(rows) {
    // Owed means issued and unpaid, at what was billed — the same rule Collections uses, so
    // the two screens give one figure. Drafts used to count here, which made this tab say a
    // customer owed money for a bill they had not been sent.
    var outstanding = dspCache.reduce(function (s, i) { return s + (i.owed ? i.balanceAmt : 0); }, 0);
    var overdue = dspCache.filter(function (i) { return i.owed && i.overdueDays > 0; });
    var drafts = dspCache.filter(function (i) { return i.status === "Draft"; });
    $("dsp-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Invoices</div><div class="kpi-value">' + dspCache.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Outstanding</div><div class="kpi-value">' + fmt(outstanding) + "</div></div>" +
      '<div class="kpi-card' + (overdue.length ? " alert" : "") + '"><div class="kpi-label">Overdue</div><div class="kpi-value">' + overdue.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Unissued Drafts</div><div class="kpi-value">' + drafts.length + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Invoice No.</th><th>Date</th><th>Customer</th><th>Order</th>" +
      '<th class="num">Value</th><th class="num">Balance</th><th>Due</th><th>Status</th><th>Tally</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(10, dspCache.length ? "No invoices match your search." : "No invoices yet — raise one from a posted dispatch.");
      return;
    }

    $("dsp-tbody").innerHTML = rows.map(function (i) {
      return "<tr>" +
        // A draft has no number until the Tally one is typed in. A blank cell read as a
        // missing row; this says what it is, in ordinary type rather than the number font.
        (i.invoiceNo ? '<td class="mono">' + escapeHtml(i.invoiceNo)
          : '<td style="color:var(--ink-soft); font-size:12.5px; white-space:nowrap;">Awaiting Tally no.') +
        "</td>" +
        '<td style="white-space:nowrap;">' + escapeHtml(i.invoiceDate) + "</td>" +
        "<td>" + escapeHtml(i.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(i.orderNo || "—") + "</td>" +
        // Tally's figure where it has been entered; the dispatch's computed one until then.
        '<td class="num mono">' + fmt(i.billedAmt !== undefined ? i.billedAmt : i.grand) + "</td>" +
        '<td class="num mono">' + (i.status === "Issued" ? fmt(i.balanceAmt)
          : '<span style="color:var(--ink-soft);">' + (i.status === "Draft" ? "not issued" : "—") +
            "</span>") + "</td>" +
        "<td>" + (i.dueDate
          ? (i.owed && i.overdueDays > 0
              ? '<span class="badge badge-overdue">' + escapeHtml(i.dueDate) + " · " + i.overdueDays + "d</span>"
              : escapeHtml(i.dueDate))
          : "—") + "</td>" +
        '<td><span class="badge ' + (INVOICE_BADGE[i.status] || "badge-draft") + '">' + escapeHtml(i.status) + "</span></td>" +
        '<td><span class="badge ' + (TALLY_BADGE[i.tallySyncStatus] || "badge-pending") + '">' +
          escapeHtml(i.tallySyncStatus || "Pending") + "</span></td>" +
        '<td class="center"><button class="btn btn-sm" data-open-invoice="' + i.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("dsp-tbody").querySelectorAll("[data-open-invoice]").forEach(function (btn) {
      btn.addEventListener("click", function () { openInvoiceModal(btn.dataset.openInvoice); });
    });
  }

  function renderUninvoicedTable(rows) {
    var value = dspCache.reduce(function (s, r) { return s + (r.uninvoicedValue || 0); }, 0);
    var stale = dspCache.filter(function (r) { return r.daysPending > 7; });
    $("dsp-summary").innerHTML = '<div class="grid grid-3" style="margin-bottom:14px;">' +
      '<div class="kpi-card' + (dspCache.length ? " alert" : "") + '"><div class="kpi-label">Dispatched, Not Invoiced</div><div class="kpi-value">' + dspCache.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Value at Risk</div><div class="kpi-value">' + fmt(value) + "</div></div>" +
      '<div class="kpi-card' + (stale.length ? " alert" : "") + '"><div class="kpi-label">Over 7 Days</div><div class="kpi-value">' + stale.length + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Dispatch No.</th><th>Dispatched</th><th>Days</th><th>Order</th>" +
      '<th>Customer</th><th class="num">Uninvoiced Value</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(7, "Nothing has gone out without a bill. This is the state you want.");
      return;
    }

    $("dsp-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.dispatchNo) + "</td>" +
        "<td>" + escapeHtml(r.dispatchDate) + "</td>" +
        "<td>" + (r.daysPending > 7
          ? '<span class="badge badge-overdue">' + r.daysPending + "</span>"
          : r.daysPending) + "</td>" +
        '<td class="mono">' + escapeHtml(r.orderNo || "—") + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        '<td class="num mono">' + fmt(r.uninvoicedValue) + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-dispatch="' + r.dispatchId + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("dsp-tbody").querySelectorAll("[data-open-dispatch]").forEach(function (btn) {
      btn.addEventListener("click", function () { openDispatchModal(btn.dataset.openDispatch); });
    });
  }

  function renderTallyTable(rows) {
    var failed = dspCache.filter(function (i) { return i.tallySyncStatus === "Failed"; });
    $("dsp-summary").innerHTML = '<div class="grid grid-3" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Awaiting Tally</div><div class="kpi-value">' + dspCache.length + "</div></div>" +
      '<div class="kpi-card' + (failed.length ? " alert" : "") + '"><div class="kpi-label">Failed</div><div class="kpi-value">' + failed.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Value</div><div class="kpi-value">' +
        fmt(dspCache.reduce(function (s, i) { return s + (i.grand || 0); }, 0)) + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Invoice No.</th><th>Date</th><th>Customer</th>" +
      '<th class="num">Value</th><th>Sync</th><th>Last Error</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(7, "Every issued invoice is accounted for in Tally.");

    }

    $("dsp-tbody").innerHTML = rows.map(function (i) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(i.invoiceNo) + "</td>" +
        "<td>" + escapeHtml(i.invoiceDate) + "</td>" +
        "<td>" + escapeHtml(i.customerName || "—") + "</td>" +
        '<td class="num mono">' + fmt(i.grand) + "</td>" +
        '<td><span class="badge ' + (TALLY_BADGE[i.tallySyncStatus] || "badge-pending") + '">' +
          escapeHtml(i.tallySyncStatus || "Pending") + "</span></td>" +
        '<td style="font-size:11.5px; color:var(--ink-soft);">' + escapeHtml(i.tallySyncError || "—") + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-invoice="' + i.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("dsp-tbody").querySelectorAll("[data-open-invoice]").forEach(function (btn) {
      btn.addEventListener("click", function () { openInvoiceModal(btn.dataset.openInvoice); });
    });
  }

  // ---- Readiness checklist rendering (FR-045) ----
  /**
   * The checklist, saying which failures actually stop something.
   *
   * Every failure used to read BLOCKED, including the ones that blocked nothing. A screen that
   * cries blocked at an unpaid advance PIE always ships against teaches people that the word
   * means nothing, and then it means nothing on the line where it is true.
   */
  function readinessHtml(readiness) {
    if (!readiness) return "";
    var rows = readiness.checks.map(function (c) {
      var tag = c.pass ? "OK" : (c.blocks === "create" ? "BLOCKED"
        : (c.blocks === "post" ? "BEFORE SENDING" : "NOTE"));
      var tone = c.pass ? "badge-won"
        : (c.blocks ? "badge-overdue" : "badge-dormant");
      return '<div style="display:flex; gap:10px; align-items:baseline; padding:5px 0;">' +
        '<span class="badge ' + tone + '">' + tag + "</span>" +
        "<span><b>" + escapeHtml(c.label) + "</b><br>" +
        '<span style="font-size:11.5px; color:var(--ink-soft);">' + escapeHtml(c.detail || "") + "</span></span>" +
        "</div>";
    }).join("");
    return '<div class="card" style="padding:12px;">' +
      '<div class="card-title" style="margin-top:0;">Dispatch Readiness</div>' + rows + "</div>";
  }

  /**
   * Reads a photograph and scales it down before it leaves the browser.
   *
   * A phone photograph is several megabytes; a proof of delivery only has to be legible. The
   * work is done here because an Apps Script call carrying 8 MB of base64 is slow and often
   * simply fails.
   */
  /**
   * The paperwork held against a record, and the control that adds to it.
   *
   * One renderer for the sales order and the invoice, because a purchase order and a tax
   * invoice are the same kind of thing: paper that arrived from outside and has to still be
   * there when somebody asks in a year. `prefix` is the modal's field prefix, which is the
   * only thing that differs between the two.
   */
  function renderDocuments(prefix, recordType, recordId, docs, types, editable) {
    var zone = $(prefix + "-docs");
    if (!zone) return;
    docs = docs || [];

    zone.innerHTML = docs.length
      ? '<div class="card" style="padding:0; overflow-x:auto;"><table><thead><tr>' +
        "<th>Document</th><th>File</th><th>Added</th><th>By</th><th></th>" +
        "</tr></thead><tbody>" +
        docs.map(function (d) {
          return "<tr>" +
            "<td>" + escapeHtml(d.docType || "—") +
              (d.caption ? '<br><span style="font-size:11px; color:var(--ink-soft);">' +
                escapeHtml(d.caption) + "</span>" : "") + "</td>" +
            '<td><a href="' + escapeHtml(d.fileUrl) + '" target="_blank" rel="noopener">' +
              escapeHtml(d.fileName || "open") + "</a>" +
              '<span style="font-size:11px; color:var(--ink-soft);"> · ' +
              Math.max(1, Math.round((Number(d.sizeBytes) || 0) / 1024)) + " KB</span></td>" +
            "<td>" + escapeHtml(String(d.uploadedAt || "").slice(0, 10)) + "</td>" +
            "<td>" + escapeHtml(d.uploadedBy || "") + "</td>" +
            '<td class="center">' + (editable
              ? '<button class="btn-ghost" data-doc-del="' + escapeHtml(d.id) +
                '" title="Remove">✕</button>' : "") + "</td>" +
            "</tr>";
        }).join("") + "</tbody></table></div>"
      : '<div class="empty">Nothing attached yet.</div>';

    var picker = $(prefix + "-doctype");
    if (picker) {
      picker.innerHTML = (types || []).map(function (t) {
        return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + "</option>";
      }).join("");
    }
    ["-doctype", "-docfile", "-doccaption"].forEach(function (f) {
      var el = $(prefix + f);
      if (el) el.disabled = !editable;
    });
    var add = $("btn-" + prefix + "-adddoc");
    if (add) add.style.display = editable ? "" : "none";

    zone.querySelectorAll("[data-doc-del]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({ title: "Remove this document?", okLabel: "Remove", danger: true,
          message: "The file goes to the Drive bin; it is not destroyed." }, function (ok) {
          if (ok === null) return;
          srv.withSuccessHandler(function () {
            showMsg("Document removed.", "success");
            reopenDocumentOwner(recordType, recordId);
          }).withFailureHandler(onServerError).deleteDocument(btn.dataset.docDel);
        });
      });
    });
  }

  /** Reloads whichever screen a document was attached to, so the list is the stored one. */
  function reopenDocumentOwner(recordType, recordId) {
    if (recordType === "SalesOrder") openOrderModal(recordId);
    else openInvoiceModal(recordId);
  }

  /** Wires the Attach button on one of the two modals. */
  function wireDocumentUpload(prefix, recordType, currentId) {
    $("btn-" + prefix + "-adddoc").addEventListener("click", function () {
      var recordId = currentId();
      if (!recordId) return;
      var input = $(prefix + "-docfile");
      var file = input.files && input.files[0];
      if (!file) { showMsg("Choose the file first.", "error"); return; }

      var btn = $("btn-" + prefix + "-adddoc");
      btn.disabled = true; btn.textContent = "Attaching…";
      var restore = function () { btn.disabled = false; btn.textContent = "Attach"; };

      readDocumentFile(file, function (dataUrl) {
        srv.withSuccessHandler(function () {
          restore();
          input.value = ""; $(prefix + "-doccaption").value = "";
          showMsg("Attached.", "success");
          reopenDocumentOwner(recordType, recordId);
        }).withFailureHandler(function (err) { restore(); onServerError(err); })
          .saveDocument({
            recordType: recordType, recordId: recordId,
            docType: $(prefix + "-doctype").value,
            caption: $(prefix + "-doccaption").value.trim(),
            name: file.name, dataUrl: dataUrl
          });
      }, function (msg) { restore(); showMsg(msg, "error"); });
    });
  }

  /**
   * A document is read as it is.
   *
   * Unlike a proof photograph, which is downscaled because a phone camera produces far more
   * detail than a picture of a signed challan needs, a purchase order is a document of
   * record: re-encoding it would make the copy differ from the paper the customer sent.
   */
  function readDocumentFile(file, done, fail) {
    var reader = new FileReader();
    reader.onerror = function () { fail("The file could not be read."); };
    reader.onload = function (e) { done(e.target.result); };
    reader.readAsDataURL(file);
  }

  function readProofPhoto(file, done, fail) {
    if (file.type === "application/pdf") {
      var raw = new FileReader();
      raw.onerror = function () { fail("The file could not be read."); };
      raw.onload = function (e) { done(e.target.result); };
      raw.readAsDataURL(file);
      return;
    }
    if (!/^image\//.test(file.type)) {
      fail("A proof of delivery should be a photograph or a PDF.");
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () { fail("The file could not be read."); };
    reader.onload = function (e) {
      var img = new Image();
      img.onerror = function () { fail("That image could not be opened — is the file damaged?"); };
      img.onload = function () {
        var max = 1600;
        var scale = Math.min(1, max / img.width, max / img.height);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var cx = canvas.getContext("2d");
        cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);
        cx.drawImage(img, 0, 0, w, h);
        done(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderInvoiceModal() {
    var inv = openInvoice;
    if (!inv) return;
    var editable = canDispatch() && inv.status === "Draft";

    // A draft has no number until the Tally one is typed in — the portal does not invent
    // invoice numbers — so the title says that rather than starting with a dash.
    $("invoice-modal-title").textContent = (inv.invoiceNo || "Draft invoice, no Tally number yet") +
      " — " + (inv.customerName || "");
    $("im-sub").textContent = inv.status + " · billed " + fmt(inv.billedAmt) +
      (inv.status === "Issued" ? " · balance " + fmt(inv.balanceAmt) : "");
    $("im-id").value = inv.id;

    $("im-banner").innerHTML = inv.status === "Cancelled"
      ? '<div class="compare-strip" style="margin-bottom:12px;"><b>Cancelled.</b> ' +
        escapeHtml(inv.notes || "") + "</div>"
      : "";

    $("im-meta").innerHTML = '<div class="card" style="padding:12px; font-size:12.5px;">' +
      "<div><b>Order:</b> " + escapeHtml(inv.orderNo || "—") +
        " &nbsp;·&nbsp; <b>PO:</b> " + escapeHtml(inv.poNo || "—") +
        " &nbsp;·&nbsp; <b>Dispatch:</b> " + escapeHtml(inv.dispatchNo || "—") +
        (inv.lrNumber ? " (LR " + escapeHtml(inv.lrNumber) + ")" : "") + "</div>" +
      '<div style="margin-top:6px;"><b>GSTIN:</b> ' + escapeHtml(inv.customerGstin || "—") + "</div>" +
      '<div style="margin-top:6px;"><b>Bill to:</b> ' + escapeHtml(inv.billingAddress || "—") + "</div>" +
      "</div>";

    $("im-no").value = inv.invoiceNo || "";
    $("im-value").value = inv.invoiceValue === "" || inv.invoiceValue === null ||
      inv.invoiceValue === undefined ? "" : inv.invoiceValue;
    $("im-date").value = inv.invoiceDate || "";
    $("im-due").value = inv.dueDate || "";
    $("im-terms").value = inv.paymentTerms || "";
    $("im-warranty").value = inv.warrantyTerms || "";
    $("im-notes").value = inv.notes || "";
    ["im-no", "im-value", "im-date", "im-due", "im-terms", "im-warranty",
     "im-notes"].forEach(function (f) {
      $(f).disabled = !editable;
    });

    // The one figure this portal knows that Tally does not: what this dispatch should have
    // come to. A rupee of slack because Tally rounds its total off; anything wider is a rate
    // typed wrong or a line left off, and it is cheaper to see it here than in the ledger.
    var note = $("im-value-note");
    if (inv.valueMatches === null || inv.valueMatches === undefined) {
      note.textContent = "This dispatch comes to " + fmt(inv.computedValue) +
        ". Enter what the Tally invoice actually says.";
      note.style.color = "";
    } else if (inv.valueMatches) {
      note.textContent = "Matches this dispatch (" + fmt(inv.computedValue) + ").";
      note.style.color = "";
    } else {
      note.textContent = "Does not match: this dispatch comes to " + fmt(inv.computedValue) +
        ", a difference of " + fmt(Math.abs(inv.valueVariance)) +
        (inv.valueVariance > 0 ? " more" : " less") + " on the Tally invoice.";
      note.style.color = "var(--danger, #b42318)";
    }
    $("btn-im-save").style.display = editable ? "" : "none";

    // The e-invoice reference arrives after the invoice is issued, so it stays editable when
    // the figures above no longer are. Cancelled is the one state with nothing left to record.
    var mayReference = inv.status !== "Cancelled" && canDoBilling();
    $("im-irn").value = inv.irn || "";
    $("im-ackno").value = inv.ackNo || "";
    $("im-ackdate").value = inv.ackDate || "";
    ["im-irn", "im-ackno", "im-ackdate"].forEach(function (f) { $(f).disabled = !mayReference; });
    $("btn-im-saveirn").style.display = mayReference ? "" : "none";

    renderDocuments("im", "Invoice", inv.id, inv.documents, inv.documentTypes, mayReference);

    $("im-items").innerHTML = '<div class="card" style="padding:0; overflow-x:auto;"><table>' +
      "<thead><tr><th>#</th><th>Item</th><th>Description</th>" +
      '<th class="num">Qty</th><th class="num">Rate</th><th class="num">Disc %</th>' +
      '<th class="num">GST %</th><th class="num">Line Total</th></tr></thead><tbody>' +
      inv.items.map(function (l) {
        return "<tr><td>" + escapeHtml(l.lineNo) + "</td>" +
          '<td class="mono">' + escapeHtml(l.itemCode) + "</td>" +
          "<td>" + escapeHtml(l.description || "") + "</td>" +
          '<td class="num mono">' + escapeHtml(l.qty) + " " + escapeHtml(l.uom || "") + "</td>" +
          '<td class="num mono">' + fmt(l.unitPrice) + "</td>" +
          '<td class="num">' + escapeHtml(l.discountPct || 0) + "</td>" +
          '<td class="num">' + escapeHtml(l.taxPct || 0) + "</td>" +
          '<td class="num mono">' + fmt(l.lineTotal) + "</td></tr>";
      }).join("") + "</tbody></table></div>";

    // The balance is owed off what Tally billed. When that differs from what the lines add up
    // to, both are shown, so Total − Received = Balance can be checked by eye; showing only
    // the computed total made the arithmetic on this box wrong by the difference.
    var differs = inv.valueMatches === false;
    $("im-totals").innerHTML = '<div class="totals-box">' +
      '<div class="totals-row"><span>Subtotal</span><span class="mono">' + fmt(inv.subtotal) + "</span></div>" +
      '<div class="totals-row"><span>Discount</span><span class="mono">-' + fmt(inv.discountAmt) + "</span></div>" +
      '<div class="totals-row"><span>GST</span><span class="mono">' + fmt(inv.taxAmt) + "</span></div>" +
      '<div class="totals-row"><span>Freight</span><span class="mono">' + fmt(inv.freight) + "</span></div>" +
      '<div class="totals-row' + (differs ? "" : " grand") + '"><span>' +
        (differs ? "Lines come to" : "Invoice Total") + '</span><span class="mono">' +
        fmt(inv.grand) + "</span></div>" +
      (differs
        ? '<div class="totals-row grand"><span>Billed in Tally</span><span class="mono">' +
          fmt(inv.billedAmt) + "</span></div>"
        : "") +
      '<div class="totals-row"><span>Received</span><span class="mono">' + fmt(inv.receivedAmt) + "</span></div>" +
      '<div class="totals-row grand"><span>' + (inv.status === "Issued" ? "Balance" : "Balance once issued") +
        '</span><span class="mono">' + fmt(inv.balanceAmt) + "</span></div>" +
      "</div>";

    $("im-receipts").innerHTML = inv.receipts.length
      ? '<div class="card" style="padding:0; overflow-x:auto;"><table>' +
        "<thead><tr><th>Receipt No.</th><th>Date</th><th>Mode</th><th>Reference</th>" +
        '<th class="num">Amount</th></tr></thead><tbody>' +
        inv.receipts.map(function (r) {
          return "<tr>" +
            '<td class="mono">' + escapeHtml(r.receiptNo || "—") + "</td>" +
            "<td>" + escapeHtml(r.receiptDate) + "</td>" +
            "<td>" + escapeHtml(r.mode || "—") + "</td>" +
            "<td>" + escapeHtml(r.reference || "—") + "</td>" +
            '<td class="num mono">' + fmt(r.amount) + "</td></tr>";
        }).join("") + "</tbody></table></div>"
      : '<div class="empty">No payments recorded yet.' +
        (inv.status === "Issued" ? " Press <b>+ Record Payment</b> when the money comes in." : "") +
        "</div>";
    $("btn-im-receipt").style.display =
      inv.status === "Issued" && inv.balanceAmt > 0.5 && canCollect() ? "" : "none";

    $("im-tally-state").innerHTML = "Status: <b>" + escapeHtml(inv.tallySyncStatus || "Pending") + "</b>" +
      (inv.tallySyncDate ? " · last attempt " + escapeHtml(inv.tallySyncDate) : "") +
      (inv.tallySyncError ? '<br><span style="color:var(--red);">' + escapeHtml(inv.tallySyncError) + "</span>" : "");

    var issued = inv.status === "Issued";
    $("btn-im-issue").style.display = editable ? "" : "none";
    $("btn-im-tally").style.display = issued && canDispatch() ? "" : "none";
    $("btn-im-tallymanual").style.display = issued && canDispatch() &&
      inv.tallySyncStatus !== "Synced" ? "" : "none";
    $("btn-im-cancelinvoice").style.display =
      inv.status !== "Cancelled" && canOverrideDispatch() ? "" : "none";
  }

  $("btn-im-close").addEventListener("click", function () {
    $("invoice-modal-backdrop").classList.remove("show");
    loadDispatchData();
  });

  // The payment form is the one Collections uses, opened on this invoice. When it saves, the
  // invoice window is refreshed so the new receipt and the lower balance show where the
  // person is looking.
  $("btn-im-receipt").addEventListener("click", function () {
    if (!openInvoice) return;
    receiptFromInvoice = openInvoice.id;
    startReceipt(openInvoice.id);
  });

  $("btn-im-saveirn").addEventListener("click", function () {
    srv.withSuccessHandler(function (inv) {
      openInvoice = inv; renderInvoiceModal();
      showMsg(inv.irn ? "E-invoice reference saved." : "E-invoice reference cleared.", "success");
    }).withFailureHandler(onServerError).saveEInvoiceReference({
      id: openInvoice.id,
      irn: $("im-irn").value.trim(),
      ackNo: $("im-ackno").value.trim(),
      ackDate: $("im-ackdate").value
    });
  });

  wireDocumentUpload("im", "Invoice", function () { return openInvoice && openInvoice.id; });
  wireDocumentUpload("om2", "SalesOrder", function () { return openOrder && openOrder.id; });

  $("btn-im-save").addEventListener("click", function () {
    srv.withSuccessHandler(function (inv) {
      openInvoice = inv; renderInvoiceModal();
      showMsg("Invoice details saved.", "success");
    }).withFailureHandler(onServerError).saveInvoiceDetails({
      id: openInvoice.id,
      invoiceNo: $("im-no").value.trim(),
      invoiceValue: $("im-value").value,
      invoiceDate: $("im-date").value,
      dueDate: $("im-due").value,
      paymentTerms: $("im-terms").value.trim(),
      warrantyTerms: $("im-warranty").value.trim(),
      notes: $("im-notes").value.trim()
    });
  });

  $("btn-im-issue").addEventListener("click", function () {
    askDialog({
      title: "Issue this invoice?",
      message: "The document becomes final and the order moves to Invoiced. An issued invoice " +
        "can only be cancelled, not edited.",
      okLabel: "Issue Invoice"
    }, function (ok) {
      if (ok === null) return;
      srv.withSuccessHandler(function (inv) {
        // Same: an issued invoice can only be cancelled, so there is nothing left to do here.
        $("invoice-modal-backdrop").classList.remove("show");
        loadDispatchData();
        showMsg("Invoice " + inv.invoiceNo + " issued.", "success");
      }).withFailureHandler(onServerError).issueInvoice(openInvoice.id);
    });
  });

  $("btn-im-cancelinvoice").addEventListener("click", function () {
    askDialog({
      title: "Cancel this invoice?",
      message: "The number stays in the register with your reason, so the series has no silent gaps.",
      input: true, inputLabel: "Reason *", okLabel: "Cancel Invoice", danger: true
    }, function (reason) {
      if (reason === null) return;
      srv.withSuccessHandler(function (inv) {
        openInvoice = inv; renderInvoiceModal();
        showMsg("Invoice cancelled.", "success");
      }).withFailureHandler(onServerError).cancelInvoice(openInvoice.id, reason);
    });
  });

  $("btn-im-tally").addEventListener("click", function () {
    srv.withSuccessHandler(function (inv) {
      openInvoice = inv; renderInvoiceModal();
      showMsg("Invoice sent to Tally.", "success");
    }).withFailureHandler(onServerError).pushInvoiceToTally(openInvoice.id);
  });

  $("btn-im-tallymanual").addEventListener("click", function () {
    askDialog({
      title: "Entered in Tally by hand?",
      message: "Record the Tally voucher reference so the two systems can be reconciled later.",
      input: true, inputLabel: "Tally Reference", required: false, okLabel: "Mark as Synced"
    }, function (ref) {
      if (ref === null) return;
      srv.withSuccessHandler(function (inv) {
        openInvoice = inv; renderInvoiceModal();
        showMsg("Marked as entered in Tally.", "success");
      }).withFailureHandler(onServerError).markInvoiceSyncedManually(openInvoice.id, ref);
    });
  });

  // ================= COLLECTIONS =================
  var COL_SUBTABS = ["ageing", "receivables", "followups", "receipts"];
  var colMode = "ageing";
  var colCache = [];
  var colSummary = null;
  var riPreview = null;

  var BUCKET_LABELS = [
    { key: "notDue", label: "Not Due" },
    { key: "d0_30", label: "1–30" },
    { key: "d31_60", label: "31–60" },
    { key: "d61_90", label: "61–90" },
    { key: "d90plus", label: "90+" }
  ];

  var RECEIPT_MODE_OPTIONS = ["NEFT/RTGS", "Cheque", "Cash", "UPI", "Adjustment", "Other"];

  function canCollect() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initCollectionsView() {
    $("col-actions").innerHTML = canCollect()
      ? '<button class="btn btn-primary" id="btn-new-receipt">+ Record Receipt</button>' +
        '<button class="btn btn-amber" id="btn-import-receipts">Import Receipts</button>'
      : "";
    if (canCollect()) {
      $("btn-new-receipt").addEventListener("click", startReceipt);
      $("btn-import-receipts").addEventListener("click", startReceiptImport);
    }
    setColMode(colMode);
  }

  COL_SUBTABS.forEach(function (mode) {
    $("subtab-" + mode).addEventListener("click", function () { setColMode(mode); });
  });

  function setColMode(mode) {
    colMode = mode;
    COL_SUBTABS.forEach(function (m) {
      $("subtab-" + m).className = "btn btn-sm" + (m === mode ? " btn-primary" : "");
    });
    loadCollections();
  }

  $("col-search").addEventListener("input", function () { renderColTable(); });
  $("col-overdue").addEventListener("change", loadCollections);

  function loadCollections() {
    // The ageing strip is the same for every sub-tab, so it is fetched once alongside the rows.
    srv.withSuccessHandler(function (summary) {
      colSummary = summary;
      renderColSummary();
    }).withFailureHandler(onServerError).getAgeingSummary();

    var done = function (rows) { colCache = rows; renderColTable(); };
    var overdue = $("col-overdue").checked;

    if (colMode === "ageing") {
      srv.withSuccessHandler(done).withFailureHandler(onServerError).getAgeingByCustomer();
    } else if (colMode === "receivables") {
      srv.withSuccessHandler(done).withFailureHandler(onServerError)
        .getReceivables({ overdueOnly: overdue });
    } else if (colMode === "followups") {
      srv.withSuccessHandler(done).withFailureHandler(onServerError)
        .listFollowups({ openOnly: true });
    } else {
      srv.withSuccessHandler(done).withFailureHandler(onServerError).listReceipts({});
    }
  }

  function renderColSummary() {
    if (!colSummary) return;
    var s = colSummary;
    $("col-summary").innerHTML =
      '<div class="grid grid-2" style="margin-bottom:12px;">' +
        '<div class="kpi-card"><div class="kpi-label">Total Outstanding</div>' +
          '<div class="kpi-value">' + fmt(s.totalOutstanding) + "</div>" +
          '<div class="kpi-sub">' + s.invoiceCount + " open invoice(s)</div></div>" +
        '<div class="kpi-card' + (s.overdueAmount > 0 ? " alert" : "") + '">' +
          '<div class="kpi-label">Overdue</div><div class="kpi-value">' + fmt(s.overdueAmount) + "</div>" +
          '<div class="kpi-sub">past the agreed due date</div></div>' +
      "</div>" +
      '<div class="grid grid-5" style="margin-bottom:14px;">' +
        s.buckets.map(function (b) {
          var bad = b.key !== "notDue" && b.amount > 0;
          return '<div class="kpi-card' + (b.key === "d90plus" && b.amount > 0 ? " alert" : "") + '">' +
            '<div class="kpi-label">' + escapeHtml(b.label) + "</div>" +
            '<div class="kpi-value" style="font-size:17px;' + (bad ? " color:var(--red);" : "") + '">' +
              fmt(b.amount) + "</div>" +
            '<div class="kpi-sub">' + b.count + " invoice(s)</div></div>";
        }).join("") +
      "</div>";
  }

  function colEmpty(cols, text) {
    $("col-tbody").innerHTML = '<tr><td colspan="' + cols + '"><div class="empty">' +
      escapeHtml(text) + "</div></td></tr>";
  }

  function renderColTable() {
    var q = ($("col-search").value || "").toLowerCase();
    var rows = colCache.filter(function (r) {
      return [r.customerName, r.invoiceNo, r.receiptNo, r.reference].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    if (colMode === "ageing") renderAgeingTable(rows);
    else if (colMode === "receivables") renderReceivablesTable(rows);
    else if (colMode === "followups") renderFollowupsTable(rows);
    else renderReceiptsTable(rows);
  }

  function renderAgeingTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Customer</th>" +
      BUCKET_LABELS.map(function (b) { return '<th class="num">' + b.label + "</th>"; }).join("") +
      '<th class="num">Total</th><th class="num">Oldest</th><th></th></tr>';

    if (!rows.length) { colEmpty(9, "Nothing outstanding. Every issued invoice is paid."); return; }

    $("col-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        "<td><b>" + escapeHtml(r.customerName || "—") + "</b>" +
          (r.overLimit ? ' <span class="badge badge-overdue">Over limit</span>' : "") +
          (r.brokenCommitments ? ' <span class="badge badge-lost">' + r.brokenCommitments +
            " broken promise(s)</span>" : "") +
          '<br><span style="font-size:11px; color:var(--ink-soft);">' + r.invoiceCount +
          " invoice(s)" + (r.creditLimit !== null && r.creditLimit !== undefined
            ? " · limit " + fmt(r.creditLimit) : "") + "</span></td>" +
        BUCKET_LABELS.map(function (b) {
          var v = r[b.key] || 0;
          var bad = b.key === "d61_90" || b.key === "d90plus";
          return '<td class="num mono"' + (bad && v > 0 ? ' style="color:var(--red);"' : "") + ">" +
            (v ? fmt(v) : "—") + "</td>";
        }).join("") +
        '<td class="num mono"><b>' + fmt(r.totalOutstanding) + "</b></td>" +
        '<td class="num">' + (r.oldestOverdueDays > 0
          ? '<span class="badge badge-overdue">' + r.oldestOverdueDays + "d</span>" : "—") + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-statement="' + r.customerId + '">Statement</button></td>' +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-statement]").forEach(function (btn) {
      btn.addEventListener("click", function () { openStatement(btn.dataset.statement); });
    });
  }

  function renderReceivablesTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Invoice No.</th><th>Customer</th><th>Invoiced</th><th>Due</th>" +
      '<th class="num">Value</th><th class="num">Received</th><th class="num">Balance</th>' +
      "<th>Ageing</th><th>Commitment</th><th></th></tr>";

    if (!rows.length) { colEmpty(10, "No open invoices match."); return; }

    $("col-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.invoiceNo) + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        "<td>" + escapeHtml(r.invoiceDate) + "</td>" +
        "<td>" + escapeHtml(r.dueDate || "—") + "</td>" +
        '<td class="num mono">' + fmt(r.grand) + "</td>" +
        '<td class="num mono">' + fmt(r.receivedAmt) + "</td>" +
        '<td class="num mono"><b>' + fmt(r.balanceAmt) + "</b></td>" +
        "<td>" + (r.overdueDays > 0
          ? '<span class="badge badge-overdue">' + r.overdueDays + " days</span>"
          : '<span class="badge badge-active">Not due</span>') + "</td>" +
        "<td>" + (r.commitmentAmount
          ? (r.commitmentOverdue
              ? '<span class="badge badge-lost">' + fmt(r.commitmentAmount) + " by " + escapeHtml(r.commitmentDate) + "</span>"
              : '<span class="badge badge-followup">' + fmt(r.commitmentAmount) + " by " + escapeHtml(r.commitmentDate) + "</span>")
          : "—") + "</td>" +
        '<td class="center" style="white-space:nowrap;">' +
          '<button class="btn btn-sm" data-followup="' + r.invoiceId + '">Follow up</button> ' +
          '<button class="btn btn-sm btn-primary" data-receipt="' + r.invoiceId + '">Receipt</button></td>' +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-followup]").forEach(function (btn) {
      btn.addEventListener("click", function () { startFollowup(btn.dataset.followup); });
    });
    $("col-tbody").querySelectorAll("[data-receipt]").forEach(function (btn) {
      btn.addEventListener("click", function () { startReceipt(btn.dataset.receipt); });
    });
  }

  function renderFollowupsTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Date</th><th>Customer</th><th>Invoice</th><th>Discussion</th>" +
      '<th class="num">Balance</th><th>Commitment</th><th>Next</th><th>Status</th><th></th></tr>';

    if (!rows.length) { colEmpty(9, "No open follow-ups. Log one from an open invoice."); return; }

    $("col-tbody").innerHTML = rows.map(function (f) {
      return "<tr>" +
        "<td>" + escapeHtml(f.contactDate) + "</td>" +
        "<td>" + escapeHtml(f.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(f.invoiceNo || "—") + "</td>" +
        '<td style="max-width:280px;">' + escapeHtml(f.discussion || "") +
          (f.contactPerson ? '<br><span style="font-size:11px; color:var(--ink-soft);">with ' +
            escapeHtml(f.contactPerson) + "</span>" : "") + "</td>" +
        '<td class="num mono">' + fmt(f.balanceAmt) + "</td>" +
        "<td>" + (f.commitmentAmount
          ? (f.commitmentOverdue
              ? '<span class="badge badge-lost">' + fmt(f.commitmentAmount) + " — broken</span>"
              : '<span class="badge badge-followup">' + fmt(f.commitmentAmount) + " by " + escapeHtml(f.commitmentDate) + "</span>")
          : "—") + "</td>" +
        "<td>" + (f.nextFollowupDate
          ? (f.followupDue ? '<span class="badge badge-overdue">' + escapeHtml(f.nextFollowupDate) + "</span>"
                           : escapeHtml(f.nextFollowupDate))
          : "—") + "</td>" +
        '<td><span class="badge ' + (f.status === "Broken" ? "badge-lost"
          : f.status === "Closed" ? "badge-won" : "badge-followup") + '">' +
          escapeHtml(f.status || "Open") + "</span></td>" +
        '<td class="center"><button class="btn btn-sm" data-editfu="' + f.id + '">Edit</button></td>' +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-editfu]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var f = colCache.filter(function (x) { return String(x.id) === String(btn.dataset.editfu); })[0];
        if (f) startFollowup(f.invoiceId, f);
      });
    });
  }

  function renderReceiptsTable(rows) {
    $("col-thead").innerHTML = "<tr><th>Receipt No.</th><th>Date</th><th>Customer</th><th>Invoice</th>" +
      '<th>Mode</th><th>Reference</th><th class="num">Amount</th><th></th></tr>';

    if (!rows.length) { colEmpty(8, "No receipts recorded yet."); return; }

    $("col-tbody").innerHTML = rows.map(function (r) {
      var reversal = (Number(r.amount) || 0) < 0;
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.receiptNo || "—") +
          (r.importedDate ? ' <span class="badge badge-dormant">imported</span>' : "") + "</td>" +
        "<td>" + escapeHtml(r.receiptDate) + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(r.invoiceNo || "—") + "</td>" +
        "<td>" + escapeHtml(r.mode || "—") + "</td>" +
        '<td class="mono" style="font-size:11.5px;">' + escapeHtml(r.reference || r.tallyRef || "—") + "</td>" +
        '<td class="num mono"' + (reversal ? ' style="color:var(--red);"' : "") + ">" + fmt(r.amount) + "</td>" +
        '<td class="center">' + (!reversal && canOverrideDispatch()
          ? '<button class="btn btn-sm btn-danger" data-reverse="' + r.id + '">Reverse</button>' : "") + "</td>" +
        "</tr>";
    }).join("");

    $("col-tbody").querySelectorAll("[data-reverse]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({
          title: "Reverse this receipt?",
          message: "The original stays in the ledger and an offsetting entry is added, so the " +
            "history of what was believed and when survives.",
          input: true, inputLabel: "Reason *", okLabel: "Reverse Receipt", danger: true
        }, function (reason) {
          if (reason === null) return;
          srv.withSuccessHandler(function () {
            loadCollections();
            showMsg("Receipt reversed.", "success");
          }).withFailureHandler(onServerError).reverseReceipt(btn.dataset.reverse, reason);
        });
      });
    });
  }

  // ---- Record a receipt ----
  var receivablesForPicker = [];

  function startReceipt(invoiceId) {
    srv.withSuccessHandler(function (rows) {

      if (!rows.length) {
        showMsg("There are no unpaid invoices to receipt against.", "error");
        return;
      }
      $("rcp-invoice").innerHTML = rows.map(function (r) {

          "</option>";
      }).join("");

        return "<option>" + escapeHtml(m) + "</option>";
      }).join("");
      $("rcp-date").value = new Date().toISOString().slice(0, 10);
      ["rcp-reference", "rcp-tallyref", "rcp-notes"].forEach(function (f) { $(f).value = ""; });

      $("receipt-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).getReceivables({});

  // Default the amount to the full balance — part payments are the exception, not the rule.
  function onReceiptInvoiceChange() {
    var row = receivablesForPicker.filter(function (r) {
      return String(r.invoiceId) === String($("rcp-invoice").value);
    })[0];
    if (!row) { $("rcp-balance").textContent = ""; return; }
    $("rcp-balance").textContent = "Outstanding on " + row.invoiceNo + ": " + fmt(row.balanceAmt) +
      (row.overdueDays > 0 ? "  ·  " + row.overdueDays + " days overdue" : "  ·  not yet due");
    $("rcp-amount").value = row.balanceAmt;
  }

  $("rcp-invoice").addEventListener("change", onReceiptInvoiceChange);

  $("btn-cancel-receipt").addEventListener("click", function () {
    receiptFromInvoice = null;
    $("receipt-modal-backdrop").classList.remove("show");
  });

  $("btn-save-receipt").addEventListener("click", function () {
    srv.withSuccessHandler(function () {
      $("receipt-modal-backdrop").classList.remove("show");
      var from = receiptFromInvoice;
      receiptFromInvoice = null;
      if (from && $("invoice-modal-backdrop").classList.contains("show")) {
        srv.withSuccessHandler(function (inv) {
          openInvoice = inv; renderInvoiceModal();
        }).withFailureHandler(onServerError).getInvoice(from);

        loadCollections();

    }).withFailureHandler(onServerError).saveReceipt({
      invoiceId: $("rcp-invoice").value,

      amount: $("rcp-amount").value,

    });

  // ---- Receipt import ----
  // Some people have a file; some have a few rows in a mail from the accounts desk. The modal
  // takes either, and both end up as the same text going to the same validator.
  var riMode = "file";

  function startReceiptImport() {
    riPreview = null;
    $("ri-csv").value = "";
    $("ri-preview").innerHTML = "";

  function setRiMode(mode) {
    riMode = mode;
    $("btn-ri-mode-file").classList.toggle("active", mode === "file");
    $("btn-ri-mode-paste").classList.toggle("active", mode === "paste");
    $("ri-file-wrap").style.display = mode === "file" ? "" : "none";

  function clearRiFile() {
    riFileText = null;

    $("btn-ri-clear").style.display = "none";

  var riFileText = null;

  $("btn-ri-clear").addEventListener("click", function () {

    $("ri-preview").innerHTML = "";

  $("ri-drop").addEventListener("click", function () { $("ri-file").click(); });
  $("ri-file").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) readRiFile(e.target.files[0]);
  });
  ["dragenter", "dragover"].forEach(function (evt) {
    $("ri-drop").addEventListener(evt, function (e) {
      e.preventDefault(); e.stopPropagation(); $("ri-drop").classList.add("dragging");
    });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    $("ri-drop").addEventListener(evt, function (e) {
      e.preventDefault(); e.stopPropagation(); $("ri-drop").classList.remove("dragging");
    });
  });
  $("ri-drop").addEventListener("drop", function (e) {
    var f = e.dataTransfer && e.dataTransfer.files;
    if (f && f[0]) readRiFile(f[0]);
  });

  function readRiFile(file) {
    if (!/\.csv$/i.test(file.name) && file.type !== "text/csv") {
      showMsg("That is not a .csv file. Save the sheet as CSV and try again.", "error");
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () {
      showMsg("The file could not be read. Try saving it again as CSV.", "error");
    };
    reader.onload = function (e) {
      // Excel prefixes a byte-order mark that would make the first column read as missing.
      riFileText = String(e.target.result || "").replace(/^\uFEFF/, "");
      var lines = riFileText.replace(/\r\n/g, "\n").split("\n")
        .filter(function (l) { return l.trim() !== ""; });
      $("ri-drop").style.display = "none";
      $("btn-ri-clear").style.display = "";
      $("ri-filecard").innerHTML = '<div class="file-card"><div>' +
        '<div class="file-name">' + escapeHtml(file.name) + "</div>" +
        '<div class="file-meta">' + Math.max(0, lines.length - 1) + " data row(s) · " +
        Math.max(1, Math.round(file.size / 1024)) + " KB</div></div></div>";
    };
    reader.readAsText(file);
  }

  /** Whichever input the user chose, the server only ever sees text. */
  function riCsvText() {
    return riMode === "file" ? riFileText : $("ri-csv").value;
  }

  $("btn-cancel-rcpimport").addEventListener("click", function () {
    $("rcpimport-modal-backdrop").classList.remove("show");

  });

  $("btn-ri-preview").addEventListener("click", function () {
    var text = riCsvText();

      showMsg(riMode === "file" ? "Choose a CSV file first." : "Paste the CSV first.", "error");
      return;
    }
    srv.withSuccessHandler(renderImportPreview)
      .withFailureHandler(onServerError).previewReceiptImport(text);
  });

  $("btn-ri-pull").addEventListener("click", function () {
    askDialog({
      title: "Pull receipts from Tally",
      message: "This asks Tally for its receipt vouchers and shows them as a preview — nothing " +
        "is written yet. It only works once PMT's IT have made Tally reachable.",
      input: true, inputLabel: "From date (YYYY-MM-DD)",
      value: new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10),
      okLabel: "Pull"
    }, function (from) {
      if (from === null) return;
      srv.withSuccessHandler(function (result) {
        // Importing sends the text, not the preview. Drop what Tally returned into the paste
        // box and switch to it, so the rows on screen are the rows Import will actually write
        // — and so anyone can see and correct them before committing.
        setRiMode("paste");
        $("ri-csv").value = result.csv || "";
        renderImportPreview(result);
      }).withFailureHandler(onServerError)
        .pullReceiptsFromTally(from, new Date().toISOString().slice(0, 10));
    });

  function renderImportPreview(result) {
    riPreview = result;
    var ok = result.valid.length;

    $("ri-preview").innerHTML =
      '<div class="grid grid-3" style="margin:14px 0;">' +
        '<div class="kpi-card"><div class="kpi-label">Rows Read</div><div class="kpi-value">' + result.totalRows + "</div></div>" +
        '<div class="kpi-card"><div class="kpi-label">Will Import</div><div class="kpi-value">' + ok + "</div>" +
          '<div class="kpi-sub">' + fmt(result.totalAmount) + "</div></div>" +
        '<div class="kpi-card' + (result.errors.length ? " alert" : "") + '">' +
          '<div class="kpi-label">Rejected</div><div class="kpi-value">' + result.errors.length + "</div></div>" +
      "</div>" +
      (ok ? '<div class="card" style="padding:0; overflow-x:auto; max-height:260px;"><table>' +
        "<thead><tr><th>Line</th><th>Invoice</th><th>Date</th>" +
        '<th class="num">Amount</th><th class="num">New Balance</th><th>Tally Ref</th></tr></thead><tbody>' +
        result.valid.map(function (r) {
          return "<tr><td>" + r.line + "</td>" +
            '<td class="mono">' + escapeHtml(r.invoiceNo) + "</td>" +
            "<td>" + escapeHtml(r.receiptDate) + "</td>" +
            '<td class="num mono">' + fmt(r.amount) + "</td>" +
            '<td class="num mono">' + fmt(r.newBalance) + "</td>" +
            '<td class="mono" style="font-size:11.5px;">' + escapeHtml(r.tallyRef || "—") + "</td></tr>";
        }).join("") + "</tbody></table></div>" : "") +
      (result.errors.length ? '<div class="card-title" style="margin-top:16px;">Rejected rows</div>' +
        '<div class="card" style="padding:0; overflow-x:auto; max-height:200px;"><table>' +
        "<thead><tr><th>Line</th><th>Invoice</th><th>Why</th></tr></thead><tbody>" +
        result.errors.map(function (e) {
          return "<tr><td>" + e.line + "</td>" +
            '<td class="mono">' + escapeHtml(e.invoiceNo || "—") + "</td>" +
            '<td style="color:var(--red);">' + escapeHtml(e.message) + "</td></tr>";
        }).join("") + "</tbody></table></div>" : "");

    $("btn-ri-commit").style.display = ok ? "" : "none";
  }

  $("btn-ri-commit").addEventListener("click", function () {
    if (!riPreview || !riPreview.valid.length) return;
    srv.withSuccessHandler(function (result) {
      $("rcpimport-modal-backdrop").classList.remove("show");
      loadCollections();
      showMsg(result.imported + " receipt(s) imported" +
        (result.rejected ? ", " + result.rejected + " rejected." : "."), "success");
    }).withFailureHandler(onServerError).commitReceiptImport(riCsvText());
  });

  // ================= DASHBOARD (control tower) =================
  //
  // Chart colours come from the design tokens in the stylesheet, which were validated
  // against the white card surface rather than picked by eye. Two rules hold everywhere
  // here: the exception severities are the reserved status colours and are never used as a
  // series colour, and no chart carries meaning by colour alone — every bar is labelled.

  var dashStream = "";
  var dashData = null;

  var ORD_RAMP = ["var(--ord-1)", "var(--ord-2)", "var(--ord-3)", "var(--ord-4)", "var(--ord-5)"];
  var SEV_ICON = { critical: "!", serious: "▲", warning: "•" };
  var SEV_WORD = { critical: "Critical", serious: "Serious", warning: "Watch" };

  /**
   * The stream switch, for whoever it means anything to.
   *
   * The server gives a single-stream user their own stream's figures whatever the client
   * asks for, which is right — but the switch was still on screen, so pressing "Compressor"
   * highlighted Compressor and went on showing spares. A control that does nothing is worse
   * than no control: it is the screen telling somebody the numbers are something they are
   * not. They get the heading saying which stream this is instead.
   */
  function paintDashboardStream() {
    var sw = $("dash-stream");
    var cross = !currentUser.businessStream || currentUser.businessStream === "All";
    if (cross) { sw.style.display = ""; return; }
    sw.style.display = "none";
    dashStream = currentUser.businessStream;
    $("dash-title").textContent = "Control Tower \u00b7 " + currentUser.businessStream;
  }

  // ================= MY DASHBOARD (2.0) =================
  // ERP 2.0's dashboard per person (PersonDashboard.gs), above ERP 1's control tower, which is
  // unchanged under it. Management can open anybody's, exactly as they see it.
  var pd = { data: null, as: "", period: "month", from: "", to: "", ownStream: null };
  var PD_SAY = {
    coordinator: "Your desk for today: follow-ups, drafts to approve, offers waiting for an answer and SDR calls.",
    salesEngineer: "The leads you found, what is due on them, and your offers out with customers.",
    serviceCoordinator: "Jobs to assign, today’s and tomorrow’s visits, and machines that have stopped.",
    serviceEngineer: "Your visits today and tomorrow, and what you have raised for sales.",
    boss: "The team at a glance. Pick a name to see their desk as they see it. The control tower, with its nine checks, is below."
  };

  function pdHost() {
    if ($("pd-host")) return $("pd-host");
    var host = document.createElement("section");
    host.id = "pd-host";
    host.className = "pd";
    var view = $("view-dashboard");
    view.insertBefore(host, view.firstChild);
    host.addEventListener("click", function (e) {
      var open = e.target.closest("[data-pd-open]");
      if (open) { pdOpen(open.dataset.pdOpen, open.dataset.id); return; }
      var go = e.target.closest("[data-pd-go]");
      if (go) { if (visibleLeaves().some(function (t) { return t.view === go.dataset.pdGo; })) goToTab(go.dataset.pdGo); return; }
      var who = e.target.closest("[data-pd-as]");
      if (who) { pd.as = who.dataset.pdAs; pdLoad(); window.scrollTo(0, 0); }
    });
    host.addEventListener("change", function (e) {
      if (e.target.id === "pd-as") { pd.as = e.target.value; pdLoad(); }
      if (e.target.id === "pd-period") {
        pd.period = e.target.value;
        if (pd.period === "custom" && pd.data) { pd.from = pd.data.period.from; pd.to = pd.data.period.to; }
        pdLoad();
      }
      if ((e.target.id === "pd-from" || e.target.id === "pd-to") && $("pd-from").value && $("pd-to").value) {
        pd.from = $("pd-from").value;
        pd.to = $("pd-to").value;
        pdLoad();
      }
    });
    return host;
  }

  function pdLoad() {
    var host = pdHost();
    if (!pd.data) host.innerHTML = '<div class="empty">Loading your desk…</div>';
    srv.withSuccessHandler(function (d) {
      pd.data = d;
      pdRender();
    }).withFailureHandler(function (err) {
      host.innerHTML = '<div class="empty">' + escapeHtml(err && err.message ? err.message : String(err)) + "</div>";
    }).getPersonDashboard(pd.period === "custom" ? { as: pd.as, period: "custom", from: pd.from, to: pd.to } : { as: pd.as, period: pd.period });
  }

  function pdGreeting(name) {
    var h = new Date().getHours();
    return (h < 12 ? "Good morning, " : h < 17 ? "Good afternoon, " : "Good evening, ") + String(name || "").split(" ")[0];
  }

  function pdRender() {
    var d = pd.data;
    var host = pdHost();
    var day = new Date(d.today + "T00:00:00");
    var html = '<div class="pd-hero"><div>' +
      '<div class="pd-date">' + escapeHtml(day.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" })) + "</div>" +
      "<h1>" + escapeHtml(d.self ? pdGreeting(d.person.name) : d.person.name + "’s desk") + "</h1>" +
      "<p>" + escapeHtml(d.self ? PD_SAY[d.kind] || "" : d.person.role + (d.person.stream && d.person.stream !== "All" ? " · " + d.person.stream : "") +
        ". What they see when they open the ERP.") + "</p></div>";
    if (d.canViewAs) {
      html += '<div class="pd-as"><label for="pd-as">Dashboard of</label><select id="pd-as">' +
        d.everyone.map(function (p) {
          var mine = p.email.toLowerCase() === String(currentUser.email).toLowerCase();
          return '<option value="' + escapeHtml(mine ? "" : p.email) + '"' +
            ((mine && d.self) || (!mine && p.email.toLowerCase() === d.person.email.toLowerCase()) ? " selected" : "") + ">" +
            escapeHtml(mine ? "Me (" + p.name + ")" : p.name + " · " + p.role) + "</option>";
        }).join("") + "</select>" +
        (d.self ? "" : '<button type="button" class="btn btn-sm" data-pd-as="">Back to mine</button>') + "</div>";
    }
    // ERP 2's period selector: what the "this month" figures cover.
    if (d.periods) {
      html += '<div class="pd-period"><label for="pd-period">Figures for</label><select id="pd-period">' + d.periods.map(function (p) {
        return '<option value="' + p.key + '"' + (p.key === d.period.key ? " selected" : "") + ">" + escapeHtml(p.label) + "</option>";
      }).join("") + "</select>" +

  var PD_TOWER_PARTS = ["#view-dashboard > .page-head", "#view-dashboard > .dash-head", "#dash-body"];
  var PD_SERVICE_ROLES = ["Service Coordinator", "Service Engineer"];

  /**
   * The control tower under somebody's desk is the one they see too: a person in one stream
   * gets that stream's alone, with no switch; service, who never see it, get none; somebody in
   * both gets the combined view. Back on their own desk, Management get the stream they had
   * picked. Only the 2.0 face opens somebody else's desk, so only it needs this.
   */
  function pdSyncTower(d) {
    if (!FACE_V2 || PD_SERVICE_ROLES.indexOf(currentUser.role) !== -1 || !$("dash-stream")) return;
    var p = d.person || {};
    var role = d.self ? currentUser.role : p.role;
    var stream = String((d.self ? currentUser.businessStream : p.stream) || "All");
    // Management's own choice, kept while they look at somebody else's.
    if (!d.self && pd.ownStream === null) pd.ownStream = dashStream;
    var want = stream !== "All" ? stream : d.self ? (pd.ownStream !== null ? pd.ownStream : dashStream) : "";
    if (d.self) pd.ownStream = null;
    var hide = PD_SERVICE_ROLES.indexOf(role) !== -1;
    PD_TOWER_PARTS.forEach(function (sel) {
      var el = document.querySelector(sel);
      if (el) el.style.display = hide ? "none" : "";
    });
    if (hide) return;
    var first = String(p.name || "").split(" ")[0];
    $("dash-stream").style.display = stream !== "All" ? "none" : "";
    $("dash-stream").querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b.dataset.stream === want); });
    $("dash-title").textContent = "Control Tower" + (stream !== "All" ? " \u00b7 " + stream : "") + (d.self ? "" : " — as " + first + " sees it");
    if (want !== dashStream) { dashStream = want; loadDashboard(false); }
  }

  /** Opens the ERP 1 record a line is about. */

    if (kind === "quotation") { openQuotation(id); return; }
    if (kind === "job") { openServiceJobModal(id); return; }
    ebGo(kind, id);

  /** Compact Indian-format money for tiles, where the full figure would not fit. */
  function fmtShort(n) {
    var v = Number(n) || 0;
    var sign = v < 0 ? "-" : "";
    v = Math.abs(v);
    if (v >= 10000000) return sign + "₹" + (v / 10000000).toFixed(2) + " Cr";
    if (v >= 100000) return sign + "₹" + (v / 100000).toFixed(2) + " L";
    if (v >= 1000) return sign + "₹" + Math.round(v / 1000) + "K";
    return fmt(v);
  }

  function renderDashboard() {
    var d = dashData;
    if (!d) return;

    var stamp = new Date(d.generatedAt);
    $("dash-stamp").textContent = "As at " + stamp.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
      (d.fromCache ? " (cached)" : "");

    $("dash-body").innerHTML =
      renderHeadline(d) +
      renderExceptions(d) +
      '<div class="two-col">' + renderOrderPipelineCard(d) + renderAgeingChart(d) + "</div>" +
      renderTrend(d) +
      '<div class="two-col">' + renderFunnels(d) + renderTopCustomers(d) + "</div>";

    wireDashboardLinks();
  }

  // ---- Headline: stat tiles, because these are single numbers, not charts ----

    var h = d.headline;
    var collectionRate = h.invoicedThisMonth > 0

    return '<div class="grid grid-4" style="margin-bottom:16px;">' +
      '<div class="hero-card"><div class="kpi-label">Outstanding</div>' +
        '<div class="hero-figure">' + fmtShort(h.outstanding) + "</div>" +
        '<div class="kpi-sub">' + (h.overduePct
          ? '<span style="color:var(--st-critical); font-weight:600;">' + h.overduePct +
            "% overdue</span> · " + fmtShort(h.overdueAmount)
          : "nothing overdue") + "</div></div>" +

      '<div class="hero-card"><div class="kpi-label">Open Order Book</div>' +
        '<div class="hero-figure">' + fmtShort(h.openOrderValue) + "</div>" +
        '<div class="kpi-sub">' + h.openOrderCount + " order(s) not yet closed</div></div>" +

      '<div class="hero-card"><div class="kpi-label">Invoiced This Month</div>' +
        '<div class="hero-figure">' + fmtShort(h.invoicedThisMonth) + "</div>" +
        '<div class="kpi-sub">collected ' + fmtShort(h.collectedThisMonth) +
          (collectionRate !== null ? " · " + collectionRate + "% of billing" : "") + "</div></div>" +

      '<div class="hero-card"><div class="kpi-label">' +
        (d.stream === "Spare" ? "Open Quotations" : "Weighted Pipeline") + "</div>" +
        '<div class="hero-figure">' + fmtShort(d.stream === "Spare"
          ? h.openQuotationValue : h.weightedPipeline) + "</div>" +
        '<div class="kpi-sub">' + (d.stream === "Spare"
          ? h.openQuotationCount + " quotation(s) live"
          : h.openQuotationCount + " quotation(s) · " + fmtShort(h.openQuotationValue)) +

  // ---- Exceptions: the reason this screen exists ----
  function renderExceptions(d) {
    if (!d.exceptions.length) {
      return '<div class="card"><div class="card-title" style="margin-top:0;">Exceptions</div>' +
        '<div class="empty">Nothing is stuck. Every order, dispatch and invoice is moving.</div></div>';

  /**
   * Horizontal bars on a shared baseline. `colors` is either one hue for a magnitude
   * comparison or the ordinal ramp where the categories are genuinely ordered.
   */
  function barChart(rows, opts) {
    var max = Math.max.apply(null, rows.map(function (r) { return Number(r[opts.field]) || 0; }).concat([1]));
    var last = ORD_RAMP.length - 1;

    return rows.map(function (r, i) {
      var v = Number(r[opts.field]) || 0;
      var pct = max > 0 ? (v / max) * 100 : 0;

      // Stretch the five ramp steps across however many rows there are, rather than
      // clamping — with eight order states, clamping painted the last four identically.
      var color = opts.color;
      if (opts.ramp) {
        var step = rows.length > 1 ? Math.round((i / (rows.length - 1)) * last) : 0;
        color = ORD_RAMP[step];
      }

      return '<div class="bar-row">' +
        '<span class="bar-name" title="' + escapeHtml(r.label) + '">' + escapeHtml(r.label) + "</span>" +
        '<span class="bar-track">' +
          // A zero value draws nothing; a 2px sliver reads as "a little", which is a lie.
          (v > 0
            ? '<span class="bar-fill" style="width:' + Math.max(pct, 0.6).toFixed(1) +
              "%; background:" + color + ';"></span>'
            : "") +
        "</span>" +
        '<span class="bar-figure">' + opts.format(r) + "</span>" +
        "</div>";
    }).join("");
  }

  /**
   * The dashboard's Order Pipeline card.
   *
   * Named for the card it draws, because "renderPipeline" was already the compressor funnel's
   * list renderer four thousand lines up. Two function declarations of one name in one scope
   * do not collide loudly: the later one silently replaces the earlier, so every press of the
   * Pipeline tab called this, with no dashboard payload to read, and threw. The funnel had
   * never once drawn a row.
   */
  function renderOrderPipelineCard(d) {
    var hasAny = d.orderPipeline.some(function (r) { return r.count > 0; });
    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Order Pipeline</div>' +
      (hasAny
        ? barChart(d.orderPipeline, {
            field: "count", ramp: true,
            format: function (r) { return r.count + (r.value ? "  " + fmtShort(r.value) : ""); }
          }) + '<div class="kpi-sub" style="margin-top:10px;">Count per state, darker as the ' +
            "order gets closer to done.</div>"
        : '<div class="empty">No orders yet.</div>') +
      "</div>";
  }

  function renderAgeingChart(d) {
    var hasAny = d.ageing.some(function (r) { return r.value > 0; });
    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Receivables Ageing</div>' +
      (hasAny
        ? barChart(d.ageing, {
            field: "value", ramp: true,
            format: function (r) { return fmtShort(r.value); }
          }) + '<div class="kpi-sub" style="margin-top:10px;">Darker is older. ' +
            "Bars are amounts, not invoice counts.</div>"
        : '<div class="empty">Nothing outstanding.</div>') +
      "</div>";
  }

  // ---- Six-month trend: two series, one axis (both are rupees) ----
  function renderTrend(d) {
    var max = Math.max.apply(null, d.trend.map(function (m) {
      return Math.max(m.invoiced, m.collected);
    }).concat([1]));

    return '<div class="card">' +
      '<div class="card-title" style="margin-top:0;">Invoiced vs Collected</div>' +
      '<div class="trend-wrap">' +
        d.trend.map(function (m) {
          var hi = max > 0 ? (m.invoiced / max) * 100 : 0;
          var hc = max > 0 ? (m.collected / max) * 100 : 0;
          return '<div class="trend-month">' +
            '<div class="trend-bars">' +
              '<div class="trend-bar" style="height:' + hi.toFixed(1) +
                '%; background:var(--series-1);" title="Invoiced ' + escapeHtml(fmtShort(m.invoiced)) + '"></div>' +
              '<div class="trend-bar" style="height:' + hc.toFixed(1) +
                '%; background:var(--series-2);" title="Collected ' + escapeHtml(fmtShort(m.collected)) + '"></div>' +
            "</div>" +
            '<div class="trend-label">' + escapeHtml(m.label) + "</div>" +
            "</div>";
        }).join("") +
      "</div>" +
      '<div class="legend">' +
        '<span class="legend-key"><span class="legend-swatch" style="background:var(--series-1);"></span>Invoiced</span>' +
        '<span class="legend-key"><span class="legend-swatch" style="background:var(--series-2);"></span>Collected</span>' +
      "</div>" +
      // The numbers themselves, because a bar you cannot read is not a report.
      '<div class="card" style="padding:0; overflow-x:auto; margin:14px 0 0; box-shadow:none;"><table>' +
        "<thead><tr><th>Month</th>" +
        d.trend.map(function (m) { return '<th class="num">' + escapeHtml(m.label) + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        '<tr><td>Invoiced</td>' + d.trend.map(function (m) {
          return '<td class="num mono">' + fmtShort(m.invoiced) + "</td>"; }).join("") + "</tr>" +
        '<tr><td>Collected</td>' + d.trend.map(function (m) {
          return '<td class="num mono">' + fmtShort(m.collected) + "</td>"; }).join("") + "</tr>" +
      "</tbody></table></div>" +
      "</div>";
  }

  function renderFunnels(d) {
    var blocks = "";
    if (d.funnel && d.funnel.length) {
      blocks += '<div class="card-title" style="margin-top:0;">Compressor Funnel</div>' +
        (d.funnel.some(function (r) { return r.count > 0; })
          ? barChart(d.funnel, {
              field: "count", ramp: true,
              format: function (r) { return r.count + (r.value ? "  " + fmtShort(r.value) : ""); }

    if (d.enquiryFunnel && d.enquiryFunnel.length) {
      blocks += '<div class="card-title" style="margin-top:' + (blocks ? "20px" : "0") +

  /**

  function renderDriftBanner() {

  // ---- Email: the office Gmail that quotations go out from (server only) ----

  /** One request to /api/email. Resolves with what it answered, rejects with its words. */
  function emailApi(action) {
    return fetch("/api/email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: sessionToken, action: action })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (b) {
        if (!res.ok) throw new Error((b && b.error) || ("The server answered " + res.status + "."));
        return b.ok;
      });
    });
  }

    $("set-panel").innerHTML = panelCard("Email",
      "Where quotation emails are sent from.", "", '<div class="hint">Checking\u2026</div>');
    emailApi("status").then(drawEmailPanel).catch(function (err) {
      $("set-panel").innerHTML = panelCard("Email", "Where quotation emails are sent from.", "",
        '<div class="msg msg-error show" style="position:static;"><span class="msg-text">' +
        escapeHtml(err.message) + "</span></div>");

  }

            escapeHtml(String(st.connectedAt).slice(0, 10)) + "</div>" : "") : "\u2014") +

          "Customers\u2019 replies go to the email address in <b>Letterhead</b>. The portal can " +
          "only send from it \u2014 it cannot read, search or delete anything in the mailbox." +
        "</div>" +
        '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
          '<button class="btn btn-primary btn-sm" id="btn-em-test" type="button">' +
            "Send a Test Email</button>" +

        "</div>";
    } else {
      body +=
        '<div class="compare-strip" style="margin-bottom:14px;">' +
          "The server sends quotations through the office Gmail account " +
          "(admin.premierindia@gmail.com) over Google\u2019s own connection \u2014 the one " +
          "Railway\u2019s plan does not block. Somebody who can sign in to that account presses " +
          "<b>Connect Gmail</b> once and allows it. Its password is never seen here." +
        "</div>" +
        (st.clientConfigured ? "" :
