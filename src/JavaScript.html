<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return "₹" + (Math.round((n || 0) * 100) / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  function escapeHtml(str) {
    return String(str === undefined || str === null ? "" : str).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  // Five roles per decision D4. Order here is the display order.
  var ALL_ROLES = ["Sales Coordinator", "Sales Engineer", "Service Engineer", "Management", "ERP Admin"];

  // Must match BUSINESS_STREAMS in Schema.gs exactly — these strings are stored on every
  // transaction and filtered on by value, so a short form here silently matches nothing.
  var BUSINESS_STREAMS = ["Compressor Sales", "Spare Sales"];
  var SALES_SIDE = ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"];

  /**
   * Navigation. Screens are grouped behind a handful of headings rather than laid out as one
   * long strip of tabs — a flat bar was already wrapping onto a second row at ten screens, and
   * dashboards, collections and settings are still to come. A group with a single visible
   * child collapses into a plain link, so role filtering never leaves an empty menu.
   */
  var NAV = [
    { view: "dashboard", label: "Dashboard", roles: ALL_ROLES },
    // The two streams are the two front offices (D2) and sit at the same level as each other,
    // never inside a shared "Sales" heading — a stream and a document are different kinds of
    // thing, and putting them in one list is what made the old grouping read wrong.
    { view: "compressor", label: "Compressor Sales", roles: SALES_SIDE },
    { view: "enquiries", label: "Spare Sales", roles: SALES_SIDE },
    { label: "Quotations", children: [
      { view: "quote", label: "New Quotation", roles: SALES_SIDE },
      { view: "quotations", label: "All Quotations", roles: SALES_SIDE }
    ] },
    { label: "Orders", children: [
      { view: "orders", label: "Sales Orders", roles: ALL_ROLES },
      { view: "dispatch", label: "Dispatch & Billing", roles: ALL_ROLES },
      { view: "collections", label: "Collections", roles: ALL_ROLES }
    ] },
    { view: "inventory", label: "Inventory", roles: ALL_ROLES },
    { label: "Masters", children: [
      { view: "customers", label: "Customers", roles: ALL_ROLES },
      { view: "catalog", label: "Catalog", roles: ALL_ROLES }
    ] },
    { view: "settings", label: "Settings", roles: ["Management", "ERP Admin"] }
  ];

  /** Every leaf screen, flattened — used for role checks and for the default landing tab. */
  function navLeaves() {
    var out = [];
    NAV.forEach(function (n) {
      if (n.children) { n.children.forEach(function (c) { out.push(c); }); }
      else out.push(n);
    });
    return out;
  }

  function visibleLeaves() {
    return navLeaves().filter(function (t) { return t.roles.indexOf(currentUser.role) !== -1; });
  }

  // Master data (Products/Spares/pricing) is Management + ERP Admin only — mirrors
  // MASTER_EDITORS in Auth.gs, which is where the rule is actually enforced.
  function canEditCatalog() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  var currentUser = null;

  var msgTimer = null;

  /**
   * Success messages fade after a few seconds; errors stay until dismissed. An error the
   * user can miss by looking away is worse than no error at all.
   */
  function showMsg(text, type) {
    var box = $("msg-box");
    var isError = type === "error";
    if (msgTimer) { clearTimeout(msgTimer); msgTimer = null; }

    box.innerHTML = '<span class="msg-text"></span>' +
      (isError ? '<button class="msg-close" type="button" title="Dismiss">&times;</button>' : "");
    box.querySelector(".msg-text").textContent = text;
    box.className = "msg show " + (isError ? "msg-error" : "msg-success");
    window.scrollTo({ top: 0, behavior: "smooth" });

    if (isError) {
      box.querySelector(".msg-close").addEventListener("click", function () {
        box.className = "msg";
      });
    } else {
      msgTimer = setTimeout(function () { box.className = "msg"; }, 4000);
    }
  }

  /**
   * Clears the banner. An error belongs to the action that raised it: once that action
   * succeeds on a retry, or the user moves to another screen, the old message is no longer
   * telling the truth and must go. Leaving it up produced a screen showing a loaded
   * dashboard under an error saying the dashboard could not load.
   */
  function clearMsg() {
    if (msgTimer) { clearTimeout(msgTimer); msgTimer = null; }
    $("msg-box").className = "msg";
  }

  function onServerError(err) {
    showMsg(err && err.message ? err.message : String(err), "error");
  }

  /**
   * Replacement for window.prompt/confirm, which the Apps Script sandbox blocks.
   *
   * askDialog({title, message, input, inputLabel, options, optionsLabel, okLabel, danger},
   *           callback)
   *
   * Pass `input: true` for a text field or `options: [{value,label}]` for a dropdown. The
   * callback receives the entered text or selected value ("" when neither was requested),
   * or null on cancel. Both field types live in the markup and are shown or hidden — callers
   * must never rewrite this dialog's DOM, or the handlers below end up reading fields that
   * no longer exist.
   */
  var askState = null;

  function askDialog(opts, callback) {
    var usesSelect = !!(opts.options && opts.options.length);
    askState = {
      callback: callback,
      requiresInput: !!opts.input,
      usesSelect: usesSelect,
      required: opts.required !== false
    };

    $("ask-title").textContent = opts.title || "Are you sure?";
    $("ask-message").textContent = opts.message || "";

    $("ask-input-wrap").style.display = opts.input ? "" : "none";
    $("ask-input-label").textContent = opts.inputLabel || "Reason";
    $("ask-input").value = opts.value || "";

    $("ask-select-wrap").style.display = usesSelect ? "" : "none";
    $("ask-select-label").textContent = opts.optionsLabel || "Choose one";
    $("ask-select").innerHTML = usesSelect
      ? opts.options.map(function (o) {
          return '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + "</option>";
        }).join("")
      : "";

    $("ask-ok").textContent = opts.okLabel || "Confirm";
    $("ask-ok").className = "btn " + (opts.danger ? "btn-danger" : "btn-primary");
    $("ask-modal-backdrop").classList.add("show");
    if (opts.input) setTimeout(function () { $("ask-input").focus(); }, 50);
  }

  function closeAsk() {
    $("ask-modal-backdrop").classList.remove("show");
    askState = null;
  }

  $("ask-cancel").addEventListener("click", function () {
    var cb = askState && askState.callback;
    closeAsk();
    if (cb) cb(null);
  });

  $("ask-ok").addEventListener("click", function () {
    if (!askState) return;
    var value = askState.usesSelect ? $("ask-select").value : $("ask-input").value.trim();
    if (askState.required && !value && (askState.requiresInput || askState.usesSelect)) {
      (askState.usesSelect ? $("ask-select") : $("ask-input")).focus();
      return;
    }
    var cb = askState.callback;
    closeAsk();
    if (cb) cb(value);
  });

  $("ask-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("ask-ok").click();
  });


  // ---------------- Tabs ----------------
  var VIEW_INIT = {
    catalog: initCatalogView,
    customers: initCustomersView,
    enquiries: initEnquiriesView,
    quotations: initQuotationsView,
    quote: initQuoteView,
    compressor: initCompressorView,
    orders: initOrdersView,
    inventory: initInventoryView,
    dispatch: initDispatchView,
    collections: initCollectionsView,
    dashboard: initDashboardView,
    settings: initSettingsView
  };

  function closeNavMenus() {
    document.querySelectorAll(".nav-menu").forEach(function (m) { m.classList.remove("show"); });
    document.querySelectorAll(".tab-btn.open").forEach(function (b) { b.classList.remove("open"); });
  }

  function goToTab(view) {
    closeNavMenus();
    clearMsg();

    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    $("view-" + view).classList.add("active");

    // A group heading lights up when the screen you are on lives inside it.
    document.querySelectorAll("#tabs .tab-btn").forEach(function (b) {
      var owns = (b.dataset.views || "").split(",").indexOf(view) !== -1;
      b.classList.toggle("active", owns);
    });
    document.querySelectorAll(".nav-menu button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === view);
    });

    if (VIEW_INIT[view]) VIEW_INIT[view]();
  }

  function renderTabs() {
    var role = currentUser.role;
    var html = "";

    NAV.forEach(function (group, gi) {
      if (!group.children) {
        if (group.roles.indexOf(role) === -1) return;
        html += '<button class="tab-btn" data-view="' + group.view +
          '" data-views="' + group.view + '">' + escapeHtml(group.label) + "</button>";
        return;
      }

      var kids = group.children.filter(function (c) { return c.roles.indexOf(role) !== -1; });
      if (!kids.length) return;

      // One child left after role filtering — show it directly rather than a menu of one.
      if (kids.length === 1) {
        html += '<button class="tab-btn" data-view="' + kids[0].view +
          '" data-views="' + kids[0].view + '">' + escapeHtml(kids[0].label) + "</button>";
        return;
      }

      html += '<div class="nav-group">' +
        '<button class="tab-btn" data-group="' + gi + '" data-views="' +
          kids.map(function (c) { return c.view; }).join(",") + '">' +
          escapeHtml(group.label) + '<span class="tab-caret">&#9662;</span></button>' +
        '<div class="nav-menu" data-menu="' + gi + '">' +
          kids.map(function (c) {
            return '<button data-view="' + c.view + '">' + escapeHtml(c.label) + "</button>";
          }).join("") +
        "</div></div>";
    });

    $("tabs").innerHTML = html;

    $("tabs").querySelectorAll("[data-group]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var menu = $("tabs").querySelector('[data-menu="' + btn.dataset.group + '"]');
        var wasOpen = menu.classList.contains("show");
        closeNavMenus();
        if (!wasOpen) { menu.classList.add("show"); btn.classList.add("open"); }
      });
    });

    $("tabs").querySelectorAll("[data-view]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        goToTab(btn.dataset.view);
      });
    });

    var visible = visibleLeaves();
    if (visible.length) goToTab(visible[0].view);
  }

  // A menu left hanging open over the page is the classic half-finished dropdown.
  document.addEventListener("click", closeNavMenus);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeNavMenus();
  });

  // ================= CATALOG (Parts + Units) =================
  var CATALOG_MODE = "spares";
  var sparesCache = [];
  var productsCache = [];
  var compareSelection = new Set();
  var catalogLoaded = { spares: false, products: false };

  // Columns are built per render because the PIE (cost) column only exists for roles
  // allowed to see cost data — the server omits the field for everyone else.
  function catalogColumns() {
    var cost = canSeeCost();
    if (CATALOG_MODE === "spares") {
      return [
        { key: "partNo", label: "Part No.", cls: "mono" },
        { key: "hsnCode", label: "HSN", cls: "mono" },
        { key: "description", label: "Description" },
        { key: "category", label: "Category" },
        { key: "uom", label: "UoM" }
      ].concat(cost ? [{ key: "piePrice", label: "PIE Price", num: true, money: true }] : [])
       .concat([
        { key: "price", label: "Price", num: true, money: true },
        { key: "altSummary", label: "Alternate" },
        { key: "onHand", label: "On Hand", num: true },
        { key: "reserved", label: "Reserved", num: true },
        { key: "available", label: "Available", num: true }
      ]);
    }
    return [
      { key: "productCode", label: "Product Code", cls: "mono" },
      { key: "hsnCode", label: "HSN", cls: "mono" },
      { key: "model", label: "Model" },
      { key: "family", label: "Family" },
      { key: "hpRating", label: "HP" },
      { key: "workingPressure", label: "Pressure" },
      { key: "fad", label: "FAD" }
    ].concat(cost ? [{ key: "piePrice", label: "PIE Price", num: true, money: true }] : [])
     .concat([
      { key: "price", label: "Price", num: true, money: true },
      { key: "leadTimeDays", label: "Lead Time (days)", num: true },
      { key: "available", label: "Available", num: true }
    ]);
  }

  // PIE is cost data, restricted to Management and ERP Admin (FR-062).
  function canSeeCost() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  function currentCatalogRows() { return CATALOG_MODE === "spares" ? sparesCache : productsCache; }
  function catalogSearchKeys() {
    return CATALOG_MODE === "spares" ? ["partNo", "description", "category"] : ["productCode", "model", "family"];
  }
  // Cheapest linked alternate part's own List price, or null when there is none priced.
  function bestAlternate(r) {
    var rates = (r.alternates || []).map(function (a) { return a.altRate; }).filter(Boolean);
    return rates.length ? Math.min.apply(null, rates) : null;
  }

  // Best of List / Special / the cheapest linked alternate part.
  function bestRate(r) {
    var candidates = [];
    if (r.price) candidates.push(r.price);
    (r.alternates || []).forEach(function (a) { if (a.altRate) candidates.push(a.altRate); });
    return candidates.length ? Math.min.apply(null, candidates) : 0;
  }

  function initCatalogView() {
    $("btn-new-catalog-item").style.display = canEditCatalog() ? "inline-flex" : "none";
    $("btn-bulk-upload").style.display = canEditCatalog() ? "inline-flex" : "none";
    switchCatalogMode(CATALOG_MODE);
  }

  function switchCatalogMode(mode) {
    CATALOG_MODE = mode;
    $("bulk-upload-panel").style.display = "none";
    compareSelection = new Set();
    $("compare-strip-zone").innerHTML = "";
    $("catalog-search").value = "";
    $("subtab-parts").className = "btn btn-sm" + (mode === "spares" ? " btn-primary" : "");
    $("subtab-units").className = "btn btn-sm" + (mode === "products" ? " btn-primary" : "");
    loadCatalog();
  }

  function loadCatalog() {
    if (CATALOG_MODE === "spares") {
      if (catalogLoaded.spares) { renderCatalogTable(); return; }
      google.script.run.withSuccessHandler(function (rows) {
        sparesCache = rows.map(decorateSpare); catalogLoaded.spares = true; renderCatalogTable();
      }).withFailureHandler(onServerError).listSpares();
    } else {
      if (catalogLoaded.products) { renderCatalogTable(); return; }
      google.script.run.withSuccessHandler(function (rows) {
        productsCache = rows; catalogLoaded.products = true; renderCatalogTable();
      }).withFailureHandler(onServerError).listProducts();
    }
  }

  // Flattens the alternates array into one readable cell for the table.
  function decorateSpare(s) {
    var alts = s.alternates || [];
    s.altSummary = alts.length
      ? alts.map(function (a) { return a.altPartNo || a.alternateSpareId; }).join(", ")
      : "";
    return s;
  }

  function renderCatalogTable() {
    var rows = currentCatalogRows();
    var q = ($("catalog-search").value || "").toLowerCase();
    var cols = catalogColumns();
    var keys = catalogSearchKeys();
    var filtered = rows.filter(function (r) {
      return keys.some(function (k) { return String(r[k] || "").toLowerCase().indexOf(q) !== -1; });
    });

    $("catalog-thead").innerHTML = "<tr><th class=\"checkbox-cell\"></th>" +
      cols.map(function (c) { return "<th" + (c.num ? ' class="num"' : "") + ">" + c.label + "</th>"; }).join("") +
      "<th></th></tr>";

    if (filtered.length === 0) {
      $("catalog-tbody").innerHTML = '<tr><td colspan="' + (cols.length + 2) + '"><div class="empty">No items match your search.</div></td></tr>';
      return;
    }

    var isManager = canEditCatalog();
    $("catalog-tbody").innerHTML = filtered.map(function (r) {
      var cells = cols.map(function (c) {
        var v = r[c.key];
        var display = c.money ? (v ? fmt(v) : "—") : (v === undefined || v === null || v === "" ? "—" : escapeHtml(v));
        return "<td" + (c.num ? ' class="num mono"' : "") + ">" + display + "</td>";
      }).join("");
      return "<tr>" +
        '<td class="checkbox-cell"><input type="checkbox" data-compare="' + r.id + '" ' + (compareSelection.has(r.id) ? "checked" : "") + " /></td>" +
        cells +
        '<td class="center">' + (isManager ? '<button class="btn-ghost" data-edit="' + r.id + '" title="Edit">✎</button>' : "") + "</td>" +
        "</tr>";
    }).join("");

    $("catalog-tbody").querySelectorAll("[data-compare]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        if (cb.checked) compareSelection.add(cb.dataset.compare); else compareSelection.delete(cb.dataset.compare);
      });
    });
    $("catalog-tbody").querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () { openCatalogModal(btn.dataset.edit); });
    });
  }

  $("catalog-search").addEventListener("input", renderCatalogTable);
  $("subtab-parts").addEventListener("click", function () { switchCatalogMode("spares"); });
  $("subtab-units").addEventListener("click", function () { switchCatalogMode("products"); });

  $("btn-compare-selected").addEventListener("click", function () {
    var zone = $("compare-strip-zone");
    if (compareSelection.size < 2) {
      zone.innerHTML = '<div class="compare-strip">Select at least two rows (checkbox on the left) to compare their rates.</div>';
      return;
    }
    var rows = currentCatalogRows().filter(function (r) { return compareSelection.has(r.id); });
    var cheapest = Math.min.apply(null, rows.map(bestRate));
    var nameKey = CATALOG_MODE === "spares" ? "partNo" : "productCode";
    var descKey = CATALOG_MODE === "spares" ? "description" : "model";
    zone.innerHTML = '<div class="compare-strip"><div class="card-title" style="margin-bottom:12px;">Rate Comparison — ' + rows.length + " selected</div>" +
      "<table><thead><tr><th>" + (CATALOG_MODE === "spares" ? "Part No." : "Product Code") + "</th><th>Description</th><th class=\"num\">Price</th>" +
      (CATALOG_MODE === "spares" ? '<th class="num">Alternate</th>' : "") +
      '<th class="num">Best Rate</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var best = bestRate(r);
        var isBest = best === cheapest;
        return "<tr><td class=\"mono\">" + escapeHtml(r[nameKey]) + "</td><td>" + escapeHtml(r[descKey]) + "</td>" +
          '<td class="num mono">' + (r.price ? fmt(r.price) : "—") + "</td>" +
          (CATALOG_MODE === "spares" ? '<td class="num mono">' + (bestAlternate(r) ? fmt(bestAlternate(r)) : "—") + "</td>" : "") +
          '<td class="num mono" style="font-weight:700; color:' + (isBest ? "var(--green)" : "var(--navy)") + ';">' + fmt(best) + (isBest ? " ★" : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  });

  $("btn-new-catalog-item").addEventListener("click", function () { openCatalogModal(null); });
  function openCatalogModal(id) {
    if (CATALOG_MODE === "spares") openSpareModal(id); else openProductModal(id);
  }


  // ---- Bulk upload ----
  var bulkCsvText = null;

  function bulkItemType() { return CATALOG_MODE === "spares" ? "Spare" : "Product"; }

  $("btn-bulk-upload").addEventListener("click", function () {
    $("bulk-upload-panel").style.display = "";
    $("bulk-target").textContent = CATALOG_MODE === "spares" ? "Spares" : "Products (Compressors)";
    $("bulk-key").textContent = CATALOG_MODE === "spares" ? "Part No." : "Product Code";
    resetBulkState();
    google.script.run.withSuccessHandler(function (tpl) {
      $("bulk-template").value = tpl.header + "\n" + tpl.example;
      $("bulk-required").textContent = "Required columns: " + tpl.required.join(", ") +
        ". Any other column may be left blank. Prices are optional — leave them out and " +
        "existing prices are untouched.";
    }).withFailureHandler(onServerError).getImportTemplate(bulkItemType());
  });

  $("btn-bulk-close").addEventListener("click", function () {
    $("bulk-upload-panel").style.display = "none";
    resetBulkState();
  });

  function resetBulkState() {
    bulkCsvText = null;
    $("bulk-file").value = "";
    $("bulk-preview").innerHTML = "";
    $("btn-bulk-commit").disabled = true;
  }

  $("bulk-file").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    $("bulk-preview").innerHTML = '<div class="empty" style="padding:12px;">Reading file…</div>';
    var reader = new FileReader();
    reader.onload = function () {
      bulkCsvText = reader.result;
      $("bulk-preview").innerHTML = '<div class="empty" style="padding:12px;">Checking what would change…</div>';
      google.script.run.withSuccessHandler(renderBulkPreview)
        .withFailureHandler(function (err) {
          $("bulk-preview").innerHTML = "";
          $("btn-bulk-commit").disabled = true;
          onServerError(err);
        })
        .previewCatalogImport(bulkItemType(), bulkCsvText);
    };
    reader.onerror = function () { showMsg("Could not read that file.", "error"); };
    reader.readAsText(file);
  });

  function renderBulkPreview(p) {
    var willWrite = p.newCount + p.updateCount;
    var summary = '<div class="grid grid-4" style="margin-bottom:12px;">' +
      bulkStat("New items", p.newCount, "var(--green)") +
      bulkStat("Updated", p.updateCount, "var(--navy)") +
      bulkStat("Price revisions", p.priceChangeCount, "var(--amber-dark)") +
      bulkStat("Skipped", p.skippedCount, p.skippedCount ? "var(--red)" : "var(--steel)") +
      "</div>";

    var problems = "";
    if (p.skippedCount) {
      problems = '<div class="card-title" style="margin-bottom:6px;">Rows that will be skipped</div>' +
        '<table><thead><tr><th>Line</th><th>Code</th><th>Why</th></tr></thead><tbody>' +
        p.skipped.map(function (sk) {
          return "<tr><td>" + sk.line + '</td><td class="mono">' + escapeHtml(sk.code || "—") +
            "</td><td>" + escapeHtml(sk.reason) + "</td></tr>";
        }).join("") + "</tbody></table>" +
        (p.skippedTruncated ? '<p style="font-size:11.5px; color:var(--ink-soft);">Showing the first 50.</p>' : "");
    }

    var sample = "";
    if (p.sample.length) {
      sample = '<div class="card-title" style="margin:14px 0 6px;">First few changes</div>' +
        '<table><thead><tr><th>Action</th><th>Code</th><th>Description</th></tr></thead><tbody>' +
        p.sample.map(function (r) {
          return "<tr><td>" + (r.action === "new"
            ? '<span class="badge badge-won">New</span>'
            : '<span class="badge badge-quoted">Update</span>') +
            '</td><td class="mono">' + escapeHtml(r.code) + "</td><td>" + escapeHtml(r.description) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }

    $("bulk-preview").innerHTML = summary + sample + problems;
    $("btn-bulk-commit").disabled = willWrite === 0;
    if (!willWrite) showMsg("Nothing in that file would change anything.", "error");
  }

  function bulkStat(label, value, color) {
    return '<div class="kpi-card" style="padding:10px 12px;"><div class="kpi-label">' + label +
      '</div><div class="kpi-value" style="font-size:20px; color:' + color + ';">' + value + "</div></div>";
  }

  $("btn-bulk-commit").addEventListener("click", function () {
    if (!bulkCsvText) return;
    var type = bulkItemType();
    askDialog({
      title: "Apply this import?",
      message: "This writes to the catalog and creates price revisions where prices changed. " +
        "Existing items are updated in place; nothing is deleted.",
      okLabel: "Apply Import"
    }, function (ok) {
      if (ok === null) return;
      $("btn-bulk-commit").disabled = true;

  var customersCache = [];

  var configLists = null;

  function initCustomersView() {
    $("btn-new-customer").style.display = canEditCustomers() ? "inline-flex" : "none";
    // Bulk upload writes to the master, so it sits with the other master-data privileges.
    $("btn-customer-bulk").style.display = canEditCatalog() ? "inline-flex" : "none";
    if (!configLists) loadConfigLists();
    if (customersLoaded) { renderCustomers(); return; }
    loadCustomers();
  }

  /** Refetches the customer list, bypassing the cache flag — used after a bulk import. */
  function loadCustomers() {
    google.script.run.withSuccessHandler(function (rows) {
      customersCache = rows; customersLoaded = true; renderCustomers();
    }).withFailureHandler(onServerError).listCustomers();
  }

  $("btn-customer-bulk").addEventListener("click", function () { openImportModal("Customer"); });

  function canEditCustomers() {
    return ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }
  function canEditCommercials() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  function loadConfigLists() {
    google.script.run.withSuccessHandler(function (lists) {
      configLists = lists;
      fillDatalist("industry-list", (lists.Industry || []).map(function (i) { return i.label; }));
      fillDatalist("paymentterms-list", (lists.PaymentTerms || []).map(function (i) { return i.label; }));
    }).withFailureHandler(function () { configLists = {}; }).getConfigLists();

    google.script.run.withSuccessHandler(function (users) {
      fillDatalist("users-list", users.map(function (u) { return u.email; }));
    }).withFailureHandler(function () {}).listActiveUsers();
  }

  function fillDatalist(id, values) {
    $(id).innerHTML = values.map(function (v) { return '<option value="' + escapeHtml(v) + '">'; }).join("");
  }

  function renderCustomers() {
    var q = ($("customer-search").value || "").toLowerCase();
    var rows = customersCache.filter(function (c) {
      var hay = [c.customerCode, c.name, c.gstin, c.assignedSalesperson, c.territory,
        (c.addresses[0] || {}).city].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    var tbody = $("customers-tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty">' +
        (customersCache.length ? "No customers match your search." : "No customers yet — add the first one.") +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (c) {
      var addr = c.addresses.filter(function (a) { return String(a.isDefault).toUpperCase() === "TRUE"; })[0] || c.addresses[0] || {};
      var contact = c.primaryContact || {};
      return "<tr>" +
        '<td class="mono">' + escapeHtml(c.customerCode || "—") + "</td>" +
        "<td>" + escapeHtml(c.name) + "</td>" +
        '<td class="mono">' + escapeHtml(c.gstin || "—") + "</td>" +
        "<td>" + escapeHtml(addr.city || "—") + "</td>" +
        "<td>" + (contact.name ? escapeHtml(contact.name) + (contact.phone ? " · " + escapeHtml(contact.phone) : "") : "—") + "</td>" +
        "<td>" + escapeHtml(c.assignedSalesperson || "—") + "</td>" +
        '<td class="num mono">' + (c.creditLimit === "" || c.creditLimit === null ? "—" : fmt(c.creditLimit)) + "</td>" +
        '<td class="num">' + (c.creditDays === "" || c.creditDays === null ? "—" : c.creditDays) + "</td>" +
        '<td class="center"><button class="btn-ghost" data-edit-cust="' + c.id + '" title="Open">✎</button></td>' +
        "</tr>";
    }).join("");

    tbody.querySelectorAll("[data-edit-cust]").forEach(function (btn) {
      btn.addEventListener("click", function () { openCustomerModal(btn.dataset.editCust); });
    });
  }

  $("customer-search").addEventListener("input", renderCustomers);

  $("btn-cancel-customer").addEventListener("click", function () {
    $("customer-modal-backdrop").classList.remove("show");

  function renderContacts(c) {
    var zone = $("cm-contacts");
    if (!c) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">Save the customer first, then add contacts.</div>';
      $("btn-add-contact").disabled = true;
      return;
    }
    $("btn-add-contact").disabled = !canEditCustomers();
    if (!c.contacts.length) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">No contacts yet.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Email</th><th>Primary</th><th></th></tr></thead><tbody>' +
      c.contacts.map(function (x) {
        return "<tr>" +
          "<td>" + escapeHtml(x.name) + "</td>" +
          "<td>" + escapeHtml(x.contactRole || "—") + "</td>" +
          "<td>" + escapeHtml(x.phone || "—") + "</td>" +
          "<td>" + escapeHtml(x.email || "—") + "</td>" +
          "<td>" + (String(x.isPrimary).toUpperCase() === "TRUE" ? '<span class="badge badge-active">Primary</span>' : "") + "</td>" +
          '<td class="center" style="white-space:nowrap;">' +
            '<button class="btn-ghost" data-edit-contact="' + x.id + '" title="Edit">✎</button>' +

          "</tr>";

    zone.querySelectorAll("[data-edit-contact]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        showContactForm(c.contacts.find(function (x) { return x.id === btn.dataset.editContact; }));
      });
    });
    zone.querySelectorAll("[data-del-contact]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({
          title: "Remove this contact?", okLabel: "Remove", danger: true
        }, function (ok) {
          if (ok === null) return;
          google.script.run.withSuccessHandler(function () {
            reloadCustomersKeepingModal();
            showMsg("Contact removed.", "success");
          }).withFailureHandler(onServerError).deleteCustomerContact(btn.dataset.delContact);
        });
      });
    });
  }

  function renderAddresses(c) {

  /** Refreshes the cache and re-renders the open modal, so nested edits appear immediately. */
  function reloadCustomersKeepingModal() {
    var openId = $("cm-id").value;
    google.script.run.withSuccessHandler(function (rows) {
      customersCache = rows;
      renderCustomers();
      if (openId) {
        var c = customersCache.find(function (x) { return x.id === openId; });
        renderContacts(c);
        renderAddresses(c);
      }
    }).withFailureHandler(onServerError).listCustomers();

  $("btn-save-customer").addEventListener("click", function () {
    var obj = {
      id: $("cm-id").value || null,
      name: $("cm-name").value.trim(),
      legalName: $("cm-legalname").value.trim(),
      gstin: $("cm-gstin").value.trim(),
      pan: $("cm-pan").value.trim(),
      industry: $("cm-industry").value.trim(),
      territory: $("cm-territory").value.trim(),
      assignedSalesperson: $("cm-salesperson").value.trim(),
      notes: $("cm-notes").value.trim(),
      paymentTerms: $("cm-paymentterms").value.trim(),
      creditLimit: $("cm-creditlimit").value,
      creditDays: $("cm-creditdays").value,
      riskStatus: $("cm-riskstatus").value
    };
    if (!obj.name) { showMsg("Customer name is required.", "error"); return; }

    // Advisory duplicate check first — a GSTIN clash is refused server-side regardless.
    google.script.run.withSuccessHandler(function (dupes) {
      var advisory = dupes.filter(function (d) { return !d.blocking; });
      if (advisory.length && !$("cm-id").value) {
        var names = advisory.map(function (d) { return "• " + d.name + " (" + d.reasons + ")"; }).join("\n");
        askDialog({
          title: "This customer may already exist",
          message: names + "\n\nCreate a new record anyway?",
          okLabel: "Create anyway"
        }, function (ok) {
          if (ok === null) return;
          commitCustomer(obj);
        });
        return;
      }
      commitCustomer(obj);
    }).withFailureHandler(function () { commitCustomer(obj); })
      .findDuplicateCustomers(obj, $("cm-id").value || null);
  });

  function commitCustomer(obj) {
    google.script.run.withSuccessHandler(function (saved) {
      customersLoaded = false;
      google.script.run.withSuccessHandler(function (rows) {
        customersCache = rows; customersLoaded = true; renderCustomers();
        // Stay open on a new record so contacts/addresses can be added straight away.
        $("cm-id").value = saved.id;
        $("customer-modal-title").textContent = "Edit Customer";
        $("cm-code").textContent = saved.customerCode || "";
        var c = customersCache.find(function (x) { return x.id === saved.id; });
        renderContacts(c);
        renderAddresses(c);
        showMsg("Customer " + saved.name + " saved.", "success");
      }).withFailureHandler(onServerError).listCustomers();
    }).withFailureHandler(onServerError).saveCustomer(obj);
  }

          "<td>" + (r.compatibilityConfirmed

          '<td class="num mono">' + (r.price ? fmt(r.price) : "—") + "</td>" +

  /**

  function renderQuoteBuilder() {
    var q = openQuote;
    if (!q) { renderQuoteEmpty(); return; }

    $("qb-empty").style.display = "none";
    $("qb-body").style.display = "";
    $("qb-title").textContent = q.quoteNo + " " + (q.revision || "R0");
    $("qb-subtitle").textContent = q.customerName + (q.machineModel ? " · " + q.machineModel : "");

    // A locked quotation is read-only by design: it is what the customer received.
    var editable = canEditQuotes() && !q.locked;
    $("qb-locked-banner").innerHTML = q.locked
      ? '<div class="compare-strip" style="margin-bottom:16px;">This quotation is <b>' +
        escapeHtml(q.status) + '</b> and locked. Use <b>Revise</b> to create the next revision — ' +
        'the version already sent stays untouched.</div>'
      : "";

    $("qb-customer").value = q.customerName || "";
    $("qb-gstin").value = q.customerGstin || "";
    $("qb-model").value = q.machineModel || "";
    $("qb-serial").value = q.serialNo || "";
    $("qb-date").value = q.date || "";
    $("qb-validity").value = q.validityDays || 7;
    $("qb-validuntil").value = q.validUntil || "";
    $("qb-paymentterms").value = q.paymentTerms || "";
    $("qb-deliveryterms").value = q.deliveryTerms || "";
    $("qb-warrantyterms").value = q.warrantyTerms || "";
    $("qb-notes").value = q.notes || "";
    $("qb-pkgdisc").value = Number(q.packageDiscountPct) || 0;
    $("qb-pf").value = Number(q.pfAmount) || 0;
    $("qb-taxmode").value = q.taxMode || "Extra";

    ["qb-model", "qb-serial", "qb-date", "qb-validity", "qb-paymentterms",
     "qb-deliveryterms", "qb-warrantyterms", "qb-notes",
     "qb-pkgdisc", "qb-pf", "qb-taxmode"].forEach(function (f) {
      $(f).disabled = !editable;
    });
    $("btn-qb-save-header").style.display = editable ? "" : "none";
    $("btn-qb-add-item").style.display = editable ? "" : "none";
    if (!editable) $("qb-add-panel").style.display = "none";

    renderQuoteActions(q, editable);
    renderQuoteItems(q, editable);
    renderQuoteTotals(q);
  }

  function renderQuoteActions(q, editable) {
    var zone = $("qb-actions");
    var buttons = [];
    // Available at every status, locked included: a sent quotation is exactly the one most
    // often reprinted.
    buttons.push('<button class="btn btn-sm" id="btn-qb-print">Print / PDF</button>');
    if (editable && q.status === "Draft") {
      buttons.push('<button class="btn btn-sm" data-qs="Approved">Mark Approved</button>');
    }
    if (editable && ["Draft", "Approved"].indexOf(q.status) !== -1) {
      buttons.push('<button class="btn btn-sm btn-primary" data-qs="Submitted">Mark Submitted</button>');
    }
    if (q.locked && ["Won", "Lost"].indexOf(q.status) === -1) {
      buttons.push('<button class="btn btn-sm" data-qs="Won">Mark Won</button>');
      buttons.push('<button class="btn btn-sm" data-qs="Lost">Mark Lost</button>');
    }
    if (canEditQuotes() && q.locked) {
      buttons.push('<button class="btn btn-sm btn-amber" id="btn-qb-revise">Revise</button>');
    }
    zone.innerHTML = buttons.join("");

    zone.querySelectorAll("[data-qs]").forEach(function (btn) {
      btn.addEventListener("click", function () { changeQuoteStatus(btn.dataset.qs); });
    });
    $("btn-qb-print").addEventListener("click", openQuoteDocument);
    if ($("btn-qb-revise")) {
      $("btn-qb-revise").addEventListener("click", function () {
        askDialog({
          title: "Create the next revision?",
          message: "The current version is kept exactly as it is and marked Revised. " +
            "A copy opens for editing as the next revision.",
          okLabel: "Revise"
        }, function (ok) {
          if (ok === null) return;

  function changeQuoteStatus(status) {
    if (status !== "Lost") { applyQuoteStatus(status, ""); return; }

    // A lost quotation must record why, so lost-order analysis has something to work with.
    if (!lostReasonsCache.length) {
      showMsg("No lost reasons are configured yet — add them on the LostReasons tab.", "error");
      return;
    }
    askDialog({
      title: "Mark this quotation Lost?",
      message: "The reason feeds lost-order analysis.",
      options: lostReasonsCache.map(function (r) { return { value: r.id, label: r.reasonText }; }),
      optionsLabel: "Lost reason",
      okLabel: "Mark Lost",
      danger: true
    }, function (reasonId) {
      if (reasonId === null) return;
      applyQuoteStatus("Lost", reasonId);
    });
  }

  function applyQuoteStatus(status, reasonId) {
    google.script.run.withSuccessHandler(function (q) {

    }).withFailureHandler(onServerError).setQuotationStatus(openQuote.id, status, reasonId);

  /**
   * The same arithmetic the printed offer shows, so the screen and the document never
   * disagree. When GST is quoted as extra the total genuinely excludes it — the label has to
   * say so, or a coordinator reads a tax line and a total that does not contain it.
   */
  function renderQuoteTotals(q) {
    var taxExtra = (q.taxMode || "Extra") === "Extra";
    var pkg = Number(q.packageDiscountPct) || 0;
    var rows = [
      ["Total package price", fmt(q.subtotal), ""]
    ];
    if (Number(q.discountAmt) > 0) {
      rows.push([pkg > 0 ? "Discount (incl. " + pkg + "% package)" : "Discount",
                 "− " + fmt(q.discountAmt), ""]);
    }
    if (Number(q.pfAmount) > 0) rows.push(["P&F", fmt(q.pfAmount), ""]);
    if (Number(q.freight) > 0) rows.push(["Freight", fmt(q.freight), ""]);
    rows.push([taxExtra ? "GST (charged extra)" : "GST", fmt(q.taxAmt), ""]);
    rows.push([taxExtra ? "Grand Total (before GST)" : "Grand Total", fmt(q.grand), "grand"]);

    $("qb-totals").innerHTML = rows.map(function (r) {
      return '<div class="totals-row ' + r[2] + '"><span>' + r[0] +
        '</span><span class="mono">' + r[1] + "</span></div>";
    }).join("");
  }

  function openQuoteDocument() {

    $("qd-sub").textContent = "Loading " + openQuote.quoteNo + " " + (openQuote.revision || "R0") + "…";

      $("qd-sub").textContent = openQuote.quoteNo + " " + (openQuote.revision || "R0") +
        " for " + openQuote.customerName +
        " — this is exactly what the PDF will contain.";
      $("btn-qd-pdf").disabled = false;
      $("btn-qd-print").disabled = false;

  function renderQuoteItemResults(rows, type) {
    var zone = $("qi-results");
    if (!rows.length) {
      zone.innerHTML = '<div class="empty" style="padding:12px;">Nothing matched.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>Code</th><th>Description</th>' +

      '<th class="num">Price</th><th class="num">Available</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        var code = type === "Spare" ? r.partNo : r.productCode;

        return "<tr>" +

          "<td>" + escapeHtml(desc) + "</td>" +

    zone.querySelectorAll("[data-add-line]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var r = rows.find(function (x) { return x.id === btn.dataset.addLine; });
        google.script.run.withSuccessHandler(function (nq) {
          openQuote = nq;
          renderQuoteBuilder();

          description: type === "Spare" ? r.description : (r.model || r.description),
          qty: Math.max(1, Number($("qi-qty").value) || 1),

        });

  // ================= COMPRESSOR SALES =================
  var CS_MODE = "leads";
  var leadsCache = [];
  var opportunitiesCache = [];
  var openOpportunity = null;

  var LEAD_BADGE = {
    "New": "badge-new", "Contacted": "badge-followup", "Qualified": "badge-quoted",
    "Converted": "badge-won", "Disqualified": "badge-lost"
  };
  var STAGE_BADGE = {
    "Requirement Identified": "badge-new", "Technical Discussion": "badge-followup",
    "Quotation": "badge-quoted", "Negotiation": "badge-sent", "PO Expected": "badge-active",
    "Won": "badge-won", "Lost": "badge-lost"
  };
  var STAGES = ["Requirement Identified", "Technical Discussion", "Quotation",
    "Negotiation", "PO Expected", "Won", "Lost"];

  function canEditLeads() {
    return ["Sales Engineer", "Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;

  function initCompressorView() {
    $("btn-new-lead").style.display = canEditLeads() ? "inline-flex" : "none";

    if (!configLists) loadConfigLists();
    ensureLeadFormData();

  function switchCsMode(mode) {
    CS_MODE = mode;
    $("subtab-leads").className = "btn btn-sm" + (mode === "leads" ? " btn-primary" : "");
    $("subtab-pipeline").className = "btn btn-sm" + (mode === "pipeline" ? " btn-primary" : "");
    $("cs-search").placeholder = mode === "leads"
      ? "Search by lead no., customer or requirement…"
      : "Search by opportunity no., customer or title…";
    $("pipeline-summary").style.display = mode === "pipeline" ? "" : "none";
    $("btn-new-lead").style.display = (mode === "leads" && canEditLeads()) ? "inline-flex" : "none";

  $("subtab-leads").addEventListener("click", function () { switchCsMode("leads"); });
  $("subtab-pipeline").addEventListener("click", function () { switchCsMode("pipeline"); });
  $("cs-search").addEventListener("input", renderCsRows);
  $("cs-mine").addEventListener("change", loadCsRows);
  $("cs-closed").addEventListener("change", loadCsRows);

  function loadCsRows() {
    var opts = { mineOnly: $("cs-mine").checked, includeClosed: $("cs-closed").checked };
    if (CS_MODE === "leads") {
      google.script.run.withSuccessHandler(function (rows) {
        leadsCache = rows; renderCsRows();
      }).withFailureHandler(onServerError).listLeads(opts);
    } else {
      google.script.run.withSuccessHandler(function (rows) {
        opportunitiesCache = rows; renderCsRows();
      }).withFailureHandler(onServerError).listOpportunities(opts);
    }
  }

  function renderCsRows() {
    if (CS_MODE === "leads") renderLeads(); else renderPipeline();
  }

  function renderLeads() {
    var q = ($("cs-search").value || "").toLowerCase();
    var rows = leadsCache.filter(function (l) {
      return [l.leadNo, l.customerName, l.requirementSummary, l.contactName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    $("cs-thead").innerHTML = "<tr><th>Lead No.</th><th>Date</th><th>Company</th><th>Wants</th>" +
      "<th>Source</th><th>Owner</th><th>Status</th><th>Next Action</th><th></th></tr>";

    if (!rows.length) {
      $("cs-tbody").innerHTML = '<tr><td colspan="9"><div class="empty">' +
        (leadsCache.length ? "No leads match your search." : "No open leads — log the first one.") +
        "</div></td></tr>";
      return;
    }

    $("cs-tbody").innerHTML = rows.map(function (l) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(l.leadNo || "—") + "</td>" +
        "<td>" + escapeHtml(l.date) + "</td>" +
        "<td>" + escapeHtml(l.customerName || "—") +
          (l.isProspect ? ' <span class="badge badge-new">prospect</span>' : "") + "</td>" +

        "<td>" + (l.requirementText

        "<td>" + escapeHtml(l.ownerEmail || "—") + "</td>" +

        "<td>" + (l.nextActionDate

          : "—") + "</td>" +

  function renderPipeline() {
    var q = ($("cs-search").value || "").toLowerCase();
    var rows = opportunitiesCache.filter(function (o) {
      return [o.opportunityNo, o.customerName, o.title].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    // Weighted pipeline by stage (FR-012) — what the funnel is actually worth.
    var open = rows.filter(function (o) { return ["Won", "Lost"].indexOf(o.stage) === -1; });
    var total = open.reduce(function (sum, o) { return sum + (Number(o.expectedValue) || 0); }, 0);
    var weighted = open.reduce(function (sum, o) { return sum + (Number(o.weightedValue) || 0); }, 0);
    var byStage = {};
    open.forEach(function (o) { byStage[o.stage] = (byStage[o.stage] || 0) + 1; });

    $("pipeline-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Open Opportunities</div><div class="kpi-value">' + open.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Pipeline Value</div><div class="kpi-value" style="font-size:20px;">' + fmt(total) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Weighted Pipeline</div><div class="kpi-value" style="font-size:20px;">' + fmt(weighted) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Needs Follow-up</div><div class="kpi-value" ' +
        'style="color:' + (open.filter(function (o) { return o.overdue; }).length ? "var(--red)" : "var(--navy)") + ';">' +
        open.filter(function (o) { return o.overdue; }).length + "</div></div>" +
      "</div>" +
      '<div class="compare-strip" style="margin-bottom:14px;">' +
        STAGES.filter(function (st) { return ["Won", "Lost"].indexOf(st) === -1; }).map(function (st) {
          return '<span class="badge ' + STAGE_BADGE[st] + '" style="margin-right:6px;">' +
            escapeHtml(st) + ": " + (byStage[st] || 0) + "</span>";
        }).join("") +
      "</div>";

    $("cs-thead").innerHTML = "<tr><th>Opp No.</th><th>Customer</th><th>Title</th><th>Stage</th>" +
      '<th class="num">Value</th><th class="num">Prob.</th><th class="num">Weighted</th>' +
      "<th>Expected Close</th><th>Next Action</th><th></th></tr>";

    if (!rows.length) {
      $("cs-tbody").innerHTML = '<tr><td colspan="10"><div class="empty">' +
        (opportunitiesCache.length ? "No opportunities match your search." : "No open opportunities — convert a qualified lead.") +
        "</div></td></tr>";
      return;
    }

    $("cs-tbody").innerHTML = rows.map(function (o) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(o.opportunityNo || "—") + "</td>" +
        "<td>" + escapeHtml(o.customerName || "—") + "</td>" +
        "<td>" + escapeHtml(o.title || "—") +
          (o.hasTechnicalRequirement ? "" : ' <span class="badge badge-overdue">No tech sheet</span>') + "</td>" +
        '<td><span class="badge ' + (STAGE_BADGE[o.stage] || "badge-draft") + '">' + escapeHtml(o.stage) + "</span></td>" +
        '<td class="num mono">' + (o.expectedValue ? fmt(o.expectedValue) : "—") + "</td>" +
        '<td class="num">' + o.probability + "%</td>" +
        '<td class="num mono">' + fmt(o.weightedValue) + "</td>" +
        "<td>" + escapeHtml(o.expectedCloseDate || "—") + "</td>" +
        "<td>" + (o.nextActionDate
          ? (o.overdue ? '<span class="badge badge-overdue">' + escapeHtml(o.nextActionDate) + "</span>" : escapeHtml(o.nextActionDate))
          : "—") + "</td>" +
        '<td class="center"><button class="btn-ghost" data-open-opp="' + o.id + '" title="Open">✎</button></td>' +
        "</tr>";
    }).join("");

    $("cs-tbody").querySelectorAll("[data-open-opp]").forEach(function (btn) {
      btn.addEventListener("click", function () { openOpportunityModal(btn.dataset.openOpp); });

    $("lead-modal-title").textContent = id ? "Lead" : "Log Lead";
    $("lm-no").textContent = l ? l.leadNo : "A lead number is assigned on save.";
    $("lm-id").value = id || "";

    $("lm-prospect").value = l ? (l.customerName || "") : "";
    fillLeadCustomerSelect(l ? l.customerId : "");

    $("lm-contact").value = l ? (l.contactName || "") : "";
    $("lm-phone").value = l ? (l.contactPhone || "") : "";
    $("lm-email").value = l ? (l.contactEmail || "") : "";
    $("lm-city").value = l ? (l.prospectCity || "") : "";

    leadReqs = l && l.requirements ? l.requirements.map(function (r) {
      return { compressorType: r.compressorType, quantity: r.quantity,
               capacityHint: r.capacityHint, notes: r.notes };
    }) : [];
    fillLeadTypeSelect();
    $("lm-req-qty").value = 1;
    $("lm-req-capacity").value = "";
    renderLeadReqs();
    $("lm-source").value = l ? (l.source || "") : "";
    $("lm-industry").value = l ? (l.industry || "") : "";
    $("lm-application").value = l ? (l.application || "") : "";
    $("lm-requirement").value = l ? (l.requirementSummary || "") : "";
    $("lm-urgency").value = l ? (l.urgency || "Normal") : "Normal";
    $("lm-budget").value = l && l.budget !== "" ? l.budget : "";
    $("lm-owner").value = l ? (l.ownerEmail || currentUser.email) : currentUser.email;
    $("lm-nextaction").value = l ? (l.nextActionDate || "") : "";
    $("lm-status").value = l ? l.status : "New";

    $("lm-lostreason").innerHTML = '<option value="">—</option>' +

    fillDatalist("industry-list", ((configLists || {}).Industry || []).map(function (i) { return i.label; }));

  /**
   * Both of the lead form's dropdowns are filled from caches another screen loads, so opening
   * the form before those arrive used to leave them empty with no explanation — and a
   * swallowed failure looked exactly the same as "nothing configured". These fill from
   * whatever is cached now, say plainly when there is nothing, and are called again when a
   * late load lands.
   */
  function fillLeadCustomerSelect(selectId) {
    var sel = $("lm-linkcustomer");
    var keep = selectId !== undefined ? selectId : sel.value;
    sel.innerHTML = '<option value="">No — new prospect</option>' +
      (customersCache.length
        ? customersCache.map(function (c) {
            return '<option value="' + c.id + '">' + escapeHtml(c.name) + "</option>";
          }).join("")
        : '<option value="" disabled>— no customers on file yet —</option>');
    if (keep) sel.value = keep;
  }

  function fillLeadTypeSelect() {
    var types = (configLists || {}).CompressorType || [];
    var sel = $("lm-req-type");
    var keep = sel.value;
    sel.innerHTML = types.length
      ? types.map(function (i) {
          return '<option value="' + escapeHtml(i.label) + '">' + escapeHtml(i.label) + "</option>";
        }).join("")
      : '<option value="">— none set up yet —</option>';
    if (keep) sel.value = keep;
    $("btn-lm-addreq").disabled = !types.length;
    $("lm-req-hint").textContent = types.length
      ? ""
      : "No compressor types are configured. An ERP Admin adds them under " +
        "Settings → Dropdown Lists, category CompressorType — or runs Setup, which seeds " +
        "Rotary Screw and Reciprocating (Piston).";
  }

  /** Fetches whatever the form needs and is missing, then refills. */
  function ensureLeadFormData() {
    if (!customersCache.length) {
      google.script.run.withSuccessHandler(function (rows) {
        customersCache = rows; customersLoaded = true;
        fillCustomerDatalist(); fillLeadCustomerSelect();
      }).withFailureHandler(onServerError).listCustomers();
    }
    if (!((configLists || {}).CompressorType || []).length) {
      google.script.run.withSuccessHandler(function (lists) {
        configLists = lists;
        fillLeadTypeSelect();
      }).withFailureHandler(onServerError).getConfigLists();
    }
    if (!lostReasonsCache.length) {
      google.script.run.withSuccessHandler(function (rows) {
        lostReasonsCache = rows;
      }).withFailureHandler(onServerError).listLostReasons();
    }
  }

  // ---- requirement lines, held client-side until the lead is saved ----
  var leadReqs = [];

  function renderLeadReqs() {
    if (!leadReqs.length) {
      $("lm-reqs").innerHTML = '<div class="empty" style="padding:14px;">Nothing added yet. ' +
        "A lead with no stated requirement is hard to quote later.</div>";
      return;
    }
    $("lm-reqs").innerHTML = '<div class="card" style="padding:0; overflow-x:auto;"><table>' +
      "<thead><tr><th>Compressor Type</th><th class=\"num\">Qty</th><th>Capacity / Pressure</th>" +
      "<th></th></tr></thead><tbody>" +
      leadReqs.map(function (r, i) {
        return "<tr><td>" + escapeHtml(r.compressorType) + "</td>" +
          '<td class="num mono">' + escapeHtml(r.quantity) + "</td>" +
          "<td>" + escapeHtml(r.capacityHint || "—") + "</td>" +
          '<td class="center"><button class="btn btn-sm btn-danger" data-delreq="' + i +
            '" type="button">Remove</button></td></tr>';
      }).join("") + "</tbody></table></div>";

    $("lm-reqs").querySelectorAll("[data-delreq]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        leadReqs.splice(Number(btn.dataset.delreq), 1);
        renderLeadReqs();
      });
    });
  }

  $("btn-lm-addreq").addEventListener("click", function () {
    var type = $("lm-req-type").value;
    if (!type) { showMsg("No compressor types configured. Add them in Settings.", "error"); return; }
    var qty = Number($("lm-req-qty").value);
    if (!(qty > 0)) { showMsg("Quantity must be at least 1.", "error"); return; }

    // Same type twice is a correction, not a second line — add the quantities instead.
    var existing = leadReqs.filter(function (r) { return r.compressorType === type; })[0];
    if (existing) existing.quantity = Number(existing.quantity) + qty;
    else leadReqs.push({ compressorType: type, quantity: qty,
                         capacityHint: $("lm-req-capacity").value.trim(), notes: "" });

    $("lm-req-qty").value = 1;
    $("lm-req-capacity").value = "";
    renderLeadReqs();
  });

  var ordersCache = [];

    "Draft": "badge-draft", "Approval Pending": "badge-pending", "Credit Hold": "badge-lost",
    "Material Pending": "badge-followup", "Ready for Dispatch": "badge-active",
    "Dispatched": "badge-dispatched", "Invoiced": "badge-quoted", "Closed": "badge-won"
  };

  function canEditOrders() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }
  function canReleaseCredit() {
    return ["Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
