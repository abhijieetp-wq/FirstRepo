          '<input type="date" id="ser-to" aria-label="To" /><span class="sdc-muted" id="ser-range"></span></div>' +
        '<div id="ser-kpis" class="amc-kpis"></div>' +
        '<div class="card" style="padding:0; overflow-x:auto;"><div id="ser-body"></div></div>' +
        '<p class="eb-note">Assigned counts the jobs whose visit day — or, with no day yet, the day the call came in — falls in the period. ' +
        "Days to attend runs from the call coming in to the engineer’s report.</p>";
      var after = $("view-engineers") || $("view-dashboard");
      after.parentNode.insertBefore(view, after.nextSibling);
    })();
  }

  function initEngineerReportView() {
    if (!FACE_V2) return;
    serLoad();
  }

  function serLoad() {
    var q = ser.period === "custom" ? { period: "custom", from: ser.from, to: ser.to } : { period: ser.period };
    srv.withSuccessHandler(function (d) {
      ser.data = d;
      ser.from = d.period.from;
      ser.to = d.period.to;
      serRender();
    }).withFailureHandler(onServerError).getServiceEngineerReport(q);
  }

  function serHours(n) { var x = Math.round(Number(n) * 10) / 10; return String(x); }

  /** The columns, as the table and the CSV both show them. */
  function serColumns(d) {
    var noArea = d.totals.noArea || d.totals.hoursNoArea;
    var cols = [
      ["Engineer", function (r) { return r.name; }],
      ["Assigned", function (r) { return r.assigned; }],
      ["Attended", function (r) { return r.attended; }],
      ["Closed", function (r) { return r.closed; }],
      ["Rescheduled", function (r) { return r.rescheduled; }],
      ["On calls", function (r) { return r.rescheduledJobs; }],
      ["Pending now", function (r) { return r.pending; }],
      ["Local", function (r) { return r.local; }],
      ["Outstation", function (r) { return r.outstation; }]
    ];
    if (noArea) cols.push(["No area", function (r) { return r.noArea; }]);
    cols = cols.concat([
      ["Hours local", function (r) { return serHours(r.hoursLocal); }],
      ["Hours outstation", function (r) { return serHours(r.hoursOutstation); }]
    ]);
    if (noArea) cols.push(["Hours, no area", function (r) { return serHours(r.hoursNoArea); }]);
    cols = cols.concat([
      ["Avg days to attend", function (r) { return r.daysToAttend === null ? "" : r.daysToAttend; }],
      ["AMC visits done", function (r) { return r.amcVisits; }],
      ["Spare enquiries", function (r) { return r.spareEnquiries; }]
    ]);
    if (d.money) cols.push(["Spare enquiries value", function (r) { return r.spareValue || 0; }]);
    cols.push(["Compressor leads", function (r) { return r.leads; }]);
    return cols;
  }

  function serRender() {
    var d = ser.data;
    if (!d || !$("view-engreport")) return;
    $("ser-period").innerHTML = d.periods.map(function (p) {
      return '<option value="' + p.key + '"' + (p.key === d.period.key ? " selected" : "") + ">" + escapeHtml(p.label) + "</option>";
    }).join("");
    var custom = d.period.key === "custom";
    $("ser-from").style.display = custom ? "" : "none";
    $("ser-to").style.display = custom ? "" : "none";
    $("ser-from").value = d.period.from;
    $("ser-to").value = d.period.to;
    $("ser-range").textContent = ebDate(d.period.from) + " to " + ebDate(d.period.to);
    var t = d.totals;
    $("ser-kpis").innerHTML = [
      ["Calls assigned", t.assigned, t.local + " local · " + t.outstation + " outstation" + (t.noArea ? " · " + t.noArea + " no area" : "")],
      ["Attended", t.attended, "report in · " + t.closed + " closed"],
      ["Reschedules", t.rescheduled, "on " + t.rescheduledJobs + (t.rescheduledJobs === 1 ? " call" : " calls")],
      ["Hours on site", serHours(t.hoursLocal + t.hoursOutstation + (t.hoursNoArea || 0)), serHours(t.hoursLocal) + " local · " + serHours(t.hoursOutstation) + " outstation"],
      ["Enquiries passed on", t.spareEnquiries + t.leads, t.spareEnquiries + " spares · " + t.leads + " compressor" + (d.money && t.spareValue ? " · " + fmtShort(t.spareValue) : "")]
    ].map(function (k) {
      return '<div class="pd-tile"><span class="pd-label">' + escapeHtml(k[0]) + '</span><span class="pd-value">' + escapeHtml(String(k[1])) +
        '</span><span class="pd-sub">' + escapeHtml(k[2]) + "</span></div>";
    }).join("");
    var cols = serColumns(d);
    $("ser-body").innerHTML = '<table class="tk-table"><thead><tr>' + cols.map(function (c, i) {
      return "<th" + (i ? ' class="num"' : "") + ">" + escapeHtml(c[0]) + "</th>";
    }).join("") + "</tr></thead><tbody>" + (d.rows.length ? d.rows.map(function (r) {
      return "<tr>" + cols.map(function (c, i) {
        var v = c[1](r);
        if (c[0] === "Spare enquiries value") v = v ? ebMoney(v) : "—";
        if (c[0] === "Avg days to attend" && v === "") v = "—";
        return i ? '<td class="num' + (c[0] === "Rescheduled" && r.rescheduled ? " sdc-late" : "") + '">' + escapeHtml(String(v)) + "</td>"
          : "<td><b>" + escapeHtml(String(v)) + "</b></td>";
      }).join("") + "</tr>";
    }).join("") : '<tr><td colspan="' + cols.length + '" class="empty">No service engineers in Users yet.</td></tr>') + "</tbody></table>";
  }

  /** A table as a CSV file, with ERP 1's cell rules (csvCell) and download (downloadText). */
  function csvFile(name, header, rows) {
    var lines = [header.map(csvCell).join(",")].concat(rows.map(function (r) { return r.map(csvCell).join(","); }));
    var done = downloadText(name, "﻿" + lines.join("\r\n") + "\r\n", "text/csv;charset=utf-8");
    showMsg(done ? name + " downloaded." : "The browser would not save the file.", done ? "success" : "error");
  }

  if (FACE_V2) {
    $("ser-period").addEventListener("change", function () { ser.period = $("ser-period").value; serLoad(); });
    ["ser-from", "ser-to"].forEach(function (id) {
      $(id).addEventListener("change", function () {
        if (!$("ser-from").value || !$("ser-to").value) return;
        ser.from = $("ser-from").value;
        ser.to = $("ser-to").value;
        serLoad();
      });
    });
    $("btn-ser-csv").addEventListener("click", function () {
      var d = ser.data;
      if (!d || !d.rows.length) { showMsg("There is nothing to download for this period.", "error"); return; }
      var cols = serColumns(d);
      csvFile("Service engineers " + d.period.from + " to " + d.period.to + ".csv", cols.map(function (c) { return c[0]; }),
        d.rows.map(function (r) { return cols.map(function (c) { return c[1](r); }); }));
    });
  }

  // ================= FORM FIELDS (2.0) =================
  // ERP 2's form builder (FormFields.gs): fields Management adds to a form without a code change.
  // Each shows on its form under "More details", is saved with the record, and is a list column
  // when ticked. The forms: spare enquiries, compressor leads, service jobs (and the log-a-call
  // form), customers, AMC contracts, visits and tasks. Only the 2.0 face; ERP 1's forms and
  // records are unchanged, since the values are kept apart.
  var xf = { defs: null, wait: null, vals: {}, at: {}, open: {}, edit: null, form: "enquiry" };
  var XF_TYPES = { text: "Text", number: "Number", date: "Date", select: "Dropdown", textarea: "Long text", checkbox: "Yes / no" };
  var XF_FRESH_MS = 60000;

  /** The fields of every form, fetched once; the builder fetches them afresh. */
  function xfDefs(then) {
    if (!FACE_V2) return;
    if (xf.defs) { then(xf.defs); return; }
    if (xf.wait) { xf.wait.push(then); return; }
    // The forms still work without their extra fields; asked again a minute after a failure,
    // not on every list drawn.
    if (xf.failedAt && Date.now() - xf.failedAt < XF_FRESH_MS) return;
    xf.wait = [then];
    srv.withSuccessHandler(function (d) {
      xf.defs = d && d.fields ? d : { forms: [], types: [], fields: {}, canEdit: false };
      xf.failedAt = 0;
      var w = xf.wait;
      xf.wait = null;
      w.forEach(function (f) { f(xf.defs); });
    }).withFailureHandler(function () { xf.wait = null; xf.failedAt = Date.now(); }).getFormFields();
  }
  function xfFields(form) { return xf.defs ? (xf.defs.fields[form] || []) : []; }

  /** Where each form's "More details" goes, the record it is about, and whether it is read-only. */
  var XF_HOSTS = [
    { key: "customer", form: "customer", backdrop: "customer-modal-backdrop", save: "btn-save-customer", id: function () { return $("cm-id").value; } },
    { key: "enquiry", form: "enquiry", backdrop: "enquiry-modal-backdrop", save: "btn-save-enquiry", id: function () { return $("em-id").value; } },
    { key: "lead", form: "lead", backdrop: "lead-modal-backdrop", save: "btn-save-lead", id: function () { return $("lm-id").value; } },
    { key: "service", form: "service", backdrop: "service-modal-backdrop", save: "btn-sj-save", id: function () { return $("sj-id").value; } },
    { key: "call", form: "service", backdrop: "breakdown-modal-backdrop", save: "btn-bd-save", id: function () { return ""; } },
    { key: "amc", form: "amc", backdrop: "amc-modal-backdrop", save: "btn-amc-save", id: function () { return (amc.open || {}).id || ""; } },
    { key: "visit", form: "visit", backdrop: "vp-modal-backdrop", save: "btn-vp-save", id: function () { return (vp.open || {}).id || ""; } },
    { key: "task", form: "task", backdrop: "tk-modal-backdrop", save: "btn-tk-save", id: function () { return (tk.open || {}).id || ""; } }
  ];

  if (FACE_V2) {
    XF_HOSTS.forEach(function (h) {
      var back = $(h.backdrop);
      var btn = $(h.save);
      if (!back || !btn || $("xf-host-" + h.key)) return;
      // Above the row the save button sits in: the window's last row.
      var foot = btn;
      while (foot.parentNode && foot.parentNode !== document.body && !foot.parentNode.classList.contains("modal")) foot = foot.parentNode;
      if (!foot.parentNode || foot.parentNode === document.body) foot = btn.parentNode;
      var host = document.createElement("section");
      host.className = "xf-sec";
      host.id = "xf-host-" + h.key;
      host.style.display = "none";
      foot.parentNode.insertBefore(host, foot);
      // Mounted as the window opens, whichever of the form's own buttons opened it.
      new MutationObserver(function () {
        var shown = back.classList.contains("show");
        var o = xf.open[h.key];
        if (shown && (!h.shown || !o || String(h.id() || "") !== String(o.id || ""))) xfMount(h);
        h.shown = shown;
      }).observe(back, { attributes: true, attributeFilter: ["class"] });
    });
  }

  function xfInput(key, f, val, ro) {
    var id = "xf-" + key + "-" + f.key;
    var v = val === undefined || val === null ? "" : String(val);
    var dis = ro ? " disabled" : "";
    var ctl;
    if (f.type === "select") {
      ctl = '<select id="' + id + '"' + dis + '><option value="">—</option>' + f.options.map(function (o) {
        return '<option value="' + escapeHtml(o) + '"' + (o === v ? " selected" : "") + ">" + escapeHtml(o) + "</option>";
      }).join("") + (v && f.options.indexOf(v) === -1 ? '<option value="' + escapeHtml(v) + '" selected>' + escapeHtml(v) + " (no longer listed)</option>" : "") + "</select>";
    } else if (f.type === "textarea") {
      ctl = '<textarea id="' + id + '" rows="2"' + dis + ">" + escapeHtml(v) + "</textarea>";
    } else if (f.type === "checkbox") {
      ctl = '<label class="xf-yes"><input type="checkbox" id="' + id + '"' + (v === "TRUE" ? " checked" : "") + dis + " /> Yes</label>";
    } else {
      ctl = '<input id="' + id + '" type="' + (f.type === "number" ? "number" : f.type === "date" ? "date" : "text") + '" value="' + escapeHtml(v) + '"' + dis + " />";
    }
    return '<div class="field' + (f.type === "textarea" ? " xf-wide" : "") + '" data-xf-field="' + escapeHtml(f.key) + '"><label for="' + id + '">' +
      escapeHtml(f.label) + (f.required ? " *" : "") + "</label>" + ctl + "</div>";
  }

  function xfMount(h) {
    var host = $("xf-host-" + h.key);
    if (!host) return;
    var btn = $(h.save);
    var o = { form: h.form, id: h.id() || "", ro: !btn || btn.disabled || btn.style.display === "none", values: {}, ready: false, pending: null };
    xf.open[h.key] = o;
    host.innerHTML = "";
    host.style.display = "none";
    xfDefs(function () {
      var fields = xfFields(h.form);
      if (!fields.length || xf.open[h.key] !== o) return;
      var draw = function (vals) {
        if (xf.open[h.key] !== o) return;
        o.values = vals || {};
        o.ready = true;
        host.innerHTML = '<div class="xf-h">More details</div><div class="xf-grid">' + fields.map(function (f) {
          return xfInput(h.key, f, o.values[f.key], o.ro);
        }).join("") + "</div>";
        host.style.display = "";
      };
      if (!o.id) { draw({}); return; }
      srv.withSuccessHandler(function (m) { draw((m || {})[o.id] || {}); }).withFailureHandler(function () {
        // Not drawn empty: saving blanks over values that could not be read would wipe them.
        if (xf.open[h.key] !== o) return;
        host.innerHTML = '<div class="xf-h">More details</div><p class="sdc-muted">These could not be loaded. Close and open the record again.</p>';
        host.style.display = "";
      }).getCustomValues(h.form, [o.id]);
    });
  }

  function xfCollect(key) {
    var o = xf.open[key];
    var out = {};
    xfFields(o.form).forEach(function (f) {
      var el = $("xf-" + key + "-" + f.key);
      if (!el) return;
      out[f.key] = f.type === "checkbox" ? (el.checked ? "TRUE" : "") : String(el.value).trim();
    });
    return out;
  }

  /**
   * Before a form's own save: a required field left empty stops it, so the record is not saved
   * without them. What was typed is kept for xfAfterSave.
   */
  function xfReady(key) {
    var o = xf.open[key];
    if (!FACE_V2 || !o || !o.ready || o.ro || !xfFields(o.form).length || !$("xf-host-" + key)) return true;
    var vals = xfCollect(key);
    var miss = [];
    var bad = "";
    xfFields(o.form).forEach(function (f) {
      var v = vals[f.key];
      if (!v) { if (f.required) miss.push(f); return; }
      if (f.type === "number" && !isFinite(Number(v)) && !bad) bad = "“" + f.label + "” is a number.";
    });
    if (miss.length || bad) {
      showMsg(miss.length ? "Fill in: " + miss.map(function (f) { return f.label; }).join(", ") + "." : bad, "error");
      var first = miss.length ? $("xf-" + key + "-" + miss[0].key) : null;
      if (first) first.focus();
      o.pending = null;
      return false;
    }
    o.pending = vals;
    return true;
  }

  /** After the form's own save: the record's extra fields, when any changed. */
  function xfAfterSave(key, id) {
    var o = xf.open[key];
    if (!o || !o.pending || !id) return;
    var vals = o.pending;
    o.pending = null;
    var same = Object.keys(vals).every(function (k) { return String(o.values[k] || "") === vals[k]; });
    o.id = String(id);
    if (same) return;
    srv.withSuccessHandler(function (saved) {
      o.values = saved || {};
      xfKeep(o.form, o.id, o.values);
      xfFillAll(o.form);
    }).withFailureHandler(function (err) {
      showMsg("Saved — but not its more details: " + String((err && err.message) || err).replace(/^Error:\s*/, ""), "error", true);
    }).saveCustomValues(o.form, o.id, vals);
  }

  // ---- List columns ----
  function xfKeep(form, id, vals) {
    (xf.vals[form] = xf.vals[form] || {})[id] = vals || {};
    (xf.at[form] = xf.at[form] || {})[id] = Date.now();
  }
  function xfCols(form) { return xfFields(form).filter(function (f) { return f.inList; }); }
  function xfShow(f, v) {
    if (v === undefined || v === null || v === "") return "";
    if (f.type === "checkbox") return v === "TRUE" ? "Yes" : "";
    if (f.type === "date") return ebDate(v);
    return String(v);
  }

  /** The values for these records, from what was fetched in the last minute or afresh. */
  function xfFetch(form, ids, then) {
    var now = Date.now();
    var at = xf.at[form] || {};
    var want = ids.filter(function (id) { return !(now - (at[id] || 0) < XF_FRESH_MS); });
    if (!want.length) { then(); return; }
    srv.withSuccessHandler(function (m) {
      want.forEach(function (id) { xfKeep(form, id, (m || {})[id] || {}); });
      then();
    }).withFailureHandler(function () { /* the columns stay blank */ }).getCustomValues(form, want);
  }

  function xfFillAll(form) {
    var cols = {};
    xfCols(form).forEach(function (f) { cols[f.key] = f; });
    var vals = xf.vals[form] || {};
    document.querySelectorAll('[data-xf-form="' + form + '"]').forEach(function (el) {
      var v = vals[el.dataset.xfId] || {};
      if (el.classList.contains("xf-line")) {
        el.textContent = xfCols(form).map(function (f) { var s = xfShow(f, v[f.key]); return s ? f.label + ": " + s : ""; }).filter(Boolean).join(" · ");
        el.style.display = el.textContent ? "" : "none";
        return;
      }
      var f = cols[el.dataset.xfKey];
      if (f) el.textContent = xfShow(f, v[f.key]);
    });
  }

  /**
   * A form's list-column fields, added to a table already drawn: a header each, a cell in every
   * row with a record. beforeLast keeps a row's Open button the last cell.
   */
  function xfTable(form, table, idOf, beforeLast) {
    if (!FACE_V2 || !table) return;
    xfDefs(function () {
      table.querySelectorAll(".xf-col").forEach(function (c) { c.parentNode.removeChild(c); });
      var cols = xfCols(form);
      if (!cols.length) return;
      var put = function (tr, cells) {
        var ref = beforeLast ? tr.lastElementChild : null;
        cells.forEach(function (c) { tr.insertBefore(c, ref); });
      };
      var head = table.querySelector("thead tr");
      if (head) put(head, cols.map(function (f) { var th = document.createElement("th"); th.className = "xf-col"; th.textContent = f.label; return th; }));
      var ids = [];
      table.querySelectorAll("tbody tr").forEach(function (tr) {
        var id = idOf(tr);
        if (!id) return;
        ids.push(id);
        put(tr, cols.map(function (f) {
          var td = document.createElement("td");
          td.className = "xf-col";
          td.dataset.xfForm = form;
          td.dataset.xfId = id;
          td.dataset.xfKey = f.key;
          return td;
        }));
      });
      xfFetch(form, ids, function () { xfFillAll(form); });
    });
  }
  function xfRowId(sel, attr) {
    return function (tr) { var el = tr.matches(sel) ? tr : tr.querySelector(sel); return el ? el.getAttribute(attr) : ""; };
  }

  /** On the enquiry board, the list-column fields are a line on the card. */
  function xfCards(root) {
    if (!FACE_V2 || !root) return;
    var FORMS = { SE: "enquiry", LD: "lead" };
    xfDefs(function () {
      var ids = {};
      root.querySelectorAll("[data-eb-card]").forEach(function (card) {
        var ref = String(card.dataset.ebCard).split(":");
        var form = FORMS[ref[0]];
        if (!form || !ref[1] || !xfCols(form).length || card.querySelector(".xf-line")) return;
        var line = document.createElement("span");
        line.className = "xf-line";
        line.style.display = "none";
        line.dataset.xfForm = form;
        line.dataset.xfId = ref[1];
        card.appendChild(line);
        (ids[form] = ids[form] || []).push(ref[1]);
      });
      Object.keys(ids).forEach(function (form) { xfFetch(form, ids[form], function () { xfFillAll(form); }); });
    });
  }

  // ---- The builder (Masters → Form fields) ----
  if (FACE_V2 && !$("view-formfields")) {
    (function () {
      var view = document.createElement("div");
      view.className = "view";
      view.id = "view-formfields";
      view.innerHTML = '<div class="page-head"><div><h2>Form fields</h2><p>Add your own fields to a form — text, a number, a date, a dropdown, ' +
        "long text or yes / no — without a change to the software. They appear on the form under More details, are kept with the record, " +
        "and can be a column in its list. Taking a field off keeps what was already entered.</p></div></div>" +
        '<div class="xf-builder"><nav class="xf-forms" id="xf-forms" aria-label="Forms"></nav><section class="pd-panel" id="xf-edit"></section></div>';
      var after = $("view-catalog") || $("view-customers");
      after.parentNode.insertBefore(view, after.nextSibling);

      $("xf-forms").addEventListener("click", function (e) {
        var b = e.target.closest("[data-xf-form-pick]");
        if (!b || b.dataset.xfFormPick === xf.form) return;
        var go = function () { xf.form = b.dataset.xfFormPick; xf.edit = null; xfBuild(); };
        if (xf.edit && xf.edit.dirty) {
          askDialog({ title: "Leave without saving?", message: "The changes to " + xfFormLabel(xf.form) + " are not saved yet.", okLabel: "Leave them" },
            function (ok) { if (ok !== null) go(); });
          return;
        }
        go();
      });
      $("xf-edit").addEventListener("input", function (e) { if (e.target.closest("[data-xf-i]")) xfRead(true); });
      $("xf-edit").addEventListener("change", function (e) {
        if (!e.target.closest("[data-xf-i]")) return;
        xfRead(true);
        if (e.target.classList.contains("xf-t")) xfBuild();
        else xfPreview();
      });
      $("xf-edit").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b || !xf.edit) return;
        var L = xf.edit.list;
        var i = b.closest("[data-xf-i]") ? Number(b.closest("[data-xf-i]").dataset.xfI) : -1;
        if (b.id === "btn-xf-add") {
          xfRead(false);
          L.push({ key: "", label: "", type: "text", options: "", required: false, inList: false });
          xf.edit.dirty = true;
          xfBuild();
          var rows = $("xf-edit").querySelectorAll(".xf-l");
          if (rows.length) rows[rows.length - 1].focus();
        } else if (b.dataset.xfMove && i >= 0) {
          xfRead(false);
          var j = i + Number(b.dataset.xfMove);
          if (j < 0 || j >= L.length) return;
          var x = L[i]; L[i] = L[j]; L[j] = x;
          xf.edit.dirty = true;
          xfBuild();
        } else if (b.dataset.xfDrop !== undefined && i >= 0) {
          xfRead(false);
          L.splice(i, 1);
          xf.edit.dirty = true;
          xfBuild();
        } else if (b.id === "btn-xf-discard") {
          xf.edit = null;
          xfBuild();
        } else if (b.id === "btn-xf-save") {
          xfRead(false);
          var form = xf.form;
          var done = busyButton("btn-xf-save", "Saving…");
          srv.withSuccessHandler(function (fields) {
            done();
            xf.defs.fields[form] = fields;
            xf.vals[form] = {};
            xf.at[form] = {};
            xf.edit = null;
            xfBuild();
            showMsg(xfFormLabel(form) + ": " + fields.length + (fields.length === 1 ? " field" : " fields") + " saved.", "success");
          }).withFailureHandler(function (err) { done(); onServerError(err); }).saveFormFields(form, L.map(function (f) {
            return { key: f.key, label: f.label, type: f.type, options: f.options, required: f.required, inList: f.inList };
          }));
        }
      });
    })();
  }

  function xfFormLabel(form) {
    var f = ((xf.defs || {}).forms || []).filter(function (x) { return x.key === form; })[0];
    return f ? f.label : form;
  }

  function initFormFieldsView() {
    if (!FACE_V2) return;
    if (xf.edit && xf.edit.dirty) { xfBuild(); return; }
    xf.defs = null;
    xf.failedAt = 0;
    xfDefs(xfBuild);
  }

  /** What is typed in the builder, back into the list being edited. */
  function xfRead(dirty) {
    if (!xf.edit) return;
    $("xf-edit").querySelectorAll("[data-xf-i]").forEach(function (row) {
      var f = xf.edit.list[Number(row.dataset.xfI)];
      if (!f) return;
      f.label = row.querySelector(".xf-l").value;
      f.type = row.querySelector(".xf-t").value;
      f.options = row.querySelector(".xf-o") ? row.querySelector(".xf-o").value : f.options;
      f.required = row.querySelector(".xf-r").checked;
      f.inList = row.querySelector(".xf-c").checked;
    });
    if (dirty) xf.edit.dirty = true;
  }

  function xfBuild() {
    var d = xf.defs;
    if (!d || !$("view-formfields")) return;
    if (!xf.edit || xf.edit.form !== xf.form) {
      xf.edit = { form: xf.form, dirty: false, list: xfFields(xf.form).map(function (f) {
        return { key: f.key, label: f.label, type: f.type, options: f.options.join(", "), required: f.required, inList: f.inList };
      }) };
    }
    $("xf-forms").innerHTML = d.forms.map(function (f) {
      var n = (d.fields[f.key] || []).length;
      return '<button type="button" class="xf-pick' + (f.key === xf.form ? " on" : "") + '" data-xf-form-pick="' + escapeHtml(f.key) + '">' +
        escapeHtml(f.label) + '<span class="eb-count">' + n + "</span></button>";
    }).join("");
    var ro = !d.canEdit;
    var dis = ro ? " disabled" : "";
    var L = xf.edit.list;
    $("xf-edit").innerHTML = '<div class="xf-head"><h3>' + escapeHtml(xfFormLabel(xf.form)) + "</h3>" +
      (xf.edit.dirty ? '<span class="eb-chip warn">Not saved yet</span>' : "") + "</div>" +
      (L.length ? '<div class="xf-rows"><div class="xf-row xf-row-h"><span>Field</span><span>Type</span><span>Choices</span><span>Required</span><span>In the list</span><span></span></div>' +
        L.map(function (f, i) {
          return '<div class="xf-row" data-xf-i="' + i + '">' +
            '<input class="xf-l" maxlength="60" placeholder="e.g. Warranty ends" aria-label="Field name" value="' + escapeHtml(f.label) + '"' + dis + " />" +
            '<select class="xf-t" aria-label="Type"' + dis + ">" + d.types.map(function (t) {
              return '<option value="' + t + '"' + (t === f.type ? " selected" : "") + ">" + escapeHtml(XF_TYPES[t] || t) + "</option>";
            }).join("") + "</select>" +
            (f.type === "select" ? '<input class="xf-o" placeholder="Choices, separated by commas" aria-label="Choices" value="' + escapeHtml(f.options) + '"' + dis + " />"
              : '<span class="sdc-muted">—</span>') +
            '<label class="xf-tick"><input type="checkbox" class="xf-r"' + (f.required ? " checked" : "") + dis + ' aria-label="Required" /></label>' +
            '<label class="xf-tick"><input type="checkbox" class="xf-c"' + (f.inList ? " checked" : "") + dis + ' aria-label="Show in the list" /></label>' +
            '<span class="xf-acts">' + (ro ? "" : '<button type="button" class="btn btn-sm" data-xf-move="-1" aria-label="Move up"' + (i ? "" : " disabled") + ">↑</button>" +
              '<button type="button" class="btn btn-sm" data-xf-move="1" aria-label="Move down"' + (i < L.length - 1 ? "" : " disabled") + ">↓</button>" +
              '<button type="button" class="btn btn-sm sd-danger" data-xf-drop="1" aria-label="Remove">×</button>') + "</span></div>";
        }).join("") + "</div>"
        : '<p class="sdc-muted">No fields of your own on this form yet.</p>') +
      (ro ? "" : '<div class="xf-foot"><button type="button" class="btn btn-sm" id="btn-xf-add">+ Add field</button><span style="flex:1"></span>' +
        (xf.edit.dirty ? '<button type="button" class="btn" id="btn-xf-discard">Discard changes</button>' : "") +
        '<button type="button" class="btn btn-primary" id="btn-xf-save"' + (xf.edit.dirty ? "" : " disabled") + ">Save fields</button></div>") +
      '<div class="xf-sec xf-preview" id="xf-preview"></div>';
    xfPreview();
  }

  /** How the section will look on the form. */
  function xfPreview() {
    var pv = $("xf-preview");
    if (!pv || !xf.edit) return;
    var L = xf.edit.list.filter(function (f) { return String(f.label).trim(); });
    pv.innerHTML = L.length ? '<div class="xf-h">More details <span class="sdc-muted">· how it looks on the form</span></div><div class="xf-grid">' +
      L.map(function (f, i) {
        return xfInput("pv", { key: "f" + i, label: f.label, type: f.type, required: f.required,
          options: String(f.options || "").split(/[,\n]/).map(function (o) { return o.trim(); }).filter(Boolean) }, "", false);
      }).join("") + "</div>" : "";
  }

  // ================= AI COMMANDS (2.0) =================
  // ERP 2's command bar (AiCommands.gs): a request typed or spoken, read by Claude into actions —
  // a task, a visit, a lead, a spare enquiry, a service call, a screen to open. Each is shown with
  // a tick box and nothing is done until Do; then each goes through its own form's save on the
  // server, with its own checks. Speech is the browser's own (SpeechRecognition), where it has it.
  var ai = { status: null, proposal: null, rec: null, busy: false };
  var AI_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>';
  var AI_MIC = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>';
  var AI_SPEECH = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  /** The Ask button, once signed in: for everybody when the server has its key, for Management to see why not otherwise. */
  function aiMount(user) {
    if (!FACE_V2 || $("ai-open")) return;
    var boss = ["Management", "ERP Admin"].indexOf(String(user.role)) !== -1;
    if (!user.aiCommands && !boss) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "ai-btn";
    b.id = "ai-open";
    b.innerHTML = AI_ICON + "<span>Ask</span>";
    b.title = "Tell the ERP what to do, in your own words";
    // Beside the search in the shell's top bar, which the shell may still be building.
    var tries = 0;
    (function place() {
      var tools = document.querySelector(".ws-tools");
      if (tools) { tools.insertBefore(b, tools.firstChild); return; }
      if (!b.parentNode) (document.querySelector(".topbar") || document.body).appendChild(b);
      if (tries++ < 30) setTimeout(place, 100);
    })();
    b.addEventListener("click", aiOpen);

    var back = document.createElement("div");
    back.className = "modal-backdrop modal-stacked";
    back.id = "ai-backdrop";
    back.innerHTML = '<div class="modal ai-modal" role="dialog" aria-label="Ask the ERP"><h3>' + AI_ICON + " Ask the ERP</h3>" +
      '<p class="tk-m-sub">Type or say what you want done. Nothing happens until you tick it and press Do.</p>' +
      '<div class="ai-ask"><textarea id="ai-text" rows="3" maxlength="1000" placeholder="e.g. Remind Priya to send the revised offer to Topworth by Friday"></textarea>' +
        (AI_SPEECH ? '<button type="button" class="btn ai-mic" id="ai-mic" aria-label="Speak" title="Speak">' + AI_MIC + "</button>" : "") + "</div>" +
      '<div id="ai-off" class="ai-off" style="display:none;"></div>' +
      '<div id="ai-examples" class="ai-examples"></div>' +
      '<div id="ai-reply" class="ai-reply" style="display:none;"></div>' +
      '<div id="ai-list" class="ai-list"></div>' +
      '<div class="amc-m-foot"><span class="sdc-muted ai-note">Read by Claude (Anthropic): your words go to Anthropic, your records do not.</span><span style="flex:1"></span>' +
        '<button type="button" class="btn" id="btn-ai-close">Close</button>' +
        '<button type="button" class="btn btn-primary" id="btn-ai-ask">Prepare</button>' +
        '<button type="button" class="btn btn-primary" id="btn-ai-do" style="display:none;">Do these</button></div></div>';
    document.body.appendChild(back);
    $("btn-ai-close").addEventListener("click", aiClose);
    $("btn-ai-ask").addEventListener("click", aiAsk);
    $("btn-ai-do").addEventListener("click", aiDo);
    $("ai-text").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); aiAsk(); }
    });
    $("ai-text").addEventListener("input", function () { if (ai.proposal) aiReset(); });
    $("ai-examples").addEventListener("click", function (e) {
      var x = e.target.closest("[data-ai-example]");
      if (!x) return;
      $("ai-text").value = x.textContent;
      $("ai-text").focus();
    });
    $("ai-list").addEventListener("change", aiCount);
    if ($("ai-mic")) $("ai-mic").addEventListener("click", aiListen);
  }

  function aiOpen() {
    aiReset();
    $("ai-backdrop").classList.add("show");
    $("ai-text").focus();
    if (ai.status) { aiShowStatus(); return; }
    srv.withSuccessHandler(function (s) { ai.status = s || { enabled: false, reason: "", kinds: [], examples: [] }; aiShowStatus(); })
      .withFailureHandler(onServerError).getAiStatus();
  }

  function aiClose() {
    if (ai.rec) { try { ai.rec.stop(); } catch (err) { /* already stopped */ } }
    $("ai-backdrop").classList.remove("show");
  }

  function aiShowStatus() {
    var s = ai.status;
    $("ai-off").style.display = s.enabled ? "none" : "";
    $("ai-off").textContent = s.enabled ? "" : s.reason;
    $("btn-ai-ask").disabled = !s.enabled;
    $("ai-examples").innerHTML = s.enabled && s.examples.length ? '<span class="sdc-muted">For example:</span>' + s.examples.map(function (x) {
      return '<button type="button" class="ai-example" data-ai-example="1">' + escapeHtml(x) + "</button>";
    }).join("") : "";
  }

  function aiReset() {
    ai.proposal = null;
    $("ai-reply").style.display = "none";
    $("ai-list").innerHTML = "";
    $("btn-ai-do").style.display = "none";
    $("btn-ai-ask").style.display = "";
    if (ai.status) $("ai-examples").style.display = "";
  }

  function aiAsk() {
    var text = $("ai-text").value.trim();
    if (!text) { showMsg("Say what you want done.", "error"); $("ai-text").focus(); return; }
    if (ai.busy) return;
    ai.busy = true;
    var done = busyButton("btn-ai-ask", "Reading…");
    srv.withSuccessHandler(function (p) {
      ai.busy = false;
      done();
      ai.proposal = p;
      aiDraw();
    }).withFailureHandler(function (err) { ai.busy = false; done(); onServerError(err); }).proposeAiCommand(text);
  }

  function aiDraw() {
    var p = ai.proposal;
    $("ai-examples").style.display = "none";
    $("ai-reply").style.display = p.reply ? "" : "none";
    $("ai-reply").textContent = p.reply || "";
    $("ai-list").innerHTML = p.actions.length ? p.actions.map(function (a, i) {
      return '<label class="ai-card' + (a.problem ? " bad" : "") + '"><input type="checkbox" data-ai-i="' + i + '"' + (a.problem ? " disabled" : " checked") + " />" +
        '<span class="ai-body"><b>' + escapeHtml(a.label) + "</b>" +
        (a.lines.length ? '<span class="ai-lines">' + a.lines.map(function (l) {
          return "<span><i>" + escapeHtml(l[0]) + "</i> " + escapeHtml(l[1]) + "</span>";
        }).join("") + "</span>" : "") +
        (a.problem ? '<span class="ai-problem">' + escapeHtml(a.problem) + "</span>" : "") + "</span></label>";
    }).join("") : '<p class="sdc-muted">Nothing to do from that. Try saying it another way.</p>';
    $("btn-ai-ask").style.display = "none";
    $("btn-ai-do").style.display = "";
    aiCount();
  }

  function aiCount() {
    var n = $("ai-list").querySelectorAll("[data-ai-i]:checked").length;
    $("btn-ai-do").disabled = !n;
    $("btn-ai-do").textContent = n ? "Do " + (n === 1 ? "this" : "these " + n) : "Do these";
  }

  function aiDo() {
    var p = ai.proposal;
    if (!p) return;
    var picked = [].slice.call($("ai-list").querySelectorAll("[data-ai-i]:checked")).map(function (c) {
      var a = p.actions[Number(c.dataset.aiI)];
      return { kind: a.kind, input: a.input };
    });
    if (!picked.length) return;
    var done = busyButton("btn-ai-do", "Doing…");
    srv.withSuccessHandler(function (results) {
      done();
      ai.proposal = null;
      $("btn-ai-do").style.display = "none";
      $("btn-ai-ask").style.display = "";
      $("ai-text").value = "";
      $("ai-list").innerHTML = results.map(function (r) {
        return '<div class="ai-result ' + (r.ok ? "ok" : "bad") + '">' + (r.ok ? "✓ " : "✗ ") + escapeHtml(r.text) + "</div>";
      }).join("");
      var open = results.filter(function (r) { return r.ok && r.view; })[0];
      var made = results.some(function (r) { return r.ok && !r.view; });
      if (open) {
        var tab = document.querySelector('#tabs [data-view="' + open.view + '"]');
        if (tab) { aiClose(); tab.click(); return; }
        showMsg("That screen is not on your menu.", "error");
      }
      if (made) aiRefresh();
    }).withFailureHandler(function (err) { done(); onServerError(err); }).applyAiActions(picked);
  }

  /** The screen behind the window, drawn again so what was just made shows. */
  function aiRefresh() {
    var v = document.querySelector(".view.active");
    var key = v ? v.id.replace(/^view-/, "") : "";
    if (key && VIEW_INIT[key]) { try { VIEW_INIT[key](); } catch (err) { /* the screen reloads on its next visit */ } }
  }

  /** The browser's own speech-to-text, Indian English, into the box as it is heard. */
  function aiListen() {
    if (!AI_SPEECH) return;
    if (ai.rec) { try { ai.rec.stop(); } catch (err) { /* already stopped */ } return; }
    var rec = new AI_SPEECH();
    rec.lang = "en-IN";
    rec.interimResults = true;
    rec.continuous = false;
    var before = $("ai-text").value.trim();
    rec.onresult = function (e) {
      var heard = "";
      for (var i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
      $("ai-text").value = (before ? before + " " : "") + heard.trim();
      if (ai.proposal) aiReset();
    };
    rec.onerror = function (e) {
      var why = e && e.error === "not-allowed" ? "The browser was not allowed to use the microphone." :
        e && e.error === "no-speech" ? "Nothing was heard. Press the microphone and speak." : "Speech could not be read. Type it instead.";
      showMsg(why, "error");
    };
    rec.onend = function () { ai.rec = null; $("ai-mic").classList.remove("on"); };
    ai.rec = rec;
    $("ai-mic").classList.add("on");
    try { rec.start(); } catch (err) { ai.rec = null; $("ai-mic").classList.remove("on"); }
  }

  // ================= COMPRESSOR SALES =================
  // 2.0 opens on the enquiry board unless this browser last chose a list.
  var CS_MODE = "leads";
  var leadsCache = [];
  var opportunitiesCache = [];
  var openOpportunity = null;

  var LEAD_BADGE = {
    "New": "badge-new", "Contacted": "badge-followup", "Qualified": "badge-quoted",
    "Converted": "badge-won", "Disqualified": "badge-lost"
  };
  var STAGE_BADGE = {
    "Requirement Identified": "badge-new", "Technical Discussion": "badge-followup",
    "Quotation": "badge-quoted", "Negotiation": "badge-sent", "PO Expected": "badge-active",
    "Won": "badge-won", "Lost": "badge-lost"
  };
  var STAGES = ["Requirement Identified", "Technical Discussion", "Quotation",
    "Negotiation", "PO Expected", "Won", "Lost"];

  function canEditLeads() {
    return ["Sales Engineer", "Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initCompressorView() {
    $("btn-new-lead").style.display = canEditLeads() ? "inline-flex" : "none";
    if (customersLoaded) fillCustomerDatalist();
    if (!configLists) loadConfigLists();
    ensureLeadFormData();
    if (FACE_V2 && !$("subtab-board")) {
      // 2.0's board of ERP 2's ten stages, beside ERP 1's Leads and Pipeline.
      var tab = document.createElement("button");
      tab.className = "btn btn-sm";
      tab.id = "subtab-board";
      tab.type = "button";
      tab.textContent = "Board";
      $("subtab-leads").parentNode.insertBefore(tab, $("subtab-leads"));
      tab.addEventListener("click", function () { ebSetMode("compressor", "board"); switchCsMode("board"); });
      if (ebActive("compressor")) CS_MODE = "board";
    }
    switchCsMode(CS_MODE);
  }

  function switchCsMode(mode) {
    CS_MODE = mode;
    if (FACE_V2 && mode !== "board") ebSetMode("compressor", "list");
    if ($("subtab-board")) $("subtab-board").className = "btn btn-sm" + (mode === "board" ? " btn-primary" : "");
    $("subtab-leads").className = "btn btn-sm" + (mode === "leads" ? " btn-primary" : "");
    $("subtab-pipeline").className = "btn btn-sm" + (mode === "pipeline" ? " btn-primary" : "");
    $("cs-search").placeholder = mode === "board"
      ? "Search by number, customer, requirement or quotation…"
      : mode === "leads"
      ? "Search by lead no., customer or requirement…"
      : "Search by opportunity no., customer or title…";
    $("pipeline-summary").style.display = mode === "pipeline" ? "" : "none";
    $("btn-new-lead").style.display = ((mode === "leads" || mode === "board") && canEditLeads()) ? "inline-flex" : "none";
    if (FACE_V2) ebShowList("compressor", mode !== "board");
    loadCsRows();
  }

  $("subtab-leads").addEventListener("click", function () { switchCsMode("leads"); });
  $("subtab-pipeline").addEventListener("click", function () { switchCsMode("pipeline"); });
  $("cs-search").addEventListener("input", renderCsRows);
  $("cs-mine").addEventListener("change", loadCsRows);
  $("cs-closed").addEventListener("change", loadCsRows);

  function loadCsRows() {
    var opts = { mineOnly: $("cs-mine").checked, includeClosed: $("cs-closed").checked };
    if (CS_MODE === "board") { ebLoad("compressor"); return; }
    if (CS_MODE === "leads") {
      srv.withSuccessHandler(function (rows) {
        leadsCache = rows; renderCsRows();
      }).withFailureHandler(onServerError).listLeads(opts);
    } else {
      srv.withSuccessHandler(function (rows) {
        opportunitiesCache = rows; renderCsRows();
      }).withFailureHandler(onServerError).listOpportunities(opts);
    }
  }

  function renderCsRows() {
    if (CS_MODE === "board") { ebRender("compressor"); return; }
    if (CS_MODE === "leads") renderLeads(); else renderPipeline();
  }

  function renderLeads() {
    var q = ($("cs-search").value || "").toLowerCase();
    var rows = leadsCache.filter(function (l) {
      return [l.leadNo, l.customerName, l.requirementSummary, l.contactName,
        l.serviceEngineerName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    $("cs-thead").innerHTML = "<tr><th>Lead No.</th><th>Date</th><th>Company</th><th>Wants</th>" +
      "<th>Source</th><th>Service Engineer</th><th>Owner</th><th>Status</th><th>Next Action</th>" +
      "<th></th></tr>";

    if (!rows.length) {
      $("cs-tbody").innerHTML = '<tr><td colspan="10"><div class="empty">' +
        (leadsCache.length ? "No leads match your search." : "No open leads — log the first one.") +
        "</div></td></tr>";
      return;
    }

    $("cs-tbody").innerHTML = rows.map(function (l) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(l.leadNo || "—") + "</td>" +
        "<td>" + escapeHtml(l.date) + "</td>" +
        "<td>" + escapeHtml(l.customerName || "—") +
          (l.isProspect ? ' <span class="badge badge-new">prospect</span>' : "") + "</td>" +
        // What they asked for beats a free-text summary: it is the thing you quote from.
        "<td>" + (l.requirementText
          ? escapeHtml(l.requirementText)
          : escapeHtml((l.requirementSummary || "—").slice(0, 60))) + "</td>" +
        "<td>" + escapeHtml(l.source || "—") + "</td>" +
        "<td>" + escapeHtml(l.serviceEngineerName || "—") + "</td>" +
        "<td>" + escapeHtml(l.ownerEmail || "—") + "</td>" +
        '<td><span class="badge ' + (LEAD_BADGE[l.status] || "badge-draft") + '">' + escapeHtml(l.status) + "</span></td>" +
        "<td>" + (l.nextActionDate
          ? (l.overdue ? '<span class="badge badge-overdue">' + escapeHtml(l.nextActionDate) + "</span>" : escapeHtml(l.nextActionDate))
          : "—") + "</td>" +
        '<td class="center"><button class="btn-ghost" data-open-lead="' + l.id + '" title="Open">✎</button></td>' +
        "</tr>";
    }).join("");

    $("cs-tbody").querySelectorAll("[data-open-lead]").forEach(function (btn) {
      btn.addEventListener("click", function () { openLeadModal(btn.dataset.openLead); });
    });
    xfTable("lead", $("cs-tbody").closest("table"), xfRowId("[data-open-lead]", "data-open-lead"), true);
  }

  function renderPipeline() {
    var q = ($("cs-search").value || "").toLowerCase();
    var rows = opportunitiesCache.filter(function (o) {
      return [o.opportunityNo, o.customerName, o.title].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    // Weighted pipeline by stage (FR-012) — what the funnel is actually worth.
    var open = rows.filter(function (o) { return ["Won", "Lost"].indexOf(o.stage) === -1; });
    var total = open.reduce(function (sum, o) { return sum + (Number(o.expectedValue) || 0); }, 0);
    var weighted = open.reduce(function (sum, o) { return sum + (Number(o.weightedValue) || 0); }, 0);
    var byStage = {};
    open.forEach(function (o) { byStage[o.stage] = (byStage[o.stage] || 0) + 1; });

    $("pipeline-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +

        '<td><span class="badge ' + (STAGE_BADGE[o.stage] || "badge-draft") + '">' + escapeHtml(o.stage) + "</span></td>" +
        '<td class="num mono">' + (o.expectedValue ? fmt(o.expectedValue) : "—") + "</td>" +
        '<td class="num">' + o.probability + "%</td>" +
        '<td class="num mono">' + fmt(o.weightedValue) + "</td>" +
        "<td>" + escapeHtml(o.expectedCloseDate || "—") + "</td>" +
        "<td>" + (o.nextActionDate
          ? (o.overdue ? '<span class="badge badge-overdue">' + escapeHtml(o.nextActionDate) + "</span>" : escapeHtml(o.nextActionDate))
          : "—") + "</td>" +
        '<td class="center" style="white-space:nowrap;">' +
          (canEditQuotes()
            ? '<button class="btn btn-sm" data-quote-opp="' + o.id + '" title="' +
              escapeHtml(o.canQuote

                : "Open it first — " + (!o.hasTechnicalRequirement
                    ? "the technical requirement is missing"
                    : "no compressor has been selected yet")) +
              '"' + (o.canQuote ? "" : " disabled") + ">Quote</button> "

          '<button class="btn-ghost" data-open-opp="' + o.id + '" title="Open">✎</button>' +

    $("cs-tbody").querySelectorAll("[data-open-opp]").forEach(function (btn) {
      btn.addEventListener("click", function () { openOpportunityModal(btn.dataset.openOpp); });

    // The same shortcut the enquiry list has. Offered here only where it can succeed: without
    // a technical requirement the server refuses, and a button that always errors is a button
    // that teaches people to distrust the screen.
    $("cs-tbody").querySelectorAll("[data-quote-opp]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var was = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Creating…";

          btn.disabled = false; btn.textContent = was;

  // ---- Lead modal ----
  $("btn-new-lead").addEventListener("click", function () { openLeadModal(null); });
  $("btn-cancel-lead").addEventListener("click", function () {
    $("lead-modal-backdrop").classList.remove("show");

  function openLeadModal(id) {
    var l = id ? leadsCache.find(function (x) { return x.id === id; }) : null;
    $("lead-modal-title").textContent = id ? "Lead" : "Log Lead";
    $("lm-no").textContent = l ? l.leadNo : "A lead number is assigned on save.";
    $("lm-id").value = id || "";

    $("lm-prospect").value = l ? (l.customerName || "") : "";
    fillLeadCustomerSelect(l ? l.customerId : "");
    $("lm-new-customer").style.display = canEditCustomers() ? "" : "none";

    $("lm-contact").value = l ? (l.contactName || "") : "";
    $("lm-phone").value = l ? (l.contactPhone || "") : "";
    $("lm-email").value = l ? (l.contactEmail || "") : "";
    $("lm-city").value = l ? (l.prospectCity || "") : "";
    if ($("lm-area")) {
      var areaNow = l ? (l.area || "") : "";
      ldAreas(function (areas) { $("lm-area").innerHTML = sclAreaOpts(areas, areaNow); });
    }

    leadReqs = l && l.requirements ? l.requirements.map(function (r) {
      return { compressorType: r.compressorType, quantity: r.quantity,
               capacityHint: r.capacityHint, notes: r.notes };
    }) : [];
    fillLeadTypeSelect();
    $("lm-req-qty").value = 1;
    $("lm-req-capacity").value = "";
    renderLeadReqs();
    $("lm-source").value = l ? (l.source || "") : "";
    $("lm-industry").value = l ? (l.industry || "") : "";
    $("lm-application").value = l ? (l.application || "") : "";
    $("lm-requirement").value = l ? (l.requirementSummary || "") : "";
    $("lm-urgency").value = l ? (l.urgency || "Normal") : "Normal";
    $("lm-budget").value = l && l.budget !== "" ? l.budget : "";
    withPeople(function (p) {
      fillPeopleSelect("lm-engineer", p.salesEngineers,
        l ? l.salesEngineerEmail : (currentUser.role === "Sales Engineer" ? currentUser.email : ""),
        "No engineer");
      // A new record defaults to whoever is filling it in, but only if they are
      // actually a coordinator — otherwise it is left unassigned rather than
      // putting a sales engineer in a coordinator's slot.
      fillPeopleSelect("lm-owner", p.coordinators,
        l ? (l.ownerEmail || "") : (currentUser.role === "Sales Coordinator"
          ? currentUser.email : ""), "Unassigned");
      fillServiceEngineerSelect("lm-service-engineer", "lm-service-engineer-note", p,
        l ? (l.serviceEngineerEmail || "") : "");

    $("lm-nextaction").value = l ? (l.nextActionDate || "") : "";
    $("lm-status").value = l ? l.status : "New";

    $("lm-lostreason").innerHTML = '<option value="">—</option>' +
      lostReasonsCache.map(function (r) {
        return '<option value="' + r.id + '">' + escapeHtml(r.reasonText) + "</option>";
      }).join("");
    if (l && l.lostReasonId) $("lm-lostreason").value = l.lostReasonId;
    toggleLeadLostReason();

    fillDatalist("leadsource-list", ((configLists || {}).LeadSource || []).map(function (i) { return i.label; }));
    fillDatalist("industry-list", ((configLists || {}).Industry || []).map(function (i) { return i.label; }));

    $("btn-convert-lead").style.display =
      (l && l.status === "Qualified" && canEditLeads()) ? "inline-flex" : "none";
    $("lead-modal-backdrop").classList.add("show");
    ensureLeadFormData();
  }

  /**
   * Both of the lead form's dropdowns are filled from caches another screen loads, so opening
   * the form before those arrive used to leave them empty with no explanation — and a
   * swallowed failure looked exactly the same as "nothing configured". These fill from
   * whatever is cached now, say plainly when there is nothing, and are called again when a
   * late load lands.
   */
  function fillLeadCustomerSelect(selectId) {
    var sel = $("lm-linkcustomer");
    var keep = selectId !== undefined ? selectId : sel.value;
    sel.innerHTML = '<option value="">No — new prospect</option>' +
      (customersCache.length
        ? customersCache.map(function (c) {
            return '<option value="' + c.id + '">' + escapeHtml(c.name) + "</option>";
          }).join("")
        : '<option value="" disabled>— no customers on file yet —</option>');
    if (keep) sel.value = keep;
  }

  function fillLeadTypeSelect() {
    var types = (configLists || {}).CompressorType || [];
    var sel = $("lm-req-type");
    var keep = sel.value;
    sel.innerHTML = types.length
      ? types.map(function (i) {
          return '<option value="' + escapeHtml(i.label) + '">' + escapeHtml(i.label) + "</option>";
        }).join("")
      : '<option value="">— none set up yet —</option>';
    if (keep) sel.value = keep;
    $("btn-lm-addreq").disabled = !types.length;
    $("lm-req-hint").textContent = types.length
      ? ""
      : "No compressor types are configured. An ERP Admin adds them under " +
        "Settings → Dropdown Lists, category CompressorType — or runs Setup, which seeds " +
        "Rotary Screw and Reciprocating (Piston).";
  }

  /** Fetches whatever the form needs and is missing, then refills. */
  function ensureLeadFormData() {
    if (!customersCache.length) {
      srv.withSuccessHandler(function (rows) {
        customersCache = rows; customersLoaded = true;
        fillCustomerDatalist(); fillLeadCustomerSelect();
      }).withFailureHandler(onServerError).listCustomers();
    }
    // Waits on whatever request is already in flight instead of starting a second one.
    withConfigLists(function () { fillLeadTypeSelect(); });
    if (!lostReasonsCache.length) {
      srv.withSuccessHandler(function (rows) {
        lostReasonsCache = rows;
      }).withFailureHandler(onServerError).listLostReasons();
    }
  }

  // ---- requirement lines, held client-side until the lead is saved ----
  var leadReqs = [];

  function renderLeadReqs() {
    if (!leadReqs.length) {
      $("lm-reqs").innerHTML = '<div class="empty" style="padding:14px;">Nothing added yet. ' +
        "A lead with no stated requirement is hard to quote later.</div>";
      return;
    }
    $("lm-reqs").innerHTML = '<div class="card" style="padding:0; overflow-x:auto;"><table>' +
      "<thead><tr><th>Compressor Type</th><th class=\"num\">Qty</th><th>Capacity / Pressure</th>" +
      "<th></th></tr></thead><tbody>" +
      leadReqs.map(function (r, i) {
        return "<tr><td>" + escapeHtml(r.compressorType) + "</td>" +
          '<td class="num mono">' + escapeHtml(r.quantity) + "</td>" +
          "<td>" + escapeHtml(r.capacityHint || "—") + "</td>" +
          '<td class="center"><button class="btn btn-sm btn-danger" data-delreq="' + i +
            '" type="button">Remove</button></td></tr>';
      }).join("") + "</tbody></table></div>";

    $("lm-reqs").querySelectorAll("[data-delreq]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        leadReqs.splice(Number(btn.dataset.delreq), 1);
        renderLeadReqs();
      });
    });
  }

  $("btn-lm-addreq").addEventListener("click", function () {
    var type = $("lm-req-type").value;
    if (!type) { showMsg("No compressor types configured. Add them in Settings.", "error"); return; }
    var qty = Number($("lm-req-qty").value);
    if (!(qty > 0)) { showMsg("Quantity must be at least 1.", "error"); return; }

    // Same type twice is a correction, not a second line — add the quantities instead.
    var existing = leadReqs.filter(function (r) { return r.compressorType === type; })[0];
    if (existing) existing.quantity = Number(existing.quantity) + qty;
    else leadReqs.push({ compressorType: type, quantity: qty,
                         capacityHint: $("lm-req-capacity").value.trim(), notes: "" });

    $("lm-req-qty").value = 1;
    $("lm-req-capacity").value = "";
    renderLeadReqs();
  });

  // The prospect, as a customer, now — for the salesperson who already has the GSTIN and the
  // address and would rather not wait for the lead to convert to write them down.
  $("lm-new-customer").addEventListener("click", function () {
    addCustomerFrom({
      name: $("lm-prospect").value.trim(),
      industry: $("lm-industry").value.trim(),
      contactName: $("lm-contact").value.trim(),
      phone: $("lm-phone").value.trim(),
      email: $("lm-email").value.trim(),
      city: $("lm-city").value.trim()
    }, function (cust) {
      fillLeadCustomerSelect(cust.id);
      $("lm-prospect").value = cust.name;
      showMsg(cust.name + " added as a customer and linked to this lead.", "success");
    });

      $("lead-modal-backdrop").classList.remove("show");

      okLabel: "Convert"
    }, function (ok) {
      if (ok === null) return;

        $("lead-modal-backdrop").classList.remove("show");

        openOpportunity = opp;
        renderOpportunityModal();
        $("opp-modal-backdrop").classList.add("show");
        showMsg("Opportunity " + opp.opportunityNo + " created.", "success");
      }).withFailureHandler(onServerError).convertLeadToOpportunity(id, {});

  function openOpportunityModal(id) {

  function renderOpportunityModal() {
    var o = openOpportunity;
    if (!o) return;

    $("opp-modal-title").textContent = o.title || "Opportunity";
    $("om-no").textContent = o.opportunityNo + " · " + (o.customerName || "");
    $("om-id").value = o.id;
    $("om-customer").value = o.customerName || "";
    $("om-title").value = o.title || "";
    $("om-owner").value = o.ownerEmail || "";
    $("om-stage").innerHTML = STAGES.map(function (st) {
      return '<option value="' + st + '"' + (st === o.stage ? " selected" : "") + ">" + st + "</option>";
    }).join("");
    $("om-value").value = o.expectedValue !== "" ? o.expectedValue : "";
    $("om-probability").value = o.probability;
    $("om-close").value = o.expectedCloseDate || "";
    $("om-competitor").value = o.competitor || "";
    $("om-nextaction").value = o.nextActionDate || "";
    $("om-lostreason").innerHTML = '<option value="">—</option>' +
      lostReasonsCache.map(function (r) {
        return '<option value="' + r.id + '">' + escapeHtml(r.reasonText) + "</option>";

    toggleOppLostReason();
    $("om-weighted").textContent = "Weighted value: " + fmt(o.weightedValue);

    renderTechSummary(o);
    renderSelections(o);
    renderVisits(o);
    renderActivities(o);
    renderOppQuotations(o);

          return "<tr>" +
            '<td class="mono">' + escapeHtml(sel.productCode) + "</td>" +

            "<td>" + escapeHtml(sel.workingPressure || "—") + "</td>" +

  /**
   * Every live offer as a file Excel opens: status, progress, who created it, why it was
   * declined.
   *
   * CSV rather than .xlsx because Apps Script has no spreadsheet writer and both installations
   * must produce the same file; Excel opens it directly. Three things make it open cleanly:
   * a byte-order mark, without which Excel reads the file as Latin-1 and the ₹ sign or an
   * accented name turns to garbage; quotes around every text cell, so a comma in "Pune, MH" stays
   * in its column; and an apostrophe in front of any text that starts like a formula, so a
   * customer typed as "=HYPERLINK(...)" is shown as text instead of being run when somebody
   * opens the file.
   */
  function csvCell(v) {
    if (typeof v === "number") return isFinite(v) ? String(v) : "";
    var t = String(v === null || v === undefined ? "" : v);
    if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
    return '"' + t.replace(/"/g, '""') + '"';
  }

  function downloadText(name, text, mimeType) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: mimeType }));
      var link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      return true;
    } catch (e) {
      return false;
    }
  }

  $("btn-progress-download").addEventListener("click", function () {
    var done = busyButton("btn-progress-download", "Preparing\u2026");
    srv.withSuccessHandler(function (t) {
      done();
      if (!t || !t.rows || !t.rows.length) {
        showMsg("There are no quotations to download yet.", "error");
        return;
      }
      var lines = [t.headers.map(csvCell).join(",")].concat(t.rows.map(function (row) {
        return row.map(csvCell).join(",");
      }));
      var stamp = String(t.generatedAt || "").slice(0, 10) || "today";
      var ok = downloadText("Quotation progress " + stamp + ".csv",
        "\ufeff" + lines.join("\r\n") + "\r\n", "text/csv;charset=utf-8");
      showMsg(ok
        ? t.rows.length + (t.rows.length === 1 ? " quotation" : " quotations") +
          " downloaded \u2014 open the file in Excel."
        : "This browser would not save the file. Try again from Chrome or Edge.",
        ok ? "success" : "error");

  // ================= ALL QUOTATIONS AND QUOTATION PROGRESS, AS THE 2.0 DEMO DRAWS THEM =================
  // 2.0 only. The same quotations ERP 1 lists (listQuotations, with each one's ten-step trail),
  // drawn as the demo has them: totals you can click to filter, Both desks / Compressor / Spares,
  // search, status and who prepared it, then the table; and on Progress, how far the offers got
  // step by step, with each one's ten steps, where it is, what is next and how long it has waited.
  // A row opens the quotation (All Quotations) or its full trail (Progress), as ERP 1 does.
  var qv = { rows: null, stream: "", status: "", who: "", q: "", pStream: "", pPer: "month" };
  var QV_STATUS = {
    Draft: ["Draft", ""], Approved: ["Approved", "acc"], Submitted: ["Sent", "sig"], Negotiating: ["Sent", "sig"],
    Won: ["Accepted (won)", "good"], Lost: ["Declined (lost)", "bad"], Expired: ["Past validity", "bad"], Revised: ["Revised", ""]
  };
  var QV_FILTERS = [["Draft", "Draft"], ["Approved", "Approved"], ["Sent", "Sent"], ["Won", "Accepted (won)"], ["Lost", "Declined (lost)"], ["Expired", "Past validity"]];
  /** The status a row is read as: a sent offer past its date is past validity. */
  function qvStatus(r) {
    if (r.status === "Submitted" || r.status === "Negotiating") return r.expired ? "Expired" : "Sent";
    if ((r.status === "Draft" || r.status === "Approved") && r.expired) return "Expired";
    return r.status;
  }
  function qvChip(r) {
    var s = qvStatus(r);
    var c = s === "Sent" ? QV_STATUS.Submitted : QV_STATUS[s] || [s, ""];
    return ebChip(c[0], c[1]);
  }
  /** Before GST, as the demo shows offers. */
  function qvBasic(r) {
    var g = Number(r.grand) || 0;
    var tax = Number(r.taxAmt);
    return isFinite(tax) && tax > 0 && tax < g ? g - tax : g;
  }
  function qvSum(list) { return list.reduce(function (s, r) { return s + qvBasic(r); }, 0); }
  function qvSpare(r) { return r.businessStream === "Spare Sales"; }
  function qvDeskChip(r) {
    return '<span class="qv-desk ' + (qvSpare(r) ? "sp" : "un") + '">' + escapeHtml(qvSpare(r) ? (r.enquiryType && r.enquiryType !== "Spares" ? r.enquiryType : "Spares") : "Compressor") + "</span>";
  }
  /** "UNIT/…/26-27/74 R0": the serial and the year, which is what tells offers apart in a list. */
  function qvNo(r) {
    var parts = String(r.quoteNo || "—").split("/");
    var shown = parts.length > 3 ? parts[0] + "/…/" + parts.slice(-2).join("/") : parts.join("/");
    return '<span title="' + escapeHtml(r.quoteNo || "") + '">' + escapeHtml(shown) + "</span> " + escapeHtml(r.revision || "R0");
  }
  function qvMainItem(r) {
    var it = (r.items || [])[0];
    return it ? String(it.description || it.itemCode || "") : String(r.machineModel || "");
  }
  function qvMini(j) {
    if (!j) return "—";
    if (j.closed || j.stalled) return '<span class="sdc-muted">' + escapeHtml(j.label) + "</span>";
    return '<span class="qv-stage" title="' + escapeHtml(j.nextLabel ? "Next: " + j.nextLabel : "Complete") + '"><span class="qv-mini">' + j.stages.map(function (s) {
      return "<i" + (s.done ? ' class="on"' : "") + "></i>";
    }).join("") + "</span><span>" + escapeHtml(j.label) + ' <span class="mono sdc-muted">' + (j.reachedIndex + 1) + "/" + j.stages.length + "</span></span>" +
      (j.creditHold ? " " + ebChip("hold", "bad") : "") + "</span>";
  }
  function qvStrip(j) {
    if (!j) return "";
    return '<ol class="qv-strip" aria-label="' + escapeHtml(j.label) + '">' + j.stages.map(function (s, i) {
      var cls = s.done ? "done" : (!j.closed && !j.stalled && i === j.reachedIndex + 1) ? "next" : "";
      if (j.closed && i === j.reachedIndex + 1) cls = "stop";
      return '<li class="' + cls + '" title="' + escapeHtml(s.label + (s.date ? " · " + ebDay(s.date) : "")) + '"><i></i></li>';
    }).join("") + "</ol>";
  }
  function qvDaysSince(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    if (!m) return null;
    var then = Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var t = ebToday().split("-");
    return Math.max(0, Math.round((Date.UTC(Number(t[0]), Number(t[1]) - 1, Number(t[2])) - then) / 86400000));
  }
  function qvTile(label, value, sub, tone, filter) {
    return "<" + (filter ? 'button type="button" data-qv-tile="' + escapeHtml(filter) + '"' : "div") + ' class="qv-kpi' + (tone ? " " + tone : "") + (filter && qv.status === filter ? " on" : "") + '">' +
      '<span class="qv-l">' + escapeHtml(label) + '</span><span class="qv-v">' + escapeHtml(String(value)) + '</span><span class="qv-s">' + escapeHtml(sub) + "</span></" + (filter ? "button" : "div") + ">";
  }
  function qvSeg(key, opts, cur) {
    return '<div class="eb2-seg" role="group">' + opts.map(function (o) {
      return '<button type="button" data-qv-seg="' + key + '" data-v="' + escapeHtml(o[0]) + '" aria-pressed="' + (o[0] === cur) + '">' + escapeHtml(o[1]) + "</button>";
    }).join("") + "</div>";
  }

  /** The 2.0 page's box, put where ERP 1's search bar was; ERP 1's own parts put away. */
  function qvHost(view, id) {
    if ($(id)) return $(id);
    var v = $(view);
    var host = document.createElement("div");
    host.id = id;
    host.className = "qv-host";
    var head = v.querySelector(".page-head");
    head.parentNode.insertBefore(host, head.nextSibling);
    return host;
  }
  function qvLoad(then) {
    srv.withSuccessHandler(function (rows) { qv.rows = rows || []; then(); })
      .withFailureHandler(onServerError).listQuotations({ includeClosed: true });
  }

  // ---- All Quotations ----
  function qvQuotesInit() {
    var v = $("view-quotations");
    v.querySelector(".search-bar").style.display = "none";
    v.querySelector(":scope > .card").style.display = "none";
    var head = v.querySelector(".page-head");
    head.querySelector("h2").textContent = "All Quotations";
    head.querySelector("p").textContent = "Every offer from both desks. Compressor offers and spares offers are numbered from one running serial. " +
      "Revisions keep the number and go up R0, R1, R2. Values are before GST.";
    if (!$("btn-qv-new") && canEditQuotes()) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-primary";
      b.id = "btn-qv-new";
      b.textContent = "+ New quotation";
      b.addEventListener("click", function () { goToTab("quote"); });
      head.appendChild(b);
    }
    var host = qvHost("view-quotations", "qv-quotes");
    if (!qv.rows) host.innerHTML = '<div class="empty">Loading the quotations…</div>';
    qvLoad(qvQuotesRender);
  }

  function qvQuotesRender() {
    var host = $("qv-quotes");
    if (!host || !qv.rows) return;
    var all = qv.rows;
    var month = ebToday().slice(0, 7);
    var drafts = all.filter(function (r) { return qvStatus(r) === "Draft"; });
    var approved = all.filter(function (r) { return qvStatus(r) === "Approved"; });
    var sent = all.filter(function (r) { return qvStatus(r) === "Sent"; });
    var won = all.filter(function (r) { return r.status === "Won" && String(r.wonDate || r.date || "").slice(0, 7) === month; });
    var lost = all.filter(function (r) { return r.status === "Lost" && String(r.lostDate || r.date || "").slice(0, 7) === month; });
    var expired = all.filter(function (r) { return qvStatus(r) === "Expired"; });
    if (!host.querySelector(".qv-tools")) {
      host.innerHTML = '<div class="qv-kpis"></div><div class="qv-tools eb2-tools"></div><div class="qv-body"></div>';
      host.querySelector(".qv-tools").innerHTML = qvSeg("stream", [["", "Both desks"], ["Compressor Sales", "Compressor"], ["Spare Sales", "Spares"]], qv.stream) +
        '<input type="search" class="eb2-search" data-qv-q="1" placeholder="Search number, customer or item" aria-label="Search quotations" />' +
        '<select data-qv-sel="status" aria-label="Status"></select><select data-qv-sel="who" aria-label="Prepared by"></select>';
    }
    host.querySelector(".qv-kpis").innerHTML =
      qvTile("Drafts", drafts.length, ebLakh(qvSum(drafts)) || "₹0", "", "Draft") +
      qvTile("Approved, not sent yet", approved.length, approved.length ? ebLakh(qvSum(approved)) : "management has approved them", approved.length ? "sig" : "", "Approved") +
      qvTile("Sent, no answer yet", sent.length, ebLakh(qvSum(sent)) || "₹0", "", "Sent") +
      qvTile("Accepted (won) this month", won.length, ebLakh(qvSum(won)) || "₹0", "", "Won") +
      qvTile("Declined (lost) this month", lost.length, ebLakh(qvSum(lost)) || "₹0", "", "Lost") +
      qvTile("Past validity", expired.length, (ebLakh(qvSum(expired)) || "₹0") + " · revise to renew", expired.length ? "bad" : "", "Expired");
    var tools = host.querySelector(".qv-tools");
    tools.querySelectorAll('[data-qv-seg="stream"]').forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === qv.stream)); });
    var st = tools.querySelector('[data-qv-sel="status"]');
    st.innerHTML = '<option value="">Any status</option>' + QV_FILTERS.map(function (f) { return '<option value="' + f[0] + '">' + escapeHtml(f[1]) + "</option>"; }).join("");
    st.value = qv.status;
    var people = {};
    all.forEach(function (r) { if (r.preparedBy) people[String(r.preparedBy).toLowerCase()] = r.preparedByName || r.preparedBy; });
    var who = tools.querySelector('[data-qv-sel="who"]');
    who.innerHTML = '<option value="">Anyone</option>' + Object.keys(people).sort(function (a, b) { return String(people[a]).localeCompare(String(people[b])); })
      .map(function (k) { return '<option value="' + escapeHtml(k) + '">' + escapeHtml(people[k]) + "</option>"; }).join("");
    who.value = qv.who;

    var q = String(qv.q || "").trim().toLowerCase();
    var rows = all.filter(function (r) {
      if (qv.stream && r.businessStream !== qv.stream) return false;
      if (qv.status && qvStatus(r) !== qv.status) return false;
      if (qv.who && String(r.preparedBy).toLowerCase() !== qv.who) return false;
      if (q && [r.quoteNo, r.customerName, r.machineModel, r.serialNo, (r.items || []).map(function (i) { return i.description + " " + i.itemCode; }).join(" ")]
        .join(" ").toLowerCase().indexOf(q) === -1) return false;
      // Closed ones only when asked for by their status.
      if (!qv.status && ["Won", "Lost"].indexOf(r.status) !== -1 && String(r.wonDate || r.lostDate || r.date || "").slice(0, 7) < month) return false;
      return true;
    });
    var soon = (function () { var t = new Date(); t.setDate(t.getDate() + 7); return t.toISOString().slice(0, 10); })();
    host.querySelector(".qv-body").innerHTML = '<div class="qv-table"><table><thead><tr><th>Quotation</th><th>Date</th><th>Prepared by</th><th>Customer</th><th>Main item</th>' +
      '<th class="num">Value</th><th>Status</th><th>Progress</th><th>Valid until</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (r) {
        var s = qvStatus(r);
        var late = (s === "Sent" && r.validUntil && r.validUntil <= soon) || s === "Expired";
        return '<tr class="qv-row" data-qv-open="' + escapeHtml(r.id) + '"><td><span class="mono">' + qvNo(r) + "</span><br>" + qvDeskChip(r) + "</td>" +
          '<td style="white-space:nowrap;">' + escapeHtml(ebDay(r.date)) + "</td>" +
          "<td>" + escapeHtml(r.preparedByName || r.preparedBy || "—") + "</td>" +
          "<td><b>" + escapeHtml(r.customerName || "—") + "</b></td>" +
          '<td class="qv-item">' + escapeHtml(qvMainItem(r) || "—") + "</td>" +
          '<td class="num mono">' + escapeHtml(ebMoney(qvBasic(r)) || "₹0") + "</td>" +
          "<td>" + qvChip(r) + "</td>" +
          "<td>" + qvMini(r.journey) + "</td>" +
          '<td style="white-space:nowrap;"' + (late ? ' class="qv-late"' : "") + ">" + escapeHtml(ebDay(r.validUntil) || "—") + "</td></tr>";
      }).join("") : '<tr><td colspan="9" class="empty">' + (all.length ? "No quotation matches that." : "No quotations yet — raise one from an enquiry.") + "</td></tr>") +
      "</tbody></table></div>";
  }

  // ---- Quotation Progress ----
  function qvProgressInit() {
    var v = $("view-progress");
    v.querySelector(".search-bar").style.display = "none";
    $("progress-picker-card").style.display = "none";
    var head = v.querySelector(".page-head");
    head.querySelector("p").textContent = "Each quotation’s road from prepared to service told, ERP 1’s ten steps, with who made the offer. " +
      "Anything waiting more than a week at one step is flagged.";
    $("btn-progress-download").className = "btn btn-primary";
    var host = qvHost("view-progress", "qv-progress");
    host.style.display = "";
    if (!qv.rows) host.innerHTML = '<div class="empty">Loading the quotations…</div>';
    qvLoad(qvProgressRender);
  }

  function qvProgressRender() {
    var host = $("qv-progress");
    if (!host || !qv.rows) return;
    var since = (function () { var t = new Date(); t.setDate(t.getDate() - 30); return t.getFullYear() + "-" + ("0" + (t.getMonth() + 1)).slice(-2) + "-" + ("0" + t.getDate()).slice(-2); })();
    var rows = qv.rows.filter(function (r) {
      if (r.status === "Revised") return false;
      if (qv.pStream && r.businessStream !== qv.pStream) return false;
      return qv.pPer === "all" || String(r.date || "") >= since;
    });
    var stages = rows.length && rows[0].journey ? rows[0].journey.stages.map(function (s) { return s.label; })
      : ["Prepared", "Approved", "Sent to customer", "Accepted by customer", "PO received", "Sales order", "Invoiced", "Dispatched", "Delivered", "Service told"];
    var mx = Math.max(1, rows.length);
    var declined = rows.filter(function (r) { return r.status === "Lost"; }).length;
    var expired = rows.filter(function (r) { return qvStatus(r) === "Expired"; }).length;
    var bars = stages.map(function (label, i) {
      var n = rows.filter(function (r) { return r.journey && r.journey.stages[i] && r.journey.stages[i].done; }).length;
      return '<div class="qv-hbar" data-qv-step="' + i + '"><span>' + escapeHtml(label) + '</span><span class="qv-track"><i class="' + (i < 4 ? "t1" : i < 6 ? "t2" : "t3") + '" style="width:' +
        (n / mx * 100) + '%"></i></span><span class="mono">' + n + "</span></div>";
    }).join("");
    host.innerHTML = '<div class="eb2-tools">' + qvSeg("pStream", [["", "Both desks"], ["Compressor Sales", "Compressor"], ["Spare Sales", "Spares"]], qv.pStream) +
      qvSeg("pPer", [["month", "Last 30 days"], ["all", "All"]], qv.pPer) + "</div>" +
      '<section class="qv-panel"><header><h3>How far ' + rows.length + (rows.length === 1 ? " quotation" : " quotations") + " got</h3>" +
        '<span class="sdc-muted">' + (qv.pPer === "month" ? "prepared in the last 30 days" : "all quotations") + "</span></header>" +
        '<div class="qv-bars">' + bars + '<p class="eb-note">' + declined + (declined === 1 ? " quotation" : " quotations") + " declined and " + expired + " past validity in this period.</p></div></section>" +
      '<div class="qv-table"><table><thead><tr><th>Quotation</th><th>Customer</th><th>Prepared by</th><th class="num">Value</th><th>Status</th><th>The ten steps</th><th>Where it is</th><th>Waiting</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (r) {
        var j = r.journey || { stages: [], reachedIndex: -1, label: "" };
        var all = j.stages.length && j.stages.every(function (s) { return s.done; });
        var last = j.stages[j.reachedIndex] || {};
        var wait = j.closed || all ? null : qvDaysSince(last.date || r.date);
        var waitChip = wait === null ? ebChip(j.closed ? String(j.label).toLowerCase() : "done", j.closed ? "bad" : "good")
          : ebChip(wait + (wait === 1 ? " day" : " days"), wait > 7 ? "bad" : wait > 3 ? "sig" : "");
        return '<tr class="qv-row" data-qv-trail="' + escapeHtml(r.id) + '"><td><span class="mono">' + qvNo(r) + "</span><br>" + qvDeskChip(r) + "</td>" +
          "<td><b>" + escapeHtml(r.customerName || "—") + "</b></td>" +
          "<td>" + escapeHtml(r.preparedByName || r.preparedBy || "—") + "</td>" +
          '<td class="num mono">' + escapeHtml(ebLakh(qvBasic(r)) || "₹0") + "</td>" +
          "<td>" + qvChip(r) + "</td>" +
          "<td>" + qvStrip(j) + "</td>" +
          "<td>" + escapeHtml(j.label) + ' <span class="mono sdc-muted">' + (j.reachedIndex + 1) + "/" + (j.stages.length || 10) + "</span>" +
            (j.nextLabel ? '<br><span class="sdc-muted">next: ' + escapeHtml(j.nextLabel) + "</span>" : "") + "</td>" +
          "<td>" + waitChip + "</td></tr>";
      }).join("") : '<tr><td colspan="8" class="empty">No quotations in this period.</td></tr>') + "</tbody></table></div>";
  }

  if (FACE_V2) {
    document.addEventListener("click", function (e) {
      var host = e.target.closest("#qv-quotes, #qv-progress");
      if (!host) return;
      var seg = e.target.closest("[data-qv-seg]");
      if (seg) { qv[seg.dataset.qvSeg] = seg.dataset.v; if (host.id === "qv-quotes") qvQuotesRender(); else qvProgressRender(); return; }
      var tile = e.target.closest("[data-qv-tile]");
      if (tile) { qv.status = qv.status === tile.dataset.qvTile ? "" : tile.dataset.qvTile; qvQuotesRender(); return; }
      var open = e.target.closest("[data-qv-open]");
      if (open) { openQuotation(open.dataset.qvOpen); return; }
      var trail = e.target.closest("[data-qv-trail]");
      if (trail) openProgressTrail(trail.dataset.qvTrail);
    });
    document.addEventListener("input", function (e) {
      if (!e.target.closest("#qv-quotes [data-qv-q]")) return;
      qv.q = e.target.value;
      qvQuotesRender();
    });
    document.addEventListener("change", function (e) {
      var sel = e.target.closest("#qv-quotes [data-qv-sel]");
      if (!sel) return;
      qv[sel.dataset.qvSel] = sel.value;
      qvQuotesRender();
    });
  }

  // ================= ENQUIRY BOARD (2.0) =================
  // ERP 2's ten stages, as a board of cards, on the Spare Sales and Compressor Sales screens.
  // 2.0 only (FACE_V2); the other faces keep ERP 1's lists. Every stage is read off ERP 1's own
  // records by the server (EnquiryBoard.gs); the three set by hand write ERP 1's own fields.
  var EB_DESKS = {
    spare: { stream: "Spare Sales", view: "enquiries", search: "enquiry-search", mine: "enquiry-mine", closed: "enquiry-closed" },
    compressor: { stream: "Compressor Sales", view: "compressor", search: "cs-search", mine: "cs-mine", closed: "cs-closed" }
  };
  var eb = { spare: { data: null, mode: "" }, compressor: { data: null, mode: "" }, open: null, renaming: false };
  var EB_KIND = { enquiry: "Spare enquiry", lead: "Lead", opportunity: "Opportunity", quotation: "Quotation" };

  function ebMode(desk) {
    if (!FACE_V2) return "list";
    if (!eb[desk].mode) {
      var kept = "";
      try { kept = window.localStorage.getItem("erp.board." + desk) || ""; } catch (e) { /* private window */ }
      // The 2.0 desks open on the board; Board / List switch inside it. ERP 1's own lists
      // come back only when one of ERP 1's steps asks (Convert to opportunity → Pipeline).
      eb[desk].mode = kept === "erp1" ? "list" : "board";
    }
    return eb[desk].mode;
  }
  function ebActive(desk) { return FACE_V2 && ebMode(desk) === "board"; }
  function ebSetMode(desk, mode) {
    eb[desk].mode = mode;
  }
  /** Board or List inside the 2.0 desk, kept by this browser. */
  function ebView(desk) {
    if (!eb[desk].view) {
      var kept = "";
      try { kept = window.localStorage.getItem("erp.board.view." + desk) || ""; } catch (e) { /* private window */ }
      eb[desk].view = kept === "list" ? "list" : "board";
    }
    return eb[desk].view;
  }
  function ebSetView(desk, view) {
    eb[desk].view = view;
    try { window.localStorage.setItem("erp.board.view." + desk, view); } catch (e) { /* private window */ }
