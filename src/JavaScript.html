  // ================= SPARE ENQUIRIES =================
  var enquiriesCache = [];
  var lostReasonsCache = [];
  var identifySearchTimer = null;

  /**
   * Opening this screen used to fire six calls before it drew anything — the list, the
   * customers, the lost reasons, the known models and two config lists — each its own round
   * trip, one after another. The server gathers them now, so the screen costs one call on
   * first open and one list refresh after that. The config lists are for datalists inside
   * forms, so they wait until a form is opened.
   */
  function initEnquiriesView() {
    $("btn-new-enquiry").style.display = canEditEnquiries() ? "inline-flex" : "none";
    if (FACE_V2) ebSpareInit();
    if (customersLoaded && lostReasonsCache.length) {
      fillCustomerDatalist();
      loadEnquiries();
      return;
    }
    srv.withSuccessHandler(function (data) {
      customersCache = data.customers || []; customersLoaded = true;
      lostReasonsCache = data.lostReasons || [];
      fillCustomerDatalist();
      fillDatalist("models-list", data.knownModels || []);
      enquiriesCache = data.enquiries || [];
      renderEnquiries();
    }).withFailureHandler(onServerError).spareSalesScreen({
      mineOnly: $("enquiry-mine").checked,
      includeClosed: $("enquiry-closed").checked
    });
  }

  function canEditEnquiries() {
    return ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function fillCustomerDatalist() {
    fillDatalist("customers-list", customersCache.map(function (c) { return c.name; }));
  }

  function loadEnquiries() {
    // 2.0's board follows the same saves and tick boxes as the list.
    if (ebActive("spare")) ebLoad("spare");
    srv.withSuccessHandler(function (rows) {
      enquiriesCache = rows; renderEnquiries();
    }).withFailureHandler(onServerError).listSpareEnquiries({
      mineOnly: $("enquiry-mine").checked,
      includeClosed: $("enquiry-closed").checked
    });
  }

  var STATUS_BADGE = {
    "New": "badge-new", "Identifying": "badge-followup", "Quoted": "badge-quoted",
    "Won": "badge-won", "Lost": "badge-lost", "Dropped": "badge-draft"
  };

  /**
   * Who rang, and how to ring them back.
   *
   * The number is the point of this column: most of what a coordinator does with an open
   * enquiry is call the person about it, and having to open each one to find the number is
   * how it ends up in a notebook instead. Drawn as a dial link, because they work from a
   * phone.
   */
  function enquiryContactCell(e) {
    var name = String(e.contactName || "").trim();
    var phone = String(e.contactPhone || "").trim();
    if (!name && !phone) return "—";
    var cell = name ? escapeHtml(name) : "";
    if (phone) {
      cell += (name ? "<br>" : "") +
        '<a class="mono" style="font-size:11.5px;" href="tel:' +
        escapeHtml(phone.replace(/[^0-9+]/g, "")) + '">' + escapeHtml(phone) + "</a>";
    }
    return cell;
  }

  function renderEnquiries() {
    var q = ($("enquiry-search").value || "").toLowerCase();
    var rows = enquiriesCache.filter(function (e) {
      // The person is worth searching by too: "what did Mohan ask for last week" is a
      // question somebody asks, and their number is how a callback starts.
      return [e.enquiryNo, e.customerName, e.contactName, e.contactPhone, e.productModel,
        e.serialNo, e.requirementText, e.serviceEngineerName].join(" ").toLowerCase()
        .indexOf(q) !== -1;
    });

    var tbody = $("enquiries-tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="11"><div class="empty">' +
        (enquiriesCache.length ? "No enquiries match your search." : "No open enquiries — log the first one.") +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (e) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(e.enquiryNo || "—") + "</td>" +
        "<td>" + escapeHtml(e.date) + "</td>" +
        "<td>" + escapeHtml(e.customerName || "—") + "</td>" +
        "<td>" + enquiryContactCell(e) + "</td>" +
        "<td>" + escapeHtml(e.productModel || "—") + (e.serialNo ? ' <span class="mono" style="color:var(--steel);">· ' + escapeHtml(e.serialNo) + "</span>" : "") + "</td>" +
        "<td>" + escapeHtml(e.serviceEngineerName || "—") + "</td>" +
        "<td>" + escapeHtml(e.urgency || "Normal") + "</td>" +
        '<td class="num">' + e.itemCount + "</td>" +
        '<td><span class="badge ' + (STATUS_BADGE[e.status] || "badge-draft") + '">' + escapeHtml(e.status) + "</span></td>" +
        "<td>" + (e.expectedDeliveryDate
          ? (e.overdue ? '<span class="badge badge-overdue">' + escapeHtml(e.expectedDeliveryDate) + "</span>" : escapeHtml(e.expectedDeliveryDate))
          : "—") + "</td>" +
        '<td class="center" style="white-space:nowrap;">' +
          (canEditQuotes()
            ? '<button class="btn btn-sm" data-quote-enq="' + e.id + '" title="' +
              (quotedAlready(e)
                ? "This enquiry has already been quoted. This raises a second offer from it."
                : "Raise the quotation from this enquiry") + '">' +
              (quotedAlready(e) ? "Quote again" : "Quote") + "</button> "
            : "") +
          '<button class="btn-ghost" data-open-enq="' + e.id + '" title="Open">✎</button>' +
        "</td>" +
        "</tr>";
    }).join("");

    tbody.querySelectorAll("[data-open-enq]").forEach(function (btn) {
      btn.addEventListener("click", function () { openEnquiryModal(btn.dataset.openEnq); });
    });
    // Raising the offer without opening the enquiry first. The window now closes when the
    // enquiry is saved, and reopening it only to press one button was the price of that.
    tbody.querySelectorAll("[data-quote-enq]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var e = enquiriesCache.find(function (x) { return x.id === btn.dataset.quoteEnq; });
        if (!e) return;
        var was = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Creating\u2026";
        quoteFromEnquiry(e, function () { btn.disabled = false; btn.textContent = was; });
      });
    });
    xfTable("enquiry", tbody.closest("table"), xfRowId("[data-open-enq]", "data-open-enq"), true);
  }

  /** Past the point where another offer would be a second one rather than the first. */
  function quotedAlready(e) {
    return ["Quoted", "Won", "Lost"].indexOf(e.status) !== -1;
  }

  /**
   * Turns an enquiry into a quotation and goes to it.
   *
   * Shared by the button on the list row and the one inside the enquiry window, because they
   * are the same action reached two ways and a coordinator should not be able to tell which
   * one they used from what happens next.
   */
  function quoteFromEnquiry(e, done) {
    srv.withSuccessHandler(function (q) {
      done();
      openQuote = q;
      $("enquiry-modal-backdrop").classList.remove("show");
      renderQuoteBuilder();
      goToTab("quote");
      showMsg("Quotation " + q.quoteNo + " created from " + e.enquiryNo + ".", "success");
    }).withFailureHandler(function (err) {
      done();
      onServerError(err);
    }).createQuotationFromEnquiry(e.id);
  }

  /**
   * Adds a customer from inside another form, with what that form already knows filled in.
   *
   * A spares enquiry or a compressor lead is very often the first time a company exists in
   * the system at all — somebody rings about a filter, or a salesperson meets a plant
   * manager — and making the coordinator leave the form, go to Customers, type the same
   * name, phone and email again and come back lost the call. So the customer window opens on
   * top of the form, already holding the name and the person typed so far; saving it adds
   * the customer with that contact, closes, and hands the new record back to the form.
   */
  function addCustomerFrom(prefill, onAdded) {
    if (!canEditCustomers()) {
      showMsg("Only Sales and Management can add a customer.", "error");
      return;
    }
    var p = prefill || {};
    onCustomerSaved = function (saved, isNew) {
      if (!isNew) return;
      onCustomerSaved = null;
      // commitCustomer has already refreshed the cache before handing over, so the new
      // record — contacts and all — is in it. No second fetch.
      fillCustomerDatalist();
      var fresh = customersCache.find(function (c) { return c.id === saved.id; }) || saved;
      onAdded(fresh);
    };
    openCustomerModal(null);
    // After opening, because opening a new customer clears these forms.
    if (p.name) $("cm-name").value = p.name;
    if (p.industry) $("cm-industry").value = p.industry;
    if (p.contactName) $("cf-name").value = p.contactName;
    if (p.phone) $("cf-phone").value = p.phone;
    if (p.email) $("cf-email").value = p.email;
    if (p.city) $("af-city").value = p.city;
    $("cm-name").focus();
  }

  $("em-new-customer").addEventListener("click", function (ev) {
    ev.preventDefault();
    var typed = $("em-customer").value.trim();
    var known = customersCache.some(function (c) {
      return c.name.toLowerCase() === typed.toLowerCase();
    });
    addCustomerFrom({
      name: known ? "" : typed,
      contactName: $("em-contact").value.trim(),
      phone: $("em-contactphone").value.trim(),
      email: $("em-contactemail").value.trim()
    }, function (cust) {
      $("em-customer").value = cust.name;
      fillEnquiryContacts(cust);
      // The person on the enquiry went in as the customer's contact, so tie the two now
      // rather than letting the save add them a second time.
      var contacts = cust.contacts || [];
      var typedContact = $("em-contact").value.trim().toLowerCase();
      var match = contacts.filter(function (c) {
        return String(c.name).trim().toLowerCase() === typedContact;
      })[0];
      $("em-contactid").value = match ? match.id : "";
      noteEnquiryContact(contacts);
      showMsg(cust.name + " added and selected on this enquiry.", "success");
    });
  });

  $("enquiry-search").addEventListener("input", renderEnquiries);
  $("enquiry-mine").addEventListener("change", loadEnquiries);
  $("enquiry-closed").addEventListener("change", loadEnquiries);
  $("btn-new-enquiry").addEventListener("click", function () {
    if (!configLists) loadConfigLists();
    openEnquiryModal(null);
  });
  $("btn-cancel-enquiry").addEventListener("click", function () {
    $("enquiry-modal-backdrop").classList.remove("show");
  });

  function currentEnquiry() {
    var id = $("em-id").value;
    return id ? enquiriesCache.find(function (e) { return e.id === id; }) : null;
  }

  /**
   * The people already on file at this customer, offered as you type.
   *
   * Picking one fills in their number and address and ties the enquiry to their record, so
   * the same person is not written down twice with two spellings; typing somebody new adds
   * them to the customer when the enquiry is saved, which is what stops the second enquiry
   * from them asking all over again.
   */
  function fillEnquiryContacts(cust) {
    var contacts = (cust && cust.contacts) || [];
    $("em-contacts-list").innerHTML = contacts.map(function (c) {
      return '<option value="' + escapeHtml(c.name) + '">' +
        escapeHtml([c.designation, c.phone].filter(Boolean).join(" · ")) + "</option>";
    }).join("");
    noteEnquiryContact(contacts);
  }

  function enquiryContactsForCustomer() {
    var cust = customersCache.find(function (c) {
      return c.name.toLowerCase() === $("em-customer").value.trim().toLowerCase();
    });
    return (cust && cust.contacts) || [];
  }

  /** Says whether this person is already known here, or is about to be added. */
  function noteEnquiryContact(contacts) {
    var typed = $("em-contact").value.trim();
    var note = $("em-contact-note");
    if (!typed) { note.textContent = ""; return; }
    var known = (contacts || []).filter(function (c) {
      return String(c.name).trim().toLowerCase() === typed.toLowerCase();
    })[0];
    note.textContent = known
      ? "Already on file for this customer — the quotation will be addressed to them."
      : "New to this customer. Saving the enquiry adds them to the customer's contacts.";
  }

  $("em-contact").addEventListener("input", function () {
    var contacts = enquiryContactsForCustomer();
    var typed = $("em-contact").value.trim().toLowerCase();
    var known = contacts.filter(function (c) {
      return String(c.name).trim().toLowerCase() === typed;
    })[0];
    if (known) {
      $("em-contactid").value = known.id;
      // Only into empty boxes: a number typed for this call must not be wiped by the one on
      // file, and the server keeps the same rule when it writes back.
      if (!$("em-contactphone").value.trim()) $("em-contactphone").value = known.phone || "";
      if (!$("em-contactemail").value.trim()) $("em-contactemail").value = known.email || "";
    } else {
      $("em-contactid").value = "";
    }
    noteEnquiryContact(contacts);
  });

  // A different customer has different people, so the list behind the box follows it.
  $("em-customer").addEventListener("change", function () {
    var cust = customersCache.find(function (c) {
      return c.name.toLowerCase() === $("em-customer").value.trim().toLowerCase();
    });
    fillEnquiryContacts(cust);
  });

  function openEnquiryModal(id) {
    var e = id ? enquiriesCache.find(function (x) { return x.id === id; }) : null;
    $("enquiry-modal-title").textContent = id ? "Spare Enquiry" : "Log Spare Enquiry";
    $("em-no").textContent = e ? e.enquiryNo : "An enquiry number is assigned on save.";
    $("em-id").value = id || "";

    var cust = e ? customersCache.find(function (c) { return c.id === e.customerId; }) : null;
    $("em-customer").value = cust ? cust.name : (e ? (e.customerName || "") : "");
    $("em-contact").value = e ? (e.contactName || "") : "";
    $("em-contactid").value = e ? (e.contactId || "") : "";
    $("em-contactphone").value = e ? (e.contactPhone || "") : "";
    $("em-contactemail").value = e ? (e.contactEmail || "") : "";
    fillEnquiryContacts(cust);
    $("em-source").value = e ? (e.source || "") : "";
    $("em-model").value = e ? (e.productModel || "") : "";
    $("em-serial").value = e ? (e.serialNo || "") : "";
    $("em-urgency").value = e ? (e.urgency || "Normal") : "Normal";
    if ($("em-type")) $("em-type").value = e ? (e.enquiryType || "Spares") : "Spares";
    $("em-expdelivery").value = e ? (e.expectedDeliveryDate || "") : "";
    $("em-requirement").value = e ? (e.requirementText || "") : "";
    // Spare Sales is a coordinator and nobody else, so there is no engineer to name here.
    withPeople(function (p) {
      fillPeopleSelect("em-owner", p.coordinators,
        e ? (e.ownerEmail || "") : (currentUser.role === "Sales Coordinator"
          ? currentUser.email : ""), "Unassigned");
      fillServiceEngineerSelect("em-service-engineer", "em-service-engineer-note", p,
        e ? (e.serviceEngineerEmail || "") : "");
    });
    showEnquiryProgress(e);

    fillDatalist("leadsource-list", ((configLists || {}).LeadSource || []).map(function (i) { return i.label; }));

    // Offered the moment the enquiry is saved. It used to wait until parts had been
    // identified against it, which read as the button being broken — and now that an enquiry
    // is the only way to raise a spares offer, waiting would be a dead end.
    // Offered on an enquiry that does not exist yet, as well as one that does. Logging the
    // call and quoting it are usually one intention — somebody is on the phone asking the
    // price — and making them save, find the row and press again put two screens inside one
    // thought. On a new enquiry the button saves it first and goes on to the offer.
    $("btn-quote-enquiry").style.display = canEditQuotes() ? "inline-flex" : "none";
    $("btn-quote-enquiry").textContent = (e && e.items.length)
      ? "Create Quotation (" + e.items.length + (e.items.length === 1 ? " part)" : " parts)")
      : "Create Quotation";
    $("btn-quote-enquiry").title = e
      ? (e.items.length
          ? "The identified parts carry across onto the offer."
          : "No parts identified yet — the offer opens empty and you pick them there.")
      : "Logs this enquiry and opens the offer on it.";
    hideIdentifyPanel();
    renderEnquiryItems(e);
    $("enquiry-modal-backdrop").classList.add("show");
  }

  $("btn-quote-enquiry").addEventListener("click", function () {
    var e = currentEnquiry();
    if (e) {
      quoteFromEnquiry(e, busyButton("btn-quote-enquiry", "Creating\u2026"));
      return;
    }
    // Nothing saved yet. Save it and carry straight on rather than handing back a row to find.
    var done = busyButton("btn-quote-enquiry", "Creating\u2026");
    saveEnquiry(function (saved) {
      enquiriesCache = enquiriesCache.concat([saved]);
      $("em-id").value = saved.id;
      quoteFromEnquiry(saved, done);
    }, done);
  });

  /**
   * Where the enquiry has got to, as a line of text rather than a box to fill in.
   *
   * The status is decided by the work: logging it makes it New, naming a part makes it
   * Identifying, raising the offer makes it Quoted, and marking that offer sets Won or Lost.
   * A picker here asked the coordinator to state the same thing a second time, and a spares
   * desk has no use for the answer — but the enquiry list still badges the status, so the
   * form has to say what it is, and why, when it is Lost.
   */
  function showEnquiryProgress(e) {
    var wrap = $("em-status-wrap");
    if (!e || !e.status) { wrap.style.display = "none"; return; }
    wrap.style.display = "";
    var reason = e.lostReasonId && lostReasonsCache.find(function (r) { return r.id === e.lostReasonId; });
    $("em-status-text").innerHTML =
      '<span class="badge ' + (STATUS_BADGE[e.status] || "badge-draft") + '">' +
      escapeHtml(e.status) + "</span>" +
      (reason ? ' <span style="color:var(--steel);">' + escapeHtml(reason.reasonText) + "</span>" : "");
  }

  function renderEnquiryItems(e) {
    var zone = $("em-items");
    if (!e) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">Save the enquiry first, then identify parts against it.</div>';
      $("btn-identify-part").disabled = true;
      return;
    }
    $("btn-identify-part").disabled = !canEditEnquiries();
    if (!e.items.length) {
      zone.innerHTML = '<div class="empty" style="padding:14px;">No parts identified yet.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>#</th><th>Part No.</th><th>Description</th>' +
      '<th class="num">Qty</th><th>Fit</th><th>Availability</th><th></th></tr></thead><tbody>' +
      e.items.map(function (i) {

          "<td>" + i.lineNo + "</td>" +

            ? '<span class="badge badge-won">Confirmed</span>'

  /**
   * A button that says it is working.
   *
   * The round trip out to the sheet and back is a second or two, and for that second a
   * button that looks exactly as it did before the click reads as a button that did nothing.
   * People press it again. This makes the wait visible and makes a second press impossible,
   * and hands back a `done` to call when the answer arrives.
   */
  function busyButton(id, workingLabel) {
    var btn = $(id);
    if (!btn) return function () {};
    var was = btn.textContent;
    btn.disabled = true;
    btn.textContent = workingLabel;
    return function () { btn.disabled = false; btn.textContent = was; };
  }

  /**
   * Writes the enquiry and hands the saved row back.
   *
   * Extracted because two buttons need it: Save Enquiry, which finishes, and Create Quotation
   * on an enquiry nobody has saved yet, which carries on to the offer. Two ways to one action
   * should not be two pieces of code — that is how a validation rule ends up on one path and
   * not the other.
   */
  function saveEnquiry(onSaved, done) {
    var name = $("em-customer").value.trim();
    var cust = customersCache.find(function (c) { return c.name.toLowerCase() === name.toLowerCase(); });
    if (!cust) {
      // It used to name the Customers tab, which on the spares side is a dead end: a spares
      // offer can only begin here, so somebody not yet on the books had no way through.
      showMsg("No customer by that name. Use \u201cNot on the list? Add them\u201d under the " +
        "customer box.", "error");
      $("em-customer").focus();
      if (done) done();
      return;
    }
    var input = {
      id: $("em-id").value || null,
      customerId: cust.id,
      customerName: cust.name,
      contactName: $("em-contact").value.trim(),
      contactId: $("em-contactid").value,
      contactPhone: $("em-contactphone").value.trim(),
      contactEmail: $("em-contactemail").value.trim(),
      source: $("em-source").value.trim(),
      productModel: $("em-model").value.trim(),
      serialNo: $("em-serial").value.trim(),
      urgency: $("em-urgency").value,
      expectedDeliveryDate: $("em-expdelivery").value,
      requirementText: $("em-requirement").value.trim(),
      ownerEmail: $("em-owner").value.trim(),
      serviceEngineerEmail: $("em-service-engineer").value.trim()
    };
    // 2.0 only: what the offer is for. Left out elsewhere, so the type already stored stays.
    if ($("em-type")) input.enquiryType = $("em-type").value;
    if (!xfReady("enquiry")) { if (done) done(); return; }
    srv.withSuccessHandler(function (saved) {
      if (done) done();
      xfAfterSave("enquiry", saved.id);
      onSaved(saved);
    }).withFailureHandler(function (err) {
      if (done) done();
      onServerError(err);
    }).saveSpareEnquiry(input);
  }

  // 2.0's enquiry form says what the offer will be for — spares, an AMC renewal or a service —
  // and the quotation's heading and subject follow it. The other faces keep ERP 1's form.
  if (FACE_V2 && $("em-requirement") && !$("em-type")) {
    (function () {
      var ask = $("em-requirement").closest(".field");
      var row = document.createElement("div");
      row.className = "grid grid-4";
      row.style.marginTop = "12px";
      row.innerHTML = '<div class="field"><label>Quotation for</label><select id="em-type">' +
        ["Spares", "AMC renewal", "Service"].map(function (t) {
          return '<option value="' + t + '">' + t + "</option>";
        }).join("") + "</select></div>";
      if (ask && ask.parentNode) ask.parentNode.insertBefore(row, ask);
    })();
  }

  $("btn-save-enquiry").addEventListener("click", function () {

      $("enquiry-modal-backdrop").classList.remove("show");
      loadEnquiries();

        ? "Enquiry " + (saved.enquiryNo || "") + " logged. Press Quote on its row to raise " +
          "the offer, or open it to identify the parts first."
        : "Enquiry " + (saved.enquiryNo || "") + " saved.", "success");
    }, done);
