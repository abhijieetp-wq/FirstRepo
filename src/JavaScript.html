  /**
   * Moving a person onto a different address, history and all.
   *
   * Two steps, because this is not a field edit — it rewrites the name the whole sheet calls
   * them by. The server counts what it would touch and changes nothing; only the second press
   * writes. The count is shown per area rather than as one total, because "412 cells" tells an
   * admin nothing and "Quotations, Sales Orders, GRNs" tells them whether it is the person they
   * meant.
   */
  function changeAddressFor(id) {
    var u = setData.users.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!u) return;
    askDialog({
      title: "Change the address for " + u.name,
      message: "They sign in with their username, so this does not change how they get in, " +
        "and nothing is ever sent here — it is how the records know whose work is whose. It " +
        "does not have to be a real mailbox. Currently " + u.email + ".",
      input: true, inputLabel: "New address — e.g. " +
        (u.username || "name") + "@premierindia.internal",
      value: u.email, okLabel: "Check what would change"
    }, function (val) {
      if (val === null) return;
      srv.withSuccessHandler(function (p) {
        var where = p.where.length
          ? p.where.map(function (w) { return w.tab + " (" + w.rows + ")"; }).join(", ")
          : "nothing yet — they have no work on file";
        askDialog({
          title: "Move " + p.name + " to " + p.newEmail + "?",
          message: p.total + " place" + (p.total === 1 ? "" : "s") + " would change:\n" +
            where + "\n\n" + p.notes.join("\n"),
          okLabel: "Change it", danger: true
        }, function (go) {
          if (go === null) return;
          srv.withSuccessHandler(function (r) {
            loadSettings();
            showMsg(r.name + " is now " + r.newEmail + " — " + r.total +
              " places updated.", "success");
          }).withFailureHandler(onServerError)
            .changeUserEmail({ userId: id, newEmail: p.newEmail });
        });
      }).withFailureHandler(onServerError)
        .previewUserEmailChange({ userId: id, newEmail: val });
    });
  }

  /**
   * An admin giving somebody a password.
   *
   * It sets one rather than showing one — there is nothing to look up, because only the
   * derived form is stored. Whoever receives it must change it before doing anything else,
   * so the password an admin knows is never the one left in use.
   */
  function setPasswordFor(id) {
    var u = setData.users.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!u) return;
    askDialog({
      title: "Set a password for " + u.name,
      message: "Tell it to them yourself — it is not stored anywhere readable, and they will " +
        "be made to choose their own the first time they sign in. Any sessions they have open " +
        "will end.",
      input: true, inputLabel: "New password (8+ characters, a letter and a number)",
      okLabel: "Set password"
    }, function (password) {
      if (password === null) return;
      srv.withSuccessHandler(function (result) {
        loadSettings();
        showMsg(result.message, "success");
      }).withFailureHandler(onServerError).setUserPassword({ id: id, password: password });
    });
  }

  function openUserModal(id) {
    var u = id ? setData.users.filter(function (x) { return String(x.id) === String(id); })[0] : null;
    $("user-modal-title").textContent = u ? "Edit User" : "Add User";
    $("usr-id").value = u ? u.id : "";
    $("usr-email").value = u ? u.email : "";
    // Read-only on an existing person: the server refuses a change here, because the
    // address has to move together with everything they have already done. "Change
    // address" on their row does both.
    $("usr-email").readOnly = !!u;
    $("usr-email").disabled = !!u;   // the email is the identity; changing it makes a new person
    // The username is only what they type, so unlike the email it can be corrected later.
    $("usr-username").value = u ? (u.username || "") : "";
    $("usr-name").value = u ? u.name : "";
    $("usr-role").innerHTML = setData.roles.map(function (r) {
      return '<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + "</option>";
    }).join("");
    $("usr-role").value = u ? u.role : "Sales Coordinator";
    $("usr-designation").value = u ? (u.designation || "") : "";
    $("usr-stream").value = u && u.businessStream ? u.businessStream : "All";
    $("usr-active").checked = !u || String(u.active).toUpperCase() !== "FALSE";
    // This used to say the email had to match the Google account they sign in with, which is
    // not true and contradicted the note on the Email field two inches above it. The gate asks
    // only whether the Google account is on its list — it never compares it to the person's
    // row — so one company account opens the portal for everybody, each with their own
    // username and password. Read the other way round, the old note said every employee needed
    // a Google account of their own, which is the arrangement PIE cannot have.
    $("usr-note").textContent = u && u.isSelf
      ? "This is your own account. You cannot deactivate it or drop your own ERP Admin role."
      : (u ? "" : "They sign in with the username and password above. Where the Google " +
          "requirement is on, any account on its list opens the portal for them — this " +
          "address is not checked against it.");
    $("user-modal-backdrop").classList.add("show");
  }

  /**
   * Reads the file in the browser and checks its header before anything reaches the server.
   * A missing column is worth saying plainly here rather than as a server error after an
   * upload — and Excel's byte-order mark is stripped so a column that is visibly present
   * does not read as missing.
   */
  function readImportFile(file) {
    if (!/\.csv$/i.test(file.name) && file.type !== "text/csv") {
      showMsg("That is not a .csv file. Save the sheet as CSV and try again.", "error");
      return;
    }

    var reader = new FileReader();
    reader.onerror = function () {
      showMsg("The file could not be read. Try saving it again as CSV.", "error");
    };
    reader.onload = function (e) {
      var text = String(e.target.result || "").replace(/^\uFEFF/, "");
      importFileName = file.name;
      renderFileCheck(text, file);
    };
    reader.readAsText(file);
  }

  function renderFileCheck(text, file) {
    var spec = currentImportSpec();
    var lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n")
      .filter(function (l) { return l.trim() !== ""; });

    if (lines.length < 2) {
      importCsvText = null;
      $("ti-filecard").innerHTML = '<div class="file-card bad"><div>' +
        '<div class="file-name">' + escapeHtml(file.name) + "</div>" +
        '<div class="file-meta">The file needs a header row and at least one row of data.</div>' +
        "</div></div>";
      $("btn-ti-preview").disabled = true;
      $("btn-ti-clear").style.display = "";
      $("ti-drop").style.display = "none";
      return;
    }

    // Header comparison is by name, not position — column order does not matter.
    var found = lines[0].split(",").map(function (h) {
      return h.trim().replace(/^"|"$/g, "");
    });
    var expected = spec.header.split(",");
    var missing = spec.required.filter(function (c) { return found.indexOf(c) === -1; });
    var extra = found.filter(function (c) { return expected.indexOf(c) === -1 && c !== ""; });
    var ok = missing.length === 0;

    importCsvText = ok ? text : null;
    $("btn-ti-preview").disabled = !ok;
    $("btn-ti-clear").style.display = "";
    $("ti-drop").style.display = "none";

    var chips = expected.map(function (c) {
      var present = found.indexOf(c) !== -1;
      var isRequired = spec.required.indexOf(c) !== -1;
      var cls = present ? "col-ok" : (isRequired ? "col-missing" : "col-extra");
      return '<span class="col-chip ' + cls + '">' + escapeHtml(c) +
        (present ? "" : (isRequired ? " ✕" : " –")) + "</span>";
    }).join("") +
      extra.map(function (c) {
        return '<span class="col-chip col-extra">' + escapeHtml(c) + " (ignored)</span>";
      }).join("");

    $("ti-filecard").innerHTML = '<div class="file-card' + (ok ? "" : " bad") + '"><div style="flex:1;">' +
      '<div class="file-name">' + escapeHtml(file.name) + "</div>" +
      '<div class="file-meta">' + (lines.length - 1) + " data row(s) · " +
        Math.max(1, Math.round(file.size / 1024)) + " KB" +
        (ok ? "" : ' · <b style="color:var(--st-critical);">missing required column(s): ' +
          escapeHtml(missing.join(", ")) + "</b>") + "</div>" +
      '<div style="margin-top:8px;">' + chips + "</div>" +
      (ok ? "" : '<div class="file-meta" style="margin-top:8px;">Add the missing column(s) to ' +
        "the header row and choose the file again. Column order does not matter.</div>") +
      "</div></div>";
  }

  $("btn-ti-close").addEventListener("click", function () {
    $("tallyimport-modal-backdrop").classList.remove("show");
  });

  $("btn-ti-preview").addEventListener("click", function () {
    if (!importCsvText) { showMsg("Choose a CSV file first.", "error"); return; }

  function renderTallyPreview(result) {
    var rec = result.reconciliation;
    var ok = result.valid.length;

    // Column set differs per import; keep the preview honest to what will actually be written.
    var head, body;
    if (result.kind === "Customer") {
      head = "<tr><th>Line</th><th>Customer</th><th>GSTIN</th>" +
        '<th class="num">Credit Limit</th><th>Action</th></tr>';
      body = result.valid.map(function (r) {
        return "<tr><td>" + r.line + "</td><td>" + escapeHtml(r.name) + "</td>" +
          '<td class="mono" style="font-size:11.5px;">' + escapeHtml(r.gstin || "—") + "</td>" +
          '<td class="num mono">' + (r.creditLimit === "" ? "—" : fmt(r.creditLimit)) + "</td>" +
          '<td><span class="badge ' + (r.action === "Create" ? "badge-new" : "badge-followup") +
            '">' + r.action + "</span></td></tr>";
      }).join("");
    } else if (result.kind === "OpeningStock") {
      head = "<tr><th>Line</th><th>Item</th><th>Description</th><th class=\"num\">Qty</th></tr>";
      body = result.valid.map(function (r) {
        return "<tr><td>" + r.line + "</td>" +
          '<td class="mono">' + escapeHtml(r.itemCode) + "</td>" +
          "<td>" + escapeHtml(r.description || "") + "</td>" +
          '<td class="num mono">' + escapeHtml(r.qty) + "</td></tr>";
      }).join("");
    } else {
      head = "<tr><th>Line</th><th>Invoice</th><th>Date</th><th>Customer</th>" +
        '<th class="num">Amount</th><th class="num">Balance</th></tr>';
      body = result.valid.map(function (r) {
        return "<tr><td>" + r.line + "</td>" +
          '<td class="mono">' + escapeHtml(r.invoiceNo) + "</td>" +
          "<td>" + escapeHtml(r.invoiceDate) + "</td>" +
          "<td>" + escapeHtml(r.customerName) + "</td>" +
          '<td class="num mono">' + fmt(r.amount) + "</td>" +
          '<td class="num mono">' + fmt(r.balance) + "</td></tr>";
      }).join("");
    }

    $("ti-preview").innerHTML =
      '<div class="grid grid-3" style="margin:14px 0;">' +
        '<div class="kpi-card"><div class="kpi-label">Rows Read</div>' +
          '<div class="kpi-value">' + result.totalRows + "</div></div>" +
        '<div class="kpi-card"><div class="kpi-label">Will Import</div>' +
          '<div class="kpi-value">' + ok + "</div>" +
          '<div class="kpi-sub">' + escapeHtml(rec.detail || "") + "</div></div>" +
        '<div class="kpi-card' + (result.errors.length ? " alert" : "") + '">' +
          '<div class="kpi-label">Rejected</div>' +
          '<div class="kpi-value">' + result.errors.length + "</div></div>" +
      "</div>" +
      (rec.total !== undefined
        ? '<div class="compare-strip" style="margin-bottom:14px;"><b>' + escapeHtml(rec.label) +
          ": " + (result.kind === "OpeningStock" ? escapeHtml(String(rec.total)) + " units" : fmt(rec.total)) +
          "</b> — check this against the same total in Tally before you go live. If the two " +
          "disagree, something is wrong with the export and it is much cheaper to find out now.</div>"
        : "") +
      (ok ? '<div class="card" style="padding:0; overflow-x:auto; max-height:280px;"><table>' +
        "<thead>" + head + "</thead><tbody>" + body + "</tbody></table></div>" : "") +
      (result.errors.length
        ? '<div class="card-title" style="margin-top:16px;">Rejected rows</div>' +
          '<div class="card" style="padding:0; overflow-x:auto; max-height:220px;"><table>' +
          "<thead><tr><th>Line</th><th></th><th>Why</th></tr></thead><tbody>" +
          result.errors.map(function (e) {
            return "<tr><td>" + e.line + "</td>" +
              '<td class="mono" style="font-size:11.5px;">' + escapeHtml(e.key || "—") + "</td>" +
              '<td style="color:var(--st-critical);">' + escapeHtml(e.message) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : "");

    $("btn-ti-commit").style.display = ok ? "" : "none";
  }

   * The logo is stored in the sheet as a data URI, not as a link.
   *
   * A link has to be publicly readable to survive the trip through Apps Script's PDF
   * converter, which means either hosting it or opening a Drive file to anyone who has the
   * address. Embedding the bytes avoids both, and the picture cannot later break because
   * someone moved a file. The cost is a size limit, which is what the downscale below is for.
   */
  // Roughly twice the size each is printed at, so it stays crisp on paper. The old logo cap of
  // 320x160 was the reason the mark came out a third the height of theirs.
  var IMAGE_LIMITS = {
    logo:    { w: 400, h: 300 },
    partner: { w: 320, h: 180 },
    seal:    { w: 300, h: 200 },
    // Printed across the page, so it keeps more width than a logo.
    compressor: { w: 900, h: 340 },
    airsystem: { w: 900, h: 340 },
    placement: { w: 900, h: 340 }

  function readImageAsDataUri(file, maxW, maxH, done, fail) {
    if (!/^image\//.test(file.type)) {
      fail("That is not an image. A PNG or JPG is what's wanted here.");
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () { fail("The file could not be read."); };
    reader.onload = function (e) {
      var img = new Image();
      img.onerror = function () { fail("That image could not be opened — is the file damaged?"); };
      img.onload = function () {
        var scale = Math.min(1, maxW / img.width, maxH / img.height);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        // PNG keeps a transparent background, which a logo dropped onto a letterhead needs.
        var uri = canvas.toDataURL("image/png");
        if (uri.length > 48000) {
          // Fall back to JPEG on a white ground rather than refuse a photographed seal.
          var flat = document.createElement("canvas");
          flat.width = w; flat.height = h;
          var fx = flat.getContext("2d");
          fx.fillStyle = "#fff"; fx.fillRect(0, 0, w, h);
          fx.drawImage(img, 0, 0, w, h);
          // A photograph — the compressor range — can need a little more squeezing than that.
          [0.82, 0.72, 0.62, 0.52].some(function (q) {
            uri = flat.toDataURL("image/jpeg", q);
            return uri.length <= 48000;
          });
        }
        if (uri.length > 48000) {
          fail("Even after resizing, that image is too large to store. Try a simpler PNG.");
          return;
        }
        done(uri, w, h);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

            "cutover uses), and a copy worth keeping outside. Attachments are not in it: they " +
            "stay on the server. <b>It holds the whole business, user passwords (scrambled) " +
            "included \u2014 keep it somewhere safe and delete it when you are done.</b>" +
          "</div>" +

            "Download All Data (.zip)</button>"
        : "") +
      '<div id="sys-result"></div>' +
      (currentUser.role === "ERP Admin"
        ? '<div id="sys-gate" style="margin-top:22px;"></div>' : ""));

  /**
   * Downloads every record as one .zip, straight from the server.
   *
   * Not through `srv`: the answer is a file, not JSON. The server still checks the session
   * and the role first (authorizeDataExport), and a refusal comes back in words.
   */
  function exportAllData() {
    var done = busyButton("btn-export-all", "Preparing the file\u2026");
    fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: sessionToken })
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (b) {
          throw new Error((b && b.error) || ("The server answered " + res.status + "."));
        });
      }
      var named = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "");
      var rows = Number(res.headers.get("X-Export-Rows")) || 0;
      var tables = Number(res.headers.get("X-Export-Tables")) || 0;
      return res.blob().then(function (blob) {
        return { blob: blob, name: named ? named[1] : "ERP data export.zip", rows: rows,
                 tables: tables };
      });
    }).then(function (r) {
      done();
      var url = URL.createObjectURL(r.blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = r.name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      var mb = r.blob.size / (1024 * 1024);
      showMsg("Downloaded " + r.name + " \u2014 " + fmtInt(r.rows) + " records from " +
        r.tables + " tables, " + (mb < 1 ? Math.max(1, Math.round(r.blob.size / 1024)) + " KB"
          : mb.toFixed(1) + " MB") + ". Keep it somewhere safe.", "success");
    }).catch(function (err) {
      done();
      showMsg("The export did not download. " + ((err && err.message) || ""), "error");
    });
  }

  /**
   * The deeper clear-out, for when the parts left behind are held only by trial documents.
   *
   * The plan is fetched and shown *before* the confirmation is asked for, not after. What
   * this removes is not guessable from the button — a quotation by number, a count of ledger
   * rows — and nobody should be typing a confirmation phrase against a description they have
   * not read.
   */
  function purgeSparesDeepNow() {
    $("sys-result").innerHTML = '<p style="font-size:12.5px; margin-top:14px;">Working out what this would remove…</p>';
    srv.withSuccessHandler(function (plan) {
      var quoteLines = plan.quotations.map(function (q) {
        return "<li>quotation <span class=\"mono\">" + escapeHtml(q.quoteNo) + "</span> (" +
          escapeHtml(quoteStatusLabel(q.status)) + ")</li>";
      }).join("");

      $("sys-result").innerHTML = '<div class="card" style="margin-top:14px; font-size:12.5px;">' +
        "<b>This would remove:</b>" +
        '<ul style="margin:8px 0 0 18px; padding:0;">' +
          "<li>" + plan.spares + " spare(s), with their prices, compatibility and substitutes</li>" +
          (plan.stockMovements ? "<li>" + plan.stockMovements + " stock movement(s)</li>" : "") +
          (plan.reservations ? "<li>" + plan.reservations + " stock reservation(s)</li>" : "") +
          (plan.enquiryLines ? "<li>" + plan.enquiryLines + " enquiry line(s)</li>" : "") +
          quoteLines +
        "</ul>" +
        (plan.blocked.length
          ? '<div class="msg msg-error show" style="margin-top:12px; position:static;">' +
            "<span class=\"msg-text\"><b>It will not run.</b> " + plan.blocked.length +
            " committed record(s) refer to these parts — " +
            escapeHtml(plan.blocked.slice(0, 5).join(", ")) +
            (plan.blocked.length > 5 ? ", and others" : "") +
            ". Those are records of what actually happened, so they are never swept away by " +
            "a clear-out. Use Clear Spare Catalogue instead: the parts they name are " +
            "deactivated rather than deleted, and everything else still goes.</span></div>"
          : '<p style="margin:12px 0 0;">Nothing here is a committed record — no order, ' +
            "goods receipt, dispatch or invoice names these parts.</p>") +
        "</div>";

      if (plan.blocked.length) {
        showMsg("Cannot run — committed records refer to these parts.", "error");
        return;
      }

      // The dialog carries its own summary rather than pointing at the card behind it: the
      // modal covers that card, and a confirmation phrase should never be typed against a
      // description the person cannot see while typing it.
      var parts = [plan.spares + " spare(s)"];
      if (plan.stockMovements) parts.push(plan.stockMovements + " stock movement(s)");
      if (plan.reservations) parts.push(plan.reservations + " reservation(s)");
      if (plan.enquiryLines) parts.push(plan.enquiryLines + " enquiry line(s)");
      if (plan.quotations.length) {
        parts.push(plan.quotations.length + " quotation(s) — " +
          plan.quotations.map(function (q) { return q.quoteNo; }).join(", "));
      }

      askDialog({
        title: "Delete the spares and these documents?",
        message: "This removes " + parts.join(", ") + ", along with their prices, " +
          "compatibility and substitute rows. It cannot be undone from the app — the Sheet's " +
          "own version history is the only way back. Type DELETE SPARES AND DOCUMENTS to " +
          "confirm.",
        input: true, inputLabel: "Confirmation", okLabel: "Delete everything listed", danger: true
      }, function (typed) {
        if (typed === null) return;
        if (String(typed).trim().toUpperCase() !== "DELETE SPARES AND DOCUMENTS") {
          showMsg("Not confirmed — nothing was deleted.", "error");
          return;
        }
        $("sys-result").innerHTML = '<p style="font-size:12.5px; margin-top:14px;">Clearing…</p>';
        srv.withSuccessHandler(function (res) {
          catalogLoaded.spares = false;
          $("sys-result").innerHTML = '<div class="card" style="margin-top:14px; font-size:12.5px;">' +
            "<b>Done.</b> " + res.deleted + " spare(s) deleted, with " + res.prices +
            " price record(s), " + res.compatibility + " compatibility row(s), " +
            res.alternates + " substitute link(s), " + res.stockMovements +
            " stock movement(s), " + res.reservations + " reservation(s) and " +
            res.enquiryLines + " enquiry line(s)." +
            (res.quotations.length
              ? "<div style=\"margin-top:8px;\">Quotations discarded: " +
                escapeHtml(res.quotations.join(", ")) + "</div>"
              : "") +
            '<div style="margin-top:10px;">The catalogue is empty. Import from Masters → ' +
            "Catalog → Bulk Upload.</div></div>";
          showMsg(res.deleted + " spare(s) and their documents removed.", "success");
        }).withFailureHandler(function (err) {
          $("sys-result").innerHTML = "";
          onServerError(err);
        }).purgeSparesWithDocuments("DELETE SPARES AND DOCUMENTS");
      });
    }).withFailureHandler(function (err) {
      $("sys-result").innerHTML = "";
      onServerError(err);
    }).planSparePurge();
  }

  // ---------------- Boot ----------------
  function onBootSuccess(user) {
    bootWaited();
    currentUser = user;
    if (user.appName) {
      $("app-name").textContent = user.appName;
      $("app-subtitle").textContent = user.appSubtitle || "";
      $("app-mark").textContent = user.appMark || "";
      $("app-footer").textContent = user.appName + " — internal tool." +
        (user.build ? "  ·  build " + user.build : "");
      document.title = user.appName;
    }
    var initials = String(user.name || user.email || "?").trim().split(/\s+/)
      .slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join("");
    // The chevron and the Sign out beside it are the whole point. This corner used to be a
    // label that happened to be clickable, so the only way out of the portal was to already
    // know it was there — which for a sign-out is not a discoverable place to hide one.
    $("whoami").innerHTML =
      '<span class="user-avatar" title="' + escapeHtml(user.name + " — " + user.role) + '">' +
        escapeHtml(initials) + "</span>" +
      '<span class="user-meta"><b>' + escapeHtml(user.name) + "</b>" +
        "<span>" + escapeHtml(user.role) + "</span></span>" +
      '<span class="whoami-caret" aria-hidden="true">▾</span>' +
      '<button class="btn-signout" id="btn-signout" type="button" ' +
        'title="Sign out of the portal">Sign out</button>';
    renderTabs();
    // ERP 2.0's Ask bar (AiCommands.gs), in the top bar once there is somebody to ask for.
    if (FACE_V2) aiMount(user);
    $("boot-screen").style.display = "none";
    $("signin-screen").style.display = "none";
    $("app").style.display = "block";

    $("whoami").addEventListener("click", openAccountMenu);
    // Its own button, so leaving does not go through a menu that also offers a password
    // change. The stopPropagation keeps the menu from opening behind it.
    $("btn-signout").addEventListener("click", function (e) {
      e.stopPropagation();
      signOut();
    });
    // A password somebody else chose is a way in, not a password — so this is not dismissable.
    if (pendingPasswordChange) { openPasswordModal(true); return; }

    // A section that appears on the printed offer without warning is unsettling, so say which
    // one arrived with the deployment and where it is edited.
    if (user.installedSections && user.installedSections.length) {
      var named = user.installedSections.map(qtplSectionLabel).join(", ");
      showMsg("This build added " + (user.installedSections.length === 1
        ? "a standard quotation section" : "standard quotation sections") + " — " + named +
        ". Edit the wording under Settings → Quotation Text.", "success", true);
    }
  }

  /**
   * A dead end, shown rather than a sign-in box.
   *
   * There is nothing the person at the keyboard can type to get past this one: the browser
   * is signed in to the wrong Google account, and offering a password would be inviting
   * them to try passwords against a door that is not the one that is shut.
   */
  function showBlocked(text) {
    $("boot-screen").style.display = "none";
    $("signin-screen").style.display = "none";
    $("error-screen").style.display = "flex";
    $("error-text").textContent = String(text).replace(/^.*GOOGLE_ACCOUNT_BLOCKED:\s*/, "");
  }

  function onBootFailure(err) {
    bootWaited();
    var text = err && err.message ? err.message : String(err);
    // No session, or one that has lapsed, is not a fault — it is somebody arriving.
    if (/SESSION_ENDED/.test(text)) { showSignIn(""); return; }
    if (/GOOGLE_ACCOUNT_BLOCKED/.test(text)) { showBlocked(text); return; }
    $("boot-screen").style.display = "none";
    $("error-screen").style.display = "flex";
    $("error-text").textContent = text;
  }

  /** Clicking your own name: change the password, or leave. */
  function openAccountMenu() {
    askDialog({
      title: currentUser.name,
      message: (currentUser.username || currentUser.email) + " · " + currentUser.role +
        (currentUser.businessStream && currentUser.businessStream !== "All"
          ? " · " + currentUser.businessStream : ""),
      options: [{ value: "password", label: "Change my password" },
                { value: "signout", label: "Sign out" }],
      optionsLabel: "What would you like to do?",
      okLabel: "Go"
    }, function (choice) {
      if (choice === "password") { openPasswordModal(false); return; }
      if (choice === "signout") signOut();
    });
  }

  /** Leaving, from the menu or from the button beside your name. */
  function signOut() {
    var token = sessionToken;
    rememberSession(null);
    // Told to forget it server-side too, so a token copied from this browser is dead.
    runner({ ok: function () {}, fail: function () {} }).logout(token);
    // The next person to sign in on this browser starts on their own first screen, not on
    // the one the last person left open.
    if (URL_ROUTING) {
      currentView = null;
      showPath("/", false);
      if (currentUser && currentUser.appName) document.title = currentUser.appName;
    }
    showSignIn("You have signed out.");
  }

  // ---------------- Signing in ----------------
  /**
   * The sign-in screen, and the only place a password is handled.
   *
   * `login` is called on google.script.run directly rather than through `srv`, because srv
   * sends a session token and the whole point of this call is that there is not one yet.
   */
  function showSignIn(message) {
    $("boot-screen").style.display = "none";
    $("app").style.display = "none";
    $("error-screen").style.display = "none";
    $("signin-screen").style.display = "flex";
    $("signin-msg").innerHTML = message
      ? '<div class="msg msg-error show" style="position:static; margin-bottom:14px;">' +
        '<span class="msg-text">' + escapeHtml(message) + "</span></div>"
      : "";
    $("signin-password").value = "";
    paintGoogleSignIn();
    ($("signin-email").value ? $("signin-password") : $("signin-email")).focus();
  }

  // ---------------- The Google account in front of the password ----------------
  /**
   * What Google said, on the way in.
   *
   * By the time this page exists, the Google half is already over: the server either did not
   * ask for one, or sent the browser to Google and back and put the result here. So there is
   * no button to press and nothing to decide — only a value to carry into the sign-in call,
   * where the server spends it. Editing it here buys nothing: the server issued it, holds
   * it, and will not accept anything it did not issue.
   */
  var googlePass = (typeof window.GOOGLE_PASS === "string") ? window.GOOGLE_PASS : "";

  // Asked for once per page, not once per showing of the screen: the answer cannot change
  // without a reload, and each ask mints a one-time value the server has to remember.
  var googleLinkAsked = false;

  function paintGoogleSignIn() {
    var wrap = $("signin-google");
    if (!wrap) return;

    if (googlePass) {
      // The trip is already made. Nothing to press, only a note saying whose account got here.
      wrap.style.display = "";
      $("signin-google-link").style.display = "none";
      $("signin-google-note").textContent =
        "Signed in with Google. Now enter your portal username and password.";
      return;
    }

    if (googleLinkAsked) return;
    googleLinkAsked = true;
    runner({
      ok: function (link) {
        if (!link || !link.offered || googlePass) return;
        wrap.style.display = "";
        var a = $("signin-google-link");
        a.href = link.url;
        a.style.display = "inline-block";
        $("signin-google-note").textContent =
          "Optional here. Sign in with Google as well if this portal is to be restricted to " +
          "the company's own accounts.";
      },
      fail: function () { /* not configured, or offline: the password box stands */ }
    }).googleGateSignInLink();
  }

  function attemptSignIn() {
    // The server takes an email here too, for anybody who learnt to sign in that way before
    // usernames existed. The box asks for a username because that is what people have.
    var login = $("signin-email").value.trim();
    var password = $("signin-password").value;
    if (!login || !password) { showSignIn("Enter your username and password."); return; }

    var btn = $("btn-signin");
    btn.disabled = true; btn.textContent = "Signing in…";
    var restore = function () { btn.disabled = false; btn.textContent = "Sign in"; };

    runner({
      ok: function (result) {
        restore();
        rememberSession(result.token);
        $("signin-screen").style.display = "none";
        $("boot-screen").style.display = "flex";
        // A password an admin set is a way in, not a password. Change it before anything else.
        pendingPasswordChange = !!result.user.mustChangePassword;
        init();
      },
      fail: function (err) {
        restore();
        var text = (err && err.message) ? err.message : String(err);
        if (/GOOGLE_ACCOUNT_BLOCKED/.test(text)) {
          // Only the Google half failed or lapsed. A wrong password leaves the pass alone,
          // so this really does mean starting again at Google, and reloading is what does it.
          googlePass = "";
          text = text.replace(/^.*GOOGLE_ACCOUNT_BLOCKED:\s*/, "") +
            " Reload the page to start again.";
        }
        showSignIn(text);
      }
    }).login(login, password, googlePass);
  }

  $("btn-signin").addEventListener("click", attemptSignIn);
  ["signin-email", "signin-password"].forEach(function (id) {
    $(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") attemptSignIn();
    });
  });

  // ---------------- Changing a password ----------------
  var pendingPasswordChange = false;

  function openPasswordModal(forced) {
    $("password-modal-title").textContent = forced
      ? "Choose your own password" : "Change your password";
    $("password-modal-sub").textContent = forced
      ? "Your ERP Admin set the one you just used. Pick one only you know."
      : "";
    $("btn-pw-cancel").style.display = forced ? "none" : "";
    $("password-modal-msg").innerHTML = "";
    $("pw-current").value = ""; $("pw-new").value = ""; $("pw-confirm").value = "";
    $("password-modal-backdrop").classList.add("show");
    $("pw-current").focus();
  }

  function passwordModalError(text) {
    $("password-modal-msg").innerHTML =
      '<div class="msg msg-error show" style="position:static; margin-bottom:14px;">' +
      '<span class="msg-text">' + escapeHtml(text) + "</span></div>";
  }

  $("btn-pw-cancel").addEventListener("click", function () {
    $("password-modal-backdrop").classList.remove("show");
  });

  $("btn-pw-save").addEventListener("click", function () {
    var next = $("pw-new").value;
    if (next !== $("pw-confirm").value) {
      passwordModalError("The two new passwords are not the same."); return;
    }
    var btn = $("btn-pw-save");
    btn.disabled = true; btn.textContent = "Changing…";
    var restore = function () { btn.disabled = false; btn.textContent = "Change password"; };

    srv.withSuccessHandler(function (result) {
      restore();
      // Changing a password ends every session, including this one — the server hands back a
      // fresh token so the person is not thrown out of the screen in front of them.
      rememberSession(result.token);
      pendingPasswordChange = false;
      $("password-modal-backdrop").classList.remove("show");
      showMsg("Password changed.", "success");
    }).withFailureHandler(function (err) {
      restore();
      passwordModalError(err && err.message ? err.message : String(err));
    }).changeMyPassword($("pw-current").value, next);
  });

  /**
   * Four seconds is the point at which a silent screen stops reading as "loading" and starts
   * reading as "broken". Shown then rather than immediately, so the usual warm load — which
   * is well under a second — never mentions a slowness nobody experienced.
   */
  var bootSlowTimer = null;
  function bootWaited() {
    if (bootSlowTimer) { clearTimeout(bootSlowTimer); bootSlowTimer = null; }
    var el = $("boot-slow");
    if (el) el.style.display = "none";
  }

  function init() {
    if (!sessionToken) { showSignIn(""); return; }
    $("signin-screen").style.display = "none";
    $("boot-screen").style.display = "flex";
    bootSlowTimer = setTimeout(function () {
      var el = $("boot-slow");
      if (el) el.style.display = "";
    }, 4000);
    srv.withSuccessHandler(onBootSuccess).withFailureHandler(onBootFailure).bootstrap();
  }

  init();
})();
</script>
