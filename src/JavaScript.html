  function loadOrders() {
    google.script.run.withSuccessHandler(function (rows) {
      ordersCache = rows; renderOrders();
    }).withFailureHandler(onServerError).listSalesOrders({
      mineOnly: $("orders-mine").checked,
      includeClosed: $("orders-closed").checked,
      creditHoldOnly: $("orders-hold").checked
    });
  }

  $("orders-search").addEventListener("input", renderOrders);
  $("orders-mine").addEventListener("change", loadOrders);
  $("orders-hold").addEventListener("change", loadOrders);
  $("orders-closed").addEventListener("change", loadOrders);

  function renderOrders() {
    var q = ($("orders-search").value || "").toLowerCase();
    var rows = ordersCache.filter(function (o) {
      return [o.orderNo, o.poNo, o.customerName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var holds = ordersCache.filter(function (o) { return o.creditHold || o.orderStatus === "Credit Hold"; });
    var ready = ordersCache.filter(function (o) { return o.orderStatus === "Ready for Dispatch"; });
    var late = ordersCache.filter(function (o) { return o.overdueDispatch; });
    $("orders-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Open Orders</div><div class="kpi-value">' + ordersCache.length + "</div></div>" +
      '<div class="kpi-card' + (holds.length ? " alert" : "") + '"><div class="kpi-label">Credit Holds</div><div class="kpi-value">' + holds.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Ready for Dispatch</div><div class="kpi-value">' + ready.length + "</div></div>" +
      '<div class="kpi-card' + (late.length ? " alert" : "") + '"><div class="kpi-label">Past Promised Date</div><div class="kpi-value">' + late.length + "</div></div>" +
      "</div>";

    if (!rows.length) {
      $("orders-tbody").innerHTML = '<tr><td colspan="8"><div class="empty">' +
        (ordersCache.length ? "No orders match your search." : "No orders yet — convert a won quotation.") +
        "</div></td></tr>";
      return;
    }

    $("orders-tbody").innerHTML = rows.map(function (o) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(o.orderNo) + "</td>" +
        "<td>" + escapeHtml(o.date) + "</td>" +
        "<td>" + escapeHtml(o.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(o.poNo || "—") +
          (String(o.poVerified).toUpperCase() === "FALSE" ? ' <span class="badge badge-overdue">PO variance</span>' : "") + "</td>" +
        '<td class="num mono">' + fmt(o.grand) + "</td>" +
        '<td><span class="badge ' + (ORDER_BADGE[o.orderStatus] || "badge-draft") + '">' +
          escapeHtml(o.orderStatus) + "</span></td>" +
        "<td>" + (o.promisedDispatchDate
          ? (o.overdueDispatch ? '<span class="badge badge-overdue">' + escapeHtml(o.promisedDispatchDate) + "</span>" : escapeHtml(o.promisedDispatchDate))
          : "—") + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-order="' + o.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("orders-tbody").querySelectorAll("[data-open-order]").forEach(function (btn) {
      btn.addEventListener("click", function () { openOrderModal(btn.dataset.openOrder); });
    });
  }

  // ---- Create from quotation ----
  $("btn-new-order").addEventListener("click", function () {
    google.script.run.withSuccessHandler(function (quotes) {
      if (!quotes.length) {
        showMsg("No won quotations are waiting to be converted. Mark a quotation Won first.", "error");
        return;
      }
      $("no-quotation").innerHTML = quotes.map(function (q) {
        return '<option value="' + q.id + '" data-grand="' + q.grand + '">' +
          escapeHtml(q.quoteNo + " " + (q.revision || "") + " · " + q.customerName + " · " + fmt(q.grand)) +
          "</option>";
      }).join("");
      $("no-pono").value = "";
      $("no-podate").value = new Date().toISOString().slice(0, 10);
      $("no-povalue").value = quotes[0].grand;
      $("no-advance").value = "";
      $("no-promised").value = "";
      $("no-attachment").value = "";
      $("neworder-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).listConvertibleQuotations();
  });

  // Default the PO value to the quoted total, so a variance is a deliberate act.
  $("no-quotation").addEventListener("change", function () {
    var opt = $("no-quotation").selectedOptions[0];
    if (opt) $("no-povalue").value = opt.dataset.grand;
  });

  $("btn-cancel-neworder").addEventListener("click", function () {
    $("neworder-modal-backdrop").classList.remove("show");
  });

  $("btn-save-neworder").addEventListener("click", function () {
    if (!$("no-pono").value.trim()) { showMsg("Enter the customer's PO number.", "error"); return; }
    google.script.run.withSuccessHandler(function (order) {
      $("neworder-modal-backdrop").classList.remove("show");
      loadOrders();
      openOrder = order;
      renderOrderModal();
      $("order-modal-backdrop").classList.add("show");
      showMsg("Order " + order.orderNo + " created.", "success");
    }).withFailureHandler(onServerError).createOrderFromQuotation({
      quotationId: $("no-quotation").value,
      poNo: $("no-pono").value.trim(),
      poDate: $("no-podate").value,
      poValue: $("no-povalue").value,
      advanceRequired: $("no-advance").value,
      promisedDispatchDate: $("no-promised").value,
      poAttachmentUrl: $("no-attachment").value.trim()
    });
  });

  // ---- Order detail ----
  $("btn-cancel-order").addEventListener("click", function () {
    $("order-modal-backdrop").classList.remove("show");
    loadOrders();
  });

  function openOrderModal(id) {
    google.script.run.withSuccessHandler(function (o) {
      openOrder = o;
      renderOrderModal();
      $("order-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).getSalesOrder(id);
  }

  function renderOrderModal() {
    var o = openOrder;
    if (!o) return;
    var editable = canEditOrders() && o.orderStatus !== "Closed";

    $("order-modal-title").textContent = o.orderNo + " — " + (o.customerName || "");
    $("om2-sub").textContent = o.businessStream + " · " + o.orderStatus + " · " + fmt(o.grand);
    $("om2-id").value = o.id;

    $("om2-credit-banner").innerHTML = o.creditHold
      ? '<div class="msg msg-error show" style="margin-bottom:14px;"><span class="msg-text">' +
        "<b>On credit hold.</b> " + escapeHtml(o.creditHoldReason || "") +
        (canReleaseCredit()
          ? " You can release it below."
          : " Management must release it before dispatch.") +
        "</span></div>"
      : "";

    $("om2-variance-banner").innerHTML = String(o.poVerified).toUpperCase() === "FALSE"
      ? '<div class="compare-strip" style="margin-bottom:14px;"><b>PO variance:</b> ' +
        escapeHtml(o.poVarianceNotes || "") + "</div>"
      : "";

    $("om2-pono").value = o.poNo || "";
    $("om2-podate").value = o.poDate || "";
    $("om2-povalue").value = o.poValue !== "" ? o.poValue : "";
    $("om2-paymentterms").value = o.paymentTerms || "";
    $("om2-advreq").value = o.advanceRequired !== "" ? o.advanceRequired : "";
    $("om2-advrec").value = o.advanceReceived !== "" ? o.advanceReceived : "";
    $("om2-promised").value = o.promisedDispatchDate || "";
    $("om2-attachment").value = o.poAttachmentUrl || "";
    $("om2-notes").value = o.notes || "";

    ["om2-pono", "om2-podate", "om2-povalue", "om2-paymentterms", "om2-advreq",
     "om2-advrec", "om2-promised", "om2-attachment", "om2-notes"].forEach(function (f) {
      $(f).disabled = !editable;
    });
    $("btn-om2-save").style.display = editable ? "" : "none";

    renderCreditPanel(o);
    renderOrderItems(o);
    renderStatusPanel(o, editable);
    renderCreditChecks(o);
  }

  function renderCreditPanel(o) {
    var latest = o.creditChecks[0];
    if (!latest) {
      $("om2-credit-panel").innerHTML = '<div class="empty" style="padding:14px;">No credit check run yet.</div>';
      return;
    }
    var limit = latest.creditLimit === "" ? null : Number(latest.creditLimit);
    $("om2-credit-panel").innerHTML = '<div class="grid grid-4">' +
      '<div class="kpi-card"><div class="kpi-label">Credit Limit</div><div class="kpi-value" style="font-size:18px;">' +
        (limit === null ? "Not set" : fmt(limit)) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Outstanding Invoices</div><div class="kpi-value" style="font-size:18px;">' +
        fmt(latest.outstandingAmt) + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Open Orders</div><div class="kpi-value" style="font-size:18px;">' +
        fmt(latest.openOrderExposure) + "</div></div>" +
      '<div class="kpi-card' + (latest.result === "Hold" ? " alert" : "") + '">' +
        '<div class="kpi-label">Total Exposure</div><div class="kpi-value" style="font-size:18px;">' +
        fmt(latest.totalExposure) + "</div>" +
        '<div class="kpi-sub">' + (latest.availableCredit === ""
          ? "No limit set"
          : "Available: " + fmt(latest.availableCredit)) + "</div></div>" +
      "</div>";
  }

  function renderOrderItems(o) {
    $("om2-items").innerHTML = o.items.length
      ? '<table><thead><tr><th>#</th><th>Code</th><th>Description</th><th class="num">Qty</th>' +
        '<th class="num">Price</th><th class="num">Line Total</th>' +
        '<th class="num">Reserved</th><th class="num">Dispatched</th></tr></thead><tbody>' +
        o.items.map(function (i) {
          return "<tr><td>" + i.lineNo + '</td><td class="mono">' + escapeHtml(i.itemCode || "—") +
            "</td><td>" + escapeHtml(i.description || "—") +
            '</td><td class="num">' + i.qty +
            '</td><td class="num mono">' + fmt(i.unitPrice) +
            '</td><td class="num mono">' + fmt(i.lineTotal) +
            '</td><td class="num">' + (i.qtyReserved || 0) +
            '</td><td class="num">' + (i.qtyDispatched || 0) + "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty" style="padding:14px;">No items.</div>';
  }

  function renderStatusPanel(o, editable) {
    var zone = $("om2-status-panel");
    var buttons = "";

    if (o.creditHold && canReleaseCredit()) {
      buttons += '<button class="btn btn-sm btn-amber" id="btn-release-hold">Release Credit Hold</button> ';
    }
    if (editable && !o.creditHold && ["Draft", "Approval Pending", "Material Pending"].indexOf(o.orderStatus) !== -1) {
      buttons += '<button class="btn btn-sm btn-amber" id="btn-reserve-stock">Reserve Stock</button> ';
    }
    if (editable && !o.creditHold) {
      buttons += o.allowedTransitions.map(function (st) {
        return '<button class="btn btn-sm" data-order-status="' + st + '">→ ' + st + "</button>";
      }).join(" ");
    }
    if (!buttons) {
      buttons = '<span style="color:var(--ink-soft); font-size:13px;">' +
        (o.orderStatus === "Closed" ? "This order is closed." : "No status change available to you.") +
        "</span>";
    }

    zone.innerHTML = '<p style="font-size:12px; color:var(--ink-soft); margin:0 0 10px;">Current: <b>' +
      escapeHtml(o.orderStatus) + "</b>. Moving to Ready for Dispatch or Dispatched re-runs the " +
      "credit check automatically.</p>" + buttons;

    zone.querySelectorAll("[data-order-status]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var target = btn.dataset.orderStatus;
        google.script.run.withSuccessHandler(function (updated) {
          openOrder = updated; renderOrderModal(); loadOrders();
          showMsg("Order moved to " + target + ".", "success");
        }).withFailureHandler(onServerError).setOrderStatus(o.id, target, "");
      });
    });

    if ($("btn-reserve-stock")) {
      $("btn-reserve-stock").addEventListener("click", function () {
        google.script.run.withSuccessHandler(function (res) {
          openOrderModal(o.id);
          loadOrders();
          var msg = res.reserved.length
            ? "Reserved " + res.reserved.map(function (r) { return r.qty + " × " + r.itemCode; }).join(", ")
            : "Nothing could be reserved";
          if (res.shortfalls.length) {
            msg += ". Short: " + res.shortfalls.map(function (sf) {
              return sf.itemCode + " (need " + sf.shortBy + " more)";
            }).join(", ");
          }
          showMsg(msg + ".", res.shortfalls.length ? "error" : "success");
        }).withFailureHandler(onServerError).reserveStockForOrder(o.id);
      });
    }

    if ($("btn-release-hold")) {
      $("btn-release-hold").addEventListener("click", function () {
        askDialog({
          title: "Release this credit hold?",
          message: "The reason is recorded against the order, the credit check and the " +
            "approvals register. This is a logged commercial exception.",
          input: true, inputLabel: "Reason for release", okLabel: "Release hold", danger: true
        }, function (reason) {
          if (reason === null) return;
          google.script.run.withSuccessHandler(function (updated) {
            openOrder = updated; renderOrderModal(); loadOrders();
            showMsg("Credit hold released.", "success");
          }).withFailureHandler(onServerError).releaseCreditHold(o.id, reason, "Material Pending");
        });
      });
    }
  }

  function renderCreditChecks(o) {
    $("om2-checks").innerHTML = o.creditChecks.length
      ? '<table><thead><tr><th>Date</th><th class="num">Exposure</th><th class="num">Limit</th>' +
        "<th>Result</th><th>Reason / Release</th></tr></thead><tbody>" +
        o.creditChecks.map(function (c) {
          return "<tr><td>" + escapeHtml(c.checkDate) +
            '</td><td class="num mono">' + fmt(c.totalExposure) +
            '</td><td class="num mono">' + (c.creditLimit === "" ? "—" : fmt(c.creditLimit)) +
            "</td><td>" + (c.result === "Hold"
              ? '<span class="badge badge-lost">Hold</span>'
              : '<span class="badge badge-won">Pass</span>') +
            "</td><td>" + escapeHtml(c.holdReason || "—") +
              (c.releasedBy ? '<br><span style="font-size:11px; color:var(--ink-soft);">Released by ' +
                escapeHtml(c.releasedBy) + ": " + escapeHtml(c.releaseNotes || "") + "</span>" : "") +
            "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty" style="padding:14px;">No checks recorded.</div>';
  }

  $("btn-om2-save").addEventListener("click", function () {
    google.script.run.withSuccessHandler(function (updated) {
      openOrder = updated; renderOrderModal(); loadOrders();
      showMsg("Order details saved. Credit check re-run.", "success");
    }).withFailureHandler(onServerError).saveOrderDetails({
      id: openOrder.id,
      poNo: $("om2-pono").value.trim(),
      poDate: $("om2-podate").value,
      poValue: $("om2-povalue").value,
      paymentTerms: $("om2-paymentterms").value.trim(),
      advanceRequired: $("om2-advreq").value,
      advanceReceived: $("om2-advrec").value,
      promisedDispatchDate: $("om2-promised").value,
      poAttachmentUrl: $("om2-attachment").value.trim(),
      notes: $("om2-notes").value.trim()
    });
  });


  // ================= INVENTORY & INWARD =================
  var INV_MODE = "stock";
  var inventoryCache = [];
  var reservationsCache = [];
  var grnsCache = [];
  var serialsCache = [];
  var openGrn = null;
  var grnSearchTimer = null;

  function canDoStores() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initInventoryView() {
    switchInvMode(INV_MODE);
  }

  function switchInvMode(mode) {
    INV_MODE = mode;
    ["stock", "reservations", "inward", "serials"].forEach(function (m) {
      $("subtab-" + m).className = "btn btn-sm" + (m === mode ? " btn-primary" : "");
    });
    $("inv-type").style.display = (mode === "stock") ? "" : "none";
    $("inv-search").placeholder = {
      stock: "Search by code or description…",
      reservations: "Search by order no. or item…",
      inward: "Search by GRN no. or supplier…",
      serials: "Search by serial or product…"
    }[mode];

    var actions = [];
    if (mode === "inward" && canDoStores()) actions.push('<button class="btn btn-amber" id="btn-new-grn">+ New GRN</button>');
    if (mode === "serials" && canDoStores()) actions.push('<button class="btn btn-amber" id="btn-new-serial">+ Add Serial</button>');
    $("inv-actions").innerHTML = actions.join("");
    if ($("btn-new-grn")) $("btn-new-grn").addEventListener("click", function () { openGrnModal(null); });
    if ($("btn-new-serial")) $("btn-new-serial").addEventListener("click", function () { openSerialModal(null); });

    loadInvRows();
  }

  ["stock", "reservations", "inward", "serials"].forEach(function (m) {
    $("subtab-" + m).addEventListener("click", function () { switchInvMode(m); });
  });
  $("inv-search").addEventListener("input", renderInvRows);
  $("inv-type").addEventListener("change", loadInvRows);

  function loadInvRows() {
    if (INV_MODE === "stock") {
      google.script.run.withSuccessHandler(function (rows) {
        inventoryCache = rows; renderInvRows();
      }).withFailureHandler(onServerError).listInventory($("inv-type").value);
    } else if (INV_MODE === "reservations") {
      google.script.run.withSuccessHandler(function (rows) {
        reservationsCache = rows; renderInvRows();
      }).withFailureHandler(onServerError).listReservations({});
    } else if (INV_MODE === "inward") {
      google.script.run.withSuccessHandler(function (rows) {
        grnsCache = rows; renderInvRows();
      }).withFailureHandler(onServerError).listGRNs({ includeVerified: true });
    } else {
      google.script.run.withSuccessHandler(function (rows) {
        serialsCache = rows; renderInvRows();
      }).withFailureHandler(onServerError).listSerialNumbers({});
    }
  }

  function renderInvRows() {
    if (INV_MODE === "stock") renderStock();
    else if (INV_MODE === "reservations") renderReservations();
    else if (INV_MODE === "inward") renderGRNs();
    else renderSerials();
  }

  function renderStock() {
    var q = ($("inv-search").value || "").toLowerCase();
    var rows = inventoryCache.filter(function (r) {
      return [r.code, r.description, r.category].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var lowStock = inventoryCache.filter(function (r) { return r.belowReorder; });
    var value = inventoryCache.reduce(function (sum, r) { return sum + (r.stockValue || 0); }, 0);
    $("inv-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Items</div><div class="kpi-value">' + inventoryCache.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Total Reserved</div><div class="kpi-value">' +
        inventoryCache.reduce(function (sum, r) { return sum + r.reserved; }, 0) + "</div></div>" +
      '<div class="kpi-card' + (lowStock.length ? " alert" : "") + '"><div class="kpi-label">At or Below Reorder</div><div class="kpi-value">' +
        lowStock.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Stock Value</div><div class="kpi-value" style="font-size:18px;">' +
        fmt(value) + "</div></div>" +
      "</div>";

    $("inv-thead").innerHTML = "<tr><th>Code</th><th>Description</th><th>Category</th><th>Bin</th>" +
      '<th class="num">On Hand</th><th class="num">Reserved</th><th class="num">Available</th>' +
      '<th class="num">Reorder</th><th class="num">Value</th></tr>';

    if (!rows.length) {
      $("inv-tbody").innerHTML = '<tr><td colspan="9"><div class="empty">Nothing to show.</div></td></tr>';
      return;
    }

    $("inv-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.code) + "</td>" +
        "<td>" + escapeHtml(r.description || "—") + "</td>" +
        "<td>" + escapeHtml(r.category || "—") + "</td>" +
        "<td>" + escapeHtml(r.binId || "—") + "</td>" +
        '<td class="num">' + r.onHand + "</td>" +
        '<td class="num">' + r.reserved + "</td>" +
        '<td class="num" style="font-weight:600; color:' +
          (r.available > 0 ? "var(--green)" : "var(--red)") + ';">' + r.available + "</td>" +
        '<td class="num">' + (r.reorderLevel === null ? "—" : r.reorderLevel) +
          (r.belowReorder ? ' <span class="badge badge-overdue">Low</span>' : "") + "</td>" +
        '<td class="num mono">' + fmt(r.stockValue) + "</td>" +
        "</tr>";
    }).join("");
  }

  function renderReservations() {
    var q = ($("inv-search").value || "").toLowerCase();
    var rows = reservationsCache.filter(function (r) {
      return [r.orderNo, r.itemCode].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    $("inv-summary").innerHTML = "";
    $("inv-thead").innerHTML = "<tr><th>Order No.</th><th>Item</th><th>Type</th>" +
      '<th class="num">Qty Reserved</th><th>Reserved On</th><th>By</th><th></th></tr>';

    if (!rows.length) {
      $("inv-tbody").innerHTML = '<tr><td colspan="7"><div class="empty">No active reservations. ' +
        "Reserving happens from an order once it is past credit check.</div></td></tr>";
      return;
    }

    $("inv-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.orderNo || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(r.itemCode || "—") + "</td>" +
        "<td>" + escapeHtml(r.itemType) + "</td>" +
        '<td class="num">' + r.qtyReserved + "</td>" +
        "<td>" + escapeHtml(r.reservedDate) + "</td>" +
        "<td>" + escapeHtml(r.reservedBy || "—") + "</td>" +
        '<td class="center">' + (canDoStores()
          ? '<button class="btn btn-sm" data-release-res="' + r.id + '">Release</button>' : "") + "</td>" +
        "</tr>";
    }).join("");

    $("inv-tbody").querySelectorAll("[data-release-res]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({
          title: "Release this reservation?",
          message: "The stock returns to available and can be promised to another order.",
          input: true, inputLabel: "Reason", okLabel: "Release", danger: true
        }, function (reason) {
          if (reason === null) return;
          google.script.run.withSuccessHandler(function () {
            loadInvRows(); showMsg("Reservation released.", "success");
          }).withFailureHandler(onServerError).releaseReservation(btn.dataset.releaseRes, reason);
        });
      });
    });
  }

  function renderGRNs() {
    var q = ($("inv-search").value || "").toLowerCase();
    var rows = grnsCache.filter(function (g) {
      return [g.grnNo, g.supplierName, g.poRef].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var pending = grnsCache.filter(function (g) { return g.verificationStatus !== "Verified"; });
    $("inv-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Total GRNs</div><div class="kpi-value">' + grnsCache.length + "</div></div>" +
      '<div class="kpi-card' + (pending.length ? " alert" : "") + '"><div class="kpi-label">Awaiting Verification</div>' +
        '<div class="kpi-value">' + pending.length + '</div><div class="kpi-sub">Stock is not posted until verified</div></div>' +
      "</div>";

    $("inv-thead").innerHTML = "<tr><th>GRN No.</th><th>Date</th><th>Supplier</th><th>PO Ref</th>" +
      '<th class="num">Lines</th><th>Received By</th><th>Status</th><th></th></tr>';

    if (!rows.length) {
      $("inv-tbody").innerHTML = '<tr><td colspan="8"><div class="empty">No goods received notes yet.</div></td></tr>';
      return;
    }

    $("inv-tbody").innerHTML = rows.map(function (g) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(g.grnNo || "—") + "</td>" +
        "<td>" + escapeHtml(g.grnDate) + "</td>" +
        "<td>" + escapeHtml(g.supplierName || "—") + "</td>" +
        "<td>" + escapeHtml(g.poRef || "—") + "</td>" +
        '<td class="num">' + g.itemCount + "</td>" +
        "<td>" + escapeHtml(g.receivedBy || "—") + "</td>" +
        "<td>" + (g.verificationStatus === "Verified"
          ? '<span class="badge badge-won">Verified</span>'
          : '<span class="badge badge-pending">Awaiting verification</span>') + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-grn="' + g.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("inv-tbody").querySelectorAll("[data-open-grn]").forEach(function (btn) {
      btn.addEventListener("click", function () { openGrnModal(btn.dataset.openGrn); });
    });
  }

  function renderSerials() {
    var q = ($("inv-search").value || "").toLowerCase();
    var rows = serialsCache.filter(function (sn) {
      return [sn.serialNo, sn.productCode, sn.productName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var byStatus = {};
    serialsCache.forEach(function (sn) { byStatus[sn.status] = (byStatus[sn.status] || 0) + 1; });
    $("inv-summary").innerHTML = '<div class="compare-strip" style="margin-bottom:14px;">' +
      ["In Stock", "Reserved", "Dispatched", "Installed"].map(function (st) {
        return '<span class="badge badge-draft" style="margin-right:6px;">' + st + ": " + (byStatus[st] || 0) + "</span>";
      }).join("") + "</div>";

    $("inv-thead").innerHTML = "<tr><th>Serial No.</th><th>Product</th><th>Status</th>" +
      "<th>GRN</th><th>Order</th><th>Recorded</th><th></th></tr>";

    if (!rows.length) {
      $("inv-tbody").innerHTML = '<tr><td colspan="7"><div class="empty">No serials recorded. ' +
        "Verifying a GRN with serial numbers creates them automatically.</div></td></tr>";
      return;
    }

    $("inv-tbody").innerHTML = rows.map(function (sn) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(sn.serialNo) + "</td>" +
        "<td>" + escapeHtml(sn.productName || sn.productCode || "—") + "</td>" +
        '<td><span class="badge ' + (sn.status === "In Stock" ? "badge-active" : "badge-draft") + '">' +
          escapeHtml(sn.status) + "</span></td>" +
        "<td>" + escapeHtml(sn.grnId ? "Yes" : "—") + "</td>" +
        "<td>" + escapeHtml(sn.salesOrderId ? "Allocated" : "—") + "</td>" +
        "<td>" + escapeHtml(sn.createdAt || "—") + "</td>" +
        '<td class="center">' + (canDoStores()
          ? '<button class="btn-ghost" data-edit-serial="' + sn.id + '" title="Edit">✎</button>' : "") + "</td>" +
        "</tr>";
    }).join("");

    $("inv-tbody").querySelectorAll("[data-edit-serial]").forEach(function (btn) {
      btn.addEventListener("click", function () { openSerialModal(btn.dataset.editSerial); });
    });
  }

  // ---- GRN modal ----
  $("btn-grn-close").addEventListener("click", function () {
    $("grn-modal-backdrop").classList.remove("show");
    loadInvRows();
  });

  function openGrnModal(id) {
    if (!id) {
      openGrn = null;
      $("grn-modal-title").textContent = "New Goods Received Note";
      $("grn-no").textContent = "A GRN number is assigned on save.";
      $("grn-id").value = "";
      $("grn-date").value = new Date().toISOString().slice(0, 10);
      ["grn-supplier", "grn-poref", "grn-invoice", "grn-checkedby", "grn-notes"].forEach(function (f) { $(f).value = ""; });
      $("grn-receivedby").value = currentUser.email;
      renderGrnModal();
      $("grn-modal-backdrop").classList.add("show");
      return;
    }
    google.script.run.withSuccessHandler(function (g) {
      openGrn = g;
      renderGrnModal();
      $("grn-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).getGRN(id);
  }

  function renderGrnModal() {
    var g = openGrn;
    var verified = g && g.verificationStatus === "Verified";

    if (g) {
      $("grn-modal-title").textContent = "Goods Received Note";
      $("grn-no").textContent = g.grnNo + " · " + g.supplierName;
      $("grn-id").value = g.id;
      $("grn-date").value = g.grnDate || "";
      $("grn-supplier").value = g.supplierName || "";
      $("grn-poref").value = g.poRef || "";
      $("grn-invoice").value = g.invoiceRef || "";
      $("grn-receivedby").value = g.receivedBy || "";
      $("grn-checkedby").value = g.checkedBy || "";
      $("grn-notes").value = g.notes || "";
    }

    $("grn-status-banner").innerHTML = verified
      ? '<div class="msg msg-success show" style="margin-bottom:14px;"><span class="msg-text">' +
        "<b>Verified</b> by " + escapeHtml(g.verifiedBy) + " on " + escapeHtml(g.verificationDate) +
        ". Stock has been posted and this GRN can no longer be changed.</span></div>"
      : (g ? '<div class="compare-strip" style="margin-bottom:14px;">Stock has <b>not</b> been ' +
        "posted yet. Add what arrived, then verify to move it into stock.</div>" : "");

    ["grn-date", "grn-supplier", "grn-poref", "grn-invoice", "grn-receivedby", "grn-checkedby", "grn-notes"]
      .forEach(function (f) { $(f).disabled = verified || !canDoStores(); });
    $("btn-grn-save").style.display = (verified || !canDoStores()) ? "none" : "";
    $("btn-grn-additem").style.display = (!g || verified || !canDoStores()) ? "none" : "";
    $("btn-grn-verify").style.display = (g && !verified && canDoStores()) ? "" : "none";
    $("grn-item-form").style.display = "none";

    renderGrnItems(g, verified);
  }

  function renderGrnItems(g, verified) {
    if (!g) {
      $("grn-items").innerHTML = '<div class="empty" style="padding:14px;">Save the GRN first, then add what arrived.</div>';
      return;
    }
    $("grn-items").innerHTML = g.items.length
      ? '<table><thead><tr><th>#</th><th>Code</th><th>Description</th><th class="num">Received</th>' +
        '<th class="num">Accepted</th><th class="num">Rejected</th><th>Condition</th><th>Serials</th><th></th></tr></thead><tbody>' +
        g.items.map(function (i) {
          return "<tr><td>" + i.lineNo + '</td><td class="mono">' + escapeHtml(i.itemCode || "—") +
            "</td><td>" + escapeHtml(i.description || "—") +
            '</td><td class="num">' + i.qtyReceived +
            '</td><td class="num">' + i.qtyAccepted +
            '</td><td class="num">' + (Number(i.qtyRejected) || 0) +
            "</td><td>" + escapeHtml(i.condition || "—") +
            "</td><td>" + escapeHtml(i.serialNos || "—") +
            '</td><td class="center">' + (verified ? "" :
              '<button class="btn-ghost" data-del-grni="' + i.id + '" title="Remove">✕</button>') +
            "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty" style="padding:14px;">Nothing recorded yet.</div>';

    $("grn-items").querySelectorAll("[data-del-grni]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({ title: "Remove this line?", okLabel: "Remove", danger: true }, function (ok) {
          if (ok === null) return;
          google.script.run.withSuccessHandler(function (updated) {
            openGrn = updated; renderGrnModal();
          }).withFailureHandler(onServerError).deleteGRNItem(btn.dataset.delGrni);
        });
      });
    });
  }

  $("btn-grn-save").addEventListener("click", function () {
    google.script.run.withSuccessHandler(function (g) {
      openGrn = g; renderGrnModal(); loadInvRows();
      showMsg("GRN " + g.grnNo + " saved.", "success");
    }).withFailureHandler(onServerError).saveGRN({
      id: $("grn-id").value || null,
      grnDate: $("grn-date").value,
      supplierName: $("grn-supplier").value.trim(),
      poRef: $("grn-poref").value.trim(),
      invoiceRef: $("grn-invoice").value.trim(),
      receivedBy: $("grn-receivedby").value.trim(),
      checkedBy: $("grn-checkedby").value.trim(),
      notes: $("grn-notes").value.trim()
    });
  });

  $("btn-grn-additem").addEventListener("click", function () {
    $("grn-item-form").style.display = "";
    $("gi-received").value = "";
    $("gi-accepted").value = "";
    $("gi-serials").value = "";
    $("gi-bin").value = "";
    runGrnItemSearch();
  });
  $("btn-grn-cancelitem").addEventListener("click", function () {
    $("grn-item-form").style.display = "none";
  });
  $("gi-type").addEventListener("change", runGrnItemSearch);
  $("gi-search").addEventListener("input", function () {
    if (grnSearchTimer) clearTimeout(grnSearchTimer);
    grnSearchTimer = setTimeout(runGrnItemSearch, 250);
  });

  function runGrnItemSearch() {
    google.script.run.withSuccessHandler(function (items) {
      $("gi-item").innerHTML = items.map(function (i) {
        return '<option value="' + i.id + '">' + escapeHtml(i.code + " — " + i.description) + "</option>";
      }).join("");
    }).withFailureHandler(onServerError).searchStockItems($("gi-type").value, $("gi-search").value.trim());
  }

  $("btn-grn-saveitem").addEventListener("click", function () {
    if (!$("gi-item").value) { showMsg("Pick the item received.", "error"); return; }
    google.script.run.withSuccessHandler(function (g) {
      openGrn = g; renderGrnModal();
      showMsg("Line added.", "success");
    }).withFailureHandler(onServerError).saveGRNItem({
      grnId: $("grn-id").value,
      itemType: $("gi-type").value,
      itemId: $("gi-item").value,
      qtyReceived: $("gi-received").value,
      qtyAccepted: $("gi-accepted").value,
      condition: $("gi-condition").value,
      serialNos: $("gi-serials").value.trim(),
      binId: $("gi-bin").value.trim()
    });
  });

  $("btn-grn-verify").addEventListener("click", function () {
    askDialog({
      title: "Verify this GRN and post stock?",
      message: "Accepted quantities move into stock and cannot be un-posted — a correction " +
        "afterwards is a stock adjustment, not an edit. Rejected material is not posted.",
      input: true, inputLabel: "Verification notes (optional)", required: false,
      okLabel: "Verify and post"
    }, function (notes) {
      if (notes === null) return;
      google.script.run.withSuccessHandler(function (g) {
        openGrn = g; renderGrnModal(); loadInvRows();
        showMsg("GRN verified — stock posted.", "success");
      }).withFailureHandler(onServerError).verifyGRN($("grn-id").value, notes);
    });
  });

  // ---- Serial modal ----
  $("btn-cancel-serial").addEventListener("click", function () {
    $("serial-modal-backdrop").classList.remove("show");
  });

  function openSerialModal(id) {
    var sn = id ? serialsCache.find(function (x) { return x.id === id; }) : null;
    $("sn-id").value = id || "";
    $("sn-serial").value = sn ? sn.serialNo : "";
    $("sn-status").value = sn ? sn.status : "In Stock";
    $("sn-notes").value = sn ? (sn.notes || "") : "";

    google.script.run.withSuccessHandler(function (products) {
      $("sn-product").innerHTML = products.map(function (p) {
        return '<option value="' + p.id + '"' + (sn && sn.productId === p.id ? " selected" : "") + ">" +
          escapeHtml(p.productCode + " — " + (p.model || "")) + "</option>";
      }).join("");
      $("serial-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).listProducts();
  }

  $("btn-save-serial").addEventListener("click", function () {
    if (!$("sn-serial").value.trim()) { showMsg("Enter the serial number.", "error"); return; }
    google.script.run.withSuccessHandler(function () {
      $("serial-modal-backdrop").classList.remove("show");
      loadInvRows();
      showMsg("Serial saved.", "success");
    }).withFailureHandler(onServerError).saveSerialNumber({
      id: $("sn-id").value || null,
      productId: $("sn-product").value,
      serialNo: $("sn-serial").value.trim(),
      status: $("sn-status").value,
      notes: $("sn-notes").value.trim()
    });
  });

  // ================= DISPATCH & BILLING =================
  var DSP_SUBTABS = ["dispatches", "invoices", "uninvoiced", "tally"];
  var dspMode = "dispatches";
  var dspCache = [];
  var openDispatch = null;
  var openInvoice = null;

  var DISPATCH_BADGE = {
    "Planned": "badge-draft", "Dispatched": "badge-dispatched", "Cancelled": "badge-lost"
  };
  var INVOICE_BADGE = {
    "Draft": "badge-draft", "Issued": "badge-sent", "Cancelled": "badge-lost"
  };
  var TALLY_BADGE = {
    "Pending": "badge-pending", "Synced": "badge-won", "Failed": "badge-overdue",
    "Not Required": "badge-dormant"
  };

  function canDispatch() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }
  function canOverrideDispatch() {
    return ["Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function initDispatchView() {
    $("dsp-actions").innerHTML = canDispatch()
      ? '<button class="btn btn-amber" id="btn-new-dispatch">+ New Dispatch</button>' +
        '<button class="btn btn-primary" id="btn-new-invoice">+ Raise Invoice</button>'
      : "";
    if (canDispatch()) {
      $("btn-new-dispatch").addEventListener("click", startNewDispatch);
      $("btn-new-invoice").addEventListener("click", startNewInvoice);
    }
    setDspMode(dspMode);
  }

  DSP_SUBTABS.forEach(function (mode) {
    $("subtab-" + mode).addEventListener("click", function () { setDspMode(mode); });
  });

  function setDspMode(mode) {
    dspMode = mode;
    DSP_SUBTABS.forEach(function (m) {
      $("subtab-" + m).className = "btn btn-sm" + (m === mode ? " btn-primary" : "");
    });
    loadDispatchData();
  }

  $("dsp-search").addEventListener("input", function () { renderDspTable(); });

  function loadDispatchData() {
    var done = function (rows) { dspCache = rows; renderDspTable(); };
    if (dspMode === "dispatches") {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError).listDispatches({});
    } else if (dspMode === "invoices") {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError).listInvoices({});
    } else if (dspMode === "uninvoiced") {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError).listDispatchedNotInvoiced();
    } else {
      google.script.run.withSuccessHandler(done).withFailureHandler(onServerError).listTallySyncQueue();
    }
  }

  function renderDspTable() {
    var q = ($("dsp-search").value || "").toLowerCase();
    var rows = dspCache.filter(function (r) {
      return [r.dispatchNo, r.invoiceNo, r.orderNo, r.customerName].join(" ").toLowerCase().indexOf(q) !== -1;
    });

    if (dspMode === "dispatches") renderDispatchesTable(rows);
    else if (dspMode === "invoices") renderInvoicesTable(rows);
    else if (dspMode === "uninvoiced") renderUninvoicedTable(rows);
    else renderTallyTable(rows);
  }

  function dspEmpty(cols, text) {
    $("dsp-tbody").innerHTML = '<tr><td colspan="' + cols + '"><div class="empty">' +
      escapeHtml(text) + "</div></td></tr>";
  }

  function renderDispatchesTable(rows) {
    var planned = dspCache.filter(function (d) { return d.status === "Planned"; });
    var awaiting = dspCache.filter(function (d) { return d.awaitingInvoice; });
    var undelivered = dspCache.filter(function (d) {
      return d.status === "Dispatched" && d.deliveryConfirmed !== "Yes";
    });
    $("dsp-summary").innerHTML = '<div class="grid grid-3" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Open Dispatches</div><div class="kpi-value">' + planned.length + "</div></div>" +
      '<div class="kpi-card' + (awaiting.length ? " alert" : "") + '"><div class="kpi-label">Awaiting Invoice</div><div class="kpi-value">' + awaiting.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Delivery Unconfirmed</div><div class="kpi-value">' + undelivered.length + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Dispatch No.</th><th>Date</th><th>Order</th><th>Customer</th>" +
      '<th class="num">Lines</th><th>LR No.</th><th>Status</th><th>Invoice</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(9, dspCache.length ? "No dispatches match your search." : "No dispatches yet — open one from a ready order.");
      return;
    }

    $("dsp-tbody").innerHTML = rows.map(function (d) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(d.dispatchNo) + "</td>" +
        "<td>" + escapeHtml(d.dispatchDate) + "</td>" +
        '<td class="mono">' + escapeHtml(d.orderNo || "—") + "</td>" +
        "<td>" + escapeHtml(d.customerName || "—") + "</td>" +
        '<td class="num">' + (d.itemCount || 0) + "</td>" +
        '<td class="mono">' + escapeHtml(d.lrNumber || "—") + "</td>" +
        '<td><span class="badge ' + (DISPATCH_BADGE[d.status] || "badge-draft") + '">' + escapeHtml(d.status) + "</span>" +
          (String(d.checklistComplete).toUpperCase() === "FALSE" ? ' <span class="badge badge-overdue">Override</span>' : "") + "</td>" +
        '<td class="mono">' + (d.invoiceNo ? escapeHtml(d.invoiceNo)
          : (d.awaitingInvoice ? '<span class="badge badge-overdue">Not invoiced</span>' : "—")) + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-dispatch="' + d.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("dsp-tbody").querySelectorAll("[data-open-dispatch]").forEach(function (btn) {
      btn.addEventListener("click", function () { openDispatchModal(btn.dataset.openDispatch); });
    });
  }

  function renderInvoicesTable(rows) {
    var outstanding = dspCache.reduce(function (s, i) { return s + (i.balanceAmt > 0 ? i.balanceAmt : 0); }, 0);
    var overdue = dspCache.filter(function (i) { return i.overdueDays > 0 && i.balanceAmt > 0.5; });
    var drafts = dspCache.filter(function (i) { return i.status === "Draft"; });
    $("dsp-summary").innerHTML = '<div class="grid grid-4" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Invoices</div><div class="kpi-value">' + dspCache.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Outstanding</div><div class="kpi-value">' + fmt(outstanding) + "</div></div>" +
      '<div class="kpi-card' + (overdue.length ? " alert" : "") + '"><div class="kpi-label">Overdue</div><div class="kpi-value">' + overdue.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Unissued Drafts</div><div class="kpi-value">' + drafts.length + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Invoice No.</th><th>Date</th><th>Customer</th><th>Order</th>" +
      '<th class="num">Value</th><th class="num">Balance</th><th>Due</th><th>Status</th><th>Tally</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(10, dspCache.length ? "No invoices match your search." : "No invoices yet — raise one from a posted dispatch.");
      return;
    }

    $("dsp-tbody").innerHTML = rows.map(function (i) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(i.invoiceNo) + "</td>" +
        "<td>" + escapeHtml(i.invoiceDate) + "</td>" +
        "<td>" + escapeHtml(i.customerName || "—") + "</td>" +
        '<td class="mono">' + escapeHtml(i.orderNo || "—") + "</td>" +
        '<td class="num mono">' + fmt(i.grand) + "</td>" +
        '<td class="num mono">' + fmt(i.balanceAmt) + "</td>" +
        "<td>" + (i.dueDate
          ? (i.overdueDays > 0 && i.balanceAmt > 0.5
              ? '<span class="badge badge-overdue">' + escapeHtml(i.dueDate) + " · " + i.overdueDays + "d</span>"
              : escapeHtml(i.dueDate))
          : "—") + "</td>" +
        '<td><span class="badge ' + (INVOICE_BADGE[i.status] || "badge-draft") + '">' + escapeHtml(i.status) + "</span></td>" +
        '<td><span class="badge ' + (TALLY_BADGE[i.tallySyncStatus] || "badge-pending") + '">' +
          escapeHtml(i.tallySyncStatus || "Pending") + "</span></td>" +
        '<td class="center"><button class="btn btn-sm" data-open-invoice="' + i.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("dsp-tbody").querySelectorAll("[data-open-invoice]").forEach(function (btn) {
      btn.addEventListener("click", function () { openInvoiceModal(btn.dataset.openInvoice); });
    });
  }

  function renderUninvoicedTable(rows) {
    var value = dspCache.reduce(function (s, r) { return s + (r.uninvoicedValue || 0); }, 0);
    var stale = dspCache.filter(function (r) { return r.daysPending > 7; });
    $("dsp-summary").innerHTML = '<div class="grid grid-3" style="margin-bottom:14px;">' +
      '<div class="kpi-card' + (dspCache.length ? " alert" : "") + '"><div class="kpi-label">Dispatched, Not Invoiced</div><div class="kpi-value">' + dspCache.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Value at Risk</div><div class="kpi-value">' + fmt(value) + "</div></div>" +
      '<div class="kpi-card' + (stale.length ? " alert" : "") + '"><div class="kpi-label">Over 7 Days</div><div class="kpi-value">' + stale.length + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Dispatch No.</th><th>Dispatched</th><th>Days</th><th>Order</th>" +
      '<th>Customer</th><th class="num">Uninvoiced Value</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(7, "Nothing has gone out without a bill. This is the state you want.");
      return;
    }

    $("dsp-tbody").innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.dispatchNo) + "</td>" +
        "<td>" + escapeHtml(r.dispatchDate) + "</td>" +
        "<td>" + (r.daysPending > 7
          ? '<span class="badge badge-overdue">' + r.daysPending + "</span>"
          : r.daysPending) + "</td>" +
        '<td class="mono">' + escapeHtml(r.orderNo || "—") + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        '<td class="num mono">' + fmt(r.uninvoicedValue) + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-dispatch="' + r.dispatchId + '">Open</button></td>' +
        "</tr>";
    }).join("");

    $("dsp-tbody").querySelectorAll("[data-open-dispatch]").forEach(function (btn) {
      btn.addEventListener("click", function () { openDispatchModal(btn.dataset.openDispatch); });
    });
  }

  function renderTallyTable(rows) {
    var failed = dspCache.filter(function (i) { return i.tallySyncStatus === "Failed"; });
    $("dsp-summary").innerHTML = '<div class="grid grid-3" style="margin-bottom:14px;">' +
      '<div class="kpi-card"><div class="kpi-label">Awaiting Tally</div><div class="kpi-value">' + dspCache.length + "</div></div>" +
      '<div class="kpi-card' + (failed.length ? " alert" : "") + '"><div class="kpi-label">Failed</div><div class="kpi-value">' + failed.length + "</div></div>" +
      '<div class="kpi-card"><div class="kpi-label">Value</div><div class="kpi-value">' +
        fmt(dspCache.reduce(function (s, i) { return s + (i.grand || 0); }, 0)) + "</div></div>" +
      "</div>";

    $("dsp-thead").innerHTML = "<tr><th>Invoice No.</th><th>Date</th><th>Customer</th>" +
      '<th class="num">Value</th><th>Sync</th><th>Last Error</th><th></th></tr>';

    if (!rows.length) {
      dspEmpty(7, "Every issued invoice is accounted for in Tally.");
      return;
    }

    $("dsp-tbody").innerHTML = rows.map(function (i) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(i.invoiceNo) + "</td>" +
        "<td>" + escapeHtml(i.invoiceDate) + "</td>" +
        "<td>" + escapeHtml(i.customerName || "—") + "</td>" +
        '<td class="num mono">' + fmt(i.grand) + "</td>" +

  // ---- Readiness checklist rendering (FR-045) ----
  function readinessHtml(readiness) {
    if (!readiness) return "";
    var rows = readiness.checks.map(function (c) {
      return '<div style="display:flex; gap:10px; align-items:baseline; padding:5px 0;">' +
        '<span class="badge ' + (c.pass ? "badge-won" : "badge-overdue") + '">' + (c.pass ? "OK" : "BLOCKED") + "</span>" +
        "<span><b>" + escapeHtml(c.label) + "</b><br>" +
        '<span style="font-size:11.5px; color:var(--ink-soft);">' + escapeHtml(c.detail || "") + "</span></span>" +
        "</div>";
    }).join("");
    return '<div class="card" style="padding:12px;">' +
      '<div class="card-title" style="margin-top:0;">Dispatch Readiness</div>' + rows + "</div>";
  }

  // ---- New dispatch ----
  var newDispatchOrders = [];

  function startNewDispatch() {
    google.script.run.withSuccessHandler(function (orders) {
      newDispatchOrders = orders;
      if (!orders.length) {
        showMsg("No orders are at Material Pending or Ready for Dispatch yet.", "error");
        return;
      }
      $("nd-order").innerHTML = orders.map(function (o) {
        return '<option value="' + o.id + '">' +
          escapeHtml(o.orderNo + " · " + o.customerName + " · " + o.orderStatus +
            (o.ready ? " · ready" : " · blocked")) + "</option>";
      }).join("");
      $("nd-date").value = new Date().toISOString().slice(0, 10);
      ["nd-transporter", "nd-challan", "nd-lr", "nd-lrdate", "nd-eway", "nd-packing",
       "nd-certs", "nd-override"].forEach(function (f) { $(f).value = ""; });
      refreshNewDispatchReadiness();
      $("newdispatch-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).listDispatchableOrders();
  }

  function refreshNewDispatchReadiness() {
    var id = $("nd-order").value;
    google.script.run.withSuccessHandler(function (readiness) {
      $("nd-readiness").innerHTML = readinessHtml(readiness);
      var blocked = !readiness.ready;
      $("nd-override-wrap").style.display = blocked && canOverrideDispatch() ? "" : "none";
      $("btn-save-newdispatch").disabled = blocked && !canOverrideDispatch();
      $("btn-save-newdispatch").textContent = blocked && canOverrideDispatch()
        ? "Override and Open" : "Open Dispatch";
    }).withFailureHandler(onServerError).getDispatchReadiness(id);
  }

  $("btn-cancel-newdispatch").addEventListener("click", function () {

  $("btn-save-newdispatch").addEventListener("click", function () {

      $("newdispatch-modal-backdrop").classList.remove("show");
      openDispatch = dispatch;
      renderDispatchModal();
      $("dispatch-modal-backdrop").classList.add("show");
      showMsg("Dispatch " + dispatch.dispatchNo + " opened. Check the quantities before posting.", "success");

  // ---- Dispatch detail ----
  function openDispatchModal(id) {
    google.script.run.withSuccessHandler(function (d) {
      openDispatch = d;
      renderDispatchModal();
      $("dispatch-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).getDispatch(id);
  }

  function renderDispatchModal() {
    var d = openDispatch;
    if (!d) return;
    var posted = d.status === "Dispatched";
    var editable = canDispatch() && !posted;

    $("dispatch-modal-title").textContent = d.dispatchNo + " — " + (d.customerName || "");
    $("dm-sub").textContent = "Order " + (d.orderNo || "—") + " · " + d.status +
      (d.invoiceNo ? " · invoiced as " + d.invoiceNo : "");
    $("dm-id").value = d.id;

    if (String(d.checklistComplete).toUpperCase() === "FALSE") {
      $("dm-readiness").innerHTML = '<div class="compare-strip"><b>Opened against an incomplete checklist.</b> ' +
        escapeHtml(d.checklistNotes || "") + "</div>";
    } else {
      $("dm-readiness").innerHTML = "";
    }

    $("dm-date").value = d.dispatchDate || "";
    $("dm-transporter").value = d.transporterName || "";
    $("dm-challan").value = d.deliveryChallanNo || "";
    $("dm-lr").value = d.lrNumber || "";
    $("dm-lrdate").value = d.lrDate || "";
    $("dm-eway").value = d.ewayBillNo || "";
    $("dm-packing").value = d.packingListRef || "";
    $("dm-certs").value = d.certificatesRef || "";
    ["dm-date", "dm-transporter", "dm-challan", "dm-lr", "dm-lrdate", "dm-eway",
     "dm-packing", "dm-certs"].forEach(function (f) { $(f).disabled = !editable; });
    $("btn-dm-savedetails").style.display = editable ? "" : "none";

    renderDispatchItems();
    $("dm-line-form").style.display = "none";

    $("btn-dm-post").style.display = editable ? "" : "none";
    $("btn-dm-invoice").style.display = posted && !d.invoiceNo && canDispatch() ? "" : "none";
    $("btn-dm-delivered").style.display = posted && d.deliveryConfirmed !== "Yes" && canDispatch() ? "" : "none";
  }

  function renderDispatchItems() {
    var d = openDispatch;
    var posted = d.status === "Dispatched";
    var editable = canDispatch() && !posted;

    if (!d.items.length) {
      $("dm-items").innerHTML = '<div class="empty">Nothing on this dispatch. Reserve stock on the order, ' +
        "then reopen the dispatch.</div>";
      return;
    }

    $("dm-items").innerHTML = '<div class="card" style="padding:0; overflow-x:auto;"><table>' +
      "<thead><tr><th>#</th><th>Item</th><th>Description</th>" +
      '<th class="num">Qty</th><th>Serials</th><th>Bin</th><th></th></tr></thead><tbody>' +
      d.items.map(function (it) {
        return "<tr>" +
          "<td>" + escapeHtml(it.lineNo) + "</td>" +
          '<td class="mono">' + escapeHtml(it.itemCode) + "</td>" +
          "<td>" + escapeHtml(it.description || "") + "</td>" +
          '<td class="num mono">' + escapeHtml(it.qtyDispatched) + "</td>" +
          '<td class="mono" style="font-size:11.5px;">' + escapeHtml(it.serialNos || "—") + "</td>" +
          "<td>" + escapeHtml(it.binId || "—") + "</td>" +
          '<td class="center">' + (editable

      btn.addEventListener("click", function () {
        askDialog({
          title: "Remove this line?",

            openDispatch = d2; renderDispatchModal();
          }).withFailureHandler(onServerError).deleteDispatchItem(btn.dataset.delDline);
        });
      });

  function editDispatchLine(id) {
    var line = openDispatch.items.filter(function (i) { return String(i.id) === String(id); })[0];
    if (!line) return;
    $("dm-line-id").value = line.id;

      renderInvoiceModal();
      $("invoice-modal-backdrop").classList.add("show");
      showMsg("Draft invoice " + inv.invoiceNo + " created. Check it, then issue it.", "success");
      loadDispatchData();
    }).withFailureHandler(onServerError).createInvoiceFromDispatch({ dispatchId: dispatchId });

    $("invoice-modal-title").textContent = inv.invoiceNo + " — " + (inv.customerName || "");

    $("im-banner").innerHTML = inv.status === "Cancelled"

    $("im-meta").innerHTML = '<div class="card" style="padding:12px; font-size:12.5px;">' +
      "<div><b>Order:</b> " + escapeHtml(inv.orderNo || "—") +

        " &nbsp;·&nbsp; <b>Dispatch:</b> " + escapeHtml(inv.dispatchNo || "—") +
        (inv.lrNumber ? " (LR " + escapeHtml(inv.lrNumber) + ")" : "") + "</div>" +
      '<div style="margin-top:6px;"><b>GSTIN:</b> ' + escapeHtml(inv.customerGstin || "—") + "</div>" +

      "</div>";

    $("im-notes").value = inv.notes || "";
    ["im-date", "im-due", "im-terms", "im-warranty", "im-notes"].forEach(function (f) {
      $(f).disabled = !editable;
    });
    $("btn-im-save").style.display = editable ? "" : "none";

    $("im-items").innerHTML = '<div class="card" style="padding:0; overflow-x:auto;"><table>' +
      "<thead><tr><th>#</th><th>Item</th><th>Description</th>" +
      '<th class="num">Qty</th><th class="num">Rate</th><th class="num">Disc %</th>' +
      '<th class="num">GST %</th><th class="num">Line Total</th></tr></thead><tbody>' +
      inv.items.map(function (l) {
        return "<tr><td>" + escapeHtml(l.lineNo) + "</td>" +
          '<td class="mono">' + escapeHtml(l.itemCode) + "</td>" +
          "<td>" + escapeHtml(l.description || "") + "</td>" +
          '<td class="num mono">' + escapeHtml(l.qty) + " " + escapeHtml(l.uom || "") + "</td>" +
          '<td class="num mono">' + fmt(l.unitPrice) + "</td>" +
          '<td class="num">' + escapeHtml(l.discountPct || 0) + "</td>" +
          '<td class="num">' + escapeHtml(l.taxPct || 0) + "</td>" +
          '<td class="num mono">' + fmt(l.lineTotal) + "</td></tr>";
      }).join("") + "</tbody></table></div>";

    $("im-totals").innerHTML = '<div class="totals-box">' +
      '<div class="totals-row"><span>Subtotal</span><span class="mono">' + fmt(inv.subtotal) + "</span></div>" +
      '<div class="totals-row"><span>Discount</span><span class="mono">-' + fmt(inv.discountAmt) + "</span></div>" +
      '<div class="totals-row"><span>GST</span><span class="mono">' + fmt(inv.taxAmt) + "</span></div>" +
      '<div class="totals-row"><span>Freight</span><span class="mono">' + fmt(inv.freight) + "</span></div>" +
      '<div class="totals-row grand"><span>Invoice Total</span><span class="mono">' + fmt(inv.grand) + "</span></div>" +
      '<div class="totals-row"><span>Received</span><span class="mono">' + fmt(inv.receivedAmt) + "</span></div>" +
      '<div class="totals-row grand"><span>Balance</span><span class="mono">' + fmt(inv.balanceAmt) + "</span></div>" +
      "</div>";

    $("im-receipts").innerHTML = inv.receipts.length
      ? '<div class="card" style="padding:0; overflow-x:auto;"><table>' +

        '<th class="num">Amount</th></tr></thead><tbody>' +
        inv.receipts.map(function (r) {

            '<td class="mono">' + escapeHtml(r.receiptNo || "—") + "</td>" +
