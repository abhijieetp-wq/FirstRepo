<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return "₹" + (Math.round((n || 0) * 100) / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  function escapeHtml(str) {
    return String(str === undefined || str === null ? "" : str).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  // Five roles per decision D4. Order here is the display order.
  var ALL_ROLES = ["Sales Coordinator", "Sales Engineer", "Service Engineer", "Management", "ERP Admin"];
  var SALES_SIDE = ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"];

  var TABS = [
    { view: "dashboard", label: "Dashboard", roles: ALL_ROLES },
    { view: "customers", label: "Customers", roles: ALL_ROLES },
    { view: "enquiries", label: "Enquiries", roles: SALES_SIDE },
    { view: "catalog", label: "Catalog", roles: ALL_ROLES },
    { view: "quote", label: "New Quotation", roles: SALES_SIDE },
    { view: "quotations", label: "Quotations", roles: SALES_SIDE },
    { view: "orders", label: "Orders", roles: ALL_ROLES }
  ];

  // Master data (Products/Spares/pricing) is Management + ERP Admin only — mirrors
  // MASTER_EDITORS in Auth.gs, which is where the rule is actually enforced.
  function canEditCatalog() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  var currentUser = null;

  function showMsg(text, type) {
    var box = $("msg-box");
    box.textContent = text;
    box.className = "msg show " + (type === "error" ? "msg-error" : "msg-success");
    window.scrollTo({ top: 0, behavior: "smooth" });
    setTimeout(function () { box.className = "msg"; }, 4000);
  }

  function onServerError(err) {
    showMsg(err && err.message ? err.message : String(err), "error");
  }

  // ---------------- Tabs ----------------
  var VIEW_INIT = {
    catalog: initCatalogView
  };

  function goToTab(view) {
    document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    document.querySelector('.tab-btn[data-view="' + view + '"]').classList.add("active");
    $("view-" + view).classList.add("active");
    if (VIEW_INIT[view]) VIEW_INIT[view]();
  }

  function renderTabs() {
    var visible = TABS.filter(function (t) { return t.roles.indexOf(currentUser.role) !== -1; });
    $("tabs").innerHTML = visible.map(function (t, i) {
      return '<button class="tab-btn' + (i === 0 ? " active" : "") + '" data-view="' + t.view + '">' + t.label + "</button>";
    }).join("");
    $("tabs").querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { goToTab(btn.dataset.view); });
    });
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    if (visible.length) {
      $("view-" + visible[0].view).classList.add("active");
      if (VIEW_INIT[visible[0].view]) VIEW_INIT[visible[0].view]();
    }
  }

  // ================= CATALOG (Parts + Units) =================
  var CATALOG_MODE = "spares";
  var sparesCache = [];
  var productsCache = [];
  var compareSelection = new Set();
  var catalogLoaded = { spares: false, products: false };

  var CATALOG_COLUMNS = {
    spares: [
      { key: "partNo", label: "Part No.", cls: "mono" },
      { key: "description", label: "Description" },
      { key: "category", label: "Category" },
      { key: "uom", label: "UoM" },
      { key: "listPrice", label: "List Price", num: true, money: true },
      { key: "specialPrice", label: "Special Price", num: true, money: true },
      { key: "altSummary", label: "Alternate" },
      { key: "onHand", label: "On Hand", num: true },
      { key: "reserved", label: "Reserved", num: true },
      { key: "available", label: "Available", num: true }
    ],
    products: [
      { key: "productCode", label: "Product Code", cls: "mono" },
      { key: "model", label: "Model" },
      { key: "family", label: "Family" },
      { key: "hpRating", label: "HP" },
      { key: "workingPressure", label: "Pressure" },
      { key: "fad", label: "FAD" },
      { key: "listPrice", label: "List Price", num: true, money: true },
      { key: "specialPrice", label: "Special Price", num: true, money: true },
      { key: "leadTimeDays", label: "Lead Time (days)", num: true },
      { key: "available", label: "Available", num: true }
    ]
  };

  function currentCatalogRows() { return CATALOG_MODE === "spares" ? sparesCache : productsCache; }
  function catalogSearchKeys() {
    return CATALOG_MODE === "spares" ? ["partNo", "description", "category"] : ["productCode", "model", "family"];
  }
  // Cheapest linked alternate part's own List price, or null when there is none priced.
  function bestAlternate(r) {
    var rates = (r.alternates || []).map(function (a) { return a.altRate; }).filter(Boolean);
    return rates.length ? Math.min.apply(null, rates) : null;
  }

  // Best of List / Special / the cheapest linked alternate part.
  function bestRate(r) {
    var candidates = [];
    if (r.listPrice) candidates.push(r.listPrice);
    if (r.specialPrice) candidates.push(r.specialPrice);
    (r.alternates || []).forEach(function (a) { if (a.altRate) candidates.push(a.altRate); });
    return candidates.length ? Math.min.apply(null, candidates) : 0;
  }

  function initCatalogView() {
    $("btn-new-catalog-item").style.display = canEditCatalog() ? "inline-flex" : "none";
    switchCatalogMode(CATALOG_MODE);
  }

  function switchCatalogMode(mode) {
    CATALOG_MODE = mode;
    compareSelection = new Set();
    $("compare-strip-zone").innerHTML = "";
    $("catalog-search").value = "";
    $("subtab-parts").className = "btn btn-sm" + (mode === "spares" ? " btn-primary" : "");
    $("subtab-units").className = "btn btn-sm" + (mode === "products" ? " btn-primary" : "");
    loadCatalog();
  }

  function loadCatalog() {
    if (CATALOG_MODE === "spares") {
      if (catalogLoaded.spares) { renderCatalogTable(); return; }
      google.script.run.withSuccessHandler(function (rows) {
        sparesCache = rows.map(decorateSpare); catalogLoaded.spares = true; renderCatalogTable();
      }).withFailureHandler(onServerError).listSpares();
    } else {
      if (catalogLoaded.products) { renderCatalogTable(); return; }
      google.script.run.withSuccessHandler(function (rows) {
        productsCache = rows; catalogLoaded.products = true; renderCatalogTable();
      }).withFailureHandler(onServerError).listProducts();
    }
  }

  // Flattens the alternates array into one readable cell for the table.
  function decorateSpare(s) {
    var alts = s.alternates || [];
    s.altSummary = alts.length
      ? alts.map(function (a) { return a.altPartNo || a.alternateSpareId; }).join(", ")
      : "";
    return s;
  }

  function renderCatalogTable() {
    var rows = currentCatalogRows();
    var q = ($("catalog-search").value || "").toLowerCase();
    var cols = CATALOG_COLUMNS[CATALOG_MODE];
    var keys = catalogSearchKeys();
    var filtered = rows.filter(function (r) {
      return keys.some(function (k) { return String(r[k] || "").toLowerCase().indexOf(q) !== -1; });
    });

    $("catalog-thead").innerHTML = "<tr><th class=\"checkbox-cell\"></th>" +
      cols.map(function (c) { return "<th" + (c.num ? ' class="num"' : "") + ">" + c.label + "</th>"; }).join("") +
      "<th></th></tr>";

    if (filtered.length === 0) {
      $("catalog-tbody").innerHTML = '<tr><td colspan="' + (cols.length + 2) + '"><div class="empty">No items match your search.</div></td></tr>';
      return;
    }

    var isManager = canEditCatalog();
    $("catalog-tbody").innerHTML = filtered.map(function (r) {
      var cells = cols.map(function (c) {
        var v = r[c.key];
        var display = c.money ? (v ? fmt(v) : "—") : (v === undefined || v === null || v === "" ? "—" : escapeHtml(v));
        return "<td" + (c.num ? ' class="num mono"' : "") + ">" + display + "</td>";
      }).join("");
      return "<tr>" +
        '<td class="checkbox-cell"><input type="checkbox" data-compare="' + r.id + '" ' + (compareSelection.has(r.id) ? "checked" : "") + " /></td>" +
        cells +
        '<td class="center">' + (isManager ? '<button class="btn-ghost" data-edit="' + r.id + '" title="Edit">✎</button>' : "") + "</td>" +
        "</tr>";
    }).join("");

    $("catalog-tbody").querySelectorAll("[data-compare]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        if (cb.checked) compareSelection.add(cb.dataset.compare); else compareSelection.delete(cb.dataset.compare);
      });
    });
    $("catalog-tbody").querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () { openCatalogModal(btn.dataset.edit); });
    });
  }

  $("catalog-search").addEventListener("input", renderCatalogTable);
  $("subtab-parts").addEventListener("click", function () { switchCatalogMode("spares"); });
  $("subtab-units").addEventListener("click", function () { switchCatalogMode("products"); });

  $("btn-compare-selected").addEventListener("click", function () {
    var zone = $("compare-strip-zone");
    if (compareSelection.size < 2) {
      zone.innerHTML = '<div class="compare-strip">Select at least two rows (checkbox on the left) to compare their rates.</div>';
      return;
    }
    var rows = currentCatalogRows().filter(function (r) { return compareSelection.has(r.id); });
    var cheapest = Math.min.apply(null, rows.map(bestRate));
    var nameKey = CATALOG_MODE === "spares" ? "partNo" : "productCode";
    var descKey = CATALOG_MODE === "spares" ? "description" : "model";
    zone.innerHTML = '<div class="compare-strip"><div class="card-title" style="margin-bottom:12px;">Rate Comparison — ' + rows.length + " selected</div>" +
      "<table><thead><tr><th>" + (CATALOG_MODE === "spares" ? "Part No." : "Product Code") + "</th><th>Description</th><th class=\"num\">List</th><th class=\"num\">Special</th>" +
      (CATALOG_MODE === "spares" ? '<th class="num">Alternate</th>' : "") +
      '<th class="num">Best Rate</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var best = bestRate(r);
        var isBest = best === cheapest;
        return "<tr><td class=\"mono\">" + escapeHtml(r[nameKey]) + "</td><td>" + escapeHtml(r[descKey]) + "</td>" +
          '<td class="num mono">' + fmt(r.listPrice) + "</td>" +
          '<td class="num mono">' + (r.specialPrice ? fmt(r.specialPrice) : "—") + "</td>" +
          (CATALOG_MODE === "spares" ? '<td class="num mono">' + (bestAlternate(r) ? fmt(bestAlternate(r)) : "—") + "</td>" : "") +
          '<td class="num mono" style="font-weight:700; color:' + (isBest ? "var(--green)" : "var(--navy)") + ';">' + fmt(best) + (isBest ? " ★" : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  });

  $("btn-new-catalog-item").addEventListener("click", function () { openCatalogModal(null); });
  function openCatalogModal(id) {
    if (CATALOG_MODE === "spares") openSpareModal(id); else openProductModal(id);
  }

  // ---- Spare modal ----
  function openSpareModal(id) {
    var s = id ? sparesCache.find(function (x) { return x.id === id; }) : null;
    $("part-modal-title").textContent = id ? "Edit Spare" : "Add Spare";
    $("btn-delete-part").style.display = id ? "inline-flex" : "none";
    $("pm-id").value = id || "";
    $("pm-partno").value = s ? s.partNo : "";
    $("pm-category").value = s ? (s.category || "") : "";
    $("pm-description").value = s ? s.description : "";
    $("pm-unit").value = s ? (s.uom || "Nos") : "Nos";
    $("pm-listrate").value = s && s.listPrice ? s.listPrice : "";
    $("pm-specialrate").value = s && s.specialPrice ? s.specialPrice : "";
    $("pm-minprice").value = s && s.minPrice ? s.minPrice : "";
    $("pm-gst").value = s && s.gstPct !== "" ? s.gstPct : "";
    $("pm-reorder").value = s && s.reorderLevel !== "" ? s.reorderLevel : "";
    $("pm-bin").value = s ? (s.defaultBinId || "") : "";
    // Opening stock is only meaningful at creation; afterwards stock moves via the ledger.
    $("pm-opening-row").style.display = id ? "none" : "";
    $("pm-opening").value = "";
    $("pm-stock-summary").textContent = s
      ? "On hand " + s.onHand + " · reserved " + s.reserved + " · available " + s.available
      : "";
    $("part-modal-backdrop").classList.add("show");
  }
  $("btn-cancel-part").addEventListener("click", function () { $("part-modal-backdrop").classList.remove("show"); });
  $("btn-save-part").addEventListener("click", function () {
    var obj = {
      id: $("pm-id").value || null,
      partNo: $("pm-partno").value.trim(),
      description: $("pm-description").value.trim(),
      category: $("pm-category").value.trim(),
      uom: $("pm-unit").value.trim() || "Nos",
      gstPct: $("pm-gst").value,
      reorderLevel: $("pm-reorder").value,
      defaultBinId: $("pm-bin").value.trim(),
      listPrice: $("pm-listrate").value,
      specialPrice: $("pm-specialrate").value,
      minPrice: $("pm-minprice").value,
      openingStock: $("pm-opening").value
    };
    google.script.run.withSuccessHandler(function (saved) {
      catalogLoaded.spares = false;
      $("part-modal-backdrop").classList.remove("show");
      loadCatalog();
      showMsg("Spare " + saved.partNo + " saved.", "success");
    }).withFailureHandler(onServerError).saveSpare(obj);
  });
  $("btn-delete-part").addEventListener("click", function () {
    var id = $("pm-id").value;
    if (!id) return;
    var reason = prompt("Deactivate this spare? It stays in the sheet so past orders still resolve.\n\nReason:");
    if (reason === null) return;
    google.script.run.withSuccessHandler(function () {
      catalogLoaded.spares = false;
      $("part-modal-backdrop").classList.remove("show");
      loadCatalog();
      showMsg("Spare deactivated.", "success");
    }).withFailureHandler(onServerError).deleteSpare(id, reason);
  });

  // ---- Product modal ----
  function openProductModal(id) {
    var p = id ? productsCache.find(function (x) { return x.id === id; }) : null;
    $("unit-modal-title").textContent = id ? "Edit Product" : "Add Product";
    $("btn-delete-unit").style.display = id ? "inline-flex" : "none";
    $("um-id").value = id || "";
    $("um-modelcode").value = p ? p.productCode : "";
    $("um-modelname").value = p ? p.model : "";
    $("um-family").value = p ? (p.family || "") : "";
    $("um-category").value = p ? (p.category || "") : "";
    $("um-hprating").value = p ? (p.hpRating || "") : "";
    $("um-workingpressure").value = p ? (p.workingPressure || "") : "";
    $("um-fad").value = p ? (p.fad || "") : "";
    $("um-listrate").value = p && p.listPrice ? p.listPrice : "";
    $("um-specialrate").value = p && p.specialPrice ? p.specialPrice : "";
    $("um-minprice").value = p && p.minPrice ? p.minPrice : "";
    $("um-gst").value = p && p.gstPct !== "" ? p.gstPct : "";
    $("um-leadtime").value = p && p.leadTimeDays !== "" ? p.leadTimeDays : "";
    $("um-warranty").value = p && p.warrantyMonths !== "" ? p.warrantyMonths : "";
    $("um-notes").value = p ? (p.notes || "") : "";
    $("um-opening-row").style.display = id ? "none" : "";
    $("um-opening").value = "";
    $("unit-modal-backdrop").classList.add("show");
  }
  $("btn-cancel-unit").addEventListener("click", function () { $("unit-modal-backdrop").classList.remove("show"); });
  $("btn-save-unit").addEventListener("click", function () {
    var obj = {
      id: $("um-id").value || null,
      productCode: $("um-modelcode").value.trim(),
      model: $("um-modelname").value.trim(),
      family: $("um-family").value.trim(),
      category: $("um-category").value.trim(),
      hpRating: $("um-hprating").value.trim(),
      workingPressure: $("um-workingpressure").value.trim(),
      fad: $("um-fad").value.trim(),
      gstPct: $("um-gst").value,
      warrantyMonths: $("um-warranty").value,
      leadTimeDays: $("um-leadtime").value,
      notes: $("um-notes").value.trim(),
      listPrice: $("um-listrate").value,
      specialPrice: $("um-specialrate").value,
      minPrice: $("um-minprice").value,
      openingStock: $("um-opening").value
    };
    google.script.run.withSuccessHandler(function (saved) {
      catalogLoaded.products = false;
      $("unit-modal-backdrop").classList.remove("show");
      loadCatalog();
      showMsg("Product " + saved.productCode + " saved.", "success");
    }).withFailureHandler(onServerError).saveProduct(obj);
  });
  $("btn-delete-unit").addEventListener("click", function () {
    var id = $("um-id").value;
    if (!id) return;
    var reason = prompt("Deactivate this product? It stays in the sheet so past orders still resolve.\n\nReason:");
    if (reason === null) return;
    google.script.run.withSuccessHandler(function () {
      catalogLoaded.products = false;
      $("unit-modal-backdrop").classList.remove("show");
      loadCatalog();
      showMsg("Product deactivated.", "success");
    }).withFailureHandler(onServerError).deleteProduct(id, reason);
  });

  // ---------------- Boot ----------------
  function onBootSuccess(user) {
    currentUser = user;
    $("whoami").innerHTML = "Signed in as <b>" + escapeHtml(user.name) + "</b> (" + escapeHtml(user.role) + ")";
    renderTabs();
    $("boot-screen").style.display = "none";
    $("app").style.display = "block";
  }

  function onBootFailure(err) {
    $("boot-screen").style.display = "none";
    $("error-screen").style.display = "flex";
    $("error-text").textContent = err && err.message ? err.message : String(err);
  }

  function init() {
    google.script.run.withSuccessHandler(onBootSuccess).withFailureHandler(onBootFailure).bootstrap();
  }

  init();
})();
</script>
