  // ================= QUOTATIONS =================
  var quotationsCache = [];
  var openQuote = null;
  var quoteSearchTimer = null;

  /**
   * The people work can be handed to, fetched once.
   *
   * PIE run several sales engineers and several coordinators, so "owner" was never one
   * person: the engineer brings the lead in and a coordinator is put in charge of it. Both
   * are picked from a list of who actually holds that role, rather than typed as an email
   * that nobody checks.
   */
  var peopleCache = null;

  /**
   * The directory, fetched once however many callers want it.
   *
   * The cache was only set when the answer came back, so it guarded nothing while the request
   * was in the air: two forms opening together — which is the ordinary case, a modal with a
   * coordinator picker and an owner picker — each sent their own. On this platform a wasted
   * round trip is most of a second, and it was being spent on data the other half of the same
   * screen had already asked for.
   *
   * The same shape as withConfigLists: whoever arrives first sends the request, everybody
   * after it joins a queue, and all of them are answered together.
   */
  var peopleWaiting = null;
  function withPeople(then) {
    if (peopleCache) { then(peopleCache); return; }
    if (peopleWaiting) { peopleWaiting.push(then); return; }
    peopleWaiting = [then];
    var settle = function (data) {
      peopleCache = data;
      var queue = peopleWaiting || [];
      peopleWaiting = null;
      queue.forEach(function (fn) { fn(peopleCache); });
    };
    srv.withSuccessHandler(settle).withFailureHandler(function () {
      // A dropdown that cannot be filled must not stop the form opening.
      settle({ salesEngineers: [], coordinators: [], serviceEngineers: [], management: [],
        categories: [] });
    }).listPeople();
  }

  /**
   * How a person is named on a form.
   *
   * The address is what every record is keyed on, but it is nobody's business on screen.
   * They are personal addresses on this installation — the company issues none — so printing
   * one beside a name on every picker puts a coordinator's private address in front of
   * whoever is standing behind the desk. Two people sharing a name is the one case where the
   * name alone does not say who is meant, and that is the only case that shows it.
   */
  /**
   * The name behind an address, looked for across every role.
   *
   * Somebody named on an old record may have moved role or left, so they are not in the list
   * the form is offering — but they are still in the directory, and the directory is what
   * turns an address back into a person. Only somebody nobody has ever heard of shows as an
   * address, because then there is nothing else to show.
   */
  function nameForEmail(email) {
    var want = String(email || "").toLowerCase();
    var found = "";
    Object.keys(peopleCache || {}).forEach(function (bucket) {
      var list = peopleCache[bucket];
      if (!Array.isArray(list)) return;
      list.forEach(function (p) {
        if (p && p.email && String(p.email).toLowerCase() === want && p.name) found = p.name;
      });
    });
    if (!found && currentUser && String(currentUser.email).toLowerCase() === want) {
      found = currentUser.name || "";
    }
    return found || email;
  }

  function personLabeller(people) {
    var byName = {};
    (people || []).forEach(function (p) {
      var k = String(p.name || "").trim().toLowerCase();
      byName[k] = (byName[k] || 0) + 1;
    });
    return function (p) {
      var name = String(p.name || "").trim();
      if (!name) return p.email;
      return byName[name.toLowerCase()] > 1 ? name + " \u00b7 " + p.email : name;
    };
  }

  function fillPeopleSelect(id, people, chosen, blankLabel) {
    var sel = $(id);
    if (!sel) return;
    var seen = {};
    var label = personLabeller(people);
    var opts = ['<option value="">' + escapeHtml(blankLabel || "Unassigned") + "</option>"];
    people.forEach(function (p) {
      seen[p.email.toLowerCase()] = true;
      opts.push('<option value="' + escapeHtml(p.email) + '">' +
        escapeHtml(label(p)) + "</option>");
    });
    // Somebody already on the record who no longer holds the role still has to show, or
    // saving the form would quietly reassign their work. They are named too: the record
    // stores an address, but the whole point of naming people is not to print one.
    if (chosen && !seen[String(chosen).toLowerCase()]) {
      opts.push('<option value="' + escapeHtml(chosen) + '">' +
        escapeHtml(nameForEmail(chosen)) + " (no longer in this role)</option>");
    }
    sel.innerHTML = opts.join("");
    sel.value = chosen || "";
  }

  /**
   * The service engineer who generated an enquiry or lead. Optional: plenty of business comes
   * in by phone with no engineer behind it, and that is an answer too.
   */
  function fillServiceEngineerSelect(id, noteId, people, chosen) {
    var list = (people && people.serviceEngineers) || [];
    fillPeopleSelect(id, list, chosen || "", "None \u2014 not from an engineer");
    var note = $(noteId);
    if (note) {
      note.textContent = list.length ? "" : "No service engineers on the user list yet. " +
        "Management adds them in Settings \u2192 Users, with the role Service Engineer.";
    }
  }

  var QUOTE_BADGE = {
    "Draft": "badge-draft", "Approved": "badge-active", "Submitted": "badge-sent",
    "Negotiating": "badge-followup",
    "Revised": "badge-followup", "Won": "badge-won", "Lost": "badge-lost", "Expired": "badge-overdue"
  };

  /**
   * What a quotation's status is called on screen.
   *
   * The stored values are the ones the sheet has always held and the reports are written
   * against, so they stay. What they were not is what anybody says: a quotation is Sent, not
   * Submitted, and the customer Accepts or Declines it rather than us winning or losing it —
   * winning is what happens to a deal, and a deal is an opportunity, which has its own Won
   * and Lost and keeps them. Two vocabularies for one thing is what left somebody looking for
   * an Accept button next to a journey stage called Accepted.
   */
  var QUOTE_STATUS_LABEL = {
    "Submitted": "Sent", "Negotiating": "Sent", "Won": "Accepted", "Lost": "Declined"
  };
  function quoteStatusLabel(status) {
    return QUOTE_STATUS_LABEL[status] || status || "";
  }

  /**
   * The order-to-cash run drawn as a strip: what has happened, when, and what is next.
   *
   * The facts were all in the system already, spread over the quotation, the order, the
   * invoice and the dispatch. Answering "where has this one got to?" meant opening four
   * screens and joining them by eye, which is the sort of question that gets asked ten times
   * a day and answered from memory.
   */
  /**
   * Who signs this offer off before it is sent.
   *
   * Approval follows the customer's coordinator rather than going up to Management as a
   * matter of course — PIE's point being that an office where every decision waits for the
   * owner is an office that waits. Saying so on screen is the difference between knowing the
   * rule and discovering it by being refused.
   */
  /**
   * Whose quotation this is: who built it, who signed it off, and which coordinator looks
   * after the customer. All three facts were recorded from the beginning and none of them
   * were shown, so the only way to answer "whose is this?" was to open the spreadsheet.
   *
   * The coordinator is set from here too. The banner below already says when nobody is
   * named; sending somebody three screens away to fix a gap this screen raised was the
   * whole problem.
   */
  function renderOwnership(q) {
    var zone = $("qb-ownership");
    if (!zone) return;
    var o = q.ownership;
    if (!o) { zone.innerHTML = ""; return; }

    var cell = function (label, value, none) {
      return '<div><span class="owner-k">' + escapeHtml(label) + "</span>" +
        '<span class="owner-v' + (value ? "" : " none") + '">' +
        escapeHtml(value || none) + "</span></div>";
    };

    zone.innerHTML = '<div class="owners">' +
      cell("Prepared by", o.preparedBy, "—") +
      cell("Approved by", o.approvedBy
        ? o.approvedBy + (o.approvalDate ? " · " + o.approvalDate : "")
        : "", "not yet approved") +
      '<div><span class="owner-k">Customer looked after by</span>' +
        '<span class="owner-v' + (o.coordinatorInCharge ? "" : " none") + '" id="qb-incharge">' +
        escapeHtml(o.coordinatorInChargeName || o.coordinatorInCharge || "nobody yet") +
        "</span>" +
        (o.youMayAssign
          ? ' <button class="btn-ghost owner-assign" id="btn-qb-assign">' +
            (o.coordinatorInCharge ? "Change" : "Assign") + "</button>"
          : "") +
      "</div>" +
      "</div>";

    var assign = $("btn-qb-assign");
    if (assign) assign.addEventListener("click", function () { openAssignDialog(q); });
  }

  /** Puts a coordinator's name against the customer, without leaving the quotation. */
  function openAssignDialog(q) {
    withPeople(function (p) {
      var label = personLabeller(p.coordinators);
      var options = [{ value: "", label: "Nobody yet" }].concat(
        (p.coordinators || []).map(function (c) {
          return { value: c.email, label: label(c) };
        }));
      askDialog({
        title: "Who looks after " + (q.customerName || "this customer") + "?",
        message: "They approve this customer's quotations and can release a credit hold on " +
          "them. Management can too, but does not have to.",
        options: options,
        optionsLabel: "Coordinator in charge",
        // "Nobody yet" is a real answer here, so an empty choice must not be refused.
        required: false,
        okLabel: "Save"
      }, function (picked) {
        if (picked === null) return;   // cancelled, as distinct from "nobody"

        srv.withSuccessHandler(function () {
          var who = (p.coordinators || []).filter(function (c) { return c.email === picked; })[0];
          showMsg(picked ? "This customer is now looked after by " +
                             ((who && who.name) || picked) + "."
                         : "This customer is no longer assigned to anybody.", "success");
          // The approval rule and the banner both read off this, so reload rather than patch.
          openQuotation(q.id);
        }).withFailureHandler(onServerError).assignCustomerCoordinator(q.customerId, picked);
      });
      $("ask-select").value = q.ownership.coordinatorInCharge || "";
    });
  }

  function renderApprovalNote(q) {
    var zone = $("qb-approval-note");
    var rule = q.approvalRule;
    if (!zone) return;

    // Accepted, and nothing has happened since. The PO is what turns the customer's yes into
    // an order, and whoever is looking at this screen is either the person who records it or
    // the person who has to ask someone else to.
    if (q.status === "Won" && !(q.journey && q.journey.orderNo)) {
      zone.innerHTML = '<div class="compare-strip" style="margin-bottom:16px;">' +
        (canEditOrders()
          ? "Accepted. Press <strong>Record PO &amp; Create Order</strong> once the customer's " +
            "purchase order is in hand — the lines and prices carry across as they are."
          : "Accepted. A sales coordinator records the customer's purchase order against this " +
            "quotation to turn it into an order.") + "</div>";
      return;
    }

    // What the customer said when they said no. Recorded on the decline form and shown here,
    // because a reason nobody reads before quoting the same customer again was not worth
    // asking for.
    if (q.status === "Lost") {
      var reason = (q.journey && q.journey.declined && q.journey.declined.reason) || "";
      var parts = [];
      if (q.lostToCompetitor) {
        parts.push("Lost to " + escapeHtml(q.lostToCompetitor) +
          (q.lostAtPrice !== "" && q.lostAtPrice !== null && q.lostAtPrice !== undefined
            ? " at " + fmt(q.lostAtPrice) + " against our " + fmt(q.grand) : "") + ".");
      } else if (q.lostAtPrice !== "" && q.lostAtPrice !== null && q.lostAtPrice !== undefined) {
        parts.push("They bought at " + fmt(q.lostAtPrice) + " against our " + fmt(q.grand) + ".");
      }
      if (q.lostNotes) parts.push(escapeHtml(q.lostNotes));
      zone.innerHTML = '<div class="compare-strip" style="margin-bottom:16px;">' +
        "<strong>Declined" + (q.lostDate ? " on " + escapeHtml(q.lostDate) : "") + "</strong>" +
        (reason ? " — " + escapeHtml(reason) : "") +
        (parts.length ? " " + parts.join(" ") : "") + "</div>";
      return;
    }

    if (!rule || ["Draft", "Approved"].indexOf(q.status) === -1) { zone.innerHTML = ""; return; }

    var approved = q.status === "Approved";
    zone.innerHTML = '<div class="compare-strip" style="margin-bottom:16px;">' +
      escapeHtml(rule.why) +
      (approved
        ? " Approved by " + escapeHtml(q.approvedBy || "") +
          (q.approvalDate ? " on " + escapeHtml(q.approvalDate) : "") + "."
        : (rule.youMay ? " That is you." : "")) +
      "</div>";
  }

  function renderQuoteJourney(j) {
    var zone = $("qb-journey");
    zone.innerHTML = journeyStrip(j);
  }

  /**
   * The strip itself, as HTML.
   *
   * Returned rather than written, because two screens draw it now — the quotation builder and
   * the progress trail — and a strip that only knows how to write itself into one element is
   * a strip the second screen has to reimplement and then keep in step.
   */
  function journeyStrip(j) {
    if (!j || !j.stages) return "";

    var steps = j.stages.map(function (st, i) {
      var isNow = !j.closed && !j.stalled && i === j.reachedIndex;
      var cls = st.done ? (isNow ? "jstep done now" : "jstep done") : "jstep";
      // A step reached after one that was skipped is drawn as reached, because it was — the
      // gap is the story, and smoothing it over would hide a missed approval.
      return '<li class="' + cls + '" title="' +
          escapeHtml(st.label + (st.hint ? " — " + st.hint : "") + " · from the " +
            st.owner.toLowerCase()) + '">' +
        '<span class="jdot"></span>' +
        '<span class="jlabel">' + escapeHtml(st.label) + "</span>" +
        '<span class="jdate">' + escapeHtml(st.date || (st.detail ? st.detail : "")) + "</span>" +
        "</li>";
    });

    // An offer the customer turned down stops where it stopped. Drawn straight after the last
    // stage actually reached, so the refusal sits at the point it happened rather than at the
    // far end of a line of stages that never came.
    if (j.declined) {
      steps.splice(Math.max(0, j.declined.after + 1), 0,
        '<li class="jstep declined" title="' +
          escapeHtml("The customer did not take this offer" +
            (j.declined.reason ? " — " + j.declined.reason : "")) + '">' +
          '<span class="jdot"></span>' +
          '<span class="jlabel">Declined</span>' +
          '<span class="jdate">' + escapeHtml(j.declined.reason || "") + "</span>" +
        "</li>");
    }
    steps = steps.join("");

    var head;
    if (j.closed) {
      head = '<span class="badge badge-lost">' + escapeHtml(j.label) + "</span>" +
        '<span class="jhead-note">This quotation is closed.</span>';
    } else if (j.stalled) {
      head = '<span class="badge badge-followup">Revised</span>' +
        '<span class="jhead-note">Superseded by a later revision — follow that one.</span>';
    } else {
      head = '<span class="badge badge-active">' + escapeHtml(j.label) + "</span>" +
        (j.nextLabel ? '<span class="jhead-note">Next: ' + escapeHtml(j.nextLabel) + "</span>"
                     : '<span class="jhead-note">Complete.</span>');
    }
    if (j.orderNo) {
      head += '<span class="jhead-note mono">' + escapeHtml(j.orderNo) + "</span>";
    }
    if (j.creditHold) {
      head += '<span class="badge badge-overdue">On credit hold</span>' +
        (j.creditHoldReason
          ? '<span class="jhead-note">' + escapeHtml(j.creditHoldReason) + "</span>" : "");
    }

    return '<div class="card journey"><div class="jhead">' + head + "</div>" +
      '<ol class="jsteps">' + steps + "</ol></div>";
  }

  function canEditMasters() {
    return ["Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function canEditQuotes() {
    return ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  // ---- History list ----
  function initQuotationsView() {
    if (!configLists) loadConfigLists();
    if (!lostReasonsCache.length) {
      srv.withSuccessHandler(function (rows) { lostReasonsCache = rows; })
        .withFailureHandler(function () {}).listLostReasons();
    }
    // 2.0 draws the page as its demo does (qvQuotesInit); the other faces keep ERP 1's list.
    if (FACE_V2) { qvQuotesInit(); return; }
    loadQuotations();
  }

  function loadQuotations() {
    srv.withSuccessHandler(function (rows) {
      quotationsCache = rows; renderQuotations();
    }).withFailureHandler(onServerError).listQuotations({
      mineOnly: $("quotations-mine").checked,
      includeClosed: $("quotations-closed").checked
    });
  }

  /**
   * Which stream a quotation belongs to, said in one word.
   *
   * The two documents are different offers — different price schedule, different terms,
   * different annexures — and the list showed nothing to tell them apart. The quotation
   * number does not help either: both streams draw from the same series, so PIE/…/12 and
   * PIE/…/13 can be a compressor and a set of spares.
   */
  function streamBadge(stream) {
    var spares = stream === "Spare Sales";
    return '<span class="badge ' + (spares ? "badge-quoted" : "badge-followup") + '">' +
      (spares ? "Spares" : "Compressor") + "</span>";
  }

  /**
   * The stage a quotation has reached, for the list. Status says what the quotation is;
   * this says how far the job behind it has got, which is the question actually being asked
   * when somebody scans this screen.
   */
  function stageCell(j) {
    if (!j) return "—";
    if (j.closed || j.stalled) {
      return '<span style="color:var(--ink-soft);">' + escapeHtml(j.label) + "</span>";
    }
    var n = j.stages.length;
    var done = j.reachedIndex + 1;
    return '<span class="stage-cell" title="' +
      escapeHtml(j.nextLabel ? "Next: " + j.nextLabel : "Complete") + '">' +
      escapeHtml(j.label) +
      '<span class="stage-count">' + done + "/" + n + "</span>" +
      (j.creditHold ? ' <span class="badge badge-overdue">hold</span>' : "") +
      "</span>";
  }

  /**
   * When the offer was actually put together, to the minute.
   *
   * The quotation date is the date on the document, which a coordinator can set to anything —
   * it is what the customer reads. This is the other question: which of the four we did on
   * Tuesday is this, and in what order. Quotations raised before the time was recorded have
   * only a date, so that is all this shows for them rather than inventing midnight.
   */
  function preparedCell(r) {
    var raw = String(r.createdAt || "").trim();
    if (!raw) return "—";
    if (raw.indexOf("T") === -1) return escapeHtml(raw.slice(0, 10));
    var when = new Date(raw);
    if (isNaN(when.getTime())) return escapeHtml(raw.slice(0, 10));
    // In the reader's own clock, which for PIE is IST.
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    return escapeHtml(when.getFullYear() + "-" + pad(when.getMonth() + 1) + "-" +
        pad(when.getDate())) +
      '<br><span class="mono" style="font-size:11.5px; color:var(--ink-soft);">' +
      escapeHtml(pad(when.getHours()) + ":" + pad(when.getMinutes())) + "</span>";
  }

  function renderQuotations() {
    var q = ($("quotations-search").value || "").toLowerCase();
    var wantStream = $("quotations-stream").value;
    var rows = quotationsCache.filter(function (r) {
      if (wantStream && r.businessStream !== wantStream) return false;
      return [r.quoteNo, r.customerName, r.machineModel, r.serialNo, r.businessStream]
        .join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var tbody = $("quotations-tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="13"><div class="empty">' +
        (quotationsCache.length
          ? "No quotations match your search."
          : "No quotations yet — raise one from an enquiry.") +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (r) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(r.quoteNo) + "</td>" +
        '<td class="mono">' + escapeHtml(r.revision || "R0") + "</td>" +
        "<td>" + streamBadge(r.businessStream) + "</td>" +
        "<td>" + escapeHtml(r.date) + "</td>" +
        '<td style="white-space:nowrap;">' + preparedCell(r) + "</td>" +
        "<td>" + escapeHtml(r.customerName || "—") + "</td>" +
        "<td>" + escapeHtml(r.machineModel || "—") + "</td>" +
        '<td class="num">' + r.itemCount + "</td>" +
        '<td class="num mono">' + fmt(r.grand) + "</td>" +
        '<td><span class="badge ' + (QUOTE_BADGE[r.status] || "badge-draft") + '">' +
          escapeHtml(quoteStatusLabel(r.status)) +
          (r.locked ? " 🔒" : "") + "</span></td>" +
        "<td>" + stageCell(r.journey) + "</td>" +
        "<td>" + (r.validUntil
          ? (r.expired ? '<span class="badge badge-overdue">' + escapeHtml(r.validUntil) + "</span>" : escapeHtml(r.validUntil))
          : "—") + "</td>" +
        '<td class="center"><button class="btn btn-sm" data-open-quote="' + r.id + '">Open</button></td>' +
        "</tr>";
    }).join("");

    tbody.querySelectorAll("[data-open-quote]").forEach(function (btn) {
      btn.addEventListener("click", function () { openQuotation(btn.dataset.openQuote); });
    });
  }

  $("quotations-stream").innerHTML = '<option value="">Both streams</option>' +
    BUSINESS_STREAMS.map(function (st) {
      return '<option value="' + escapeHtml(st) + '">' + escapeHtml(st) + "</option>";
    }).join("");

  $("quotations-search").addEventListener("input", renderQuotations);
  $("quotations-stream").addEventListener("change", renderQuotations);
  $("quotations-mine").addEventListener("change", loadQuotations);
  $("quotations-closed").addEventListener("change", loadQuotations);

  // ---- Builder ----
  function openQuotation(id) {
    srv.withSuccessHandler(function (q) {
      openQuote = q;
      renderQuoteBuilder();
      goToTab("quote");
    }).withFailureHandler(onServerError).getQuotation(id);
  }

  /**
   * The New Quotation screen used to show only an empty state, because a quotation could be
   * created from an enquiry or an opportunity but never from the screen named after the act.
   * The picker below fixes that; raising from an enquiry is still the better path and the
   * panel says so.
   */
  /** Active customers, kept for both the start panel and the change-customer picker. */
  var quoteCustomers = [];

  function customerOptions(selectedId) {
    if (!quoteCustomers.length) return '<option value="">— no customers yet —</option>';
    return quoteCustomers.map(function (c) {
      return '<option value="' + escapeHtml(c.id) + '"' +
        (String(c.id) === String(selectedId) ? " selected" : "") + ">" +
        escapeHtml(c.name) + "</option>";
    }).join("");
  }

  function loadQuoteCustomers(then) {
    srv.withSuccessHandler(function (customers) {
      quoteCustomers = customers.filter(function (c) {
        return String(c.active).toUpperCase() !== "FALSE";
      });
      if (then) then();
    }).withFailureHandler(onServerError).listCustomers(false);
  }

  function initQuoteStarter() {
    loadQuoteCustomers(function () {
      $("qs-customer").innerHTML = customerOptions(null);
      $("btn-qs-create").disabled = !quoteCustomers.length;
    });

    // Spare Sales is not offered here: a spares offer answers an enquiry, and this screen
    // starts one from nothing. The server refuses it too — this is so nobody fills the form
    // in first and is turned away at the end of it.
    var mine = currentUser.businessStream || "All";
    $("qs-stream").innerHTML = BUSINESS_STREAMS
      .filter(function (st) {
        return st !== "Spare Sales" && (mine === "All" || mine === st);
      })
      .map(function (st) {
        return '<option value="' + escapeHtml(st) + '">' + escapeHtml(st) + "</option>";
      }).join("");
    // Somebody whose whole job is spares has nothing to start here, so say where to go
    // rather than showing them an empty picker.
    var sparesOnly = !$("qs-stream").options.length;
    $("qs-start-card").style.display = sparesOnly ? "none" : "";
    $("qs-spares-note").style.display = sparesOnly ? "" : "none";
    syncStartMachineFields();
  }

  /**
   * A spares offer does not start with a machine.
   *
   * On a compressor quotation the model is what is being sold, so naming it before the lines
   * go on narrows everything that follows. Spares are the other way round: which machine the
   * parts belong to is settled by the parts themselves, and the builder asks for the model
   * again on the quotation. Two blank boxes before anything has been chosen, repeated a
   * moment later, read as fields somebody had forgotten to fill.
   */
  function syncStartMachineFields() {
    var spares = $("qs-stream").value === "Spare Sales";
    ["qs-machine-model", "qs-machine-serial"].forEach(function (id) {
      var el = $(id);
      if (el) el.style.display = spares ? "none" : "";
    });
    if (spares) { $("qs-model").value = ""; $("qs-serial").value = ""; }
  }

  $("qs-stream").addEventListener("change", syncStartMachineFields);

  $("btn-qs-to-enquiries").addEventListener("click", function () { goToTab("enquiries"); });

  /**
   * Adding a customer without leaving the quotation. A walk-in wanting two filters has no
   * record yet, and sending someone to Masters and back for it was four screens of ceremony
   * before a single line could be priced.
   */
  $("btn-qs-new-customer").addEventListener("click", function () {
    onCustomerSaved = function (saved, isNew) {
      if (!isNew) return;
      onCustomerSaved = null;
      // The address and the contact go in on that same form now, so there is nothing left to
      // come back for and the dialog closes itself.
      loadQuoteCustomers(function () {
        $("qs-customer").innerHTML = customerOptions(saved.id);
        $("btn-qs-create").disabled = !quoteCustomers.length;
        showMsg(saved.name + " is selected on the quotation.", "success");
      });
    };
    openCustomerModal(null);
  });

  // Getting back to the list meant opening the Quotations menu and picking All Quotations,
  // from a screen whose whole context is one quotation. The quotation is already saved, so
  // leaving it costs nothing.
  $("btn-qb-back").addEventListener("click", function () {
    releaseMsg();
    goToTab("quotations");
  });

  $("btn-qs-create").addEventListener("click", function () {
    if (!$("qs-customer").value) {
      showMsg("Add a customer first, on the Customers screen.", "error");
      return;
    }
    srv.withSuccessHandler(function (quote) {
      openQuote = quote;
      renderQuoteBuilder();
      showMsg("Quotation " + quote.quoteNo + " started. Add lines from the catalog.", "success");
    }).withFailureHandler(onServerError).createBlankQuotation({
      customerId: $("qs-customer").value,
      businessStream: $("qs-stream").value,
      machineModel: $("qs-model").value.trim(),
      serialNo: $("qs-serial").value.trim(),
      validityDays: $("qs-validity").value
    });
  });

  function initQuoteView() {
    if (openQuote) renderQuoteBuilder(); else renderQuoteEmpty();
  }

  function renderQuoteEmpty() {
    $("qb-empty").style.display = "";
    $("qb-body").style.display = "none";
    $("qb-actions").innerHTML = "";
    $("qb-title").textContent = "New Quotation";
    $("qb-subtitle").textContent = "Raise a quotation for a customer, or open one already in progress.";
    initQuoteStarter();
    if (currentView === "quote") { showAddress(false); showTitle("quote"); }
  }

  function renderQuoteBuilder() {
    var q = openQuote;
    if (!q) { renderQuoteEmpty(); return; }
    // A revision, or another offer opened from inside this one, is the same screen with a
    // different quotation on it: the address follows without adding a step to Back.
    if (currentView === "quote") { showAddress(false); showTitle("quote"); }

    $("qb-empty").style.display = "none";
    $("qb-body").style.display = "";
    $("qb-title").textContent = q.quoteNo + " " + (q.revision || "R0");
    // Which offer this is, first thing, because the document it prints differs in its price
    // schedule, its terms and its annexures — and everything below this line looks the same.
    $("qb-subtitle").innerHTML = streamBadge(q.businessStream) + " " +
      escapeHtml(q.customerName || "") +
      (q.machineModel ? " · " + escapeHtml(q.machineModel) : "");

    // A locked quotation is read-only by design: it is what the customer received.
    var editable = canEditQuotes() && !q.locked;
    $("qb-locked-banner").innerHTML = (q.locked
      ? '<div class="compare-strip" style="margin-bottom:16px;">This quotation is <b>' +
        escapeHtml(quoteStatusLabel(q.status)) + '</b> and locked. ' +
        // Approving locks the offer because it is the version about to go out — but nothing
        // has gone out yet, so telling them the sent version stays untouched named a version
        // that does not exist, and said nothing about the step they were actually on.
        (q.status === "Approved"
          ? 'Send it to the customer, then choose <b>Mark Sent</b> in the <b>Status</b> menu — or ' +
            '<b>Revise</b> there if it ' +
            'still needs changing.'
          : 'Use <b>Revise</b> in the <b>Status</b> menu to create the next revision — the ' +
            'version already sent stays ' +
            'untouched.') +
        "</div>"
      : "") +
      // An offer cannot print or send without an address, and the gap is on the customer
      // record, not on this screen. Said here, while there is still time to fix it quietly.
      (q.addressGap
        ? '<div class="msg msg-error show" style="position:static; margin-bottom:16px;">' +
          '<span class="msg-text"><b>No address to print.</b> ' + escapeHtml(q.addressGap) +
          ' Until then this quotation can be built, but not printed, emailed or sent.</span></div>'
        : "") +
      // The customer's e-mail prints on every offer. When there is none on file, said here.
      (q.emailGap && !q.addressGap
        ? '<div class="msg msg-warn show" data-email-gap style="position:static; margin-bottom:16px;">' +
          '<span class="msg-text"><b>No e-mail address to print.</b> ' + escapeHtml(q.emailGap) +
          "</span></div>"
        : "");

    // A draft can still be re-addressed; anything locked shows the name as plain text.
    var canRepoint = editable;
    $("qb-customer").style.display = canRepoint ? "none" : "";
    $("qb-customer-pick").style.display = canRepoint ? "" : "none";
    $("qb-customer").value = q.customerName || "";
    if (canRepoint) {
      if (!quoteCustomers.length) {
        loadQuoteCustomers(function () {
          $("qb-customer-pick").innerHTML = customerOptions(q.customerId);
        });
      } else {
        $("qb-customer-pick").innerHTML = customerOptions(q.customerId);
      }
    }
    $("qb-customer-note").textContent = "";
    $("qb-gstin").value = q.customerGstin || "";
    renderQuoteParties(q, editable);
    $("btn-qb-edit-customer").style.display = q.customerId ? "" : "none";
    $("qb-model").value = q.machineModel || "";
    $("qb-serial").value = q.serialNo || "";
    $("qb-date").value = q.date || "";
    $("qb-validity").value = q.validityDays || 7;
    $("qb-validuntil").value = q.validUntil || "";
    $("qb-paymentterms").value = q.paymentTerms || "";
    $("qb-deliveryterms").value = q.deliveryTerms || "";
    $("qb-deliveryperiod").value = q.deliveryPeriod || "";
    $("qb-warrantyterms").value = q.warrantyTerms || "";
    $("qb-notes").value = q.notes || "";
    $("qb-pkgdisc").value = Number(q.packageDiscountPct) || 0;
    $("qb-pf").value = Number(q.pfAmount) || 0;
    $("qb-taxmode").value = q.taxMode || "Extra";

    ["qb-model", "qb-serial", "qb-date", "qb-validity", "qb-paymentterms",
     "qb-deliveryterms", "qb-deliveryperiod", "qb-warrantyterms", "qb-notes",
     "qb-pkgdisc", "qb-pf", "qb-taxmode", "qb-customer-pick"].forEach(function (f) {
      $(f).disabled = !editable;
    });
    $("btn-qb-save-header").style.display = editable ? "" : "none";
    $("btn-qb-add-item").style.display = editable ? "" : "none";
    $("btn-qb-add-charge").style.display = editable ? "" : "none";
    if (!editable) {
      $("qb-add-panel").style.display = "none";
      $("qb-charge-panel").style.display = "none";
    }

    renderQuoteJourney(q.journey);
    renderOwnership(q);
    renderApprovalNote(q);
    renderQuoteActions(q, editable);
    renderQuoteItems(q, editable);
    renderQuoteTotals(q);
  }

  /**
   * The quotation's way forward, as one menu.
   *
   * It used to be a row of buttons that changed at every stage — Mark Approved became Mark
   * Sent became Mark Accepted and Mark Declined, with Revise and Reopen appearing beside them
   * — so the button under the cursor was a different one each time, and the header never
   * looked the same twice. PIE asked for one place instead: a Status menu listing every stage
   * in order, ticked where it has been reached, with the next step the one that can be
   * pressed. The other actions that come and go (Declined, Revise, Versions, Reopen, Discard)
   * sit under it. Print and New Quotation are there at every stage, so they stay buttons.
   *
   * The rules for what may be done when are the ones the buttons had; only where they live
   * has changed.
   */
  function renderQuoteActions(q, editable) {
    var zone = $("qb-actions");
    // Changing a quotation's content needs it unlocked; moving it to the next step does not,
    // and conflating the two left an Approved quotation with no way forward.
    var mayAdvance = canEditQuotes();
    var journey = q.journey || {};
    var stages = journey.stages || [];

    // What a stage's row does, when it is the step to take now.
    var stepAction = {};
    if (mayAdvance && q.status === "Draft") {
      stepAction.approved = { qs: "Approved", text: "Mark Approved" };
    }
    // Not offered on a draft: nothing leaves without being approved first.
    if (mayAdvance && ["Approved", "Negotiating"].indexOf(q.status) !== -1) {
      stepAction.sent = { qs: "Submitted", text: "Mark Sent" };
    }
    // The customer's answer, once the customer has been asked.
    if (mayAdvance && ["Submitted", "Negotiating"].indexOf(q.status) !== -1) {
      stepAction.accepted = { qs: "Won", text: "Mark Accepted" };
    }
    // The PO is what turns their yes into an order, so it is asked for here.
    if (mayAdvance && q.status === "Won") {
      if (journey.orderNo) {
        stepAction.order = { act: "open-order", id: "btn-qb-open-order", text: "Open " + journey.orderNo };
      } else if (canEditOrders()) {
        stepAction.po = { act: "make-order", id: "btn-qb-make-order", text: "Record PO & Create Order" };
      }
    }

    var others = [];
    if (mayAdvance && ["Submitted", "Negotiating"].indexOf(q.status) !== -1) {
      others.push({ qs: "Lost", text: "Mark Declined" });
    }
    if (canEditQuotes() && q.locked) {
      others.push({ act: "revise", id: "btn-qb-revise", text: "Revise" });
    }
    // Whenever this offer has been revised at all, from whichever version is open.
    if (q.revision !== "R0" || q.parentQuotationId) {
      others.push({ act: "versions", id: "btn-qb-versions", text: "Versions" });
    }
    // The way back down, for an offer that should not have left Draft at all.
    if (canEditQuotes() && q.locked && ["Won", "Lost"].indexOf(q.status) === -1) {
      others.push({ act: "reopen", id: "btn-qb-reopen", text: "Reopen as Draft" });
    }
    // Nothing on it — no compressor, no part — so nothing to keep, whatever its status.
    var goods = (q.items || []).filter(function (i) { return (i.lineType || "Item") !== "Charge"; });
    if (canEditQuotes() && !goods.length && !journey.orderNo) {
      others.push({ act: "delete", id: "btn-qb-delete", text: "Delete Quotation", danger: true });
    } else if (editable && q.status === "Draft") {
      others.push({ act: "discard", id: "btn-qb-discard", text: "Discard Draft", danger: true });
    }

    var pressable = function (a, cls, inner) {
      return '<button type="button" role="menuitem" class="qs-item ' + cls + '"' +
        (a.id ? ' id="' + a.id + '"' : "") +
        (a.qs ? ' data-qs="' + a.qs + '"' : "") +
        (a.act ? ' data-act="' + a.act + '"' : "") + ">" + inner + "</button>";
    };
    var tick = function (done) {
      return '<span class="qs-tick" aria-hidden="true">' + (done ? "✓" : "") + "</span>";
    };

    var rows = stages.map(function (st) {
      var a = stepAction[st.key];
      var when = st.date || st.detail || "";
      if (a) {
        return pressable(a, "qs-next" + (st.done ? " qs-done" : ""), tick(st.done) +
          '<span class="qs-label">' + escapeHtml(a.text) + "</span>" +
          '<span class="qs-sub">' + escapeHtml(st.label) + "</span>");
      }
      return '<div class="qs-item qs-static' + (st.done ? " qs-done" : "") + '" role="menuitem" ' +
        'aria-disabled="true">' + tick(st.done) +
        '<span class="qs-label">' + escapeHtml(st.label) +
          (st.done ? '<span class="sr-only"> (done)</span>' : "") + "</span>" +
        (st.done && when ? '<span class="qs-sub">' + escapeHtml(when) + "</span>" : "") +
        "</div>";
    });
    if (journey.declined) {
      rows.push('<div class="qs-item qs-static qs-stop" role="menuitem" aria-disabled="true">' +
        '<span class="qs-tick" aria-hidden="true">✕</span><span class="qs-label">Declined</span>' +
        (journey.declined.reason ? '<span class="qs-sub">' + escapeHtml(journey.declined.reason) + "</span>" : "") +
        "</div>");
    } else if (journey.expired) {
      rows.push('<div class="qs-item qs-static qs-stop" role="menuitem" aria-disabled="true">' +
        '<span class="qs-tick" aria-hidden="true">✕</span><span class="qs-label">Expired</span></div>');
    }

    var current = journey.label || q.status || "";
    zone.innerHTML =
      // Available at every status, locked included: a sent quotation is exactly the one most
      // often reprinted.
      '<button class="btn btn-sm" id="btn-qb-print">Print / PDF</button>' +
      // Leaving a quotation: keep it and come back, or start another.
      '<button class="btn btn-sm" id="btn-qb-new">+ New Quotation</button>' +
      '<div class="qs-menu" id="qb-status-menu">' +
        '<button type="button" class="btn btn-sm btn-primary" id="btn-qb-status" aria-haspopup="menu" ' +
          'aria-expanded="false" aria-controls="qb-status-list">Status: ' + escapeHtml(current) +
          ' <span class="qs-caret" aria-hidden="true">▾</span></button>' +
        '<div class="qs-list" id="qb-status-list" role="menu" aria-label="Quotation status" hidden>' +
          '<div class="qs-head">Stages</div>' + rows.join("") +
          (others.length
            ? '<div class="qs-head">More</div>' + others.map(function (a) {
                return pressable(a, a.danger ? "qs-danger" : "", tick(false) +
                  '<span class="qs-label">' + escapeHtml(a.text) + "</span>");
              }).join("")
            : "") +
        "</div>" +
      "</div>";

    var menu = $("qb-status-list");
    var toggle = $("btn-qb-status");
    var setOpen = function (open) {
      menu.hidden = !open;
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) {
        var first = menu.querySelector("button.qs-item");
        if (first) first.focus();
      }
    };
    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      setOpen(menu.hidden);
    });
    menu.addEventListener("click", function (e) { e.stopPropagation(); });
    menu.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { setOpen(false); toggle.focus(); return; }
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      e.preventDefault();
      var items = Array.prototype.slice.call(menu.querySelectorAll("button.qs-item"));
      var at = items.indexOf(document.activeElement);
      var next = items[(at + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length];
      if (next) next.focus();
    });
    quoteStatusMenuClose = function () { if (!menu.hidden) setOpen(false); };

    var run = function (btn, fn) {
      btn.addEventListener("click", function () { setOpen(false); fn(); });
    };
    menu.querySelectorAll("[data-qs]").forEach(function (btn) {
      run(btn, function () { changeQuoteStatus(btn.dataset.qs); });
    });
    var acts = {
      "make-order": openPurchaseOrderForm,
      "open-order": function () {
        goToTab("orders");
        setTimeout(function () { openOrderModal(q.journey.orderId); }, 400);
      },
      versions: openVersions,
      reopen: reopenOpenQuote,
      discard: discardOpenQuote,
      "delete": deleteOpenQuote,
      revise: reviseOpenQuote
    };
    menu.querySelectorAll("[data-act]").forEach(function (btn) {
      run(btn, acts[btn.dataset.act]);
    });

    $("btn-qb-print").addEventListener("click", openQuoteDocument);

    // Nothing to save: a quotation is written to the sheet the moment it is created, so
    // walking away from it leaves a draft sitting in the Quotations list, which is where it
    // is picked up again.
    $("btn-qb-new").addEventListener("click", function () {
      var leaving = openQuote;
      openQuote = null;
      renderQuoteEmpty();
      clearMsg();
      showMsg(leaving.quoteNo + " is saved as a draft — reopen it any time from " +
        "All Quotations. Starting a new one.", "success");
    });
  }

  // The open Status menu closes on a click anywhere else, or Escape, like the other menus.
  var quoteStatusMenuClose = function () {};
  document.addEventListener("click", function () { quoteStatusMenuClose(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") quoteStatusMenuClose();
  });

  function reopenOpenQuote() {
    var id = openQuote.id;
    askDialog({
      title: "Reopen " + openQuote.quoteNo + " as a draft?",
      message: "It becomes editable again, and its approval and submission dates are " +
        "cleared. Use Revise instead if this quotation went to the customer and needs " +
        "changing — that keeps the sent version.",
      input: true, inputLabel: "Reason", okLabel: "Reopen"
    }, function (reason) {
      if (reason === null) return;
      srv.withSuccessHandler(function (q) {
        openQuote = q;
        renderQuoteBuilder();
        showMsg(q.quoteNo + " is a draft again.", "success");
      }).withFailureHandler(onServerError).reopenQuotation(id, reason);
    });
  }

  function discardOpenQuote() {
    var lineCount = (openQuote.items || []).length;
    askDialog({
      title: "Discard " + openQuote.quoteNo + "?",
      message: "This draft and " + (lineCount === 1 ? "its 1 line" : "its " + lineCount + " lines") +
        " are deleted for good. Only a draft can be discarded — anything already sent to a " +
        "customer is marked Lost instead, so the record survives.",
      okLabel: "Discard",
      danger: true
    }, function (ok) {
      if (ok === null) return;
      srv.withSuccessHandler(function (res) {
        openQuote = null;
        renderQuoteEmpty();
        clearMsg();
        showMsg(res.quoteNo + " discarded.", "success");
      }).withFailureHandler(onServerError).discardQuotation(openQuote.id);
    });
  }

  function deleteOpenQuote() {
    var q = openQuote;
    var label = q.quoteNo + (q.revision && q.revision !== "R0" ? " " + q.revision : "");
    askDialog({
      title: "Delete " + label + "?",
      message: "It has no compressors or parts on it, so nothing offered is lost. It is deleted " +
        "for good" + ((q.items || []).length ? ", with its charge lines" : "") + "." +
        (q.parentQuotationId ? " The version before it becomes the current one again." : ""),
      okLabel: "Delete Quotation",
      danger: true
    }, function (ok) {
      if (ok === null) return;
      srv.withSuccessHandler(function (res) {
        openQuote = null;
        renderQuoteEmpty();
        clearMsg();
        var back = res.restored;
        showMsg(label + " deleted." + (back ? " " + back.quoteNo + (back.revision !== "R0" ? " " + back.revision : "") +
          " is the current version again (" + back.status + ")." : ""), "success");
      }).withFailureHandler(onServerError).deleteQuotation(q.id);
    });
  }

  function reviseOpenQuote() {
    // The reason is asked before anything happens, and the server refuses a revision
    // without one, so this is not a box that can be skipped by pressing Enter.
    askDialog({
      title: "Why is this quotation being revised?",
      message: "The current version is kept exactly as it is and marked Revised. " +
        "A copy opens for editing as the next revision, and the reason is recorded " +
        "against it for anyone who later asks why it changed.",
      input: true,
      inputLabel: "Reason for revision *",
      placeholder: "e.g. Customer asked for a lower price",
      // The same rule reviseQuotation enforces, said here first so the dialog stays open.
      validate: function (v) {
        var t = String(v || "").replace(/\s+/g, " ").trim();
        return (t.length < 5 || !/[A-Za-z0-9]{2,}/.test(t))
          ? "Give a real reason — for example “Customer asked for a lower price”."
          : "";
      },
      okLabel: "Revise"
    }, function (reason) {
      if (reason === null) return;
      srv.withSuccessHandler(function (nq) {
        openQuote = nq;
        renderQuoteBuilder();
        showMsg("Now editing " + nq.quoteNo + " " + nq.revision + ".", "success");
      }).withFailureHandler(onServerError).reviseQuotation(openQuote.id, reason);
    });
  }

  // ---- The customer said yes ----
  // The lines, prices and addresses are already on the quotation, so the only thing the
  // system does not yet know is what the customer sent back. That is all this asks for.
  function openPurchaseOrderForm() {
    var q = openQuote;
    if (!q) return;
    $("po-modal-sub").textContent = q.quoteNo + " " + (q.revision || "") + " · " +
      (q.customerName || "") + " — every line, price and address carries across; only the " +
      "customer's own paperwork is asked for here.";
    $("po-modal-msg").innerHTML = "";
    $("po-no").value = "";
    $("po-date").value = new Date().toISOString().slice(0, 10);
    // Defaulting to the total printed on the offer — tax included, which is the figure the
    // customer's purchase order is raised against. Defaulting to the pre-tax figure put a
    // variance on every order that matched the offer exactly.
    var payable = q.payable === undefined ? q.grand : q.payable;
    $("po-value").value = payable;
    $("po-quoted").textContent = "We quoted " + fmt(payable) +
      " including GST. A different PO value is recorded as a variance, not refused.";
    $("po-promised").value = "";
    $("po-modal-backdrop").classList.add("show");
    setTimeout(function () { $("po-no").focus(); }, 50);
  }

  function poModalError(text) {
    $("po-modal-msg").innerHTML =
      '<div class="msg msg-error show" style="position:static; margin-bottom:14px;">' +
      '<span class="msg-text">' + escapeHtml(text) + "</span></div>";
  }

  $("btn-po-cancel").addEventListener("click", function () {
    $("po-modal-backdrop").classList.remove("show");
  });

  $("btn-po-save").addEventListener("click", function () {
    if (!$("po-no").value.trim()) { poModalError("Enter the customer's PO number."); return; }
    var quoteId = openQuote.id;
    var quoteNo = openQuote.quoteNo;
    var btn = $("btn-po-save");
    btn.disabled = true;
    srv.withSuccessHandler(function (order) {
      btn.disabled = false;
      $("po-modal-backdrop").classList.remove("show");
      // Reloaded rather than patched in hand: the journey strip now has an order to point at,
      // and only the server knows what it is called.
      srv.withSuccessHandler(function (q) {
        openQuote = q;
        renderQuoteBuilder();
      }).withFailureHandler(function () {}).getQuotation(quoteId);
      // A credit hold is the one thing that stops this order moving, and the person who just
      // created it is the one who needs to know — not whoever opens the Orders tab next.
      showMsg("Order " + order.orderNo + " created from " + quoteNo + "." +
        (order.creditHold
          ? " It is on credit hold: " + (order.creditHoldReason || "the customer is over their limit") +
            ". Management can release it from the Orders tab."
          : " Open it from the Orders tab to attach the PO document and plan the dispatch."),
        "success", true);
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      poModalError(err && err.message ? err.message : String(err));
    }).createOrderFromQuotation({
      quotationId: quoteId,
      poNo: $("po-no").value.trim(),
      poDate: $("po-date").value,
      poValue: $("po-value").value,
      promisedDispatchDate: $("po-promised").value
    });
  });

  // ---- The customer said no ----
  // A dropdown alone says the shape of a loss and nothing about the loss itself. What the
  // customer actually said, who took the business and at what price is the part worth having
  // when the same customer is quoted again.
  function openDeclineForm() {
    var q = openQuote;
    $("lost-modal-sub").textContent = q.quoteNo + " " + (q.revision || "") + " · " +
      (q.customerName || "") + " — this closes the quotation, and what you write here is what " +
      "the next person quoting them will read.";
    $("lost-modal-msg").innerHTML = "";
    $("lost-reason").innerHTML = '<option value="">Choose a reason…</option>' +
      lostReasonsCache.map(function (r) {
        return '<option value="' + escapeHtml(r.id) + '">' + escapeHtml(r.reasonText) + "</option>";
      }).join("");
    $("lost-notes").value = "";
    $("lost-competitor").value = "";
    $("lost-price").value = "";
    $("lost-quoted").textContent = "We quoted " + fmt(q.grand) + ".";
    $("lost-modal-backdrop").classList.add("show");
  }

  function lostModalError(text) {
    $("lost-modal-msg").innerHTML =
      '<div class="msg msg-error show" style="position:static; margin-bottom:14px;">' +
      '<span class="msg-text">' + escapeHtml(text) + "</span></div>";
  }

  $("btn-lost-cancel").addEventListener("click", function () {
    $("lost-modal-backdrop").classList.remove("show");
  });

  $("btn-lost-save").addEventListener("click", function () {
    var reasonId = $("lost-reason").value;
    if (!reasonId) { lostModalError("Choose why the customer declined."); return; }
    var price = $("lost-price").value;
    if (price !== "" && Number(price) < 0) {
      lostModalError("A competitor's price cannot be negative.");
      return;
    }
    var btn = $("btn-lost-save");
    btn.disabled = true;
    applyQuoteStatus("Lost", reasonId, {
      notes: $("lost-notes").value.trim(),
      competitor: $("lost-competitor").value.trim(),
      price: price
    }, function (err) {
      btn.disabled = false;
      if (err) { lostModalError(err.message || String(err)); return; }
      $("lost-modal-backdrop").classList.remove("show");
    });
  });

  /**
   * Every version of the offer in front of you, and nothing else.
   *
   * Revising creates a separate quotation so that what the customer received cannot be edited
   * underneath them. The cost of that is that the versions of one offer sit in All Quotations
   * among everybody else's work, told apart by a small R1 against the number — so "what did
   * we send them last time" meant hunting through a list. This is that list, on its own.
   */
  function openVersions() {
    if (!openQuote) return;
    $("ver-sub").textContent = "Loading…";
    $("ver-tbody").innerHTML = "";
    $("versions-modal-backdrop").classList.add("show");

    srv.withSuccessHandler(function (rows) {
      $("ver-sub").textContent = (openQuote.customerName || "") + " · " +
        rows.length + (rows.length === 1 ? " version" : " versions") +
        ". The newest one that has not been replaced is the live offer.";
      $("ver-tbody").innerHTML = rows.map(function (v) {
        return '<tr' + (v.isCurrent ? ' style="background:var(--steel-light);"' : "") + ">" +
          '<td class="mono"><b>' + escapeHtml(v.revision) + "</b>" +
            (v.isCurrent ? ' <span class="badge badge-active">open</span>' : "") +
            (v.superseded ? ' <span class="badge badge-draft">replaced</span>' : "") + "</td>" +
          "<td>" + escapeHtml(v.date || "—") + "</td>" +
          "<td>" + escapeHtml(v.preparedBy || "—") + "</td>" +
          // R0 is the original offer and has nothing to explain. A later version without a
          // reason was revised before the question was compulsory, and says so.
          '<td style="max-width:240px; font-size:12.5px;">' + (v.revisionReason
            ? escapeHtml(v.revisionReason)
            : '<span style="color:var(--ink-soft);">' +
              (String(v.revision) === "R0" ? "original offer" : "not recorded") + "</span>") +
          "</td>" +
          "<td>" + (v.approvalDate
            ? escapeHtml(v.approvalDate) + '<br><span style="font-size:11px; color:var(--ink-soft);">' +
              escapeHtml(v.approvedBy || "") + "</span>"
            : '<span style="color:var(--ink-soft);">not approved</span>') + "</td>" +
          '<td class="num mono">' + fmt(v.grand) + "</td>" +
          "<td>" + escapeHtml(v.journeyLabel || quoteStatusLabel(v.status)) + "</td>" +
          '<td class="center">' + (v.isCurrent
            ? ""
            : '<button class="btn btn-sm" data-open-ver="' + escapeHtml(v.id) + '">Open</button>') +
          "</td></tr>";
      }).join("");

      $("ver-tbody").querySelectorAll("[data-open-ver]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          $("versions-modal-backdrop").classList.remove("show");
          openQuotation(btn.dataset.openVer);
        });
      });
    }).withFailureHandler(function (err) {
      $("versions-modal-backdrop").classList.remove("show");
      onServerError(err);
    }).listQuotationVersions(openQuote.id);
  }

  $("btn-ver-close").addEventListener("click", function () {
    $("versions-modal-backdrop").classList.remove("show");
  });

  function changeQuoteStatus(status) {
    if (status !== "Lost") { applyQuoteStatus(status, "", null, null); return; }

    // A lost quotation must record why, so lost-order analysis has something to work with.
    if (lostReasonsCache.length) { openDeclineForm(); return; }
    // The reasons are loaded by the screens that list quotations. Opening a quotation from a
    // link, or creating one here, goes straight to the builder and never touches that list —
    // and pressing Mark Declined then read "none are configured" when they were.
    srv.withSuccessHandler(function (rows) {
      lostReasonsCache = rows || [];
      if (!lostReasonsCache.length) {
        showMsg("No lost reasons are configured yet — add them on the LostReasons tab.", "error");
        return;
      }
      openDeclineForm();
    }).withFailureHandler(onServerError).listLostReasons();
  }

  /**
   * `done` is called with null on success and the error on failure, so a caller with its own
   * form can keep the form open and show the complaint inside it. Callers without one pass
   * nothing and the error goes to the usual message bar.
   */
  function applyQuoteStatus(status, reasonId, details, done) {
    srv.withSuccessHandler(function (q) {
      openQuote = q;
      renderQuoteBuilder();
      // Accepted and Declined close a quotation, and All Quotations hides closed ones. Saying
      // so here is the difference between a quotation that has moved on and one that looks
      // like it was deleted by the button you just pressed.
      showMsg("Quotation marked " + quoteStatusLabel(status) + "." +
        (["Won", "Lost"].indexOf(status) !== -1
          ? " It is closed now, so All Quotations hides it unless " +
            "\u2018Include closed\u2019 is ticked."
          : ""), "success");
      if (done) done(null);
    }).withFailureHandler(function (err) {
      if (done) { done(err); return; }
      onServerError(err);
    }).setQuotationStatus(openQuote.id, status, reasonId, details);
  }

  $("btn-qb-save-header").addEventListener("click", function () {
    srv.withSuccessHandler(function (q) {
      openQuote = q;
      renderQuoteBuilder();
      showMsg("Quotation details saved.", "success");
    }).withFailureHandler(onServerError).saveQuotationHeader({
      id: openQuote.id,
      contactId: $("qb-contact").value,
      billingAddressId: $("qb-billaddr").value,
      shippingAddressId: $("qb-shipaddr").value,
      date: $("qb-date").value,
      validityDays: $("qb-validity").value,
      paymentTerms: $("qb-paymentterms").value.trim(),
      deliveryTerms: $("qb-deliveryterms").value.trim(),
      deliveryPeriod: $("qb-deliveryperiod").value.trim(),
      warrantyTerms: $("qb-warrantyterms").value.trim(),
      machineModel: $("qb-model").value.trim(),
      serialNo: $("qb-serial").value.trim(),
      notes: $("qb-notes").value.trim(),
      packageDiscountPct: $("qb-pkgdisc").value,
      pfAmount: $("qb-pf").value,
      taxMode: $("qb-taxmode").value,
      customerId: $("qb-customer-pick").value || openQuote.customerId
    });
  });

  /**
   * One address, named the way somebody picking from a list needs it named: what kind of
   * address it is, then enough of it to tell two plants apart.
   */
  function addressOptionLabel(a) {
    var where = [a.line1, a.city].filter(Boolean).join(", ");
    return (a.label || a.addressType || "Address") + " — " + (where || "no address typed") +
      (a.isDefault ? " (default)" : "");
  }

  function fillAddressSelect(id, rows, chosen) {
    var list = rows || [];
    $(id).innerHTML = '<option value="">' +
      (list.length ? "— not chosen —" : "— none on file —") + "</option>" +
      list.map(function (a) {
        return '<option value="' + escapeHtml(a.id) + '"' +
          (String(a.id) === String(chosen) ? " selected" : "") + ">" +
          escapeHtml(addressOptionLabel(a)) + "</option>";
      }).join("");
  }

  /**
   * Who the offer is addressed to, and which of the customer's premises.
   *
   * These three were stamped on when the quotation was created — the primary contact and
   * whichever address was marked default — and there was no way to say otherwise. A customer
   * with a head office and two plants has three addresses and a different person at each, and
   * the offer has to go to the one who asked for it, at the site the parts are for.
   */
  function renderQuoteParties(q, editable) {
    var contacts = q.contactChoices || [];
    var addresses = q.addressChoices || [];

    var contactLabel = function (c) {
      return c.name + (c.designation ? " · " + c.designation : "") +
        (c.phone ? " · " + c.phone : "");
    };
    var addressLabel = addressOptionLabel;
    var fill = function (id, rows, chosen, blank, label) {
      $(id).innerHTML = '<option value="">' + escapeHtml(blank) + "</option>" +
        rows.map(function (r) {
          return '<option value="' + escapeHtml(r.id) + '"' +
            (String(r.id) === String(chosen) ? " selected" : "") + ">" +
            escapeHtml(label(r)) + "</option>";
        }).join("");
      $(id).disabled = !editable;
    };

    fill("qb-contact", contacts, q.contactId, "Nobody in particular", contactLabel);
    fill("qb-billaddr", addresses, q.billingAddressId, "— none on file —", addressLabel);
    fill("qb-shipaddr", addresses, q.shippingAddressId, "Same as the address above", addressLabel);

    noteQuoteContact(q);
    // An offer with no address cannot be printed at all, and the banner above already says
    // so; here it says which box is the one to fill.
    $("qb-billaddr-note").textContent = addresses.length
      ? "" : "This customer has no address on file. Add one on their record.";
  }

  /** What the chosen person's number and address are, since the offer will carry them. */
  function noteQuoteContact(q) {
    var chosen = (q.contactChoices || []).filter(function (c) {
      return String(c.id) === String($("qb-contact").value);
    })[0];
    $("qb-contact-note").textContent = chosen
      ? [chosen.phone, chosen.email].filter(Boolean).join(" · ") ||
        "No number or email on their record."
      : ((q.contactChoices || []).length
          ? "The offer will carry no name."
          : "This customer has nobody on file. Add them on their record.");
  }

  $("qb-contact").addEventListener("change", function () {
    if (openQuote) noteQuoteContact(openQuote);
  });

  // Re-addressing a quotation replaces the contact and the billing address too, since both
  // belong to the customer being left behind. Saying so beforehand beats a surprise on the
  // printed page.
  $("qb-customer-pick").addEventListener("change", function () {
    var note = $("qb-customer-note");
    if (!openQuote || $("qb-customer-pick").value === openQuote.customerId) {
      note.textContent = "";
      return;
    }
    var picked = $("qb-customer-pick").options[$("qb-customer-pick").selectedIndex];
    note.textContent = "Save Details to move this quotation to " +
      (picked ? picked.textContent : "this customer") +
      ". Their contact and billing address replace the current ones on the printed offer.";
  });

  /** Straight to the customer's record — the usual reason to want it is a missing GSTIN. */
  $("btn-qb-edit-customer").addEventListener("click", function () {
    if (!openQuote || !openQuote.customerId) return;
    var quotationId = openQuote.id;
    onCustomerSaved = function () {
      onCustomerSaved = null;
      // Pull the quotation again so a corrected GSTIN shows here without a reload.
      srv.withSuccessHandler(function (q) {
        openQuote = q;
        renderQuoteBuilder();
      }).withFailureHandler(onServerError).getQuotation(quotationId);
    };
    if (customersLoaded) { openCustomerModal(openQuote.customerId); return; }
    srv.withSuccessHandler(function (rows) {
      customersCache = rows; customersLoaded = true;
      openCustomerModal(openQuote.customerId);
    }).withFailureHandler(onServerError).listCustomers();
  });

  /**
   * A line under the items saying which machines will print a half-empty specification table.
   *
   * The table prints for every machine whether or not its specifications are on file, because
   * a table that is simply absent is invisible and nobody chases a page that was never there.
   * That only becomes useful if somebody is told which rows are blank while the quotation can
   * still be fixed — so this says it here, next to the lines, not after the PDF is out.
   */
  function specGapNote(q) {
    var gaps = q.specGaps || [];
    if (!gaps.length) return "";
    return '<div class="msg msg-error show" style="position:static; margin-top:12px;">' +
      '<span class="msg-text"><b>The specification table will print with blanks.</b> ' +
      gaps.map(function (g) {
        return escapeHtml(g.code) + " has no " + escapeHtml(g.missing.join(", "));
      }).join("; ") +
      ". Fill them on Masters → Catalog → Products and the table completes itself; the rows " +
      "print either way so the gap is visible on the offer.</span></div>";
  }

  function renderQuoteItems(q, editable) {
    var zone = $("qb-items");
    if (!q.items.length) {
      zone.innerHTML = '<div class="empty">No items yet.</div>';
      return;
    }
    zone.innerHTML = '<table><thead><tr><th>#</th><th>Code</th><th>Description</th>' +
      '<th>Delivery</th>' +
      '<th class="num">Qty</th><th class="num">Price</th><th class="num">Disc %</th>' +
      '<th class="num">Tax %</th><th class="num">Line Total</th><th></th></tr></thead><tbody>' +
      q.items.map(function (i) {
        var isCharge = i.lineType === "Charge";
        return "<tr>" +
          "<td>" + i.lineNo + "</td>" +
          '<td class="mono">' + (isCharge
            ? '<span class="badge badge-dormant">charge</span>'
            : escapeHtml(i.itemCode || "—")) + "</td>" +
          "<td>" + escapeHtml(i.description || "—") +
            (i.availabilityNote ? '<br><span style="font-size:11px; color:var(--ink-soft);">' +
              escapeHtml(i.availabilityNote) + "</span>" : "") + "</td>" +
          // Blank means this line goes out with the rest of the order, on the offer's own
          // period — which the header field states. Only a line on its own timetable says
          // anything here, so the column stays quiet in the ordinary case.
          '<td>' + (isCharge ? "" : escapeHtml(leadTimeLabel(i.leadTimeDays) ||
            q.deliveryPeriod || "—")) + "</td>" +
          '<td class="num">' + i.qty + "</td>" +
          '<td class="num mono">' + fmt(i.unitPrice) + "</td>" +
          '<td class="num">' + (Number(i.discountPct) || 0) + "%</td>" +
          '<td class="num">' + (Number(i.taxPct) || 0) + "%</td>" +
          '<td class="num mono">' + fmt(i.lineTotal) + "</td>" +
          '<td class="center">' + (editable
            ? '<button class="btn-ghost" data-edit-line="' + i.id + '" title="Edit">✎</button>' +
              '<button class="btn-ghost" data-del-line="' + i.id + '" title="Remove">✕</button>'
            : "") + "</td>" +
          "</tr>";
      }).join("") + "</tbody></table>";

    zone.querySelectorAll("[data-del-line]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        askDialog({ title: "Remove this line?", okLabel: "Remove", danger: true }, function (ok) {
          if (ok === null) return;
          srv.withSuccessHandler(function (nq) {
            openQuote = nq; renderQuoteBuilder(); showMsg("Line removed.", "success");
          }).withFailureHandler(onServerError).deleteQuotationItem(btn.dataset.delLine);
        });
      });
    });

    if (q.specGaps && q.specGaps.length) zone.insertAdjacentHTML("beforeend", specGapNote(q));

    zone.querySelectorAll("[data-edit-line]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var line = q.items.find(function (x) { return x.id === btn.dataset.editLine; });
        // A charge has no catalog price or discount, so the comma-separated dialog below would
        // ask three questions of which two are meaningless.
        if (line.lineType === "Charge") { openChargeForm(line); return; }
        askDialog({
          title: "Line " + line.lineNo + " — " + (line.itemCode || ""),
          message: "Catalog price is " + fmt(line.listPrice) + ". Enter quantity, price and " +
            "discount separated by commas — for example  2, 1450, 5. Add a fourth number to " +
            "promise this line on its own — days from the order, 0 for ex-stock — or leave it " +
            "off to deliver with the rest of the offer.",
          input: true, inputLabel: "Qty, Price, Discount %, Delivery days",
          value: line.qty + ", " + line.unitPrice + ", " + (Number(line.discountPct) || 0) +
            (line.leadTimeDays === "" || line.leadTimeDays === null ||
             line.leadTimeDays === undefined ? "" : ", " + line.leadTimeDays),
          okLabel: "Update line"
        }, function (val) {
          if (val === null) return;
          var parts = val.split(",").map(function (x) { return x.trim(); });
          srv.withSuccessHandler(function (nq) {
            openQuote = nq; renderQuoteBuilder(); showMsg("Line updated.", "success");
          }).withFailureHandler(onServerError).saveQuotationItem({
            id: line.id, quotationId: q.id, lineNo: line.lineNo,
            itemType: line.itemType, itemId: line.itemId, itemCode: line.itemCode,
            description: line.description, uom: line.uom,
            qty: parts[0], unitPrice: parts[1], discountPct: parts[2] || 0, taxPct: line.taxPct,
            // A fourth value left off means "no line-specific promise", not zero — and zero
            // is Ex-stock, so the two must not be confused. Omitting it clears the line back
            // to the offer's own period, which is what leaving the field empty looks like.
            leadTimeDays: parts.length > 3 && parts[3] !== "" ? parts[3] : ""
          });
        });
      });
    });
  }

  /**
   * The same arithmetic the printed offer shows, so the screen and the document never
   * disagree. When GST is quoted as extra the total genuinely excludes it — the label has to
   * say so, or a coordinator reads a tax line and a total that does not contain it.
   */
  function renderQuoteTotals(q) {
    var taxExtra = (q.taxMode || "Extra") === "Extra";
    var pkg = Number(q.packageDiscountPct) || 0;
    var rows = [
      ["Total package price", fmt(q.subtotal), ""]
    ];
    if (Number(q.discountAmt) > 0) {
      rows.push([pkg > 0 ? "Discount (incl. " + pkg + "% package)" : "Discount",
                 "− " + fmt(q.discountAmt), ""]);
    }
    if (Number(q.pfAmount) > 0) rows.push(["P&F", fmt(q.pfAmount), ""]);
    if (Number(q.freight) > 0) rows.push(["Freight", fmt(q.freight), ""]);
    rows.push([taxExtra ? "GST (charged extra)" : "GST", fmt(q.taxAmt), ""]);
    rows.push([taxExtra ? "Grand Total (before GST)" : "Grand Total", fmt(q.grand), "grand"]);

    $("qb-totals").innerHTML = rows.map(function (r) {
      return '<div class="totals-row ' + r[2] + '"><span>' + r[0] +
        '</span><span class="mono">' + r[1] + "</span></div>";
    }).join("");
  }

  /**
   * Hands a file the server built straight to the browser.
   *
   * Nothing is fetched and no link is followed: the bytes came back with the answer, and this
   * turns them into the download a person expects. Returns false if the browser refused,
   * which is the one case worth saying something about.
   */
  function downloadBytes(name, base64, mimeType) {
    try {
      var binary = atob(base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: mimeType }));
      var link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      return true;
    } catch (e) {
      return false;
    }
  }
