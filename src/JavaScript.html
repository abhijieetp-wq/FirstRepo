<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return "₹" + (Math.round((n || 0) * 100) / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  // Which face this page is (server/page.js): "v2" is ERP 2.0, which adds a few ways of working
  // on top of ERP 1's screens. Apps Script and the other faces read as false and are unchanged.
  var FACE_V2 = document.documentElement.getAttribute("data-face") === "v2";

  // ================= TALKING TO THE SERVER =================
  /**
   * `srv` stands where `google.script.run` used to, and behaves identically.
   *
   * The app no longer runs as the person using it — it runs as its owner, so the spreadsheet
   * is shared with nobody and Google no longer says who is calling. The session token has to
   * travel with every request instead, and a script instance remembers nothing between
   * requests, so it cannot be established once and relied on.
   *
   * Rather than add a token argument to a hundred and seventy-seven calls, every one goes
   * through a single `call(token, name, args)` on the server. This object presents the same
   * chainable shape those calls already use, so the call sites themselves never changed:
   *
   *     srv.withSuccessHandler(ok).withFailureHandler(no).listQuotations({})
   *
   * It also gives one place to notice a session that has ended and send the person back to
   * the sign-in screen, rather than a hundred and seventy-seven identical error toasts.
   */
  var SESSION_KEY = "pie.erp.session";
  var sessionToken = null;
  try { sessionToken = window.localStorage.getItem(SESSION_KEY) || null; } catch (e) { /* private mode */ }

  function rememberSession(token) {
    sessionToken = token || null;
    try {
      if (token) window.localStorage.setItem(SESSION_KEY, token);
      else window.localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* the session still works, it just will not outlive the tab */ }
  }

  /**
   * Where a server call actually goes, which is now one of two places.
   *
   * During the cutover this same file is served by both Apps Script and the Node server, so
   * it cannot be written for either. `runner` presents exactly the shape google.script.run
   * presents — withSuccessHandler, withFailureHandler, then any method name — and sends the
   * call wherever this page came from. On Apps Script that is google.script.run itself; on
   * the server it is a fetch.
   *
   * Four names reach the server directly rather than through `call`, and each for a reason:
   * `call` carries every other request; `login` happens before there is a token to carry;
   * `logout` is on the server's deny list, because a token must not be usable to revoke
   * another; and `googleGateSignInLink` is asked for before anybody has signed in. They are
   * listed rather than derived, so adding a fifth is a decision somebody makes on purpose.
   */
  var ON_APPS_SCRIPT = typeof google !== "undefined" && google.script && google.script.run;

  var ENDPOINTS = {
    call: "/api/call",
    login: "/api/login",
    logout: "/api/logout",
    googleGateSignInLink: "/api/google-link"
  };

  var runner = (function () {
    if (ON_APPS_SCRIPT) {
      return function (handlers) {
        var r = google.script.run;
        if (handlers.ok) r = r.withSuccessHandler(handlers.ok);
        if (handlers.fail) r = r.withFailureHandler(handlers.fail);
        return r;
      };
    }

    return function (handlers) {
      return new Proxy({}, {
        get: function (_, name) {
          return function () {
            var args = Array.prototype.slice.call(arguments);
            var path = ENDPOINTS[name];
            if (!path) {
              (handlers.fail || function () {})(new Error("Unknown action: " + name));
              return;
            }

            var payload;
            if (name === "call") payload = { token: args[0], fn: args[1], args: args[2] || [] };
            else if (name === "login") {
              payload = { username: args[0], password: args[1], googlePass: args[2] };
            } else if (name === "logout") payload = { token: args[0] };
            else payload = {};

            fetch(path, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).then(function (res) {
              return res.json().then(function (body) { return { res: res, body: body }; });
            }).then(function (r) {
              if (!r.res.ok) {
                // The server sends the portal's own message, which is written for whoever
                // is reading it. Handed on as an Error so the handlers below — which have
                // always matched on err.message — do not change.
                throw new Error((r.body && r.body.error) || ("HTTP " + r.res.status));
              }
              (handlers.ok || function () {})(r.body.ok);
            }).catch(function (err) {
              // A dropped connection reaches here too, and it is not a session ending. The
              // message says so rather than sending somebody to a password box that will
              // not help them.
              var e = (err && err.message) ? err
                : new Error("Could not reach the server. Check your connection.");
              (handlers.fail || function () {})(e);
            });
          };
        }
      });
    };
  })();

  var srv = (function () {
    function chain(handlers) {
      return new Proxy({}, {
        get: function (_, name) {
          if (name === "withSuccessHandler") {
            return function (fn) { return chain({ ok: fn, fail: handlers.fail }); };
          }
          if (name === "withFailureHandler") {
            return function (fn) { return chain({ ok: handlers.ok, fail: fn }); };
          }
          return function () {
            var args = Array.prototype.slice.call(arguments);
            runner({
              ok: handlers.ok || function () {},
              fail: function (err) {
                var text = String((err && err.message) || err || "");
                // One place to catch the session ending, wherever it happened.
                if (/SESSION_ENDED/.test(text)) {
                  rememberSession(null);
                  showSignIn("Your session has ended. Please sign in again.");
                  return;
                }
                // The browser's Google account has been shut out while this tab was open.
                // Signing in again cannot help, so the tab is not offered a password box.
                if (/GOOGLE_ACCOUNT_BLOCKED/.test(text)) {
                  rememberSession(null);
                  showBlocked(text);
                  return;
                }
                (handlers.fail || function () {})(err);
              }
            }).call(sessionToken, String(name), args);
          };
        }
      });
    }
    return chain({});
  })();
  // Plain counts, grouped the Indian way like every other number on screen — 13,126 not 13126.
  var fmtInt = function (n) { return Number(n || 0).toLocaleString("en-IN"); };
  /**
   * A lead time in the words the offer uses — the client's half of leadTimeText_ in
   * QuotationDocument.gs, so the screen and the printed page never phrase it differently.
   * Zero is Ex-stock rather than "0 days"; blank stays blank, because no promise on this
   * line means it travels with the rest of the order.
   */
  function leadTimeLabel(days) {
    if (days === "" || days === null || days === undefined) return "";
    var n = Number(days);
    if (isNaN(n) || n < 0) return "";
    if (n === 0) return "Ex-stock";
    if (n === 7) return "1 week";
    if (n % 7 === 0) return (n / 7) + " weeks";
    return n + (n === 1 ? " day" : " days");
  }

  function escapeHtml(str) {
    return String(str === undefined || str === null ? "" : str).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  // Five roles per decision D4. Order here is the display order.
  var ALL_ROLES = ["Sales Coordinator", "Sales Engineer", "Service Coordinator",
    "Service Engineer", "Management", "ERP Admin"];

  // Must match BUSINESS_STREAMS in Schema.gs exactly — these strings are stored on every
  // transaction and filtered on by value, so a short form here silently matches nothing.
  var BUSINESS_STREAMS = ["Compressor Sales", "Spare Sales"];
  var SALES_SIDE = ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"];

  /**
   * Service picks a customer up at the handover and carries them from there: installation,
   * the report, then breakdowns. What they never need is the commercial side — the
   * quotation, the discount, the order value, what the customer owes. So the office they
   * work in is one screen, and everything else in Orders is somebody else's.
   */
  var COMMERCIAL_SIDE = ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"];
  var SERVICE_VIEW = ["Service Coordinator", "Service Engineer", "Sales Coordinator",
    "Management", "ERP Admin"];

  /**
   * Navigation. Screens are grouped behind a handful of headings rather than laid out as one
   * long strip of tabs — a flat bar was already wrapping onto a second row at ten screens, and
   * dashboards, collections and settings are still to come. A group with a single visible
   * child collapses into a plain link, so role filtering never leaves an empty menu.
   */
  var NAV = [
    { view: "dashboard", label: "Dashboard", roles: ALL_ROLES },
    // ERP 2.0's tasks with the scorecard (Tasks.gs). Everybody has tasks; only the 2.0 face.
    { view: "tasks", label: "Tasks", roles: ALL_ROLES, v2: true },
    // ERP 2.0's escalations: deals handed to a named person for a decision (Escalations.gs).
    { view: "escalations", label: "Escalations", roles: SALES_SIDE, v2: true },
    // The two streams are the two front offices (D2) and sit at the same level as each other,
    // never inside a shared "Sales" heading — a stream and a document are different kinds of
    // thing, and putting them in one list is what made the old grouping read wrong.
    // A screen that belongs to one stream is not offered to somebody who works in the other.
    // The server refuses either way; this is so nobody is shown a door that will not open.
    { view: "compressor", label: "Compressor Sales", roles: SALES_SIDE, stream: "Compressor Sales" },
    { view: "enquiries", label: "Spare Sales", roles: SALES_SIDE, stream: "Spare Sales" },
    // ELGi's weekly Service Due Report, worked call by call. The spares desk's other front door.
    { view: "servicedue", label: "Service Due Calls", roles: SALES_SIDE, stream: "Spare Sales" },
    // ERP 2.0's sales visit plans (VisitPlans.gs). Both desks; only the 2.0 face.
    { view: "visits", label: "Visit plans", roles: SALES_SIDE, v2: true },
    { label: "Quotations", children: [
      { view: "quote", label: "New Quotation", roles: SALES_SIDE },
      { view: "quotations", label: "All Quotations", roles: SALES_SIDE },
      { view: "progress", label: "Quotation Progress", roles: SALES_SIDE }
    ] },
    // Reports that read across the screens above. One today, so it shows as a plain link;
    // the next one turns it into a menu.
    { label: "Reports", children: [
      { view: "engineers", label: "Leads by Engineer", roles: SALES_SIDE },
      // ERP 2.0's service engineer report (ServiceEngineerReport.gs). Only the 2.0 face.
      { view: "engreport", label: "Service engineers", roles: ["Service Coordinator", "Service Engineer", "Management", "ERP Admin"], v2: true }
    ] },
    { label: "Orders", children: [
      { view: "orders", label: "Sales Orders", roles: COMMERCIAL_SIDE },
      { view: "dispatch", label: "Dispatch & Billing", roles: COMMERCIAL_SIDE },
      // The last step of the process, and the first of service's: once the goods are known to
      // have arrived, the customer is handed over and an engineer goes to fit them.
      { view: "service", label: "Service Jobs", roles: SERVICE_VIEW },
      // ERP 2.0's AMC contracts and visits (Amc.gs). Only on the 2.0 face.
      { view: "amc", label: "AMC", roles: SERVICE_VIEW, v2: true },
      // ERP 2.0's next-day plan for the engineers' WhatsApp group (ServicePlan.gs).
      { view: "plan", label: "Next-day plan", roles: SERVICE_VIEW, v2: true },
      { view: "collections", label: "Collections", roles: COMMERCIAL_SIDE }
    ] },
    { view: "inventory", label: "Inventory", roles: COMMERCIAL_SIDE },
    { label: "Masters", children: [
      { view: "customers", label: "Customers", roles: COMMERCIAL_SIDE },
      { view: "catalog", label: "Catalog", roles: COMMERCIAL_SIDE },
      // ERP 2.0's form builder: Management's own fields on a form (FormFields.gs). Only 2.0.
      { view: "formfields", label: "Form fields", roles: ["Management", "ERP Admin"], v2: true }
    ] },
    { view: "settings", label: "Settings", roles: ["Management", "ERP Admin"] }
  ];

  /** Every leaf screen, flattened — used for role checks and for the default landing tab. */
  function navLeaves() {
    var out = [];
    NAV.forEach(function (n) {
      if (n.children) { n.children.forEach(function (c) { out.push(c); }); }
      else out.push(n);
    });
    return out;
  }

  function visibleLeaves() {
    return navLeaves().filter(function (t) {
      if (t.v2 && !FACE_V2) return false;
      if (t.roles.indexOf(currentUser.role) === -1) return false;
      // 'All' — Management and the ERP admin — sees both front offices.
      if (!t.stream) return true;
      var mine = currentUser.businessStream || "All";
      return mine === "All" || mine === t.stream;
    });
  }

  /**
   * Every screen at its own address, on the server.
   *
   * The portal is one page, and moving between screens never reloaded it — so the address
   * never changed either. Back left the portal altogether, a refresh dropped you on the first
   * screen, and a screen could not be bookmarked or sent to somebody. Now each screen writes
   * its address as it opens (/quotations, /sales-orders), Back and Forward walk through them,
   * and opening an address goes straight to its screen. A quotation and a progress trail carry
   * which one: /quotation/QT-1a2b3c4d.
   *
   * This is what react-router does inside a React app, done with the same browser feature
   * (history.pushState) directly, because these screens are not React.
   *
   * Only on the server. Apps Script serves the page inside Google's frame, where the address
   * bar belongs to Google and not to this page.
   *
   * The server answers the same list (server/routes.js); tests/routing-test.js keeps the two
   * in step.
   */
  var ROUTES = {
    dashboard: "/dashboard",
    tasks: "/tasks",
    escalations: "/escalations",
    compressor: "/compressor-sales",
    enquiries: "/spare-sales",
    servicedue: "/service-due-calls",
    visits: "/visit-plans",
    quote: "/quotation",
    quotations: "/quotations",
    progress: "/quotation-progress",
    engineers: "/reports/leads-by-engineer",
    engreport: "/reports/service-engineers",
    orders: "/sales-orders",
    dispatch: "/dispatch-billing",
    service: "/service-jobs",
    amc: "/amc",
    plan: "/next-day-plan",
    collections: "/collections",
    inventory: "/inventory",
    customers: "/customers",
    catalog: "/catalog",
    formfields: "/form-fields",
    settings: "/settings"
  };
  var URL_ROUTING = !ON_APPS_SCRIPT && /^https?:$/.test(location.protocol) &&
    !!(window.history && history.pushState);
  /** The screen on show, whichever way it was reached. */
  var currentView = null;

  /** { view, id } for an address, or null when it names no screen. */
  function viewFromPath(path) {
    var p = String(path || "/").replace(/\/+$/, "") || "/";
    var views = Object.keys(ROUTES);
    for (var i = 0; i < views.length; i++) {
      if (ROUTES[views[i]] === p) return { view: views[i], id: "" };
    }
    var m = /^\/(quotation|quotation-progress)\/([A-Za-z0-9_-]{1,64})$/.exec(p);
    if (m) return { view: m[1] === "quotation" ? "quote" : "progress", id: m[2] };
    return null;
  }

  /** The address for what is on screen now. */
  function addressFor(view) {
    var base = ROUTES[view] || "/";
    if (view === "quote" && openQuote && openQuote.id) {
      return base + "/" + encodeURIComponent(openQuote.id);
    }
    return base;
  }

  /**
   * Puts an address in the bar. A new screen is a new step for Back (push); the same screen
   * changing under you — a revision opening in place of the one before — is not (replace).
   */
  function showPath(path, push) {
    if (!URL_ROUTING || location.pathname === path) return;
    try {
      if (push) history.pushState({ view: currentView }, "", path);
      else history.replaceState({ view: currentView }, "", path);
    } catch (e) { /* the address is a convenience; the screen is already right */ }
  }

  function showAddress(push) {
    if (currentView) showPath(addressFor(currentView), push);
  }

  /** The tab's title names the screen, so a row of tabs and the history list can be read. */
  function showTitle(view) {
    if (!URL_ROUTING || !currentUser) return;
    var name = currentUser.appName || "ERP";
    var leaf = navLeaves().filter(function (t) { return t.view === view; })[0];
    var label = view === "quote" && openQuote ? (openQuote.quoteNo || "Quotation")
      : (leaf ? leaf.label : "");
    document.title = label ? label + " \u00b7 " + name : name;
  }

  /** Where the address asks to go, if this person may go there; else their usual first screen. */
  function startAt(visible) {
    var asked = URL_ROUTING ? viewFromPath(location.pathname) : null;
    var may = asked && visible.some(function (t) { return t.view === asked.view; });
    if (!may) { goToTab(landingView(visible), { replace: true }); return; }
    if (asked.id) { openFromAddress(asked, true); return; }
    goToTab(asked.view, { replace: true });
  }

  /** A quotation or a progress trail named in the address. */
  function openFromAddress(asked, first) {
    if (asked.view === "progress") {
      openProgressTrail(asked.id, first ? { replace: true } : { fromHistory: true });
      return;
    }
    srv.withSuccessHandler(function (q) {
      openQuote = q;
      renderQuoteBuilder();
      goToTab("quote", first ? { replace: true } : { fromHistory: true });
    }).withFailureHandler(function (err) {
      // Gone, or not this person's to see. Say so, and leave them somewhere real.
      openQuote = null;
      goToTab("quote", { replace: true });
      onServerError(err);
    }).getQuotation(asked.id);
  }

  if (URL_ROUTING) {
    window.addEventListener("popstate", function () {
      if (!currentUser || $("app").style.display === "none") return;
      // A window left open over the screen being left would sit over the wrong one.
      document.querySelectorAll(".modal-backdrop.show").forEach(function (m) {
        m.classList.remove("show");
      });
      var visible = visibleLeaves();
      var asked = viewFromPath(location.pathname);
      if (!asked || !visible.some(function (t) { return t.view === asked.view; })) {
        goToTab(landingView(visible), { replace: true });
        return;
      }
      if (asked.id && !(asked.view === "quote" && openQuote &&
          String(openQuote.id) === asked.id)) {
        openFromAddress(asked, false);
        return;
      }
      goToTab(asked.view, { fromHistory: true });
    });
  }

  // Master data (Products/Spares/pricing) is Management + ERP Admin only — mirrors
  // MASTER_EDITORS in Auth.gs, which is where the rule is actually enforced.
  /**
   * Adding a part and pricing it is ordinary work, so a coordinator can do it. Removing one,
   * or importing over the whole catalogue, is not — that stays with Management.
   */
  function canEditCatalog() {
    return ["Sales Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }

  function canRemoveFromCatalog() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  var currentUser = null;

  var msgTimer = null;
  var stickyMsg = false;

  /**
   * Success messages fade after a few seconds; errors stay until dismissed. An error the
   * user can miss by looking away is worse than no error at all.
   *
   * A sticky message is neither: it belongs to no action on the screen, and the first screen
   * to finish loading would otherwise wipe it before anybody read it. It waits for the user
   * to go somewhere or for a real message to take its place.
   */
  function showMsg(text, type, sticky) {
    var box = $("msg-box");
    var isError = type === "error";
    if (msgTimer) { clearTimeout(msgTimer); msgTimer = null; }
    stickyMsg = !!sticky;

    box.innerHTML = '<span class="msg-text"></span>' +
      (isError || sticky
        ? '<button class="msg-close" type="button" title="Dismiss">&times;</button>' : "");
    box.querySelector(".msg-text").textContent = text;
    box.className = "msg show " + (isError ? "msg-error" : "msg-success");
    // No scrolling. The banner floats over the page where the person already is; this used to
    // scroll to the top so it could be seen, which threw away their place on every save.

    if (isError || sticky) {
      box.querySelector(".msg-close").addEventListener("click", function () {
        stickyMsg = false;
        box.className = "msg";
      });
    } else {
      msgTimer = setTimeout(function () { box.className = "msg"; }, 4000);
    }
  }

  /**
   * Clears the banner. An error belongs to the action that raised it: once that action
   * succeeds on a retry, or the user moves to another screen, the old message is no longer
   * telling the truth and must go. Leaving it up produced a screen showing a loaded
   * dashboard under an error saying the dashboard could not load.
   */
  function clearMsg() {
    if (stickyMsg) return;
    if (msgTimer) { clearTimeout(msgTimer); msgTimer = null; }
    $("msg-box").className = "msg";
  }

  /** The user going somewhere is what ends a sticky message. */
  function releaseMsg() {
    stickyMsg = false;
    clearMsg();
  }

  function onServerError(err) {
    showMsg(err && err.message ? err.message : String(err), "error");
  }

  /**
   * Replacement for window.prompt/confirm, which the Apps Script sandbox blocks.
   *
   * askDialog({title, message, input, inputLabel, options, optionsLabel, okLabel, danger},
   *           callback)
   *
   * Pass `input: true` for a text field or `options: [{value,label}]` for a dropdown. The
   * callback receives the entered text or selected value ("" when neither was requested),
   * or null on cancel. Both field types live in the markup and are shown or hidden — callers
   * must never rewrite this dialog's DOM, or the handlers below end up reading fields that
   * no longer exist.
   */
  var askState = null;

  function askDialog(opts, callback) {
    var usesSelect = !!(opts.options && opts.options.length);
    askState = {
      callback: callback,
      requiresInput: !!opts.input,
      usesSelect: usesSelect,
      required: opts.required !== false,
      // Optional: returns what is wrong with the answer, or "" when it will do. Said under
      // the box and the dialog stays open, rather than closing and letting the server refuse.
      validate: typeof opts.validate === "function" ? opts.validate : null
    };
    $("ask-error").textContent = "";
    $("ask-input").placeholder = opts.placeholder || "";

    $("ask-title").textContent = opts.title || "Are you sure?";
    $("ask-message").textContent = opts.message || "";

    $("ask-input-wrap").style.display = opts.input ? "" : "none";
    $("ask-input-label").textContent = opts.inputLabel || "Reason";
    $("ask-input").value = opts.value || "";

    $("ask-select-wrap").style.display = usesSelect ? "" : "none";
    $("ask-select-label").textContent = opts.optionsLabel || "Choose one";
    $("ask-select").innerHTML = usesSelect
      ? opts.options.map(function (o) {
          return '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + "</option>";
        }).join("")
      : "";

    $("ask-ok").textContent = opts.okLabel || "Confirm";
    $("ask-ok").className = "btn " + (opts.danger ? "btn-danger" : "btn-primary");
    $("ask-modal-backdrop").classList.add("show");
    if (opts.input) setTimeout(function () { $("ask-input").focus(); }, 50);
  }

  function closeAsk() {
    $("ask-modal-backdrop").classList.remove("show");
    askState = null;
  }

  $("ask-cancel").addEventListener("click", function () {
    var cb = askState && askState.callback;
    closeAsk();
    if (cb) cb(null);
  });

  $("ask-ok").addEventListener("click", function () {
    if (!askState) return;
    var value = askState.usesSelect ? $("ask-select").value : $("ask-input").value.trim();
    if (askState.required && !value && (askState.requiresInput || askState.usesSelect)) {
      (askState.usesSelect ? $("ask-select") : $("ask-input")).focus();
      return;
    }
    var wrong = askState.validate ? askState.validate(value) : "";
    if (wrong) {
      $("ask-error").textContent = wrong;
      (askState.usesSelect ? $("ask-select") : $("ask-input")).focus();
      return;
    }
    var cb = askState.callback;
    closeAsk();
    if (cb) cb(value);
  });

  $("ask-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("ask-ok").click();
  });


  // ---------------- Tabs ----------------
  var VIEW_INIT = {
    catalog: initCatalogView,
    customers: initCustomersView,
    enquiries: initEnquiriesView,
    servicedue: initServiceDueView,
    quotations: initQuotationsView,
    progress: initProgressView,
    engineers: initEngineersView,
    service: initServiceView,
    amc: initAmcView,
    plan: initPlanView,
    tasks: initTasksView,
    escalations: initEscalationsView,
    visits: initVisitPlansView,
    engreport: initEngineerReportView,
    formfields: initFormFieldsView,
    quote: initQuoteView,
    compressor: initCompressorView,
    orders: initOrdersView,
    inventory: initInventoryView,
    dispatch: initDispatchView,
    collections: initCollectionsView,
    dashboard: initDashboardView,
    settings: initSettingsView
  };

  function closeNavMenus() {
    document.querySelectorAll(".nav-menu").forEach(function (m) { m.classList.remove("show"); });
    document.querySelectorAll(".tab-btn.open").forEach(function (b) { b.classList.remove("open"); });
  }

  function goToTab(view, opts) {
    var how = opts || {};
    closeNavMenus();
    clearMsg();

    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    $("view-" + view).classList.add("active");

    // A group heading lights up when the screen you are on lives inside it.
    document.querySelectorAll("#tabs .tab-btn").forEach(function (b) {
      var owns = (b.dataset.views || "").split(",").indexOf(view) !== -1;
      b.classList.toggle("active", owns);
    });
    document.querySelectorAll(".nav-menu button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.view === view);
    });

    // The address first, then the screen: a screen that changes its own address as it draws
    // (the quotation builder does) must find the new step already there to replace.
    currentView = view;
    if (!how.fromHistory) showAddress(!how.replace);
    showTitle(view);

    if (VIEW_INIT[view]) VIEW_INIT[view]();
  }

  /**
   * The screen the app opens on.
   *
   * Everybody used to land on the Dashboard because it is first in the menu. It is also the
   * most expensive screen in the system — it reads fifteen tabs, the whole parts catalogue
   * among them, to draw a control tower — and a coordinator whose job is quotations was
   * paying for it on every single load before they could get to their own work. Management
   * asked for that view and still gets it; everyone else opens on the screen they came for.
   */
  function landingView(visible) {
    // 2.0 opens everybody on their own dashboard (PersonDashboard.gs), as ERP 2 did.
    if (FACE_V2 && visible.some(function (t) { return t.view === "dashboard"; })) return "dashboard";
    if (["Management", "ERP Admin"].indexOf(currentUser.role) !== -1) return visible[0].view;
    var work = visible.filter(function (t) { return t.view !== "dashboard"; });
    return (work[0] || visible[0]).view;
  }

  function renderTabs() {
    var html = "";
    // One rule for who sees a screen, used here and by visibleLeaves, so the menu and the
    // screen the app opens on can never disagree.
    var allowed = function (t) { return visibleLeaves().indexOf(t) !== -1; };

    NAV.forEach(function (group, gi) {
      if (!group.children) {
        if (!allowed(group)) return;
        html += '<button class="tab-btn" data-view="' + group.view +
          '" data-views="' + group.view + '">' + escapeHtml(group.label) + "</button>";
        return;
      }

      var kids = group.children.filter(allowed);
      if (!kids.length) return;

      // One child left after role filtering — show it directly rather than a menu of one.
      if (kids.length === 1) {
        html += '<button class="tab-btn" data-view="' + kids[0].view +
          '" data-views="' + kids[0].view + '">' + escapeHtml(kids[0].label) + "</button>";
        return;
      }

      html += '<div class="nav-group">' +
        '<button class="tab-btn" data-group="' + gi + '" data-views="' +
          kids.map(function (c) { return c.view; }).join(",") + '">' +
          escapeHtml(group.label) + '<span class="tab-caret">&#9662;</span></button>' +
        '<div class="nav-menu" data-menu="' + gi + '">' +
          kids.map(function (c) {
            return '<button data-view="' + c.view + '">' + escapeHtml(c.label) + "</button>";
          }).join("") +
        "</div></div>";
    });

    $("tabs").innerHTML = html;

    $("tabs").querySelectorAll("[data-group]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var menu = $("tabs").querySelector('[data-menu="' + btn.dataset.group + '"]');
        var wasOpen = menu.classList.contains("show");
        closeNavMenus();
        if (!wasOpen) { menu.classList.add("show"); btn.classList.add("open"); }
      });
    });

    $("tabs").querySelectorAll("[data-view]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        releaseMsg();
        goToTab(btn.dataset.view);
      });
    });

    var visible = visibleLeaves();
    // A way back to a list this role cannot open would be a dead end.
    $("btn-qb-back").style.display =
      visible.some(function (t) { return t.view === "quotations"; }) ? "" : "none";
    if (visible.length) startAt(visible);
  }

  // A menu left hanging open over the page is the classic half-finished dropdown.
  document.addEventListener("click", closeNavMenus);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeNavMenus();
  });

  // ================= CATALOG (Parts + Units) =================
  var CATALOG_MODE = "spares";
  var sparesCache = [];
  var productsCache = [];
  var compareSelection = new Set();
  var catalogLoaded = { spares: false, products: false };
  // Which list the cache currently holds: active rows only, or active plus deactivated.
  var catalogScope = false;

  // Columns are built per render because the PIE (cost) column only exists for roles
  // allowed to see cost data — the server omits the field for everyone else.
  function catalogColumns() {
    var cost = canSeeCost();
    if (CATALOG_MODE === "spares") {
      return [
        { key: "partNo", label: "Part No.", cls: "mono" },
        { key: "hsnCode", label: "HSN", cls: "mono" },
        { key: "description", label: "Description" },
        { key: "category", label: "Category" },
        { key: "uom", label: "UoM" }
      ].concat(cost ? [{ key: "piePrice", label: "PIE Price", num: true, money: true }] : [])
       .concat([
        { key: "price", label: "Price", num: true, money: true },
        { key: "altSummary", label: "Alternate" },
        { key: "onHand", label: "On Hand", num: true },
        { key: "reserved", label: "Reserved", num: true },
        { key: "available", label: "Available", num: true }
      ]);
    }
    return [
      { key: "productCode", label: "Product Code", cls: "mono" },
      { key: "hsnCode", label: "HSN", cls: "mono" },
      { key: "model", label: "Model" },
      { key: "family", label: "Family" },
      { key: "hpRating", label: "HP" },
      { key: "workingPressure", label: "Pressure" },
      { key: "fad", label: "FAD" }
    ].concat(cost ? [{ key: "piePrice", label: "PIE Price", num: true, money: true }] : [])
     .concat([
      { key: "price", label: "Price", num: true, money: true },
      { key: "leadTimeDays", label: "Lead Time (days)", num: true },
      { key: "available", label: "Available", num: true }
    ]);
  }

  // PIE is cost data, restricted to Management and ERP Admin (FR-062).
  function canSeeCost() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  function currentCatalogRows() { return CATALOG_MODE === "spares" ? sparesCache : productsCache; }
  function catalogSearchKeys() {
    return CATALOG_MODE === "spares" ? ["partNo", "description", "category"] : ["productCode", "model", "family"];
  }
  // Cheapest linked alternate part's own List price, or null when there is none priced.
  function bestAlternate(r) {
    var rates = (r.alternates || []).map(function (a) { return a.altRate; }).filter(Boolean);
    return rates.length ? Math.min.apply(null, rates) : null;
  }

  // Best of List / Special / the cheapest linked alternate part.
  function bestRate(r) {
    var candidates = [];
    if (r.price) candidates.push(r.price);
    (r.alternates || []).forEach(function (a) { if (a.altRate) candidates.push(a.altRate); });
    return candidates.length ? Math.min.apply(null, candidates) : 0;
  }

  function initCatalogView() {
    $("btn-new-catalog-item").style.display = canEditCatalog() ? "inline-flex" : "none";
    $("btn-bulk-upload").style.display = canRemoveFromCatalog() ? "inline-flex" : "none";
    // Only the people who can reactivate a row have any use for seeing deactivated ones.
    $("catalog-inactive-wrap").style.display = canRemoveFromCatalog() ? "inline-flex" : "none";
    switchCatalogMode(CATALOG_MODE);
  }

  function switchCatalogMode(mode) {
    CATALOG_MODE = mode;
    $("bulk-upload-panel").style.display = "none";
    compareSelection = new Set();
    syncDeleteSelected();
    $("compare-strip-zone").innerHTML = "";
    $("catalog-search").value = "";
    $("subtab-parts").className = "btn btn-sm" + (mode === "spares" ? " btn-primary" : "");
    $("subtab-units").className = "btn btn-sm" + (mode === "products" ? " btn-primary" : "");
    $("btn-find-compressor").style.display = mode === "products" ? "" : "none";
    loadCatalog();
  }

  /** The same ticks that drive Compare also drive Delete, so the button follows them. */
  function syncDeleteSelected() {
    var btn = $("btn-delete-selected");
    if (!btn) return;
    var n = compareSelection.size;
    btn.style.display = (canRemoveFromCatalog() && n) ? "inline-flex" : "none";
    btn.textContent = "Delete Selected (" + n + ")";
  }

  function showingInactive() {
    var box = $("catalog-show-inactive");
    return !!(box && box.checked && canRemoveFromCatalog());
  }

  /**
   * Fills the table area with a message instead of rows.
   *
   * The catalogue used to show nothing at all while it was loading: the request went out and
   * the table sat empty until it came back, which on a real catalogue is long enough to read
   * as "there is no data here". Worse, a failure only ever appeared as a banner at the top of
   * the page, so scrolled down at the table you saw an empty grid and no reason for it.
   */
  function catalogNotice(html) {
    $("catalog-thead").innerHTML = "";
    $("catalog-count").textContent = "";
    $("catalog-tbody").innerHTML = '<tr><td><div class="empty" style="padding:22px;">' +
      html + "</div></td></tr>";
  }

  function loadCatalog() {
    // The cache holds one list or the other, so it has to be dropped when the scope changes
    // rather than only when the data does.
    var scope = showingInactive();
    if (catalogScope !== scope) {
      catalogScope = scope;
      catalogLoaded.spares = false;
      catalogLoaded.products = false;
    }
    var mode = CATALOG_MODE;
    var what = mode === "spares" ? "spares" : "compressors";

    if (catalogLoaded[mode === "spares" ? "spares" : "products"]) { renderCatalogTable(); return; }

    catalogNotice("Loading " + what + "…");

    var ok = function (assign) {
      return function (rows) {
        // The list that comes back may be for the tab the user has since left.
        if (CATALOG_MODE !== mode) return;
        assign(rows);
        renderCatalogTable();
      };
    };
    var failed = function (err) {
      if (CATALOG_MODE !== mode) return;
      catalogNotice('<b>The ' + what + " list could not be loaded.</b><br>" +
        escapeHtml(err && err.message ? err.message : String(err)) +
        '<br><button class="btn btn-sm" style="margin-top:10px;" data-catalog-retry>Try again</button>');
      $("catalog-tbody").querySelector("[data-catalog-retry]")
        .addEventListener("click", function () { loadCatalog(); });
      onServerError(err);
    };

    if (mode === "spares") {
      srv.withSuccessHandler(ok(function (rows) {
        sparesCache = rows.map(decorateSpare); catalogLoaded.spares = true;
      })).withFailureHandler(failed).listSpares(scope);
    } else {
      srv.withSuccessHandler(ok(function (rows) {
        productsCache = rows; catalogLoaded.products = true;
      })).withFailureHandler(failed).listProducts(scope);
    }
  }

  // A blank cell counts as active, matching the server — a row typed straight into the Sheet
  // without the flag is a live part, not a hidden one.
  function isInactive(r) {
    return String(r.active || "").toUpperCase() === "FALSE";
  }

  // Flattens the alternates array into one readable cell for the table.
  function decorateSpare(s) {
    var alts = s.alternates || [];
    s.altSummary = alts.length
      ? alts.map(function (a) { return a.altPartNo || a.alternateSpareId; }).join(", ")
      : "";
    return s;
  }

  /**
   * How many matching rows the table draws at once.
   *
   * It drew every one: 13,587 spares, rebuilt from scratch on every keystroke in the search box,
   * with two click handlers attached to each row. Opening the catalogue took seconds and typing
   * a letter took one or two more. Nobody reads past the first screenful — they search — so the
   * table shows the first hundred matches and says how many there are, with a button for more.
   * The count, the search, Compare and Delete all still work across the whole catalogue.
   */
  var CATALOG_PAGE = 100;
  var catalogShown = CATALOG_PAGE;
  var catalogLastQuery = "";

  function renderCatalogTable() {
    var rows = currentCatalogRows();
    var q = ($("catalog-search").value || "").toLowerCase();
    // A new search starts from the top of its own results.
    if (q !== catalogLastQuery) { catalogShown = CATALOG_PAGE; catalogLastQuery = q; }
    var cols = catalogColumns();
    var keys = catalogSearchKeys();
    var filtered = rows.filter(function (r) {
      return keys.some(function (k) { return String(r[k] || "").toLowerCase().indexOf(q) !== -1; });
    });

    $("catalog-thead").innerHTML = "<tr><th class=\"checkbox-cell\"></th>" +
      cols.map(function (c) { return "<th" + (c.num ? ' class="num"' : "") + ">" + c.label + "</th>"; }).join("") +
      "<th></th></tr>";

    // Both numbers when a search is narrowing, because "42 spares" over a filtered table
    // reads as a catalogue of 42. Nothing at all when the list is empty — the empty state
    // below says it better, and "0 spares" twice is noise.
    var noun = CATALOG_MODE === "spares" ? "spare" : "compressor";
    $("catalog-count").textContent = !rows.length ? ""
      : filtered.length === rows.length
        ? fmtInt(rows.length) + " " + noun + (rows.length === 1 ? "" : "s")
        : fmtInt(filtered.length) + " of " + fmtInt(rows.length) + " " + noun + "s";

    if (filtered.length === 0) {
      // "No items match your search" over an empty catalogue sends people hunting for a
      // filter that is not there. Say which of the two it is.
      var msg = rows.length
        ? "No items match your search."
        : (CATALOG_MODE === "spares"
            ? "No spares in the catalogue yet. Add one, or load a file with Bulk Upload."
            : "No compressors in the catalogue yet. Add one, or load a file with Bulk Upload.") +
          (showingInactive() ? "" : " Deactivated items are hidden — tick Show deactivated to include them.");
      $("catalog-tbody").innerHTML = '<tr><td colspan="' + (cols.length + 2) +
        '"><div class="empty">' + msg + "</div></td></tr>";
      return;
    }

    var isManager = canEditCatalog();
    var visible = filtered.length > catalogShown ? filtered.slice(0, catalogShown) : filtered;
    var more = filtered.length - visible.length;
    $("catalog-tbody").innerHTML = visible.map(function (r) {
      var cells = cols.map(function (c) {
        var v = r[c.key];
        var display = c.money ? (v ? fmt(v) : "—") : (v === undefined || v === null || v === "" ? "—" : escapeHtml(v));
        return "<td" + (c.num ? ' class="num mono"' : "") + ">" + display + "</td>";
      }).join("");
      var off = isInactive(r);
      return '<tr' + (off ? ' class="row-inactive" title="Deactivated — open it to reactivate"' : "") + ">" +
        '<td class="checkbox-cell"><input type="checkbox" data-compare="' + r.id + '" ' + (compareSelection.has(r.id) ? "checked" : "") + " /></td>" +
        cells +
        '<td class="center">' +
          (off ? '<span class="badge badge-draft" style="margin-right:6px;">Deactivated</span>' : "") +
          (isManager ? '<button class="btn-ghost" data-edit="' + r.id + '" title="Edit">✎</button>' : "") +
        "</td>" +
        "</tr>";
    }).join("") +
      (more > 0
        ? '<tr class="catalog-more"><td colspan="' + (cols.length + 2) + '">' +
          '<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; ' +
          'flex-wrap:wrap; padding:6px 2px; font-size:12.5px; color:var(--ink-soft);">' +
          "<span>Showing the first " + fmtInt(visible.length) + " of " + fmtInt(filtered.length) +
          ". Type in the search box to narrow it down.</span>" +
          '<button class="btn btn-sm" type="button" data-catalog-more>Show ' +
          fmtInt(Math.min(500, more)) + " more</button></div></td></tr>"
        : "");
    syncDeleteSelected();
  }

  // One listener for the whole table, set once, instead of two attached to every row on every
  // draw. Rows come and go as the search changes; the table does not.
  $("catalog-tbody").addEventListener("change", function (ev) {
    var cb = ev.target.closest("[data-compare]");
    if (!cb) return;
    if (cb.checked) compareSelection.add(cb.dataset.compare); else compareSelection.delete(cb.dataset.compare);
    syncDeleteSelected();
  });
  $("catalog-tbody").addEventListener("click", function (ev) {
    var edit = ev.target.closest("[data-edit]");
    if (edit) { openCatalogModal(edit.dataset.edit); return; }
    if (ev.target.closest("[data-catalog-more]")) {
      catalogShown += 500;
      renderCatalogTable();
    }
  });

  // Waits for a pause in the typing. Each letter used to redraw the table, so typing a part
  // number queued a dozen redraws behind each other.
  var catalogSearchTimer = null;
  $("catalog-search").addEventListener("input", function () {
    if (catalogSearchTimer) clearTimeout(catalogSearchTimer);
    catalogSearchTimer = setTimeout(function () { catalogSearchTimer = null; renderCatalogTable(); }, 150);
  });
  $("catalog-show-inactive").addEventListener("change", loadCatalog);
  $("subtab-parts").addEventListener("click", function () { switchCatalogMode("spares"); });
  $("subtab-units").addEventListener("click", function () { switchCatalogMode("products"); });

  $("btn-compare-selected").addEventListener("click", function () {
    var zone = $("compare-strip-zone");
    if (compareSelection.size < 2) {
      zone.innerHTML = '<div class="compare-strip">Select at least two rows (checkbox on the left) to compare their rates.</div>';
      return;
    }
    var rows = currentCatalogRows().filter(function (r) { return compareSelection.has(r.id); });
    var cheapest = Math.min.apply(null, rows.map(bestRate));
    var nameKey = CATALOG_MODE === "spares" ? "partNo" : "productCode";
    var descKey = CATALOG_MODE === "spares" ? "description" : "model";
    zone.innerHTML = '<div class="compare-strip"><div class="card-title" style="margin-bottom:12px;">Rate Comparison — ' + rows.length + " selected</div>" +
      "<table><thead><tr><th>" + (CATALOG_MODE === "spares" ? "Part No." : "Product Code") + "</th><th>Description</th><th class=\"num\">Price</th>" +
      (CATALOG_MODE === "spares" ? '<th class="num">Alternate</th>' : "") +
      '<th class="num">Best Rate</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var best = bestRate(r);
        var isBest = best === cheapest;
        return "<tr><td class=\"mono\">" + escapeHtml(r[nameKey]) + "</td><td>" + escapeHtml(r[descKey]) + "</td>" +
          '<td class="num mono">' + (r.price ? fmt(r.price) : "—") + "</td>" +
          (CATALOG_MODE === "spares" ? '<td class="num mono">' + (bestAlternate(r) ? fmt(bestAlternate(r)) : "—") + "</td>" : "") +
          '<td class="num mono" style="font-weight:700; color:' + (isBest ? "var(--green)" : "var(--navy)") + ';">' + fmt(best) + (isBest ? " ★" : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  });

  /**
   * Deletes the ticked rows, showing what that would take with it first.
   *
   * The plan comes back before anything is asked for, because what goes is not guessable from
   * the button: a seeded stock movement, a draft quotation by number, a row that cannot go at
   * all. The confirmation is the count, typed out, since that is the one thing a person can
   * check against what they actually ticked.
   */
  $("btn-delete-selected").addEventListener("click", function () {
    var ids = Array.from(compareSelection);
    if (!ids.length) return;
    var type = CATALOG_MODE === "spares" ? "Spare" : "Product";

    $("compare-strip-zone").innerHTML =
      '<div class="compare-strip">Working out what this would remove…</div>';

    srv.withSuccessHandler(function (plan) {
      var list = function (title, items, render) {
        if (!items.length) return "";
        return "<div style=\"margin-top:10px;\"><b>" + title + "</b><ul style=\"margin:6px 0 0 18px; padding:0;\">" +
          items.slice(0, 20).map(render).join("") +
          (items.length > 20 ? "<li>…and " + (items.length - 20) + " more</li>" : "") +
          "</ul></div>";
      };

      var canGoAlone = plan.free.length;
      var needDocs = plan.withDocuments.length;

      $("compare-strip-zone").innerHTML = '<div class="compare-strip">' +
        '<div class="card-title" style="margin-bottom:6px;">Delete ' + plan.total + " selected " +
          plan.label + "(s)?</div>" +
        list(canGoAlone + (canGoAlone === 1 ? " can be deleted now — nothing refers to it:"
                                              : " can be deleted now — nothing refers to them:"),
             plan.free,
             function (f) { return "<li><span class=\"mono\">" + escapeHtml(f.code) + "</span></li>"; }) +
        list(needDocs + (needDocs === 1 ? " is referred to by documents that can go too:"
                                        : " are referred to by documents that can go too:"),
             plan.withDocuments,
             function (f) { return "<li><span class=\"mono\">" + escapeHtml(f.code) + "</span> — " +
               escapeHtml(f.usedBy.slice(0, 3).join(", ")) + "</li>"; }) +
        list(plan.blocked.length + (plan.blocked.length === 1 ? " cannot be deleted:"
                                                             : " cannot be deleted:"),
             plan.blocked,
             function (f) { return "<li><span class=\"mono\">" + escapeHtml(f.code) + "</span> — " +
               escapeHtml(f.why.slice(0, 2).join("; ")) + "</li>"; }) +
        (plan.blocked.length
          ? '<p style="margin:10px 0 0;">Deselect those, or clear what is named, and try ' +
            "again. Nothing is deleted while any of them is in the selection.</p>"
          : "") +
        "</div>";

      if (plan.blocked.length) {
        showMsg(plan.blocked.length + " of the selected rows cannot be deleted — see the list.", "error");
        return;
      }

      var ask = function (withDocs, count) {
        askDialog({
          title: "Delete " + count + " " + plan.label + "(s)?",
          message: (withDocs
            ? "This also discards " + describeDocs(plan) + ". "
            : "Only the " + count + " that nothing refers to. ") +
            "It cannot be undone from the app — the Sheet's own version history is the only " +
            "way back. Type " + count + " to confirm.",
          input: true, inputLabel: "Type " + count, okLabel: "Delete", danger: true
        }, function (typed) {
          if (typed === null) return;
          if (String(typed).trim() !== String(count)) {
            showMsg("That is not " + count + " — nothing was deleted.", "error");
            return;
          }
          $("compare-strip-zone").innerHTML = '<div class="compare-strip">Deleting…</div>';
          srv.withSuccessHandler(function (res) {
            compareSelection = new Set();
            syncDeleteSelected();
            catalogLoaded.spares = false;
            catalogLoaded.products = false;
            $("compare-strip-zone").innerHTML = '<div class="compare-strip">' +
              "<b>" + res.deleted + " " + plan.label + "(s) deleted.</b> " +
              [res.prices + " price record(s)",
               res.compatibility + " compatibility row(s)",
               res.alternates + " substitute link(s)",
               res.stockMovements + " stock movement(s)",
               res.reservations + " reservation(s)",
               res.enquiryLines + " enquiry line(s)"]
                .filter(function (t) { return !/^0 /.test(t); }).join(", ") +
              (res.quotations.length
                ? ". Quotations discarded: " + escapeHtml(res.quotations.join(", "))
                : "") + "</div>";
            loadCatalog();
            showMsg(res.deleted + " " + plan.label + "(s) deleted.", "success");
          }).withFailureHandler(function (err) {
            $("compare-strip-zone").innerHTML = "";
            onServerError(err);
          }).deleteCatalogItems(type, ids, withDocs, String(count));
        });
      };

      if (!needDocs) { ask(false, canGoAlone); return; }

      // Two real choices when documents are in the way, so they are offered as such rather
      // than as a yes/no that hides one of them.
      askDialog({
        title: "Some of these are used by documents",
        message: needDocs + " of the " + plan.total + " are named by " + describeDocs(plan) +
          ". Delete those documents too, or delete only the " + canGoAlone +
          " that nothing refers to?",
        options: [

        ].concat(canGoAlone
          ? [{ value: "free", label: "Delete only the " + canGoAlone +
                " that nothing refers to" }] : []),
        optionsLabel: "Choose",

      }, function (choice) {

        else ask(false, canGoAlone);

    }).planCatalogDelete(type, ids);

  /** "2 draft quotation(s) and 8 stock movement(s)" — what the documents actually are. */
  function describeDocs(plan) {
    var kinds = {};
    plan.withDocuments.forEach(function (f) {
      f.usedBy.forEach(function (phrase) {
        var kind = /^quotation /.test(phrase) ? "draft quotation"
                 : /^stock movement/.test(phrase) ? "stock movement"
                 : /^reservation/.test(phrase) ? "reservation"
                 : /^enquiry/.test(phrase) ? "enquiry line" : phrase;
        kinds[kind] = kinds[kind] || new Set();
        kinds[kind].add(phrase);
      });
    });
    var parts = Object.keys(kinds).map(function (k) { return kinds[k].size + " " + k + "(s)"; });
    return parts.length > 1
      ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1]
      : (parts[0] || "documents");
  }

  /**
   * Drives the import one chunk at a time.
   *
   * Apps Script kills any single call at six minutes, and one of these files is 3,500 parts
   * with up to 7,000 prices behind them — it does not fit, and what it did instead was sit
   * there saying "Importing…" until the execution was killed. So the server takes a few
   * hundred rows per call and says where it got to; this keeps asking until it says done.
   *
   * Each chunk is committed, so the count below is what is actually in the sheet, not a
   * promise. If one fails, the rows already reported are in and the rest are not — and the
   * message says which row to resume from rather than leaving it to be guessed.
   */
  function runImport(type, csvText, name) {
    var total = { newCount: 0, updateCount: 0, reactivatedCount: 0, priceChangeCount: 0,
                  skippedCount: 0 };
    var startedAt = Date.now();

    var progress = function (done, all) {
      var pct = all ? Math.round((done / all) * 100) : 0;
      $("bulk-preview").innerHTML =
        '<div style="padding:4px 0 12px;">' +
        '<div style="font-size:12.5px; margin-bottom:8px;">Importing ' + escapeHtml(name) +
          " — " + fmtInt(done) + " of " + fmtInt(all) + " rows (" + pct + "%). " +
          "A file this size takes a few minutes; leave this screen open.</div>" +
        '<div style="height:8px; background:var(--border); border-radius:4px; overflow:hidden;">' +
          '<div style="height:8px; width:' + pct + '%; background:var(--amber);"></div>' +
        "</div></div>";
    };
    progress(0, 0);

    var step = function (fromRow) {
      srv.withSuccessHandler(function (res) {
        total.newCount += res.newCount;
        total.updateCount += res.updateCount;
        total.reactivatedCount += res.reactivatedCount;
        total.priceChangeCount += res.priceChangeCount;
        total.skippedCount += res.skippedCount;
        progress(res.nextRow, res.totalRows);

        if (!res.done) { step(res.nextRow); return; }

        catalogLoaded.spares = false;
        catalogLoaded.products = false;

        // The panel stays open and the file is dropped, because a real catalogue arrives in
        // several files and the next one follows immediately. Closing it meant reopening,
        // and the file input still held the file just imported.
        bulkImported.push(name);
        clearBulkFile();
        setBulkBusy(false);
        var secs = Math.round((Date.now() - startedAt) / 1000);
        $("bulk-done").style.display = "";
        $("bulk-done").textContent = "Imported " + name + " — " + total.newCount + " added, " +
          total.updateCount + " updated, " + total.priceChangeCount + " price revision(s)" +
          (total.reactivatedCount ? ", " + total.reactivatedCount + " reactivated" : "") +
          (total.skippedCount ? ", " + total.skippedCount + " skipped" : "") +
          ", in " + secs + "s. " + (bulkImported.length > 1
            ? bulkImported.length + " files imported so far. "
            : "") + "Choose the next file, or Close when you are done.";

        loadCatalog();
        showMsg(total.newCount + " added, " + total.updateCount + " updated, " +
          total.priceChangeCount + " price revision(s)" +
          (total.reactivatedCount ? ", " + total.reactivatedCount + " brought back into the catalogue" : "") +
          (total.skippedCount ? ", " + total.skippedCount + " skipped" : "") + ".", "success");
      }).withFailureHandler(function (err) {
        setBulkBusy(false);
        $("bulk-preview").innerHTML = '<div class="msg msg-error show" style="position:static;">' +
          '<span class="msg-text">Stopped after ' + fmtInt(fromRow) + " row(s), which are " +
          "saved. Re-importing the same file is safe — rows already in are matched on their " +
          "code and updated in place rather than duplicated.</span></div>";
        onServerError(err);
      }).commitCatalogImport(type, csvText, fromRow, null);
    };

    step(0);
  }

  /**
   * Sets the two destructive buttons on a master modal from the row being edited.

   * Both modals need the same three states and got them wrong in the same way before: a new
   * row shows neither button, a live row offers Deactivate, and a deactivated row offers

   * from the screen. Permanent deletion sits apart from all three, deliberately plain rather
   * than red, because it is the rare case and the loud button should be the safe one.
   */
  function setMasterRowButtons(prefix, row) {

    return ["Sales Coordinator", "Sales Engineer", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1;
  }
  function canEditCommercials() {
    return currentUser.role === "Management" || currentUser.role === "ERP Admin";
  }

  /**
   * The dropdown lists, fetched once however many screens ask for them.
   *
   * Every caller used to guard with `if (!configLists)`, which is only a guard if the answer
   * has already come back. On load, two callers reached that check while the first request
   * was still in the air, both saw null, and the portal opened by fetching the same lists
   * twice — a whole round trip out of a page that is already slow enough to complain about.
   *
   * So the flag is not "have they arrived" but "has anybody asked yet", and everybody who
   * asks while one is in flight is handed the same answer when it lands.
   */
  var configListsWaiting = null;

  function withConfigLists(then) {
    if (configLists) { if (then) then(configLists); return; }
    if (configListsWaiting) { if (then) configListsWaiting.push(then); return; }
    configListsWaiting = then ? [then] : [];

    var settle = function (lists) {
      configLists = lists;
      fillDatalist("industry-list", (lists.Industry || []).map(function (i) { return i.label; }));
      fillDatalist("paymentterms-list",
        (lists.PaymentTerms || []).map(function (i) { return i.label; }));
      var waiting = configListsWaiting || [];
      configListsWaiting = null;
      waiting.forEach(function (fn) { fn(configLists); });
    };

    srv.withSuccessHandler(settle)
      .withFailureHandler(function () { settle({}); })
      .getConfigLists();
  }

  var activeUsersAsked = false;

  function loadConfigLists() {
    withConfigLists();
    // Same reasoning: the datalist is filled once, not once per screen that wants it.
    if (activeUsersAsked) return;
    activeUsersAsked = true;
    srv.withSuccessHandler(function (users) {
      fillDatalist("users-list", users.map(function (u) { return u.email; }));
    }).withFailureHandler(function () { activeUsersAsked = false; }).listActiveUsers();
  }

  function fillDatalist(id, values) {
    $(id).innerHTML = values.map(function (v) { return '<option value="' + escapeHtml(v) + '">'; }).join("");
  }

  function renderCustomers() {
    var q = ($("customer-search").value || "").toLowerCase();
    var rows = customersCache.filter(function (c) {
      var hay = [c.customerCode, c.name, c.gstin, c.assignedSalesperson, c.territory,

    });

    var tbody = $("customers-tbody");
    if (!rows.length) {

    }

    tbody.innerHTML = rows.map(function (c) {
      var addr = c.addresses.filter(function (a) { return String(a.isDefault).toUpperCase() === "TRUE"; })[0] || c.addresses[0] || {};
      var contact = c.primaryContact || {};
      return "<tr>" +
        '<td class="mono">' + escapeHtml(c.customerCode || "—") + "</td>" +

        "<td>" + escapeHtml(c.assignedSalesperson || "—") + "</td>" +

        '<td class="num">' + (c.creditDays === "" || c.creditDays === null ? "—" : c.creditDays) + "</td>" +

    tbody.querySelectorAll("[data-edit-cust]").forEach(function (btn) {

  /**
   * Opens a window, in front of whatever is already open.
   *
   * Every backdrop shares one z-index, so DOM order decides which is in front — and this one
   * is declared early, which put it behind the enquiry window it gets opened from. Visible
   * through the dimming, so it looked available, while every click landed on the backdrop in
   * front of it. The confirm dialog hit the same thing and was given a fixed z-index; this is
   * the general form, set from whether anything else is actually showing rather than from a
   * guess about which window outranks which.
   */
  function stackModal(id) {
    var el = $(id);
    var others = document.querySelectorAll(".modal-backdrop.show");
    var covered = false;
    for (var i = 0; i < others.length; i++) {
      if (others[i] !== el) { covered = true; break; }
    }
    // Set either way, so a window opened on its own next time does not keep yesterday's rank.
    el.classList.toggle("modal-stacked", covered);
    el.classList.add("show");
  }

  /**
   * Everything about a new customer on screen at once, so one press saves the lot.

   * their own small saves — that is right for an edit, where somebody has come to add a second
   * address and not to retype the first.

  function openSubFormsForNewCustomer() {
    showContactForm(null);
    showAddressForm(null);

  /**
   * What this customer calls each part, and the form that records it.
   *
   * Their purchase orders name every line by their own code and mention ours, when at all,
   * somewhere inside the description — differently worded on each line. Recorded once here,
   * their code finds the part in the picker and prints beside ours on the offer, and nobody
   * reads prose to work out which filter was meant.

  var itemCodesCache = [];

  function loadItemCodes(c) {

      itemCodesCache = rows || [];

      renderItemCodes(c);
    }).listCustomerItemCodes(c.id);
  }

  function renderItemCodes(c) {
    var zone = $("cm-itemcodes");

      zone.innerHTML = '<div class="empty" style="padding:14px;">No codes recorded yet.</div>';

      "<th>Our part</th><th>Description</th><th></th></tr></thead><tbody>" +

          '<td class="mono">' + escapeHtml(r.theirCode) + "</td>" +

  function hideItemCodeForm() {

  /** The catalogue, narrowed by whatever was typed — a dropdown of 3,500 is not a chooser. */
  function fillItemCodeParts(selectedId) {
    var q = $("icf-search").value.trim().toLowerCase();
    var rows = (sparesCache || []).filter(function (sp) {
      if (String(sp.id) === String(selectedId)) return true;
      if (!q) return false;

             String(sp.description).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 50);
    $("icf-item").innerHTML = rows.length
      ? rows.map(function (sp) {
          return '<option value="' + escapeHtml(sp.id) + '"' +
            (String(sp.id) === String(selectedId) ? " selected" : "") + ">" +
            escapeHtml(sp.partNo + " — " + sp.description) + "</option>";
        }).join("")
      : '<option value="">' + (q ? "Nothing matched" : "Type above to find the part") +
        "</option>";

  $("btn-add-itemcode").addEventListener("click", function () { showItemCodeForm(null); });

  /** Refreshes the cache and re-renders the open modal, so nested edits appear immediately. */
  function reloadCustomersKeepingModal() {
    var openId = $("cm-id").value;

      customersCache = rows;

  $("btn-save-customer").addEventListener("click", function () {
    var obj = {
      id: $("cm-id").value || null,
      name: $("cm-name").value.trim(),
      legalName: $("cm-legalname").value.trim(),
      gstin: $("cm-gstin").value.trim(),
      pan: $("cm-pan").value.trim(),
      industry: $("cm-industry").value.trim(),
      territory: $("cm-territory").value.trim(),
      assignedSalesperson: $("cm-salesperson").value.trim(),
      notes: $("cm-notes").value.trim(),
      paymentTerms: $("cm-paymentterms").value.trim(),
      creditLimit: $("cm-creditlimit").value,
      creditDays: $("cm-creditdays").value,
      riskStatus: $("cm-riskstatus").value
    };
    if (!obj.name) { showMsg("Customer name is required.", "error"); return; }
    if (!xfReady("customer")) return;

    // Advisory duplicate check first — a GSTIN clash is refused server-side regardless.
    srv.withSuccessHandler(function (dupes) {
      var advisory = dupes.filter(function (d) { return !d.blocking; });
      if (advisory.length && !$("cm-id").value) {
        var names = advisory.map(function (d) { return "• " + d.name + " (" + d.reasons + ")"; }).join("\n");
        askDialog({
          title: "This customer may already exist",
          message: names + "\n\nCreate a new record anyway?",
          okLabel: "Create anyway"
        }, function (ok) {
          if (ok === null) return;
          commitCustomer(obj);
        });
        return;
      }
      commitCustomer(obj);
    }).withFailureHandler(function () { commitCustomer(obj); })
      .findDuplicateCustomers(obj, $("cm-id").value || null);
  });

  // Set by whoever opened the customer dialog from another screen, so that screen can pick up
  // the new customer instead of the user having to go and find it.
  var onCustomerSaved = null;

  /** The address block as typed, or nothing where nobody filled it in. */
  function newCustomerAddress() {
    if (!$("af-line1").value.trim()) return null;
    return {
      addressType: $("af-type").value,
      label: $("af-label").value.trim(),
      line1: $("af-line1").value.trim(),
      line2: $("af-line2").value.trim(),
      city: $("af-city").value.trim(),
      state: $("af-state").value.trim(),
      pincode: $("af-pincode").value.trim(),
      gstin: $("af-gstin").value.trim(),
      isDefault: $("af-default").checked
    };
  }

  /** Likewise the contact: a name is what makes it one. */
  function newCustomerContact() {
    if (!$("cf-name").value.trim()) return null;
    return {
      name: $("cf-name").value.trim(),
      contactRole: $("cf-role").value,
      designation: $("cf-designation").value.trim(),
      phone: $("cf-phone").value.trim(),
      email: $("cf-email").value.trim(),
      isPrimary: $("cf-primary").checked
    };
  }

  function commitCustomer(obj) {
    var isNew = !$("cm-id").value;
    var hadDetails = isNew && !!(newCustomerAddress() || newCustomerContact());
    var runner = srv.withSuccessHandler(function (saved) {
      xfAfterSave("customer", saved.id);
      customersLoaded = false;
      srv.withSuccessHandler(function (rows) {
        customersCache = rows; customersLoaded = true; renderCustomers();
        var handOff = onCustomerSaved;
        if (handOff) handOff(saved, isNew);
        $("cm-id").value = saved.id;
        $("customer-modal-title").textContent = "Edit Customer";
        $("cm-code").textContent = saved.customerCode || "";
        var c = customersCache.find(function (x) { return x.id === saved.id; });
        // The customer exists now, so the sub-forms go back to being their own saves. Without
        // this the window stays open showing two forms whose buttons are still hidden.
        restoreSubFormButtons();
        hideContactForm();
        hideAddressForm();
        renderContacts(c);
        renderAddresses(c);

        // An edit is done when it is saved, and so is a customer added from another screen —
        // that screen is waiting for them. Only a brand-new record opened from Customers
        // itself stays, because contacts and addresses could not be added until it existed,
        // and the message says so rather than leaving somebody looking at a window that will
        // not go away.
        // Closing on a new record too, now that the address and the contact go in with it.
        // It stayed open because they could not be added until the customer existed; that is
        // no longer true, and a window that stays open after finishing reads as one still
        // working. Somebody with a second address to add reopens it from the row.
        if (!isNew || handOff || hadDetails) {
          $("customer-modal-backdrop").classList.remove("show");
          showMsg("Customer " + saved.name + " saved.", "success");
          return;
        }
        showMsg("Customer " + saved.name + " created. Add their contacts and addresses below, " +
          "or press Close.", "success");
      }).withFailureHandler(onServerError).listCustomers();
    }).withFailureHandler(onServerError);

    // One call on a new record, so the address and the contact land with the customer rather
    // than after it. An existing one takes the plain save: its sub-forms are their own small
    // saves, which is right for somebody adding a second address rather than retyping the
    // first. Spelled out rather than picking the method by name — this chain is
    // google.script.run's own object and how it resolves a bracketed name is not ours to
    // assume.
    if (isNew) {
      runner.saveCustomerWithDetails({
        customer: obj, address: newCustomerAddress(), contact: newCustomerContact()
      });
    } else {
      runner.saveCustomer(obj);
    }
  }
