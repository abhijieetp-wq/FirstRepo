  /**
   * The catalogue, held in the browser for as long as this quotation is open.
   *
   * Searching on the server meant a fresh Apps Script execution and a dozen trips to the
   * Sheet for every letter typed. On 3,500 parts that is seconds per keystroke and a minute
   * to pick five parts. The search itself takes about 50 ms — it was never the compute.
   *
   * Keyed by the machine model, because that is the only thing about the quotation that
   * changes the answer — it decides which parts are marked as fitting. Two quotations for the
   * same machine share the cache; one for a different machine refetches on its own.
   */
  var spareCatalog = null;
  var spareCatalogKey = null;
  var spareCatalogLoading = false;

  function spareCatalogRow(r, compat) {
    var fit = compat[r[0]] || 0;
    var theirs = (spareCatalog && spareCatalog.theirCodes) || {};
    return { id: r[0], partNo: r[1], description: r[2], productGroup: r[3], category: r[4],
             uom: r[5], hsnCode: r[6], price: r[7], available: r[8],
             compatibilityConfirmed: fit > 0, isServiceKit: fit === 2,
             theirCode: theirs[r[0]] || "" };
  }

  /** The same matching the server did, run here where it costs nothing. */
  function searchSpareCatalog(q, group) {
    var text = String(q || "").trim().toLowerCase();
    var grp = String(group || "").trim().toLowerCase();
    var compat = spareCatalog.compat || {};
    // The customer's own code searches like any other: their purchase order names the part
    // by it, and typing what is on the order in front of you should find the part.
    var theirs = spareCatalog.theirCodes || {};
    var hits = [];
    var rows = spareCatalog.rows;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (grp && r[3].toLowerCase().indexOf(grp) === -1) continue;
      if (text &&
          r[1].toLowerCase().indexOf(text) === -1 &&
          r[2].toLowerCase().indexOf(text) === -1 &&
          r[4].toLowerCase().indexOf(text) === -1 &&
          String(theirs[r[0]] || "").toLowerCase().indexOf(text) === -1) continue;
      hits.push(r);
    }
    hits.sort(function (a, b) {
      var fa = compat[a[0]] ? 1 : 0, fb = compat[b[0]] ? 1 : 0;
      if (fa !== fb) return fb - fa;
      return String(a[1]).localeCompare(String(b[1]));
    });
    return { total: hits.length,
             rows: hits.slice(0, 50).map(function (r) { return spareCatalogRow(r, compat); }) };
  }

  function withSpareCatalog(then) {
    // Keyed by the machine model and the customer: the model decides which parts are marked
    // as fitting, and the customer decides whose codes come with it. Serving one customer's
    // codes on another's quotation would be worse than having none.
    var key = ((openQuote ? openQuote.machineModel : "") || "") + "|" +
              ((openQuote ? openQuote.customerId : "") || "");
    if (spareCatalog && spareCatalogKey === key) { then(); return; }
    if (spareCatalogLoading) return;
    spareCatalogLoading = true;
    $("qi-results").innerHTML = '<div class="empty" style="padding:12px;">' +
      "Loading the spare catalogue — once per quotation, then searching is instant…</div>";
    srv.withSuccessHandler(function (data) {
      spareCatalog = data;
      spareCatalogKey = key;
      spareCatalogLoading = false;
      then();
    }).withFailureHandler(function (err) {
      spareCatalogLoading = false;
      $("qi-results").innerHTML = "";
      onServerError(err);
    }).sparePickerData((openQuote ? openQuote.machineModel : "") || "",
                       (openQuote ? openQuote.customerId : "") || "");
  }

  function runQuoteItemSearch() {
    var type = $("qi-type").value;
    $("qi-results").innerHTML = '<div class="empty" style="padding:12px;">Searching…</div>';
    if (type === "Spare") {
      withSpareCatalog(function () {
        var found = searchSpareCatalog($("qi-search").value, $("qi-group").value);
        renderQuoteItemResults(found.rows, "Spare", found.total);
      });
    } else {
      srv.withSuccessHandler(function (rows) {
        var q = $("qi-search").value.trim().toLowerCase();
        renderQuoteItemResults(rows.filter(function (p) {
          return !q || [p.productCode, p.model, p.family].join(" ").toLowerCase().indexOf(q) !== -1;
        }).slice(0, 50), "Product");
      }).withFailureHandler(onServerError).listProducts();
    }
  }

  /**
   * What the picker calls the item, and what lands on the price schedule. Preferring the
   * model put "EQ 18-7.5 V" on the offer where PIE writes "Elgi make EQ 18 VFD -7.5 STD" —
   * the model is already in the Code column.
   */
  function quoteItemDesc(r) { return r.description || r.model; }

  function quoteItemLine(r, type, quotationId) {
    return {
      quotationId: quotationId,
      itemType: type,
      itemId: r.id,
      itemCode: type === "Spare" ? r.partNo : r.productCode,
      description: quoteItemDesc(r),
      qty: Math.max(1, Number($("qi-qty").value) || 1),
      availabilityNote: r.available !== undefined
        ? (r.available > 0 ? r.available + " available" : "Out of stock") : ""
    };
  }

  /** A row the catalogue never finished: a zero price or a missing HSN is only noticed once
   * the offer is in front of a customer, so it is completed here rather than added blank. */
  function quoteItemNeedsDetails(r) {
    return !r.price || !String(r.hsnCode || "").trim();
  }

  /**
   * What to say after adding, given that a part already on the offer raises the quantity of
   * the line it is on instead of starting a second one. That line can be well above the fold,
   * so the message has to name it — otherwise nothing visibly happens and the part gets added
   * a third time.
   */
  function quoteAddMsg(nq, addedCount) {
    var merged = nq.merged || [];
    var added = Math.max(0, (addedCount || 0) - merged.length);
    if (!merged.length) {
      return added === 1 ? "Added to the quotation."
        : "Added " + added + " items to the quotation.";
    }
    var grew = merged.length === 1
      ? "Line " + merged[0].lineNo + ", " + merged[0].description + ", was already on this " +
        "quotation — its quantity is now " + merged[0].qty + " (was " + merged[0].was + ")."
      : merged.length + " of these were already on this quotation, so their quantities went " +
        "up instead: " + merged.map(function (m) {
          return "line " + m.lineNo + " → " + m.qty;
        }).join(", ") + ".";
    if (!added) return grew;
    return (added === 1 ? "One item added. " : added + " items added. ") + grew;
  }

  function renderQuoteItemResults(rows, type, total) {
    var zone = $("qi-results");
    if (!rows.length) {
      zone.innerHTML = '<div class="empty" style="padding:12px;">Nothing matched.</div>';
      return;
    }
    // Fifty rows come back out of thousands, so say so rather than letting the list look
    // like the whole answer.
    var more = (total && total > rows.length)
      ? '<p style="font-size:12px; color:var(--ink-soft); margin:0 0 8px;">Showing ' +
        rows.length + " of " + fmtInt(total) + " matches — narrow the search to see the rest.</p>"
      : "";
    zone.innerHTML = more +
      '<div id="qi-bulk" style="display:none; align-items:center; gap:10px; margin:0 0 8px;">' +
        '<button class="btn btn-sm btn-primary" id="qi-add-selected">Add selected</button>' +
        '<span id="qi-selected-count" style="font-size:12px; color:var(--ink-soft);"></span>' +
      "</div>" +
      '<table><thead><tr><th class="center"><input type="checkbox" id="qi-pick-all"></th>' +
      "<th>Code</th><th>Description</th>" +
      (type === "Spare" ? "<th>Fit</th>" : "") +
      '<th class="num">Price</th><th class="num">Available</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        var code = type === "Spare" ? r.partNo : r.productCode;
        return "<tr>" +
          '<td class="center">' + (quoteItemNeedsDetails(r) ? ""
            : '<input type="checkbox" class="qi-pick" data-pick="' + escapeHtml(r.id) + '">') + "</td>" +
          '<td class="mono">' + escapeHtml(code) +
            // Their code under ours, so a coordinator reading the customer's order can see
            // the two are the same part rather than taking it on trust.
            (r.theirCode ? '<br><span style="font-size:11px; color:var(--ink-soft);">their ' +
              escapeHtml(r.theirCode) + "</span>" : "") + "</td>" +
          "<td>" + escapeHtml(quoteItemDesc(r)) +
            (r.productGroup ? '<br><span style="font-size:11px; color:var(--ink-soft);">' +
              escapeHtml(r.productGroup) + "</span>" : "") + "</td>" +
          (type === "Spare" ? "<td>" + (r.compatibilityConfirmed
            ? '<span class="badge badge-won">Fits model</span>'
            : '<span class="badge badge-overdue">Unverified</span>') + "</td>" : "") +
          '<td class="num mono">' + (r.price ? fmt(r.price)
            : '<span class="badge badge-overdue">no price</span>') + "</td>" +
          '<td class="num mono">' + (r.available === undefined ? "—" : r.available) + "</td>" +
          '<td class="center"><button class="btn btn-sm" data-add-line="' + escapeHtml(r.id) +
            '">Add</button></td>' +
          "</tr>";
      }).join("") + "</tbody></table>";

    var rowFor = function (id) {
      return rows.find(function (x) { return String(x.id) === String(id); });
    };
    var picked = function () {
      return Array.prototype.slice.call(zone.querySelectorAll(".qi-pick"))
        .filter(function (c) { return c.checked; })
        .map(function (c) { return rowFor(c.dataset.pick); })
        .filter(Boolean);
    };
    var refreshBulk = function () {
      var n = picked().length;
      $("qi-bulk").style.display = n ? "flex" : "none";
      $("qi-selected-count").textContent = n === 1 ? "1 item selected" : n + " items selected";
    };

    zone.querySelectorAll(".qi-pick").forEach(function (box) {
      box.addEventListener("change", refreshBulk);
    });
    var all = $("qi-pick-all");
    if (all) {
      all.addEventListener("change", function () {
        zone.querySelectorAll(".qi-pick").forEach(function (box) { box.checked = all.checked; });
        refreshBulk();
      });
    }

    // Every selected part goes over in one call. One call per part meant a fresh server
    // execution each time, which is what made building a spares offer feel like waiting.
    $("qi-add-selected").addEventListener("click", function () {
      var chosen = picked();
      if (!chosen.length) return;
      var btn = $("qi-add-selected");
      btn.disabled = true;
      btn.textContent = "Adding " + chosen.length + "…";
      srv.withSuccessHandler(function (nq) {
        openQuote = nq;
        renderQuoteBuilder();
        showMsg(quoteAddMsg(nq, chosen.length), "success");
        runQuoteItemSearch();
      }).withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = "Add selected";
        onServerError(err);
      }).saveQuotationItems({
        quotationId: openQuote.id,
        itemType: type,
        lines: chosen.map(function (r) { return quoteItemLine(r, type, openQuote.id); })
      });
    });

    zone.querySelectorAll("[data-add-line]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var r = rowFor(btn.dataset.addLine);
        if (!r) return;
        // This used to apply to spares alone, which left every compressor loaded from a
        // brochure — and a brochure carries no prices — going on at zero.
        if (quoteItemNeedsDetails(r)) {
          openCompletePanel(r, type);
          return;
        }
        btn.disabled = true;
        srv.withSuccessHandler(function (nq) {
          openQuote = nq;
          renderQuoteBuilder();
          btn.disabled = false;
          showMsg(quoteAddMsg(nq, 1), "success");
        }).withFailureHandler(function (err) {
          btn.disabled = false;
          onServerError(err);
        }).saveQuotationItem(quoteItemLine(r, type, openQuote.id));
      });
    });
  }


  // ================= SERVICE JOBS =================
  // PIE's process ends with an engineer going out to fit what was delivered. The field for it
  // existed on the dispatch from the start and nothing ever set it, so this step lived
  // entirely on WhatsApp.
  var serviceCache = [];
  var openServiceJob = null;

  var SERVICE_BADGE = {
    "Unassigned": "badge-overdue", "Assigned": "badge-new", "Scheduled": "badge-followup",
    "In Progress": "badge-quoted", "Completed": "badge-won", "Cancelled": "badge-lost"
  };

  function initServiceView() { loadServiceJobs(); }

  /**
   * Which kind of job, and how urgent. A breakdown is somebody standing next to a machine
   * that has stopped, so it is worth being able to pick it out of the list at a glance.
   */
  function jobTypeBadge(j) {
    var breakdown = j.jobType === "Breakdown";
    var urgent = breakdown && ["Urgent", "Immediate"].indexOf(j.urgency) !== -1;
    return '<span class="badge ' + (urgent ? "badge-lost" : breakdown ? "badge-overdue"
      : "badge-new") + '">' + escapeHtml(j.jobType || "Installation") + "</span>" +
      (urgent ? ' <span style="font-size:11px; color:var(--red);">' +
        escapeHtml(j.urgency) + "</span>" : "");
  }

  function loadServiceJobs() {
    srv.withSuccessHandler(function (rows) {
      serviceCache = rows;
      renderServiceJobs();
    }).withFailureHandler(onServerError).listServiceJobs({
      mineOnly: $("service-mine").checked,
      includeClosed: $("service-closed").checked,
      jobType: $("service-type").value
    });
  }

  function renderServiceJobs() {
    var q = ($("service-search").value || "").toLowerCase();
    var areaType = $("service-area-type") ? $("service-area-type").value : "";
    var rows = serviceCache.filter(function (j) {
      if (areaType && j.areaType !== areaType) return false;
      return [j.jobNo, j.customerName, j.machineModel, j.serialNo, j.engineerEmail,
        j.jobType, j.reportedBy, j.scopeText, j.area]
        .join(" ").toLowerCase().indexOf(q) !== -1;
    });

    var tbody = $("service-tbody");
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="10"><div class="empty">' +
        (serviceCache.length ? "No jobs match your search."
          : "No open service jobs. One is raised whenever a delivery is confirmed, and a " +
            "breakdown call can be logged above.") +
        "</div></td></tr>";
      return;
    }

    tbody.innerHTML = rows.map(function (j) {
      return "<tr>" +
        '<td class="mono">' + escapeHtml(j.jobNo) + "</td>" +
        "<td>" + jobTypeBadge(j) + "</td>" +
        "<td>" + escapeHtml(j.date) + "</td>" +
        "<td>" + escapeHtml(j.customerName || "—") +
          (FACE_V2 && j.area ? '<br><span class="sdc-muted">' + escapeHtml(j.area + " · " + j.areaType) + "</span>" : "") + "</td>" +
        "<td>" + escapeHtml(j.machineModel || "—") +
          (j.serialNo ? '<br><span style="font-size:11px; color:var(--ink-soft);">' +
            escapeHtml(j.serialNo) + "</span>" : "") + "</td>" +
        '<td class="num">' + (j.partCount === undefined ? "" : j.partCount) + "</td>" +
        "<td>" + escapeHtml(j.engineerEmail || "—") + "</td>" +
        "<td>" + escapeHtml(j.scheduledDate || "—") +
          (FACE_V2 && j.rescheduleCount ? '<br><span class="sdc-muted">moved ' + j.rescheduleCount + "×</span>" : "") + "</td>" +
        (FACE_V2 && j.deskStatus
          ? '<td><span class="badge ' + (SD_BADGE[j.deskStatus] || "badge-draft") + '">' + escapeHtml(j.deskStatus) + "</span></td>"
          : '<td><span class="badge ' + (SERVICE_BADGE[j.status] || "badge-draft") + '">' +
            escapeHtml(j.status) + "</span></td>") +
        '<td class="center"><button class="btn btn-sm" data-open-job="' + escapeHtml(j.id) +
          '">Open</button></td>' +
        "</tr>";
    }).join("");

    tbody.querySelectorAll("[data-open-job]").forEach(function (btn) {
      btn.addEventListener("click", function () { openServiceJobModal(btn.dataset.openJob); });
    });
    xfTable("service", tbody.closest("table"), xfRowId("[data-open-job]", "data-open-job"), true);
  }

  ["service-search", "service-mine", "service-closed", "service-type"].forEach(function (id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener(id === "service-search" ? "input" : "change", function () {
      if (id === "service-search") renderServiceJobs(); else loadServiceJobs();
    });
  });

  // ---- Logging a breakdown call ----
  $("btn-new-breakdown").addEventListener("click", function () {
    loadQuoteCustomers(function () {
      $("bd-customer").innerHTML = customerOptions(null);
      $("bd-reportedby").value = "";
      $("bd-contact").value = "";
      $("bd-phone").value = "";
      $("bd-model").value = "";
      $("bd-serial").value = "";
      $("bd-scope").value = "";
      withPeople(function (p) {
        var list = p.serviceUrgencies || ["Normal", "Urgent", "Immediate"];
        $("bd-urgency").innerHTML = list.map(function (u) {
          return '<option value="' + escapeHtml(u) + '">' + escapeHtml(u) + "</option>";
        }).join("");
      });
      $("breakdown-modal-backdrop").classList.add("show");
    });
  });

  $("btn-bd-cancel").addEventListener("click", function () {
    $("breakdown-modal-backdrop").classList.remove("show");
  });

  $("btn-bd-save").addEventListener("click", function () {
    if (!xfReady("call")) return;
    var btn = $("btn-bd-save");
    btn.disabled = true;
    srv.withSuccessHandler(function (job) {
      btn.disabled = false;
      xfAfterSave("call", job.id);
      $("breakdown-modal-backdrop").classList.remove("show");
      loadServiceJobs();
      showMsg(job.jobNo + " logged" + (FACE_V2 ? " as " + job.jobType : "") + ". It is waiting for the service coordinator to send " +
        "somebody.", "success");
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      onServerError(err);
    }).createServiceJob({
      customerId: $("bd-customer").value,
      reportedBy: $("bd-reportedby").value,
      contactName: $("bd-contact").value,
      contactPhone: $("bd-phone").value,
      machineModel: $("bd-model").value,
      serialNo: $("bd-serial").value,
      urgency: $("bd-urgency").value,
      scopeText: $("bd-scope").value,
      // 2.0's call type, area and instruction (ServiceDesk.gs); ERP 1's form has none of them.
      jobType: $("bd-type") ? $("bd-type").value : undefined,
      area: $("bd-area") ? $("bd-area").value : undefined,
      instruction: $("bd-instruction") ? $("bd-instruction").value : undefined
    });
  });

  function openServiceJobModal(id) {
    srv.withSuccessHandler(function (job) {
      openServiceJob = job;
      sdWriting = false;
      renderServiceJobModal();
      $("service-modal-backdrop").classList.add("show");
    }).withFailureHandler(onServerError).getServiceJob(id);
  }

  function renderServiceJobModal() {
    var j = openServiceJob;
    $("sj-id").value = j.id;
    var breakdown = j.jobType === "Breakdown";
    $("sj-title").textContent = j.jobNo;
    $("sj-sub").textContent = breakdown
      ? "Breakdown call logged " + j.date + (j.urgency ? " \u00b7 " + j.urgency : "") +
        (j.reportedBy ? " \u00b7 reported by " + j.reportedBy : "")
      : "Raised " + j.date + (j.dispatchId ? " on confirming the delivery." : ".");
    $("sj-customer").value = j.customerName || "";
    $("sj-machine").value = j.machineModel || "";
    $("sj-serial").value = j.serialNo || "";
    // The handover in practice: service can ring the customer without being handed the
    // customer master, which carries credit limits and pricing they have no business seeing.
    $("sj-contact").value = j.contactName || "";
    $("sj-phone").value = j.contactPhone || "";
    $("sj-email").value = j.contactEmail || "";
    $("sj-scope").value = j.scopeText || "";
    $("sj-notes").value = j.notes || "";
    $("sj-scheduled").value = j.scheduledDate || "";

    // Allocating the engineer is the service coordinator's call; sales raise the need by
    // confirming the delivery. Anyone else sees who is going but cannot change it.
    var mayAllocate = ["Service Coordinator", "Management", "ERP Admin"]
      .indexOf(currentUser.role) !== -1;
    $("sj-engineer").disabled = !mayAllocate;
    // On 2.0 a day once given moves only with a reason: Reschedule… in the panel above.
    var dayLocked = FACE_V2 && !!j.scheduledDate && ["Completed", "Cancelled"].indexOf(j.status) === -1;
    $("sj-scheduled").disabled = !mayAllocate || dayLocked;
    $("sj-allocation-note").textContent = mayAllocate
      ? (dayLocked ? "To move the visit to another day, use Reschedule… above; it asks for the reason." : "")
      : "The service coordinator allocates the engineer.";

    withPeople(function (p) {
      fillPeopleSelect("sj-engineer", p.serviceEngineers || [], j.engineerEmail, "Nobody yet");
      $("sj-status").innerHTML = (p.serviceStatuses || [j.status]).map(function (st) {
        return '<option value="' + escapeHtml(st) + '"' + (st === j.status ? " selected" : "") +
          ">" + escapeHtml(st) + "</option>";
      }).join("");
    });
    // A breakdown call carries no parts — the engineer finds out what is needed on site —
    // so the heading is about what they are going for, not a list that will stay empty.
    $("sj-items-title").textContent = breakdown ? "Reported fault" : "Parts to fit";
    $("sj-items").innerHTML = (j.items || []).length
      ? '<table><thead><tr><th>#</th><th>Code</th><th>Description</th>' +
        '<th class="num">Qty</th></tr></thead><tbody>' +
        j.items.map(function (i) {
          return "<tr><td>" + i.lineNo + '</td><td class="mono">' + escapeHtml(i.itemCode) +
            "</td><td>" + escapeHtml(i.description) + '</td><td class="num">' + i.qty +
            "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty" style="padding:10px;">' +
        (breakdown
          ? "Nothing to fit yet — what the machine needs is decided on site."
          : "Nothing was recorded against the dispatch.") + "</div>";

    renderServiceProofs();

    $("sj-delivery-proofs-wrap").style.display =
      (j.deliveryProofs || []).length ? "" : "none";
    $("sj-delivery-proofs").innerHTML = proofListHtml(j.deliveryProofs || []);

    // Service cannot open a spare enquiry, so the number is all they get — and all they need,
    // since the spares office carries it from here.
    $("sj-enquiry-note").innerHTML = j.spareEnquiryNo
      ? '<div class="compare-strip">This visit raised spare enquiry <b>' +
        escapeHtml(j.spareEnquiryNo) + "</b>. Spare Sales quote it from there.</div>"
      : "";
    $("btn-sj-enquiry").style.display = j.spareEnquiryNo ? "none" : "";

    // A closed job's photographs are part of its report and stay with it.
    var closed = ["Completed", "Cancelled"].indexOf(j.status) !== -1;
    $("sj-proof-add").style.display = closed ? "none" : "flex";

    if (FACE_V2) {
      $("sj-status").closest(".field").style.display = "none";
      sdRender(j);
    }
  }

  // ---- 2.0's service desk (ServiceDesk.gs) ----
  // ERP 2's statuses — New, Assigned, In progress, Report submitted, Closed, Cancelled — shown
  // over ERP 1's, which the server keeps as they were. On the 2.0 face the job window steps
  // through them with buttons, and the engineer writes the report here; ERP 1's own status list
  // is put away so there is one way to move a job, not two.
  var SD_STEPS = ["New", "Assigned", "In progress", "Report submitted", "Closed"];
  var SD_BADGE = {
    "New": "badge-overdue", "Assigned": "badge-new", "In progress": "badge-quoted",
    "Report submitted": "badge-sent", "Closed": "badge-won", "Cancelled": "badge-lost"
  };
  var sdWriting = false;

  function sdMayAssign() { return ["Service Coordinator", "Management", "ERP Admin"].indexOf(currentUser.role) !== -1; }
  function sdOnJob(j) {
    return sdMayAssign() || (currentUser.role === "Service Engineer" &&
      String(j.engineerEmail || "").toLowerCase() === String(currentUser.email || "").toLowerCase());
  }

  function sdPanel() {
    if ($("sj-desk")) return $("sj-desk");
    var panel = document.createElement("div");
    panel.id = "sj-desk";
    panel.className = "sd-panel";
    $("sj-items-title").parentNode.insertBefore(panel, $("sj-items-title"));
    panel.addEventListener("click", function (e) {
      var b = e.target.closest("[data-sd]");
      if (!b) return;
      var j = openServiceJob;
      var done = function (job, text) {
        openServiceJob = job;
        sdWriting = false;
        renderServiceJobModal();
        loadServiceJobs();
        showMsg(text, "success");
      };
      var act = b.dataset.sd;
      if (act === "task") {
        tkNew({ kind: "service", id: j.id, label: j.jobNo + (j.customerName ? " · " + j.customerName : "") });
        return;
      }
      if (act === "details") {
        sclLists(function (l) {
          $("sd-det-area").innerHTML = sclAreaOpts(l.areas, j.area || "");
          $("sd-det-instr").value = j.instruction || "";
          $("sd-det-backdrop").classList.add("show");
        });
        return;
      }
      if (act === "resched") {
        sclLists(function (l) {
          $("sd-rs-sub").textContent = j.jobNo + " is on " + ebDate(j.scheduledDate) + ". The reason is kept with the job.";
          $("sd-rs-date").value = "";
          $("sd-rs-reason").innerHTML = '<option value="">— pick —</option>' + l.reasons.map(function (r) {
            return '<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + "</option>";
          }).join("");
          $("sd-rs-note").value = "";
          $("sd-rs-backdrop").classList.add("show");
        });
        return;
      }
      if (act === "start") {
        srv.withSuccessHandler(function (job) { done(job, job.jobNo + " is in progress."); })
          .withFailureHandler(onServerError).setServiceJobStatus(j.id, "In Progress", $("sj-notes").value);
      } else if (act === "write") {
        sdWriting = true;
        sdRender(j);
      } else if (act === "cancel-write") {
        sdWriting = false;
        sdRender(j);
      } else if (act === "submit") {
        srv.withSuccessHandler(function (job) { done(job, "Report submitted for " + job.jobNo + ". The coordinator closes it from here."); })
          .withFailureHandler(onServerError).submitServiceReport(j.id, {
            visitDate: $("sd-visit").value, hoursSpent: $("sd-hours").value, runningHours: $("sd-running").value,
            workDone: $("sd-work").value, rootCause: $("sd-cause").value, customerRemarks: $("sd-remarks").value,
            handedOverRunning: $("sd-running-over").value
          });
      } else if (act === "close") {
        srv.withSuccessHandler(function (job) { done(job, job.jobNo + " closed."); })
          .withFailureHandler(onServerError).closeServiceJob(j.id, $("sj-notes").value);
      } else if (act === "cancel") {
        askDialog({
          title: "Cancel " + j.jobNo + "?",
          message: "Say why, so whoever the customer rings next can tell them.",
          input: true, inputLabel: "Why is it cancelled?", placeholder: "e.g. Customer fixed it themselves; machine sold",
          okLabel: "Cancel the job", danger: true,
          validate: function (v) { return String(v || "").trim().length < 5 ? "A few words, please." : ""; }
        }, function (why) {
          if (why === null) return;
          srv.withSuccessHandler(function (job) { done(job, job.jobNo + " cancelled."); })
            .withFailureHandler(onServerError).cancelServiceJob(j.id, why);
        });
      }
    });
    return panel;
  }

  function sdRender(j) {
    var panel = sdPanel();
    var st = j.deskStatus || "New";
    var at = SD_STEPS.indexOf(st);
    var html = '<div class="sd-top"><span class="badge ' + (SD_BADGE[st] || "badge-draft") + '">' + escapeHtml(st) + "</span>" +
      (st === "Cancelled" ? "" : '<ol class="sd-steps">' + SD_STEPS.map(function (s, i) {
        return '<li class="' + (i < at ? "done" : i === at ? "now" : "") + '"><i></i>' + escapeHtml(s) + "</li>";
      }).join("") + "</ol>") + "</div>";
    if (st === "Cancelled") {
      html += '<div class="sd-band bad"><b>Cancelled</b>' + (j.cancelReason ? ": " + escapeHtml(j.cancelReason) : "") +
        (j.cancelledAt ? ' <span class="sd-muted">· ' + escapeHtml(ebDate(String(j.cancelledAt).slice(0, 10))) + "</span>" : "") + "</div>";
    }
    html += sclVisitHtml(j, ["Closed", "Cancelled"].indexOf(st) === -1);
    var reported = !!String(j.reportSubmittedAt || "").trim();
    if (reported && !sdWriting) {
      var row = function (k, v) { return String(v === undefined || v === null ? "" : v).trim() ? "<dt>" + escapeHtml(k) + "</dt><dd>" + escapeHtml(v) + "</dd>" : ""; };
      html += '<div class="sd-report"><div class="sd-h">Engineer’s report</div><dl>' +
        row("Visit date", ebDate(j.visitDate)) + row("Hours spent", j.hoursSpent) + row("Running hours", j.runningHours) +
        row("Work done", j.workDone) + row("Root cause", j.rootCause) + row("Customer’s remarks", j.customerRemarks) +
        row("Handed over running", j.handedOverRunning) +
        row("Submitted", ebDate(String(j.reportSubmittedAt).slice(0, 10)) + (j.reportSubmittedBy ? " by " + j.reportSubmittedBy : "")) + "</dl></div>";
    }
    if (sdWriting) {
      var breakdown = j.jobType === "Breakdown";
      var today = new Date().toISOString().slice(0, 10);
      html += '<div class="sd-form"><div class="sd-h">' + (reported ? "Correct the report" : "The engineer’s report") + "</div>" +
        '<div class="grid grid-3">' +
          '<div class="field"><label>Visit date *</label><input id="sd-visit" type="date" value="' + escapeHtml(j.visitDate || today) + '" /></div>' +
          '<div class="field"><label>Hours spent on site *</label><input id="sd-hours" type="number" min="0" step="0.5" value="' + escapeHtml(j.hoursSpent) + '" /></div>' +
          '<div class="field"><label>Machine running hours</label><input id="sd-running" type="number" min="0" value="' + escapeHtml(j.runningHours) + '" /></div>' +
        "</div>" +
        '<div class="field"><label>Work done *</label><textarea id="sd-work" rows="3" placeholder="What was done, part by part">' + escapeHtml(j.workDone || "") + "</textarea></div>" +
        '<div class="field"><label>Root cause' + (breakdown ? " *" : "") + '</label><textarea id="sd-cause" rows="2" placeholder="' +
          (breakdown ? "What made it stop" : "Anything found that needs attention") + '">' + escapeHtml(j.rootCause || "") + "</textarea></div>" +
        '<div class="grid grid-3">' +
          '<div class="field" style="grid-column:span 2;"><label>Customer’s remarks</label><input id="sd-remarks" value="' + escapeHtml(j.customerRemarks || "") + '" /></div>' +
          '<div class="field"><label>Handed over running? *</label><select id="sd-running-over"><option value="">— pick —</option>' +
            ["Yes", "No"].map(function (x) { return '<option' + (j.handedOverRunning === x ? " selected" : "") + ">" + x + "</option>"; }).join("") + "</select></div>" +
        "</div>" +
        '<div class="sd-actions"><button type="button" class="btn btn-sm" data-sd="cancel-write">Not now</button>' +
          '<button type="button" class="btn btn-sm btn-primary" data-sd="submit">Submit report</button></div></div>';
    } else {
      var acts = [];
      var live = ["Closed", "Cancelled"].indexOf(st) === -1;
      if (st === "Assigned" && sdOnJob(j)) acts.push('<button type="button" class="btn btn-sm" data-sd="start">Start work</button>');
      if (["Assigned", "In progress", "Report submitted"].indexOf(st) !== -1 && sdOnJob(j)) {
        acts.push('<button type="button" class="btn btn-sm' + (st === "In progress" ? " btn-primary" : "") + '" data-sd="write">' +
          (reported ? "Correct the report" : "Write the report") + "</button>");
      }
      if (st === "Report submitted" && sdMayAssign()) acts.push('<button type="button" class="btn btn-sm btn-primary" data-sd="close">Close the job</button>');
      if (live && sdMayAssign()) acts.push('<button type="button" class="btn btn-sm sd-danger" data-sd="cancel">Cancel…</button>');
      // A task about this job, for anybody (Tasks.gs).
      acts.push('<button type="button" class="btn btn-sm" data-sd="task">+ Task</button>');
      var say = st === "New" ? "Name the engineer and the date below, then Save."
        : st === "Assigned" ? "When the engineer is on site, start the work; the report follows the visit."
        : st === "In progress" ? "Once the work is done, the engineer writes the report."
        : st === "Report submitted" ? (sdMayAssign() ? "The report is in. Close the job once the customer’s photograph is attached." : "The report is in. The coordinator closes the job.")
        : "";
      if (acts.length || say) html += '<div class="sd-actions">' + (say ? '<span class="sd-muted">' + escapeHtml(say) + "</span>" : "") + acts.join("") + "</div>";
    }
    panel.innerHTML = html;
  }

    var scheduled = $("sj-scheduled").value;
    var notes = $("sj-notes").value;

    // Assignment and status are two server calls because they are two different permissions:
    // a coordinator names the engineer, the engineer moves the job along.
    var thenStatus = function () {
      srv.withSuccessHandler(function (job) {
        xfAfterSave("service", job.id);

        renderServiceJobModal();

        showMsg(job.jobNo + " saved.", "success");
      }).withFailureHandler(onServerError).setServiceJobStatus(id, status, notes);
    };

    if (engineer && (engineer !== openServiceJob.engineerEmail ||
        scheduled !== (openServiceJob.scheduledDate || ""))) {
      srv.withSuccessHandler(function (job) {
        openServiceJob = job;
        thenStatus();
      }).withFailureHandler(onServerError).assignServiceJob(id, engineer, scheduled);

      thenStatus();

  // ================= SERVICE CALLS (2.0) =================
  // ERP 2's call types on the log-a-call form, each call's area (Local or Outstation) with a
  // filter, the instruction to the engineer, and rescheduling with a reason (ServiceDesk.gs).
  // The classic and new-design faces keep ERP 1's breakdown form and job window.
  var scl = { lists: null };
  function sclLists(then) {
    if (scl.lists) { then(scl.lists); return; }
    srv.withSuccessHandler(function (l) { scl.lists = l; then(l); }).withFailureHandler(onServerError).getServiceCallLists();
  }
  function sclAreaOpts(areas, sel) {
    var group = function (type) {
      var items = areas.filter(function (a) { return a.type === type; });
      return items.length ? '<optgroup label="' + type + '">' + items.map(function (a) {
        return '<option value="' + escapeHtml(a.name) + '"' + (a.name === sel ? " selected" : "") + ">" + escapeHtml(a.name) + "</option>";
      }).join("") + "</optgroup>" : "";
    };
    var known = !sel || areas.some(function (a) { return a.name === sel; });
    return '<option value="">— none —</option>' + group("Local") + group("Outstation") +
      (known ? "" : '<option value="' + escapeHtml(sel) + '" selected>' + escapeHtml(sel) + " (no longer listed)</option>");
  }

  if (FACE_V2 && $("breakdown-modal-backdrop") && !$("bd-type")) {

      row.style.marginBottom = "12px";
      row.innerHTML = '<div class="field"><label>Call type *</label><select id="bd-type"></select></div>' +

      var first = modal.querySelector(".grid");
      first.parentNode.insertBefore(row, first);
      $("btn-new-breakdown").textContent = "+ Log Service Call";
      ["Regular service", "Spare change", "Commissioning"].forEach(function (t) {

          var o = document.createElement("option");

        '<div class="amc-m-foot"><span style="flex:1"></span><button type="button" class="btn" id="btn-sd-rs-close">Close</button>' +
        '<button type="button" class="btn btn-primary" id="btn-sd-rs-save">Reschedule</button></div></div>';

  function amcMoney(v) { return v === "" || v === null || v === undefined ? "—" : ebMoney(v); }

  function renderAmc() {
    var d = amc.data;
    if (!d) return;
    var k = d.kpis;
    $("amc-kpis").innerHTML = [
      ["Active contracts", k.active, d.money ? (k.valueAYear ? fmtShort(k.valueAYear) + " a year" : "") : "", ""],
      ["Visits due this month", k.dueThisMonth, "not yet done", ""],
      ["Visits overdue", k.overdue, "no job made, or the job not done", k.overdue ? "bad" : ""],
      ["Renewals in 60 days", k.renewals, "contracts ending", k.renewals ? "warn" : ""]
    ].map(function (t) {
      return '<div class="pd-tile' + (t[3] ? " " + t[3] : "") + '"><span class="pd-label">' + escapeHtml(t[0]) + '</span><span class="pd-value">' +
        t[1] + '</span><span class="pd-sub">' + escapeHtml(t[2]) + "</span></div>";

            "<td>" + escapeHtml(c.machineModel || "—") + '<div class="mono sdc-muted">' + escapeHtml(c.serialNo) + "</div></td>" +

        (rs.length ? rs.map(function (c) {

    $("amc-search").addEventListener("input", renderAmc);
    $("amc-body").addEventListener("click", function (e) {
      var call = e.target.closest("[data-amc-call]");

        call.disabled = true;
        srv.withSuccessHandler(function (r) {
          showMsg("Service job " + r.jobNo + " made for the visit. Assign the engineer from Service Jobs.", "success");
          loadAmc();
        }).withFailureHandler(function (err) { call.disabled = false; onServerError(err); }).makeAmcVisitCall(call.dataset.amcCall);
        return;
      }
      var job = e.target.closest("[data-amc-job]");
      if (job) { openServiceJobModal(job.dataset.amcJob); return; }
      var quote = e.target.closest("[data-amc-quote]");
      if (quote) { openQuotation(quote.dataset.amcQuote); return; }
      var renew = e.target.closest("[data-amc-renew]");
      if (renew) {
        renew.disabled = true;
        srv.withSuccessHandler(function (r) {
          showMsg((r.existing ? "Opening " : "AMC renewal quotation ") + r.quoteNo + (r.existing ? "." : " raised. Add the lines, then send it."), "success");

  function amcOpen(id) {

      amc.open = c;
      var d = amc.data || { types: [], money: false, canEdit: false };

      var v = function (k) { return escapeHtml(c[k] === undefined || c[k] === null ? "" : c[k]); };
      $("amc-m-title").textContent = c.id ? c.contractNo + " · " + c.customerName : "New AMC contract";
      $("amc-m-sub").textContent = c.id ? (c.amcType + " · " + ebDate(c.startDate) + " – " + ebDate(c.endDate)) :
        "A contract is for one machine. Its visits are laid out from the first one, every so many months, to the end.";
      $("amc-m-body").innerHTML =
        '<div class="grid grid-3">' +
          '<div class="field" style="grid-column:span 2;"><label>Customer *</label><select id="amc-f-customer"' + (ro ? " disabled" : "") + '>' +
            '<option value="">— pick —</option>' + customerOptions(c.customerId || null) + "</select></div>" +
          '<div class="field"><label>Type *</label><select id="amc-f-type"' + (ro ? " disabled" : "") + ">" + d.types.map(function (t) {
            return "<option" + (t === (c.amcType || "Comprehensive") ? " selected" : "") + ">" + escapeHtml(t) + "</option>"; }).join("") + "</select></div>" +
        "</div>" +
        '<div class="grid grid-3" style="margin-top:12px;">' +
          '<div class="field"><label>Serial (fab) No. *</label><input id="amc-f-serial" class="mono" list="amc-machines" value="' + v("serialNo") + '"' + (ro ? " disabled" : "") + " /></div>" +
          '<div class="field"><label>Model</label><input id="amc-f-model" value="' + v("machineModel") + '"' + (ro ? " disabled" : "") + " /></div>" +
          '<div class="field"><label>Running hours at the start</label><input id="amc-f-hours" value="' + v("runningHours") + '"' + (ro ? " disabled" : "") + " /></div>" +
        '</div><datalist id="amc-machines"></datalist>' +
        '<div class="grid grid-4" style="margin-top:12px;">' +
          '<div class="field"><label>Starts *</label><input id="amc-f-start" type="date" value="' + escapeHtml(c.startDate || today) + '"' + (ro ? " disabled" : "") + " /></div>" +
          '<div class="field"><label>Ends</label><input id="amc-f-end" type="date" value="' + v("endDate") + '"' + (ro ? " disabled" : "") + ' /><div class="sdc-muted">Blank: a year</div></div>' +
          '<div class="field"><label>Service every (months) *</label><input id="amc-f-every" type="number" min="1" max="24" value="' + escapeHtml(c.everyMonths || 3) + '"' + (ro ? " disabled" : "") + " /></div>" +
          '<div class="field"><label>First visit</label><input id="amc-f-first" type="date" value="' + v("firstVisitDate") + '"' + (ro ? " disabled" : "") + ' /><div class="sdc-muted">Blank: end of the first period</div></div>' +
        "</div>" +
        '<div class="grid grid-4" style="margin-top:12px;">' +
          (d.money ? '<div class="field"><label>Value a year (₹)</label><input id="amc-f-value" type="number" min="0" value="' + v("contractValue") + '"' + (ro ? " disabled" : "") + " /></div>" : "") +
          '<div class="field"><label>Contact</label><input id="amc-f-contact" value="' + v("contactName") + '"' + (ro ? " disabled" : "") + " /></div>" +
          '<div class="field"><label>Phone</label><input id="amc-f-phone" class="mono" value="' + v("contactPhone") + '"' + (ro ? " disabled" : "") + " /></div>" +
          '<div class="field"><label>Area</label><input id="amc-f-area" value="' + v("area") + '"' + (ro ? " disabled" : "") + " /></div>" +
        "</div>" +
        '<div class="field" style="margin-top:12px;"><label>Notes</label><textarea id="amc-f-notes" rows="2"' + (ro ? " disabled" : "") + ">" + v("notes") + "</textarea></div>" +
        (c.visits && c.visits.length ? '<div class="sd-h">Visits</div><table class="amc-visits"><thead><tr><th>#</th><th>Due</th><th>Where it stands</th><th>Job</th></tr></thead><tbody>' +
          c.visits.map(function (x) {
            return "<tr><td>" + x.visitNo + "</td><td>" + escapeHtml(ebDate(x.dueDate)) + "</td><td>" + escapeHtml(x.state) +
              (x.doneDate ? " " + escapeHtml(ebDate(x.doneDate)) : "") + '</td><td class="mono">' + escapeHtml(x.jobNo || "—") + "</td></tr>";
          }).join("") + "</tbody></table>" : "");
      $("btn-amc-save").style.display = ro ? "none" : "";
      $("btn-amc-delete").style.display = !ro && c.id ? "" : "none";
      $("amc-modal-backdrop").classList.add("show");
      var fillMachines = function () {

            return '<option value="' + escapeHtml(m.serialNo) + '">' + escapeHtml((m.machineModel || "") + " · " + m.from) + "</option>";
          }).join("");
        }).withFailureHandler(function () { /* suggestions only */ }).listAmcMachines(cid);
      };
      $("amc-f-customer").addEventListener("change", fillMachines);

  function amcSave() {
    var c = amc.open || {};
    var input = {
      id: c.id || "", customerId: $("amc-f-customer").value, amcType: $("amc-f-type").value,
      serialNo: $("amc-f-serial").value.trim(), machineModel: $("amc-f-model").value.trim(),
      runningHours: $("amc-f-hours").value.trim(), startDate: $("amc-f-start").value, endDate: $("amc-f-end").value,
      everyMonths: $("amc-f-every").value, firstVisitDate: $("amc-f-first").value,
      contactName: $("amc-f-contact").value.trim(), contactPhone: $("amc-f-phone").value.trim(),
      area: $("amc-f-area").value.trim(), notes: $("amc-f-notes").value.trim()
    };
    if ($("amc-f-value")) input.contractValue = $("amc-f-value").value;
    if (!xfReady("amc")) return;
    var done = busyButton("btn-amc-save", "Saving…");

      done();
      xfAfterSave("amc", saved.id);
      $("amc-modal-backdrop").classList.remove("show");
      showMsg(saved.contractNo + " saved, with " + (saved.visits || []).length + " visits.", "success");
      loadAmc();
    }).withFailureHandler(function (err) { done(); onServerError(err); }).saveAmcContract(input);
  }

  // ================= NEXT-DAY PLAN (2.0) =================
  // Each engineer's visits for a day, from the assigned service jobs, with what is not on the
  // plan yet, and the message for the engineers' WhatsApp group (ServicePlan.gs). The message
  // is copied by hand: the ERP sends nothing by itself. 2.0 face only.
  var np = { data: null, date: "", perEngineer: false };

  if (FACE_V2 && !$("view-plan")) {
    (function () {
      var view = document.createElement("div");
      view.className = "view";
      view.id = "view-plan";
      view.innerHTML = '<div class="page-head"><div><h2>Next-day plan</h2><p>Each engineer’s visits for the day, from the service jobs ' +
        "assigned to them. Check it, then copy the message into the engineers’ WhatsApp group. The ERP never sends WhatsApp by itself.</p></div></div>" +
        '<div class="np-bar"><div class="eb-switch" id="np-quick"><button type="button" data-np-plus="1">Tomorrow</button>' +
        '<button type="button" data-np-plus="2">Day after</button><button type="button" data-np-plus="0">Today</button></div>' +
        '<input type="date" id="np-date" aria-label="Day" /><span class="np-sum" id="np-sum"></span></div>' +
        '<div class="np-split"><section class="pd-panel" id="np-plan"></section><section class="pd-panel" id="np-msg"></section></div>' +
        '<div class="pd-lists" id="np-todo"></div>';
      var after = $("view-amc") || $("view-service");
      after.parentNode.insertBefore(view, after.nextSibling);
    })();
  }

  function npPlus(n) {
    var d = new Date();
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function npDayName(iso, long) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-IN", long ? { weekday: "long", day: "numeric", month: "long", year: "numeric" } : { weekday: "short" }) +
      (long ? "" : " " + ebDate(iso));
  }

  function initPlanView() {
    if (!FACE_V2) return;
    loadPlan();
  }

  function loadPlan() {
    srv.withSuccessHandler(function (d) {
      np.data = d;
      np.date = d.date;
      renderPlan();
    }).withFailureHandler(onServerError).getNextDayPlan(np.date ? { date: np.date } : {});
  }

  /** One visit as a line of the WhatsApp message. */
  function npLine(v) {
    return (v.scheduledTime || "Any time") + " " + v.customerName + (v.city ? ", " + v.city : "") + " – " + v.jobType +
      (v.scopeText ? ": " + v.scopeText : "") + " (" + v.jobNo + ")" +
      (v.contactName || v.contactPhone ? "\n    " + [v.contactName, v.contactPhone].filter(Boolean).join(" ") : "") +
      (v.instruction ? "\n    Note: " + v.instruction : "");
  }
  function npMessage(people) {
    var d = np.data;
    return "*Service plan, " + npDayName(d.date, false) + "*\n\n" + people.map(function (p) {
      return "*" + p.name + "*\n" + p.visits.map(npLine).join("\n");
    }).join("\n\n") + "\n\nSend the report from the ERP after each visit.";
  }

  function renderPlan() {
    var d = np.data;
    $("np-date").value = d.date;
    $("np-quick").querySelectorAll("[data-np-plus]").forEach(function (b) {
      b.classList.toggle("on", npPlus(Number(b.dataset.npPlus)) === d.date);
    });
    var busy = d.plan.filter(function (p) { return p.visits.length; });
    $("np-sum").textContent = busy.length + (busy.length === 1 ? " engineer · " : " engineers · ") + d.visits + (d.visits === 1 ? " visit" : " visits");

    $("np-plan").innerHTML = '<div class="pd-panel-head"><h3>' + escapeHtml(npDayName(d.date, true)) + "</h3></div>" +
      (d.plan.length ? d.plan.map(function (p) {
        return '<div class="np-eng"><div class="np-eng-head"><span class="eb-av">' + escapeHtml(ebInitials(p.name)) + "</span><b>" + escapeHtml(p.name) + "</b>" +
          '<span class="eb-chip' + (p.visits.length ? " auto" : "") + '">' + (p.visits.length ? p.visits.length + (p.visits.length === 1 ? " visit" : " visits") : "Free") + "</span></div>" +
          p.visits.map(function (v) {
            return '<div class="np-visit" data-np-job="' + escapeHtml(v.id) + '">' +
              (d.canAssign ? '<input type="time" class="np-time" data-np-time="' + escapeHtml(v.id) + '" value="' + escapeHtml(v.scheduledTime) + '" aria-label="Time" />'
                : '<span class="np-time-text">' + escapeHtml(v.scheduledTime || "—") + "</span>") +
              '<span class="np-main"><span><b>' + escapeHtml(v.customerName) + "</b>" + (v.city ? ", " + escapeHtml(v.city) : "") + "</span>" +
                '<span class="sdc-muted">' + escapeHtml(v.jobType + " · " + v.jobNo + (v.areaType === "Outstation" ? " · Outstation" : "") +
                (v.scopeText ? " · " + v.scopeText : "") + (v.instruction ? " · Note: " + v.instruction : "")) + "</span></span>" +
              '<span class="np-serial mono">' + escapeHtml(v.serialNo) + "</span></div>";
          }).join("") + "</div>";
      }).join("") : '<div class="pd-empty">No service engineers in Users yet.</div>');

    var msg;
    if (!d.visits) {
      msg = '<div class="pd-empty">Nothing planned for this day yet.' + (d.canAssign ? " Send somebody on the jobs below." : "") + "</div>";
    } else if (!np.perEngineer) {
      msg = '<pre class="np-wa" id="np-wa-all">' + escapeHtml(npMessage(busy)) + "</pre>" +
        '<div class="sd-actions"><button type="button" class="btn btn-primary btn-sm" data-np-copy="np-wa-all">Copy message</button></div>';
    } else {
      msg = busy.map(function (p, i) {
        return '<pre class="np-wa" id="np-wa-' + i + '">' + escapeHtml(npMessage([p])) + "</pre>" +
          '<div class="sd-actions"><button type="button" class="btn btn-sm" data-np-copy="np-wa-' + i + '">Copy for ' +
          escapeHtml(p.name.split(" ")[0]) + "</button></div>";
      }).join("");
    }
    $("np-msg").innerHTML = '<div class="pd-panel-head"><h3>Message for WhatsApp</h3><label class="check-line"><input type="checkbox" id="np-per"' +
      (np.perEngineer ? " checked" : "") + " /> One message per engineer</label></div>" + msg +
      '<p class="eb-note">On a phone, paste it straight into the group. The ERP never sends WhatsApp messages by itself.</p>';

    var todo = [];
    if (d.canAssign) {
      var engOpts = function () {
        return '<option value="">— engineer —</option>' + d.engineers.map(function (e) {
          return '<option value="' + escapeHtml(e.email) + '">' + escapeHtml(e.name) + "</option>";
        }).join("");
      };
      var row = function (v, side) {
        return '<div class="pd-row np-row"><span class="pd-row-main"><b>' + escapeHtml(v.customerName) + (v.city ? ", " + escapeHtml(v.city) : "") + "</b><span>" +
          escapeHtml((v.jobNo ? v.jobNo + " · " : "") + (v.jobType || "") + (v.urgency && v.urgency !== "Normal" ? " · " + v.urgency : "") +
            (v.scopeText ? " · " + v.scopeText : "")) + "</span></span>" + side + "</div>";
      };
      todo.push({ title: "Not assigned yet", count: d.unassigned.length, empty: "Every job has an engineer.", rows: d.unassigned.map(function (v) {
        return row(v, '<span class="np-act"><select data-np-eng="' + escapeHtml(v.id) + '">' + engOpts() + '</select>' +
          '<button type="button" class="btn btn-sm btn-primary" data-np-assign="' + escapeHtml(v.id) + '">Send on ' + escapeHtml(npDayName(d.date, false).split(" ")[0]) + "</button></span>");
      }) });

  /** Copies a message; where the browser will not, selects it for Ctrl+C. */
  function npCopy(id, btn) {
    var text = $(id).textContent;
    var said = function () { var was = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = was; }, 1500); };
    var fallback = function () {
      var range = document.createRange();
      range.selectNodeContents($(id));
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      var done = false;
      try { done = document.execCommand("copy"); } catch (e) { done = false; }
      if (done) said(); else showMsg("Selected — press Ctrl+C (or long-press Copy on a phone).", "success");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(said, fallback);
    else fallback();
  }

    $("np-date").addEventListener("change", function () { if ($("np-date").value) { np.date = $("np-date").value; loadPlan(); } });
    $("view-plan").addEventListener("change", function (e) {
      if (e.target.id === "np-per") { np.perEngineer = e.target.checked; renderPlan(); return; }
      var t = e.target.closest("[data-np-time]");
      if (t) {
        srv.withSuccessHandler(function () { loadPlan(); showMsg(t.value ? "Visit time set to " + t.value + "." : "Visit time taken off.", "success"); })
          .withFailureHandler(onServerError).setServiceJobTime(t.dataset.npTime, t.value);
      }
    });
    $("view-plan").addEventListener("click", function (e) {
      var copy = e.target.closest("[data-np-copy]");
      if (copy) { npCopy(copy.dataset.npCopy, copy); return; }
      var assign = e.target.closest("[data-np-assign]");
      if (assign) {
        var eng = $("view-plan").querySelector('[data-np-eng="' + assign.dataset.npAssign + '"]').value;
        if (!eng) { showMsg("Pick the engineer who is going.", "error"); return; }
        srv.withSuccessHandler(function (job) { showMsg(job.jobNo + " is on the plan.", "success"); loadPlan(); })
          .withFailureHandler(onServerError).assignServiceJob(assign.dataset.npAssign, eng, np.data.date);

      var put = e.target.closest("[data-np-put]");

          .withFailureHandler(onServerError).assignServiceJob(put.dataset.npPut, put.dataset.eng, np.data.date);
        return;

      var amcBtn = e.target.closest("[data-np-amc]");

        return;

      if (e.target.closest(".np-time")) return;
      var visit = e.target.closest("[data-np-job]");
      if (visit) openServiceJobModal(visit.dataset.npJob);
    });
  }

      assigneeEmail: $("tk-f-who").value, dueDate: $("tk-f-due").value, priority: $("tk-f-pr").value
    };
    if (!t.id && t.link) { input.linkKind = t.link.kind; input.linkId = t.link.id; }
    var status = $("tk-f-status") ? $("tk-f-status").value : t.status;
    var changed = !t.id || (t.canEdit && (input.title !== t.title || input.details !== t.details || input.dueDate !== t.dueDate ||
      input.priority !== t.priority || input.assigneeEmail.toLowerCase() !== String(t.assigneeEmail).toLowerCase()));

    var then = function (saved) {

  function vpIso(d) { return d.getUTCFullYear() + "-" + ("0" + (d.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + d.getUTCDate()).slice(-2); }
  function vpAdd(iso, n) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return vpIso(d); }
  function vpToday() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function vpMonday(iso) { var d = new Date(iso + "T00:00:00Z"); return vpAdd(iso, -((d.getUTCDay() + 6) % 7)); }

  /** The days on screen: Monday to Sunday, or the month. */
  function vpRange() {
    var a = vp.anchor || vpToday();
    if (vp.mode === "month") {
      var first = a.slice(0, 8) + "01";
      var next = vpAdd(first, 32).slice(0, 8) + "01";
      var label = new Date(first + "T00:00:00Z").toLocaleDateString("en-IN", { month: "long", year: "numeric", timeZone: "UTC" });
      return { from: first, to: vpAdd(next, -1), label: label };
    }
    var mon = vpMonday(a);
    return { from: mon, to: vpAdd(mon, 6), label: ebDate(mon) + " – " + ebDate(vpAdd(mon, 6)) };
  }

    var r = vpRange();
    var q = { from: r.from, to: r.to };
    if (vp.engineer !== null) q.engineer = vp.engineer;
    srv.withSuccessHandler(function (d) {
      vp.data = d;
      if (vp.engineer === null) vp.engineer = d.engineer;
      vpRender();
    }).withFailureHandler(onServerError).getVisitPlans(q);
  }

  function vpOpts(list, sel, blank) {
    return (blank !== undefined ? '<option value="">' + escapeHtml(blank) + "</option>" : "") + list.map(function (x) {
      var v = typeof x === "string" ? x : x.v;
      var l = typeof x === "string" ? x : x.l;
      return '<option value="' + escapeHtml(v) + '"' + (v === sel ? " selected" : "") + ">" + escapeHtml(l) + "</option>";
    }).join("");
  }
  function vpAreaOpts(d, sel, blank) {
    var group = function (type) {
      var items = d.areas.filter(function (a) { return a.type === type; });
      return items.length ? '<optgroup label="' + type + '">' + vpOpts(items.map(function (a) { return a.name; }), sel) + "</optgroup>" : "";
    };
    var known = !sel || d.areas.some(function (a) { return a.name === sel; });
    return '<option value="">' + escapeHtml(blank || "—") + "</option>" + group("Local") + group("Outstation") +
      (known ? "" : '<option value="' + escapeHtml(sel) + '" selected>' + escapeHtml(sel) + " (no longer listed)</option>");
  }

  function vpStats(V) {
    var s = { n: V.length, vis: 0, miss: 0, res: 0, enq: 0, pot: 0, hot: 0, local: 0, out: 0, tl: {}, br: {}, ct: {} };
    V.forEach(function (v) {
      if (v.status === "Visited") {
        s.vis++;
        s.pot += Number(v.potentialValue) || 0;
        if (v.interest === "Hot") s.hot++;
        if (v.timeline) s.tl[v.timeline] = (s.tl[v.timeline] || 0) + 1;
        if (v.brand) s.br[v.brand] = (s.br[v.brand] || 0) + 1;
        if (v.compType) s.ct[v.compType] = (s.ct[v.compType] || 0) + 1;
      } else if (v.status === "Not visited") s.miss++;
      else if (v.status === "Rescheduled") s.res++;
      if (v.leadId) s.enq++;
      if (v.areaType === "Local") s.local++;
      else if (v.areaType === "Outstation") s.out++;
    });
    return s;
  }

  function vpBars(obj, order) {
    var keys = (order || Object.keys(obj)).filter(function (k) { return obj[k]; });
    var max = Math.max.apply(null, [1].concat(keys.map(function (k) { return obj[k]; })));
    return keys.map(function (k) {
      return '<div class="vp-hbar"><span>' + escapeHtml(k) + '</span><span class="vp-track"><i style="width:' + (obj[k] / max * 100) + '%"></i></span><b>' + obj[k] + "</b></div>";
    }).join("") || '<p class="sdc-muted">No visit reports yet.</p>';
  }

  function vpRender() {
    var d = vp.data;
    if (!d || !$("view-visits")) return;
    var r = vpRange();
    var today = d.today;
    $("btn-vp-areas").style.display = d.canEditAreas ? "" : "none";
    $("vp-eng").style.display = d.seeAll ? "" : "none";
    $("vp-eng").innerHTML = vpOpts([{ v: "", l: "All engineers" }].concat(d.people.map(function (p) { return { v: p.email, l: p.name }; })), vp.engineer || "");
    $("vp-mode").querySelectorAll("[data-vp-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.vpMode === vp.mode); });
    $("vp-label").textContent = r.label;
    $("btn-vp-copy").style.display = vp.mode === "week" ? "" : "none";
    $("vp-q-eng-wrap").style.display = d.seeAll && !vp.engineer ? "" : "none";
    $("vp-q-eng").innerHTML = vpOpts(d.people.map(function (p) { return { v: p.email, l: p.name }; }), d.me, "— engineer —");
    if (!$("vp-q-date").value || $("vp-q-date").value < r.from || $("vp-q-date").value > r.to) {

    var area = $("vp-q-area").value;

    var purpose = $("vp-q-purpose").value;

    $("vp-customers").innerHTML = d.customers.map(function (c) { return '<option value="' + escapeHtml(c.name) + '">'; }).join("");

    var V = d.visits;
    var s = vpStats(V);
    $("vp-kpis").innerHTML = [
      ["Planned", s.n, s.local + " local · " + s.out + " outstation", ""],
      ["Visited", s.vis, s.n ? Math.round(s.vis / s.n * 100) + "% of the plan" : "nothing planned", ""],
      ["Not visited / rescheduled", s.miss + " / " + s.res, "", s.miss ? "warn" : ""],
      ["Enquiries made", s.enq, s.vis ? Math.round(s.enq / s.vis * 100) + "% of visits" : "", ""],
      ["Potential value", s.pot ? fmtShort(s.pot) : "—", s.hot + " hot", ""]
    ].map(function (t) {
      return '<div class="pd-tile' + (t[3] ? " " + t[3] : "") + '"><span class="pd-label">' + escapeHtml(t[0]) + '</span><span class="pd-value">' +
        escapeHtml(String(t[1])) + '</span><span class="pd-sub">' + escapeHtml(t[2]) + "</span></div>";
    }).join("");

    var all = !vp.engineer;
    var chip = function (v) {
      return '<button type="button" class="vp-chip ' + (VP_CHIP[v.status] || "") + '" data-vp-open="' + escapeHtml(v.id) + '"><b>' + escapeHtml(v.customerName) + "</b>" +
        (v.leadNo ? ' <span class="eb-chip auto">Enquiry</span>' : "") +
        '<span class="vp-e">' + escapeHtml([v.purpose, v.area ? v.area + (v.areaType === "Outstation" ? " (out)" : "") : "", all ? v.engineerName : ""].filter(Boolean).join(" · ")) + "</span></button>";
    };
    if (vp.mode === "week") {
      var days = [];
      for (var i = 0; i < 7; i++) days.push(vpAdd(r.from, i));
      $("vp-grid").innerHTML = '<div class="vp-week">' + days.map(function (day) {
        var dt = new Date(day + "T00:00:00Z");
        return '<div class="vp-day' + (day === today ? " today" : "") + '"><div class="vp-dh"><b>' +
          escapeHtml(dt.toLocaleDateString("en-IN", { weekday: "short", timeZone: "UTC" })) + "</b> <span>" +
          escapeHtml(dt.toLocaleDateString("en-IN", { day: "numeric", month: "short", timeZone: "UTC" })) + "</span></div>" +
          V.filter(function (v) { return v.visitDate === day; }).map(chip).join("") +
          '<button type="button" class="vp-add" data-vp-day="' + day + '">+ Add</button></div>';
      }).join("") + "</div>";
    } else {
      $("vp-grid").innerHTML = '<div class="card" style="padding:0; overflow-x:auto;"><table class="tk-table vp-table"><thead><tr><th>Date</th>' + (all ? "<th>Engineer</th>" : "") +
        '<th>Company</th><th>Area</th><th>Purpose</th><th>Status</th><th>Discussion</th><th>Timeline</th><th class="num">Potential</th><th>Enquiry</th></tr></thead><tbody>' +
        (V.length ? V.map(function (v) {
          return '<tr data-vp-open="' + escapeHtml(v.id) + '"><td style="white-space:nowrap;">' + escapeHtml(ebDate(v.visitDate)) + "</td>" +
            (all ? "<td>" + escapeHtml(v.engineerName) + "</td>" : "") +
            "<td><b>" + escapeHtml(v.customerName) + "</b></td>" +
            "<td>" + escapeHtml(v.area || "—") + (v.areaType ? '<div class="sdc-muted">' + escapeHtml(v.areaType) + "</div>" : "") + "</td>" +
            "<td>" + escapeHtml(v.purpose) + "</td>" +
            '<td><span class="badge ' + (VP_BADGE[v.status] || "badge-draft") + '">' + escapeHtml(v.status) + "</span></td>" +
            '<td class="sdc-muted" style="max-width:260px;">' + escapeHtml((v.discussion || "").slice(0, 90)) + "</td>" +
            "<td>" + escapeHtml(v.timeline) + "</td>" +
            '<td class="num">' + escapeHtml(v.potentialValue === "" ? "" : ebMoney(v.potentialValue)) + "</td>" +
            '<td class="mono">' + escapeHtml(v.leadNo) + "</td></tr>";
        }).join("") : '<tr><td colspan="10" class="empty">No visits planned this month.</td></tr>') + "</tbody></table></div>";
      xfTable("visit", $("vp-grid").querySelector("table"), xfRowId("[data-vp-open]", "data-vp-open"), false);
    }

    var engs = [];
    V.forEach(function (v) { if (engs.indexOf(v.engineerEmail) === -1) engs.push(v.engineerEmail); });
    $("vp-report").innerHTML = '<div class="pd-panel-head"><h3>Visit performance</h3><span class="tk-rules">' + s.n + " planned · " + s.vis + " visited · " +
      s.enq + (s.enq === 1 ? " enquiry" : " enquiries") + "</span>" + (V.length ? '<button type="button" class="btn btn-sm" id="btn-vp-csv">Download CSV</button>' : "") + "</div>" +
      (V.length ? '<div style="overflow-x:auto;"><table class="tk-table"><thead><tr><th>Engineer</th><th class="num">Planned</th><th class="num">Visited</th>' +
        '<th class="num">Not visited</th><th class="num">Rescheduled</th><th class="num">Completion</th><th class="num">Enquiries</th><th class="num">Visit → enquiry</th>' +
        '<th class="num">Hot</th><th class="num">Potential</th></tr></thead><tbody>' + engs.map(function (e) {
          var x = vpStats(V.filter(function (v) { return v.engineerEmail === e; }));
          var name = V.filter(function (v) { return v.engineerEmail === e; })[0].engineerName;
          var pc = x.n ? Math.round(x.vis / x.n * 100) : 0;
          return "<tr><td><b>" + escapeHtml(name) + '</b></td><td class="num">' + x.n + '</td><td class="num">' + x.vis + "</td>" +
            '<td class="num' + (x.miss ? " sdc-late" : "") + '">' + x.miss + '</td><td class="num">' + x.res + "</td>" +
            '<td class="num"><span class="tk-score"><b>' + pc + '%</b><span class="tk-meter"><i style="width:' + pc + '%"></i></span></span></td>' +
            '<td class="num">' + x.enq + '</td><td class="num">' + (x.vis ? Math.round(x.enq / x.vis * 100) + "%" : "—") + "</td>" +
            '<td class="num">' + x.hot + '</td><td class="num">' + escapeHtml(x.pot ? fmtShort(x.pot) : "—") + "</td></tr>";
        }).join("") + "</tbody></table></div>" +
        '<div class="vp-bars"><div><h4>Probable purchase timeline</h4>' + vpBars(s.tl, d.lists.timelines) + "</div>" +
          "<div><h4>Compressor brand in use</h4>" + vpBars(s.br) + "</div>" +
          "<div><h4>Compressor type in use</h4>" + vpBars(s.ct, d.lists.compTypes) + "</div></div>"
        : '<div class="pd-empty">No visits planned in this ' + (vp.mode === "week" ? "week" : "month") + ".</div>");
  }

  function vpField(label, html, wide) {
    return '<div class="field' + (wide ? " vp-wide" : "") + '"><label>' + label + "</label>" + html + "</div>";
  }

  /** The visit form: ERP 2's, field for field. */
  function vpDraw(v) {
    var d = vp.data;
    vp.open = v;
    var ro = v.id && !v.canEdit;
    var dis = ro ? " disabled" : "";
    var val = function (k) { return escapeHtml(v[k] === undefined || v[k] === null ? "" : v[k]); };
    var inp = function (k, type, extra) { return '<input id="vp-f-' + k + '"' + (type ? ' type="' + type + '"' : "") + ' value="' + val(k) + '"' + (extra || "") + dis + " />"; };
    var sel = function (k, list, blank) { return '<select id="vp-f-' + k + '"' + dis + ">" + vpOpts(list, v[k] || "", blank) + "</select>"; };
    $("vp-m-title").textContent = v.id ? v.customerName || "Visit" : "Plan a visit";
    $("vp-m-sub").textContent = v.id ? v.engineerName + " · " + ebDate(v.visitDate) + (v.area ? " · " + v.area + " (" + v.areaType + ")" : "") : "";
    $("vp-m-body").innerHTML = '<div class="vp-form">' +
      vpField("Engineer *", '<select id="vp-f-engineerEmail"' + (d.seeAll && !ro ? "" : " disabled") + ">" +

      vpField("Company *", inp("customerName", "", ' list="vp-customers" autocomplete="off"')) +

      vpField("Purpose", sel("purpose", d.lists.purposes)) +
      vpField("Status", sel("status", d.statuses)) +
      vpField("Person met", inp("contactMet")) +
      vpField("Phone", inp("phone", "tel")) +

      vpField("Discussion with the customer", '<textarea id="vp-f-discussion" rows="3"' + dis + ">" + val("discussion") + "</textarea>", true) +
      vpField("Compressor in use", sel("compType", d.lists.compTypes, "—")) +
      vpField("Brand in use", sel("brand", d.lists.brands, "—")) +
      vpField("Installed capacity", inp("capacity", "", ' placeholder="e.g. 2 × 22 kW, 250 cfm"')) +
      vpField("Age of machines (years)", inp("ageYears", "number", ' min="0"')) +

      vpField("Potential value (₹)", inp("potentialValue", "number", ' min="0"')) +
      vpField("Next action", inp("nextAction")) +
      vpField("Next action date", inp("nextDate", "date")) +
      "</div>" +
      (v.leadNo ? '<div class="tk-about">Enquiry made: <b>' + escapeHtml(v.leadNo + (v.leadStatus ? " · " + v.leadStatus : "")) + "</b>" +
        '<button type="button" class="btn btn-sm" data-vp-lead="' + escapeHtml(v.leadId) + '">Open</button></div>' : "");
    $("btn-vp-delete").style.display = v.id && !ro ? "" : "none";
    $("btn-vp-save").style.display = ro ? "none" : "";
    $("btn-vp-enquiry").style.display = ro || v.leadId ? "none" : "";
    $("vp-modal-backdrop").classList.add("show");
  }

  function vpForm() {
    var v = vp.open || {};
    var f = function (k) { var el = $("vp-f-" + k); return el ? String(el.value).trim() : ""; };
    var out = { id: v.id || "" };
    ["engineerEmail", "visitDate", "customerName", "area", "purpose", "status", "contactMet", "phone", "industry", "discussion", "compType",
      "brand", "capacity", "ageYears", "considering", "interest", "requirement", "timeline", "potentialValue", "nextAction", "nextDate"].forEach(function (k) {
      out[k] = f(k);
    });
    // The company picked from the master keeps its customer; one typed differently is a prospect.
    if (v.customerId && out.customerName === v.customerName) out.customerId = v.customerId;
    return out;
  }

  function vpSave(withEnquiry) {
    var input = vpForm();
    if (!xfReady("visit")) return;
    var btn = withEnquiry ? "btn-vp-enquiry" : "btn-vp-save";
    var done = busyButton(btn, "Saving…");
    var fail = function (err) { done(); onServerError(err); vpLoad(); };
    srv.withSuccessHandler(function (saved) {
      xfAfterSave("visit", saved.id);
      if (!withEnquiry) {
        done();
        $("vp-modal-backdrop").classList.remove("show");
        showMsg("Visit saved.", "success");
        vpLoad();
        return;
      }
      vp.open = saved;
      srv.withSuccessHandler(function (r) {
        done();
        $("vp-modal-backdrop").classList.remove("show");
        showMsg("Saved, and enquiry " + r.leadNo + " made on the compressor desk.", "success");
        vpLoad();
      }).withFailureHandler(fail).createVisitEnquiry(saved.id);
    }).withFailureHandler(function (err) { done(); onServerError(err); }).saveVisit(input);
  }

  function vpDrawAreas(list) {
    $("vp-a-body").innerHTML = list.map(function (a, i) {
      return '<div class="vp-area-row" data-vp-area="' + i + '"><input value="' + escapeHtml(a.name) + '" aria-label="Area" />' +
        '<select aria-label="Local or Outstation">' + vpOpts(["Local", "Outstation"], a.type) + "</select>" +
        '<button type="button" class="btn btn-sm" data-vp-area-drop="' + i + '" aria-label="Remove">×</button></div>';
    }).join("");
  }
  function vpReadAreas() {
    return Array.prototype.map.call($("vp-a-body").querySelectorAll("[data-vp-area]"), function (row) {
      return { name: row.querySelector("input").value.trim(), type: row.querySelector("select").value };
    });
  }

    $("vp-eng").addEventListener("change", function () { vp.engineer = $("vp-eng").value; vpLoad(); });
    $("vp-mode").addEventListener("click", function (e) {
      var b = e.target.closest("[data-vp-mode]");
      if (b) { vp.mode = b.dataset.vpMode; vpLoad(); }
    });
    $("view-visits").addEventListener("click", function (e) {
      var nav = e.target.closest("[data-vp-nav]");
      if (nav) {
        var n = Number(nav.dataset.vpNav);
        var a = vp.anchor || vpToday();
        vp.anchor = !n ? vpToday() : vp.mode === "month" ? vpAdd(a.slice(0, 8) + "15", n * 30).slice(0, 8) + "01" : vpAdd(a, n * 7);
        vp.qaDate = "";

        return;
      }
      var add = e.target.closest("[data-vp-day]");

      var open = e.target.closest("[data-vp-open]");
      if (open) {
        var v = vp.data.visits.filter(function (x) { return x.id === open.dataset.vpOpen; })[0];
        if (v) vpDraw(v);
      }
    });
    $("btn-vp-add").addEventListener("click", function () {
      var d = vp.data;
      var input = { visitDate: $("vp-q-date").value, customerName: $("vp-q-cust").value.trim(), area: $("vp-q-area").value, purpose: $("vp-q-purpose").value };
      input.engineerEmail = !d.seeAll ? d.me : vp.engineer || $("vp-q-eng").value;
      if (!input.engineerEmail || !input.visitDate || !input.customerName) { showMsg("Pick the engineer, the date and the company.", "error"); return; }
      vp.qaDate = input.visitDate;
      srv.withSuccessHandler(function () {
        $("vp-q-cust").value = "";
        $("vp-q-cust").focus();
        showMsg("Added to the plan.", "success");
        vpLoad();
      }).withFailureHandler(onServerError).saveVisit(input);
    });
    $("btn-vp-copy").addEventListener("click", function () {
      srv.withSuccessHandler(function (r) {
        showMsg(r.copied ? r.copied + (r.copied === 1 ? " visit" : " visits") + " copied to this week." + (r.skipped ? " " + r.skipped + " already on the plan." : "")
          : "Last week’s visits are already on this week’s plan.", "success");
        vpLoad();
      }).withFailureHandler(onServerError).copyLastWeekVisits({ weekStart: vpRange().from, engineer: vp.engineer || "" });
    });
    $("vp-report").addEventListener("click", function (e) {
      if (!e.target.closest("#btn-vp-csv")) return;
      var r = vpRange();
      csvFile("Visits " + r.from + " to " + r.to + ".csv",
        ["Date", "Engineer", "Company", "Area", "Local / Outstation", "Purpose", "Status", "Person met", "Phone", "Industry", "Discussion",
          "Compressor in use", "Brand in use", "Capacity", "Age (years)", "Alternative considered", "Interest", "Requirement", "Timeline",
          "Potential value", "Next action", "Next action date", "Enquiry"],
        vp.data.visits.map(function (v) {
          return [v.visitDate, v.engineerName, v.customerName, v.area, v.areaType, v.purpose, v.status, v.contactMet, v.phone, v.industry, v.discussion,
            v.compType, v.brand, v.capacity, v.ageYears, v.considering, v.interest, v.requirement, v.timeline,
            v.potentialValue === "" ? "" : Number(v.potentialValue), v.nextAction, v.nextDate, v.leadNo];

    $("btn-vp-cancel").addEventListener("click", function () { $("vp-modal-backdrop").classList.remove("show"); });
    $("btn-vp-save").addEventListener("click", function () { vpSave(false); });
    $("btn-vp-enquiry").addEventListener("click", function () { vpSave(true); });
    $("btn-vp-delete").addEventListener("click", function () {
