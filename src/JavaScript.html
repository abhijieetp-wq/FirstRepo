  }

  function ebMoney(n) {
    if (n === "" || n === null || n === undefined || isNaN(Number(n))) return "";
    return "₹" + Math.round(Number(n)).toLocaleString("en-IN");
  }
  function ebDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ""));
    return m ? m[3] + "-" + m[2] + "-" + m[1] : "";
  }
  /** "24-10" this year, "24-10-25" otherwise: a card is narrow. */
  function ebShort(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ""));
    if (!m) return "";
    return m[3] + "-" + m[2] + (Number(m[1]) === new Date().getFullYear() ? "" : "-" + m[1].slice(2));
  }
  function ebInitials(name) {
    return String(name || "").split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join("") || "—";
  }
  function ebLabel(desk, key) {
    var d = eb[desk].data;
    if (!d) return key;
    if (key === d.closed.key) return d.closed.label;
    var s = d.stages.filter(function (x) { return x.key === key; })[0];
    return s ? s.label : key;
  }

  /** The board's own box, under the screen's search bar; made once. */
  function ebHost(desk) {
    var id = "eb-" + desk;
    if ($(id)) return $(id);
    var view = $("view-" + EB_DESKS[desk].view);
    var bar = view.querySelector(".search-bar");
    var host = document.createElement("div");
    host.id = id;
    host.className = "eb-host";
    bar.parentNode.insertBefore(host, bar.nextSibling);
    return host;
  }

  /** The table ERP 1 draws, hidden while the board is up. */
  function ebShowList(desk, on) {
    var view = $("view-" + EB_DESKS[desk].view);
    view.querySelectorAll(":scope > .card").forEach(function (c) { c.style.display = on ? "" : "none"; });
    ebHost(desk).style.display = on ? "none" : "";
    // The board has its own toolbar (search, owner, stage, lost); ERP 1's list keeps its own.
    var bar = view.querySelector(".search-bar");
    if (bar) bar.style.display = on ? "" : "none";
    if (desk === "compressor" && $("subtab-leads")) $("subtab-leads").parentNode.style.display = on ? "" : "none";
    if (desk === "compressor" && !on) $("pipeline-summary").style.display = "none";
    // ERP 2's heading for the board; ERP 1's words for its list.
    var p = view.querySelector(".page-head p");
    if (p) {
      if (!p.dataset.erp1) p.dataset.erp1 = p.textContent;
      p.textContent = on ? p.dataset.erp1 : EB_DESC[desk];
    }
    var add = $(desk === "spare" ? "btn-new-enquiry" : "btn-new-lead");
    if (add) add.textContent = desk === "spare" ? "+ Spare enquiry" : "+ Compressor enquiry";
  }

  /** Spare Sales: a Board / List switch at the head of the search bar. */
  function ebSpareInit() {
    if (!FACE_V2) return;
    var bar = $("view-enquiries").querySelector(".search-bar");
    if (!$("eb-switch-spare")) {
      var sw = document.createElement("div");
      sw.id = "eb-switch-spare";
      sw.className = "eb-switch";
      sw.innerHTML = '<button type="button" data-eb-mode="board">Board</button><button type="button" data-eb-mode="list">List</button>';
      bar.insertBefore(sw, bar.firstChild);
      sw.addEventListener("click", function (e) {
        var b = e.target.closest("[data-eb-mode]");
        if (!b) return;
        ebSetMode("spare", b.dataset.ebMode);
        ebSpareInit();
      });
    }
    var board = ebActive("spare");
    $("eb-switch-spare").querySelectorAll("[data-eb-mode]").forEach(function (b) {
      b.classList.toggle("on", (b.dataset.ebMode === "board") === board);
    });
    ebShowList("spare", !board);
    if (board) ebLoad("spare");
  }

  function ebLoad(desk) {
    var host = ebHost(desk);
    if (!eb[desk].data) host.innerHTML = '<div class="empty">Loading the board…</div>';
    srv.withSuccessHandler(function (d) {
      eb[desk].data = d;
      ebRender(desk);
    }).withFailureHandler(function (err) {
      host.innerHTML = '<div class="empty">' + escapeHtml(err && err.message ? err.message : String(err)) + "</div>";
    }).getEnquiryBoard({ stream: EB_DESKS[desk].stream });
  }

  // ---- ERP 2's board, as the 2.0 demo draws it: a toolbar, ten stage columns, cards with the
  // flag, the town, the document, the value, the follow-up and the owner; one card opens a
  // drawer from the right with the stages, the dropdowns, the follow-ups and the documents.
  var EB_DESC = {
    compressor: "Every compressor enquiry from first call to dispatch, on ERP 2’s one board of ten stages. Enquiry and Requirement are set by hand; " +
      "the rest move by themselves from quotations, orders and dispatch. In negotiation means it is with management.",
    spare: "Spare, AMC renewal and service enquiries from customers, engineers and the SDR list, on ERP 2’s one board of ten stages. " +
      "Enquiry and Requirement are set by hand; the rest move by themselves from quotations, orders and dispatch. In negotiation means it is with management."
  };
  var EB_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  /** ₹14.00 L from a lakh up, ₹58,200 below: what fits on a card. */
  function ebLakh(n) {
    if (n === "" || n === null || n === undefined || isNaN(Number(n))) return "";
    var v = Number(n);
    return v >= 100000 ? "₹" + (v / 100000).toFixed(2) + " L" : "₹" + Math.round(v).toLocaleString("en-IN");
  }
  function ebDay(d, year) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ""));
    return m ? Number(m[3]) + " " + EB_MONTHS[Number(m[2]) - 1] + (year ? " " + m[1] : "") : "";
  }
  function ebToday() {
    var t = new Date();
    return t.getFullYear() + "-" + ("0" + (t.getMonth() + 1)).slice(-2) + "-" + ("0" + t.getDate()).slice(-2);
  }
  function ebFlagTone(f) { return /Hot/.test(f) ? "bad" : f === "Cold" ? "acc" : "sig"; }
  function ebChip(text, tone, title) {
    return '<span class="eb-chip' + (tone ? " " + tone : "") + '"' + (title ? ' title="' + escapeHtml(title) + '"' : "") + ">" + escapeHtml(text) + "</span>";
  }
  function ebOpenRecord(c) { return c.stage !== "lost" && c.stage !== "dispatched"; }

  /** The toolbar, made once per desk so the search box keeps its focus while the board redraws. */
  function ebTools(desk) {
    var host = ebHost(desk);
    if (host.querySelector(".eb2-tools")) return;
    host.innerHTML = '<div class="eb2-tools">' +
      '<div class="eb2-seg" role="group" aria-label="Board or list"><button type="button" data-eb-view="board" aria-pressed="true">Board</button>' +
        '<button type="button" data-eb-view="list" aria-pressed="false">List</button></div>' +
      '<input type="search" class="eb2-search" data-eb-q="1" placeholder="Search number, customer, serial" aria-label="Search enquiries" />' +
      '<select class="eb-filter" data-eb-filter="owner" aria-label="Owner"></select>' +
      '<select class="eb-filter" data-eb-filter="stage" aria-label="Stage"></select>' +
      '<label class="eb2-chk"><input type="checkbox" data-eb-lost="1" /> <span class="eb2-lostn">Show lost</span></label>' +
      '<span class="eb2-legend">' + ebChip("set by hand") + ebChip("moves by itself", "auto") + ebChip("goes to the owner", "sig") + "</span>" +
      '<span class="eb2-rename-slot"></span></div>' +
      '<div class="eb-sum"></div><div class="eb2-body"></div>';
  }

  /** The cards the toolbar's search, owner and lost box leave. */
  function ebShown(desk) {
    var d = eb[desk].data;
    var q = String(eb[desk].q || "").trim().toLowerCase();
    var owner = eb[desk].owner || "";
    var me = String(d.me).toLowerCase();
    return d.cards.filter(function (c) {
      var who = String(c.ownerEmail).toLowerCase();
      if (owner === "__mine" && who !== me) return false;
      if (owner && owner !== "__mine" && who !== owner) return false;
      if (q) {
        var hay = [c.no, c.customerName, c.what, c.detail, c.place, c.contactName, c.quote && c.quote.quoteNo, c.order && c.order.orderNo,
          c.ownerName].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function ebRender(desk) {
    var d = eb[desk].data;
    var host = ebHost(desk);
    if (!d) return;
    ebTools(desk);
    var cards = ebShown(desk);
    var showLost = !!eb[desk].lost;
    var allCols = d.stages.concat(showLost ? [{ key: d.closed.key, label: d.closed.label, how: "closed" }] : []);
    var stage = eb[desk].stage || "";
    var cols = stage ? allCols.filter(function (c) { return c.key === stage; }) : allCols;
    var today = ebToday();
    var open = cards.filter(function (c) { return ebOpenRecord(c); });
    var openValue = open.reduce(function (s, c) { return s + (Number(c.value) || 0); }, 0);
    var late = open.filter(function (c) { return c.followUp && c.followUp < today; }).length;
    var month = today.slice(0, 7);
    var won = cards.filter(function (c) {
      return c.order && String(c.order.date || "").slice(0, 7) === month && ["won", "procurement", "dispatched"].indexOf(c.stage) !== -1;
    });
    var wonValue = won.reduce(function (s, c) { return s + (Number(c.value) || 0); }, 0);
    var lostCount = cards.filter(function (c) { return c.stage === "lost"; }).length;

    // The toolbar's moving parts.
    var tools = host.querySelector(".eb2-tools");
    var people = {};
    (d.owners || []).forEach(function (p) { people[String(p.email).toLowerCase()] = p.name; });
    d.cards.forEach(function (c) { if (c.ownerEmail && !people[String(c.ownerEmail).toLowerCase()]) people[String(c.ownerEmail).toLowerCase()] = c.ownerName || c.ownerEmail; });
    var ownerSel = tools.querySelector('[data-eb-filter="owner"]');
    ownerSel.innerHTML = '<option value="">Everyone</option><option value="__mine">Mine</option>' + Object.keys(people).sort(function (a, b) {
      return String(people[a]).localeCompare(String(people[b]));
    }).map(function (k) { return '<option value="' + escapeHtml(k) + '">' + escapeHtml(people[k]) + "</option>"; }).join("");
    ownerSel.value = eb[desk].owner || "";
    var stageSel = tools.querySelector('[data-eb-filter="stage"]');
    stageSel.innerHTML = '<option value="">All stages</option>' + d.stages.concat([{ key: d.closed.key, label: d.closed.label }]).map(function (c) {
      return '<option value="' + escapeHtml(c.key) + '">' + escapeHtml(c.label) + "</option>";
    }).join("");
    stageSel.value = stage;
    tools.querySelector("[data-eb-lost]").checked = showLost;
    var asList = ebView(desk) === "list";
    tools.querySelectorAll("[data-eb-view]").forEach(function (b) { b.setAttribute("aria-pressed", String((b.dataset.ebView === "list") === asList)); });
    tools.querySelector(".eb2-lostn").textContent = "Show lost (" + lostCount + ")";
    tools.querySelector(".eb2-rename-slot").innerHTML = d.canRename
      ? '<button type="button" class="btn btn-sm" data-eb-rename="1">' + (eb.renaming ? "Done renaming" : "Rename stages") + "</button>" : "";
    host.querySelector(".eb-sum").innerHTML = "<b>" + open.length + "</b> open · <b>" + escapeHtml(ebLakh(openValue) || "₹0") + "</b> in play · <b>" +
      won.length + "</b> won this month" + (wonValue ? " (" + escapeHtml(ebMoney(wonValue)) + ")" : "") +
      (late ? ' · <span class="eb-late">' + late + " follow-ups past their date</span>" : "");

    var html = "";
    if (eb.renaming && d.canRename) {
      html += '<div class="eb-rename">' + d.stages.concat([d.closed]).map(function (s, i) {
        return '<label class="field"><span>' + (s.key === d.closed.key ? "Closed" : (i + 1) + " · " + (s.how === "hand" ? "set by hand" : "moves by itself")) +
          '</span><input data-eb-name="' + escapeHtml(s.key) + '" value="' + escapeHtml(s.label) + '" maxlength="40" /></label>';
      }).join("") + '<p class="eb-note">Renaming changes the board on both desks. Stages cannot be added: the ones that move by themselves follow the quotations, orders and dispatch.</p></div>';
    }
    if (asList) {
      host.querySelector(".eb2-body").innerHTML = html + ebTable(desk, cards, cols, today, showLost);
      return;
    }
    html += '<div class="eb2-board' + (stage ? " one" : "") + '">' + cols.map(function (s) {
      var here = cards.filter(function (c) { return c.stage === s.key; });
      var total = here.reduce(function (n, c) { return n + (Number(c.value) || 0); }, 0);
      var rule = s.key === "negotiation" ? ebChip("goes to the owner", "sig", "With management for a decision")
        : s.how === "hand" ? ebChip("set by hand")
        : s.how === "closed" ? ebChip("reason needed", "bad")
        : ebChip("moves by itself", "auto", s.when ? "Moves here when " + s.when : "");
      return '<section class="eb2-col' + (s.key === "negotiation" ? " neg" : "") + (s.how === "closed" ? " closed" : "") + '" data-eb-stage="' + escapeHtml(s.key) + '">' +
        '<h3><span class="eb-name">' + escapeHtml(s.label) + '</span><span class="eb-count">' + here.length + "</span></h3>" +
        '<div class="eb2-rule">' + rule + "</div>" +
        '<div class="eb2-tot eb-total">' + escapeHtml(ebLakh(total) || "₹0") + "</div>" +
        (here.length ? here.map(function (c) { return ebCard(c, today, desk); }).join("") : '<div class="eb2-empty">Nothing here.</div>') + "</section>";
    }).join("") + "</div>" +
      '<p class="eb-note">Dispatched and closed cards stay for ' + d.recentDays + " days." + (showLost ? "" : " Tick “Show lost” to see the closed ones.") + "</p>";
    host.querySelector(".eb2-body").innerHTML = html;
    xfCards(host);
  }

  /** The same cards as a table: one row each, in stage order, the row opening the same drawer. */
  function ebTable(desk, cards, cols, today, showLost) {
    var order = {};
    cols.forEach(function (s, i) { order[s.key] = i; });
    var rows = cards.filter(function (c) { return order[c.stage] !== undefined; }).sort(function (a, b) {
      return (order[a.stage] - order[b.stage]) || String(a.followUp || "9").localeCompare(String(b.followUp || "9")) ||
        String(b.date || "").localeCompare(String(a.date || ""));
    });
    var kindWord = { enquiry: "Enquiry", lead: "Lead", opportunity: "Opportunity", quotation: "Quotation only" };
    var body = rows.map(function (c) {
      var doc = c.order ? c.order.orderNo + " · " + c.order.status
        : c.quote ? c.quote.quoteNo + (c.quote.revision && c.quote.revision !== "R0" ? " " + c.quote.revision : "") + " · " +
          (c.quote.status === "Submitted" ? "Sent" : c.quote.status) : "";
      var late = c.followUp && c.followUp < today && ebOpenRecord(c);
      var what = c.kind === "lead" || c.kind === "opportunity" ? [c.detail || c.what, c.source].filter(Boolean).join(" · ") : (c.what || c.detail || c.source || "");
      var stageChip = c.stage === "negotiation" ? ebChip(ebLabel(desk, c.stage), "sig") : c.stage === "lost" ? ebChip(ebLabel(desk, c.stage), "bad") : ebChip(ebLabel(desk, c.stage), "auto");
      return '<tr class="qv-row" data-eb-card="' + escapeHtml(c.ref) + '">' +
        '<td><span class="mono">' + escapeHtml(c.no || "—") + '</span><br><span class="eb2-kind">' + escapeHtml(kindWord[c.kind] || c.kind || "") + "</span></td>" +
        "<td>" + escapeHtml(ebDay(c.date)) + "</td>" +
        "<td><b>" + escapeHtml(c.customerName || "—") + "</b>" + (c.place ? '<br><span class="eb2-kind">' + escapeHtml(c.place) + "</span>" : "") + "</td>" +
        '<td class="qv-item">' + escapeHtml(what) + (c.stage === "lost" && c.closedWhy ? '<br><span class="eb-why">' + escapeHtml(c.closedWhy) + "</span>" : "") + "</td>" +
        "<td>" + stageChip + (c.escalation ? " " + ebChip("Escalated", "esc", "With " + c.escalation.toName) : "") + "</td>" +
        "<td>" + (c.flag ? ebChip(c.flag, ebFlagTone(c.flag)) : "") + "</td>" +
        '<td class="num"><b>' + escapeHtml(ebLakh(c.value) || "₹0") + "</b></td>" +
        "<td" + (late ? ' class="qv-late"' : "") + ">" + (c.followUp && ebOpenRecord(c) ? escapeHtml(ebDay(c.followUp)) : "—") + "</td>" +
        "<td>" + escapeHtml(c.ownerName || "—") + "</td>" +
        '<td><span class="mono eb2-doc">' + escapeHtml(doc || "—") + "</span></td></tr>";
    }).join("");
    return '<div class="qv-table eb2-list"><table><thead><tr><th>Number</th><th>Date</th><th>Customer</th><th>What they need</th><th>Stage</th>' +
      '<th>Flag</th><th class="num">Value</th><th>Follow-up</th><th>Owner</th><th>Quote / order</th></tr></thead><tbody>' +
      (body || '<tr><td colspan="10" class="eb2-empty">Nothing matches.</td></tr>') + "</tbody></table></div>" +
      '<p class="eb-note">' + rows.length + " shown. Click a row to open it." + (showLost ? "" : " Tick “Show lost” to see the closed ones.") + "</p>";
  }

  function ebCard(c, today, desk) {
    var doc = c.order ? c.order.orderNo + " · " + c.order.status + (c.order.creditHold ? " · credit hold" : "")
      : c.quote ? c.quote.quoteNo + (c.quote.revision && c.quote.revision !== "R0" ? " " + c.quote.revision : "") +
        (c.quote.sentDate ? " · Sent " + ebDay(c.quote.sentDate) : " · " + (c.quote.status === "Submitted" ? "Sent" : c.quote.status))
      : "";
    var late = c.followUp && c.followUp < today && ebOpenRecord(c);
    var sub = [c.place, c.kind === "lead" || c.kind === "opportunity" ? c.source : (c.what || c.source)].filter(Boolean).join(" · ");
    var chips = (c.kind === "quotation" ? ebChip("No enquiry") : "") +
      (c.escalation ? ebChip("Escalated", "esc", "With " + c.escalation.toName + " for a decision") : "") +
      (c.areaType === "Outstation" ? ebChip(c.area || "Outstation", "warn", "Outstation") : "") +
      (c.type && c.type !== "Spares" ? ebChip(c.type, "type") : "") +
      (c.urgency && c.urgency !== "Normal" ? ebChip(c.urgency, c.urgency === "Breakdown" ? "bad" : "warn") : "");
    return '<button type="button" class="eb-card eb2-card' + (desk === "spare" ? " d-spare" : "") + (c.escalation ? " esc" : "") +
      (c.order && c.order.creditHold ? " hold" : "") + '" data-eb-card="' + escapeHtml(c.ref) + '">' +
      '<span class="eb2-t"><span class="mono">' + escapeHtml(c.no || "—") + "</span>" + (c.flag ? ebChip(c.flag, ebFlagTone(c.flag)) : "") + "</span>" +
      '<span class="eb-cust">' + escapeHtml(c.customerName || "—") + "</span>" +
      (sub ? '<span class="eb-what">' + escapeHtml(sub) + "</span>" : "") +
      (chips ? '<span class="eb2-chips">' + chips + "</span>" : "") +
      (c.stage === "lost" && c.closedWhy ? '<span class="eb-why">' + escapeHtml(c.closedWhy) + "</span>" : "") +
      (doc ? '<span class="eb-doc">' + escapeHtml(doc) + "</span>" : "") +
      '<span class="eb2-foot"><b>' + escapeHtml(ebLakh(c.value) || "₹0") + "</b>" +
        (c.followUp && ebOpenRecord(c) ? '<span class="eb-fu' + (late ? " late" : "") + '" title="' + escapeHtml(c.followUpLabel + " " + ebDate(c.followUp)) + '">' +
          (c.followUpLabel === "Expected" ? "Due " : "FU ") + escapeHtml(ebDay(c.followUp)) + "</span>" : "") +
        '<span class="eb-av" title="' + escapeHtml(c.ownerName || "") + '">' + escapeHtml(ebInitials(c.ownerName)) + "</span></span>" +
      "</button>";
  }

  // One handler per board: the toolbar, the cards, the rename boxes.
  ["spare", "compressor"].forEach(function (desk) {
    if (!FACE_V2) return;
    var host = ebHost(desk);
    host.style.display = "none";
    host.addEventListener("input", function (e) {
      if (!e.target.closest("[data-eb-q]")) return;
      eb[desk].q = e.target.value;
      ebRender(desk);
    });
    host.addEventListener("change", function (e) {
      var f = e.target.closest("[data-eb-filter]");
      if (f) { eb[desk][f.dataset.ebFilter] = f.value; ebRender(desk); return; }
      if (e.target.closest("[data-eb-lost]")) { eb[desk].lost = e.target.checked; ebRender(desk); return; }
      var box = e.target.closest("[data-eb-name]");
      if (!box) return;
      srv.withSuccessHandler(function (names) {
        names = names || {};
        ["spare", "compressor"].forEach(function (k) {
          var dd = eb[k].data;
          if (!dd) return;
          dd.stages.forEach(function (s) { if (names[s.key]) s.label = names[s.key].label; });
          if (names[dd.closed.key]) dd.closed.label = names[dd.closed.key].label;
        });
        ebRender(desk);
        showMsg("Stage renamed.", "success");
      }).withFailureHandler(function (err) { ebRender(desk); onServerError(err); }).saveBoardStageName(box.dataset.ebName, box.value);
    });
    host.addEventListener("click", function (e) {
      var card = e.target.closest("[data-eb-card]");
      if (card) { ebOpenCard(desk, card.dataset.ebCard); return; }
      if (e.target.closest("[data-eb-rename]")) { eb.renaming = !eb.renaming; ebRender(desk); return; }
      var v = e.target.closest("[data-eb-view]");
      if (v) { ebSetView(desk, v.dataset.ebView); ebRender(desk); }
    });
  });

  // ---- one card, opened: a drawer from the right ----
  function ebModal() {
    if ($("eb-modal-backdrop")) return $("eb-modal-backdrop");
    var back = document.createElement("div");
    back.className = "eb2-ov";
    back.id = "eb-modal-backdrop";
    back.innerHTML = '<aside class="eb2-drawer" role="dialog" aria-modal="true" aria-labelledby="eb-m-title"><header>' +
      '<div class="eb2-dtop"><div class="eb2-dhead"><span class="eb2-eyebrow" id="eb-m-kind"></span><h2 id="eb-m-title"></h2><div class="eb2-chips" id="eb-m-chips"></div></div>' +
        '<div class="eb2-acts" id="eb-m-acts"></div>' +
        '<button type="button" class="eb2-x" id="eb-m-close" aria-label="Close">×</button></div>' +
      '<div id="eb-m-steps"></div><div class="eb2-tabs" role="tablist" id="eb-m-tabs"></div></header>' +
      '<div class="eb2-dbody" id="eb-m-body"></div></aside>';
    document.body.appendChild(back);
    $("eb-m-close").addEventListener("click", ebCloseCard);
    back.addEventListener("click", function (e) {
      if (e.target === back) { ebCloseCard(); return; }
      var tab = e.target.closest("[data-eb-tab]");
      if (tab) { eb.tab = tab.dataset.ebTab; ebRedraw(); return; }
      var go = e.target.closest("[data-eb-go]");
      if (go) { ebGo(go.dataset.ebGo, go.dataset.id); return; }
      var c0 = ebOpenCardData();
      if (!c0) return;
      var d0 = eb[eb.open.desk].data;
      if (e.target.closest("[data-eb-esc-open]")) { if (c0.escalation) escShow(c0.escalation); return; }
      if (e.target.closest("[data-eb-escalate]")) { escRaise(c0, d0.escalateTo); return; }
      if (e.target.closest("[data-eb-task]")) { tkNew({ kind: c0.kind, id: c0.id, label: (c0.no ? c0.no + " · " : "") + (c0.customerName || "") }); return; }
      var act = e.target.closest("[data-eb-act]");
      if (act) { ebAct(act.dataset.ebAct, act); return; }
      var mv = e.target.closest("[data-eb-move]");
      if (mv) ebMove(mv.dataset.ebMove);
    });
    back.addEventListener("change", function (e) {
      var f = e.target.closest("[data-eb-field]");
      if (f) ebSetField(f.dataset.ebField, f.value, f);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && back.classList.contains("show") && !document.querySelector(".modal-backdrop.show")) ebCloseCard();
    });
    return back;
  }
  function ebCloseCard() { if ($("eb-modal-backdrop")) $("eb-modal-backdrop").classList.remove("show"); eb.open = null; }
  function ebOpenCardData() {
    if (!eb.open) return null;
    var d = eb[eb.open.desk].data;
    return d ? d.cards.filter(function (x) { return x.ref === eb.open.ref; })[0] || null : null;
  }
  function ebRedraw() { var c = ebOpenCardData(); if (c) ebDrawCard(eb.open.desk, c); }
  /** A card the server sent back, in place on the board and in the drawer. */
  function ebPut(desk, card) {
    var d = eb[desk].data;
    if (!d || !card) return;
    d.cards = d.cards.map(function (c) { return c.ref === card.ref ? card : c; });
    ebRender(desk);
    if (eb.open && eb.open.ref === card.ref) ebDrawCard(desk, card);
  }

  function ebOpenCard(desk, ref) {
    var c = eb[desk].data.cards.filter(function (x) { return x.ref === ref; })[0];
    if (!c) return;
    eb.open = { desk: desk, ref: ref };
    eb.tab = "overview";
    ebModal().classList.add("show");
    ebDrawCard(desk, c);
  }

  var EB_KIND_LONG = { enquiry: "Spare enquiry", lead: "Compressor enquiry", opportunity: "Opportunity", quotation: "Quotation" };

  function ebDrawCard(desk, c) {
    var d = eb[desk].data;
    var open = ebOpenRecord(c);
    var edit = d.canMove && open && c.kind !== "quotation";
    var stageName = c.stage === "lost" ? d.closed.label : ebLabel(desk, c.stage);
    $("eb-m-kind").innerHTML = escapeHtml(EB_KIND_LONG[c.kind] || "Enquiry") + (c.no ? ' · <span class="mono">' + escapeHtml(c.no) + "</span>" : "");
    $("eb-m-title").textContent = c.customerName || "—";
    $("eb-m-chips").innerHTML = ebChip(stageName, c.stage === "lost" ? "bad" : c.stage === "negotiation" ? "sig" : "acc") +
      (c.flag ? ebChip(c.flag, ebFlagTone(c.flag)) : "") + (c.escalation ? ebChip("Escalated to " + c.escalation.toName, "sig") : "");

    var acts = "";
    if (open) {
      if (edit) acts += '<button type="button" class="btn btn-sm" data-eb-act="note">Add follow-up</button>';
      if (c.quote) acts += '<button type="button" class="btn btn-sm" data-eb-go="quotation" data-id="' + escapeHtml(c.quote.id) + '">Open quotation</button>';
      else if ((c.kind === "enquiry" || c.kind === "opportunity") && canEditQuotes()) acts += '<button type="button" class="btn btn-sm btn-primary" data-eb-act="quote">Prepare quotation</button>';
      else if (c.kind === "lead") acts += '<button type="button" class="btn btn-sm btn-primary" data-eb-go="lead" data-id="' + escapeHtml(c.id) + '" title="A lead is quoted once it is an opportunity">Open lead to quote</button>';
      if (!c.escalation && (d.escalateTo || []).length) acts += '<button type="button" class="btn btn-sm" data-eb-escalate="1">Escalate to owner</button>';
      acts += '<button type="button" class="btn btn-sm" data-eb-task="1">+ Task</button>';
      if (edit) acts += '<button type="button" class="btn btn-sm eb2-danger" data-eb-act="lost">Mark lost</button>';
    } else {
      acts += '<button type="button" class="btn btn-sm" data-eb-task="1">+ Task</button>';
    }
    $("eb-m-acts").innerHTML = acts;

    var at = d.stages.map(function (s) { return s.key; }).indexOf(c.stage);
    $("eb-m-steps").innerHTML = c.stage === "lost"
      ? '<div class="eb-lost">' + escapeHtml(d.closed.label) + ": " + escapeHtml(c.closedWhy || "closed") + "</div>"
      : '<ol class="eb-steps">' + d.stages.map(function (s, i) {
          return '<li class="' + (i < at ? "done" : i === at ? "now" + (s.key === "negotiation" ? " neg" : "") : "") + '"><i></i><span>' + escapeHtml(s.label) + "</span></li>";
        }).join("") + "</ol>";
    var tab = eb.tab || "overview";
    $("eb-m-tabs").innerHTML = [["overview", "Overview"], ["log", "Follow-ups (" + (c.logCount || 0) + ")"], ["docs", "Quotations and orders"]].map(function (t) {
      return '<button type="button" role="tab" data-eb-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + escapeHtml(t[1]) + "</button>";
    }).join("");

    var body = "";
    if (tab === "overview") body = ebOverview(desk, c, d, edit);
    else if (tab === "log") body = ebLogTab(c, edit);
    else body = ebDocs(c, true);
    $("eb-m-body").innerHTML = body;
    if (tab === "log") ebLoadLog(c);
  }

  function ebOverview(desk, c, d, edit) {
    var h = "";
    var x = c.escalation;
    if (x) {
      h += '<div class="eb-esc"><div><b>With ' + escapeHtml(x.toName) + " for a decision</b>" +
        '<span class="sdc-muted"> · escalated by ' + escapeHtml(x.raisedByName) + " on " + escapeHtml(ebDate(x.raisedDay)) + ", " +
        x.waitingDays + (x.waitingDays === 1 ? " day" : " days") + "</span></div><p>" + escapeHtml(x.note) + "</p>" +
        '<button type="button" class="btn btn-sm' + (x.outcomes.length ? " btn-primary" : "") + '" data-eb-esc-open="1">' + (x.outcomes.length ? "Answer…" : "Open") + "</button></div>";
    }
    if ((c.escalations || []).length) {
      h += '<div class="eb-esc-hist"><div class="sd-h">Escalated before</div>' + c.escalations.map(function (e) {
        return '<div class="eb-esc-row"><span class="sdc-muted">' + escapeHtml(ebDate(e.raisedDay)) + "</span> " + escapeHtml(e.raisedByName + " → " + e.toName + ": " + e.note) +
          '<div><span class="badge ' + (ESC_BADGE[e.outcome] || "badge-draft") + '">' + escapeHtml(e.outcome) + "</span> " +
          escapeHtml((e.decidedByName ? e.decidedByName : "") + (e.decisionNote ? ": " + e.decisionNote : "")) + "</div></div>";
      }).join("") + "</div>";
    }
    var moves = d.canMove ? c.moves : [];
    if (c.stage === "enquiry" || c.stage === "requirement") {
      h += '<div class="eb2-callout acc"><span><b>This stage is set by hand.</b> ' + (c.stage === "enquiry" ? "Move it on when you know what the customer needs."
        : "The next stage starts by itself once a quotation is prepared.") + "</span>" +
        (moves.length ? "<div>" + moves.map(function (k) {
          return '<button type="button" class="btn btn-sm ' + (k === "requirement" ? "btn-primary" : "") + '" data-eb-move="' + escapeHtml(k) + '">' +
            (k === "enquiry" ? "Back to " : "Move to ") + escapeHtml(ebLabel(desk, k)) + "</button>";
        }).join(" ") + "</div>" : "") + "</div>";
    } else if (moves.length) {
      h += '<div class="eb2-callout' + (c.stage === "negotiation" ? "" : " acc") + '"><span><b>' + (c.stage === "sent" ? "Is the customer discussing the offer?"
        : "Discussion over, waiting on the customer?") + "</b> " + (c.stage === "sent" ? "In negotiation means it is with management." : "") + "</span><div>" + moves.map(function (k) {
          return '<button type="button" class="btn btn-sm btn-primary" data-eb-move="' + escapeHtml(k) + '">' + (k === "negotiation" ? "Move to " + escapeHtml(ebLabel(desk, k)) + "…"
            : "Back to " + escapeHtml(ebLabel(desk, k))) + "</button>";
        }).join(" ") + "</div></div>";
    }
    var fact = function (k, v) { return v ? "<dt>" + escapeHtml(k) + "</dt><dd>" + v + "</dd>" : ""; };
    var lead = c.kind === "lead" || c.kind === "opportunity";
    h += '<div class="eb2-split"><dl class="eb-facts">' +
      fact("Customer", "<b>" + escapeHtml(c.customerName || "—") + "</b>" + (c.place ? " · " + escapeHtml(c.place) : "")) +
      fact("Contact", c.contactName || c.contactPhone ? escapeHtml(c.contactName || "") + (c.contactName && c.contactPhone ? " · " : "") + '<span class="mono">' + escapeHtml(c.contactPhone || "") + "</span>" : "") +
      fact("Source", escapeHtml(c.source || "")) +
      fact(lead ? "Requirement" : "Needs", escapeHtml(c.detail || (lead ? c.what : "") || "")) +
      fact("Machine", !lead && c.what && c.what !== c.detail ? escapeHtml(c.what + (c.urgency && c.urgency !== "Normal" ? " · " + c.urgency : "")) : "") +
      fact("Quotation for", c.type && c.type !== "Spares" ? escapeHtml(c.type) : "") +
      fact("Area", c.area ? escapeHtml(c.area + " · " + c.areaType) : "") +
      fact("Value", '<span class="mono">' + escapeHtml(ebLakh(c.value) || "₹0") + "</span>") +
      fact("Owner", escapeHtml(c.ownerName || "")) +
      fact("Received", escapeHtml(ebDay(c.date, true))) +
      fact("Quotation", c.quote ? escapeHtml(c.quote.quoteNo + " · " + (c.quote.status === "Submitted" ? "Sent" : c.quote.status) +
        (c.quote.sentDate ? " on " + ebDate(c.quote.sentDate) : "")) : "") +
      fact("Order", c.order ? escapeHtml(c.order.orderNo + " · " + c.order.status + (c.order.poNo ? " · PO " + c.order.poNo : "") +
        (c.order.date ? " · " + ebDate(c.order.date) : "")) : "") +
      fact("Dispatch", c.dispatch ? escapeHtml(c.dispatch.dispatchNo + " · " + c.dispatch.status + " · " + ebDate(c.dispatch.date)) : "") +
      fact("Transporter", c.dispatch && (c.dispatch.transporter || c.dispatch.lrNumber) ? escapeHtml([c.dispatch.transporter, c.dispatch.vehicleNo,
        c.dispatch.lrNumber ? "LR " + c.dispatch.lrNumber + (c.dispatch.lrDate ? " of " + ebDate(c.dispatch.lrDate) : "") : ""].filter(Boolean).join(" · ")) : "") +
      fact("Invoice", c.invoice ? escapeHtml(c.invoice.invoiceNo + (c.invoice.date ? " · " + ebDate(c.invoice.date) : "")) : "") +
      "</dl>";
    // ERP 2's dropdowns: the next follow-up, the flag, the owner — each saved as it changes.
    var dis = function (on) { return on ? "" : " disabled"; };
    var noRec = c.kind === "quotation";
    h += '<div class="eb2-fields">' +
      '<label class="eb2-f"><span>' + escapeHtml(c.followUpLabel === "Expected" ? "Next follow-up" : "Next follow-up") + '</span><input type="date" id="eb-d-fu" data-eb-field="followUp" value="' +
        escapeHtml(c.followUpLabel === "Expected" ? "" : c.followUp || "") + '"' + dis(edit && !noRec) + " />" +
        (c.followUpLabel === "Expected" && c.followUp ? '<small class="sdc-muted">Parts expected ' + escapeHtml(ebDay(c.followUp, true)) + "</small>" : "") + "</label>" +
      '<label class="eb2-f"><span>Flag</span><select id="eb-d-flag" data-eb-field="flag"' + dis(edit && !noRec) + '><option value="">—</option>' +
        (d.flags || []).map(function (f) { return '<option value="' + escapeHtml(f) + '"' + (f === c.flag ? " selected" : "") + ">" + escapeHtml(f) + "</option>"; }).join("") + "</select></label>" +
      '<label class="eb2-f"><span>Owner</span><select id="eb-d-owner" data-eb-field="owner"' + dis(d.canOwner && ebOpenRecord(c) && !noRec) + ">" +
        ((d.owners || []).some(function (p) { return String(p.email).toLowerCase() === String(c.ownerEmail).toLowerCase(); }) ? "" :
          '<option value="' + escapeHtml(c.ownerEmail || "") + '" selected>' + escapeHtml(c.ownerName || "Unassigned") + "</option>") +
        (d.owners || []).map(function (p) {
          return '<option value="' + escapeHtml(p.email) + '"' + (String(p.email).toLowerCase() === String(c.ownerEmail).toLowerCase() ? " selected" : "") + ">" + escapeHtml(p.name) + "</option>";
        }).join("") + "</select></label></div></div>";
    h += '<div class="eb2-subh">Linked records</div>' + ebDocs(c, false);
    return h;
  }

  /** The record behind the card and its quotations, order, dispatch and invoice, each opening where ERP 1 works it. */
  function ebDocs(c, full) {
    var rows = [];
    var row = function (kind, id, title, sub, right) {
      return '<button type="button" class="eb2-lrow"' + (kind ? ' data-eb-go="' + kind + '" data-id="' + escapeHtml(id) + '"' : " disabled") + '><span class="eb2-lt mono">' + escapeHtml(title) +
        '</span><span class="eb2-ls">' + escapeHtml(sub) + '</span><span class="eb2-lr">' + right + "</span></button>";
    };
    if (full || c.kind !== "quotation") {
      if (c.kind === "enquiry") rows.push(row("enquiry", c.id, c.no || "Enquiry", "Spare enquiry · " + ebDay(c.date, true), ebChip("Open")));
      if (c.kind === "lead") rows.push(row("lead", c.id, c.no || "Lead", "Compressor lead · " + ebDay(c.date, true), ebChip("Open")));
      if (c.opportunityId) rows.push(row("opportunity", c.opportunityId, "Opportunity", "From the lead", ebChip("Open")));
      if (c.kind === "opportunity") rows.push(row("opportunity", c.id, c.no || "Opportunity", ebDay(c.date, true), ebChip("Open")));
    }
    if (c.quote) rows.push(row("quotation", c.quote.id, c.quote.quoteNo + (c.quote.revision && c.quote.revision !== "R0" ? " " + c.quote.revision : ""),
      ebDay(c.quote.date, true) + (c.quoteCount > 1 ? " · newest of " + c.quoteCount : ""),
      ebChip(c.quote.status === "Submitted" ? "Sent" : c.quote.status, c.quote.status === "Won" ? "acc" : "") + '<br><span class="mono">' + escapeHtml(ebLakh(c.value)) + "</span>"));
    if (c.order) rows.push(row("order", c.order.id, c.order.orderNo, "Order" + (c.order.poNo ? " · PO " + c.order.poNo : "") + (c.order.date ? " · " + ebDay(c.order.date) : ""),
      ebChip(c.order.status, c.order.creditHold ? "bad" : "acc")));
    if (c.dispatch) rows.push(row("", "", c.dispatch.dispatchNo, "Dispatched " + ebDay(c.dispatch.date) + (c.dispatch.transporter ? " · " + c.dispatch.transporter : ""),
      c.invoice ? ebChip("Invoiced", "acc") : ebChip("Not invoiced", "sig")));
    if (!c.quote) rows.push('<p class="eb-note">No quotation yet.' + (ebOpenRecord(c) && canEditQuotes() ? " Use Prepare quotation above." : "") + "</p>");
    return '<div class="eb2-lrows">' + rows.join("") + "</div>";
  }

  function ebLogTab(c, edit) {
    var next = (function () { var t = new Date(); t.setDate(t.getDate() + 2); return t.getFullYear() + "-" + ("0" + (t.getMonth() + 1)).slice(-2) + "-" + ("0" + t.getDate()).slice(-2); })();
    return (edit ? '<div class="eb2-noteform"><label class="eb2-f"><span>What happened</span><textarea id="eb-n-text" rows="3" placeholder="Called, visited, sent the quotation again…"></textarea></label>' +
        '<div class="eb2-noterow"><label class="eb2-f"><span>How</span><select id="eb-n-mode">' + ["Call", "Visit", "WhatsApp", "E-mail"].map(function (m) { return "<option>" + m + "</option>"; }).join("") + "</select></label>" +
        '<label class="eb2-f"><span>Next follow-up</span><input type="date" id="eb-n-next" value="' + next + '" /></label>' +
        '<button type="button" class="btn btn-primary" id="btn-eb-note" data-eb-act="note-save">Save follow-up</button></div></div>' : "") +
      '<div class="eb2-timeline" id="eb-log"><p class="eb-note">Loading…</p></div>';
  }

  function ebLoadLog(c) {
    var ref = c.ref;
    srv.withSuccessHandler(function (log) {
      if (!eb.open || eb.open.ref !== ref || !$("eb-log")) return;
      $("eb-log").innerHTML = (log || []).map(function (e) {
        return '<div class="eb2-tl"><span class="eb-av">' + escapeHtml(ebInitials(e.by)) + '</span><div><div class="eb2-meta"><b>' + escapeHtml(e.by) + "</b><span>" + escapeHtml(ebDay(e.at, true)) + "</span>" +
          (e.mode ? ebChip(e.mode) : "") + (e.next ? '<span class="sdc-muted">next ' + escapeHtml(ebDay(e.next)) + "</span>" : "") + "</div><p>" + escapeHtml(e.text) + "</p></div></div>";
      }).join("") + '<div class="eb2-tl"><span class="eb-av">+</span><div><div class="eb2-meta"><b>' + escapeHtml(c.ownerName || "") + "</b><span>" + escapeHtml(ebDay(c.date, true)) + "</span></div><p>" +
        escapeHtml((c.kind === "quotation" ? "Quotation prepared" : "Enquiry received") + (c.detail ? ": " + c.detail : "")) + "</p></div></div>";
    }).withFailureHandler(function (err) { if ($("eb-log")) $("eb-log").innerHTML = '<p class="eb-note">' + escapeHtml(err && err.message ? err.message : String(err)) + "</p>"; })
      .getBoardCardLog(ref);
  }

  function ebSetField(field, value, el) {
    var o = eb.open;
    if (!o) return;
    srv.withSuccessHandler(function (card) {
      ebPut(o.desk, card);
      showMsg(field === "flag" ? "Flag saved." : field === "owner" ? "Owner changed." : "Next follow-up saved.", "success");
    }).withFailureHandler(function (err) { ebRedraw(); onServerError(err); }).setBoardCardDetail({ ref: o.ref, field: field, value: value });
  }

  function ebAct(what) {
    var o = eb.open;
    var c = ebOpenCardData();
    if (!o || !c) return;
    if (what === "note") {
      eb.tab = "log";
      ebDrawCard(o.desk, c);
      if ($("eb-n-text")) $("eb-n-text").focus();
    } else if (what === "note-save") {
      var text = $("eb-n-text").value.trim();
      if (!text) { showMsg("Write what happened first.", "error"); $("eb-n-text").focus(); return; }
      var done = busyButton("btn-eb-note", "Saving…");
      srv.withSuccessHandler(function (r) {
        done();
        ebPut(o.desk, r.card);
        showMsg("Follow-up saved.", "success");
      }).withFailureHandler(function (err) { done(); onServerError(err); })
        .addBoardFollowUp({ ref: o.ref, mode: $("eb-n-mode").value, text: text, nextDate: $("eb-n-next").value });
    } else if (what === "quote") {
      var finish = function () { /* the quotation builder opens */ };
      ebCloseCard();
      if (c.kind === "opportunity") { quoteFromOpportunity(c.id, finish); return; }
      quoteFromEnquiry({ id: c.id, enquiryNo: c.no }, finish);
    } else if (what === "lost") {
      ebLostAsk(o, c);
    }
  }

  /** Mark lost: why, from the desk's list, and a note. */
  function ebLostAsk(o, c) {
    var d = eb[o.desk].data;
    if (!$("eb-lost-backdrop")) {
      var m = document.createElement("div");
      m.className = "modal-backdrop modal-stacked";
      m.id = "eb-lost-backdrop";
      m.innerHTML = '<div class="modal" style="max-width:520px;"><h3 id="eb-l-title">Mark as lost</h3><p class="tk-m-sub">It leaves the board’s open stages and shows under “Show lost”, with the reason.</p>' +
        '<div class="field"><label for="eb-l-reason">Why was it lost? *</label><select id="eb-l-reason"></select></div>' +
        '<div class="field" style="margin-top:12px;"><label for="eb-l-note">Notes</label><textarea id="eb-l-note" rows="2" placeholder="e.g. Went with a local supplier at 8% less"></textarea></div>' +
        '<div class="amc-m-foot"><span style="flex:1"></span><button type="button" class="btn" id="btn-eb-l-cancel">Cancel</button>' +
        '<button type="button" class="btn btn-danger" id="btn-eb-l-save">Mark lost</button></div></div>';
      document.body.appendChild(m);
      $("btn-eb-l-cancel").addEventListener("click", function () { m.classList.remove("show"); });
      $("btn-eb-l-save").addEventListener("click", function () {
        var oo = eb.open;
        if (!oo) { m.classList.remove("show"); return; }
        if (!$("eb-l-reason").value) { showMsg("Pick why it was lost.", "error"); return; }
        var done = busyButton("btn-eb-l-save", "Saving…");
        srv.withSuccessHandler(function (card) {
          done();
          m.classList.remove("show");
          eb[oo.desk].lost = true;
          ebPut(oo.desk, card);
          showMsg("Marked lost.", "success");
        }).withFailureHandler(function (err) { done(); onServerError(err); })
          .markBoardCardLost({ ref: oo.ref, reasonId: $("eb-l-reason").value, note: $("eb-l-note").value.trim() });
      });
    }
    $("eb-l-title").textContent = "Mark " + (c.no || "this enquiry") + " as lost";
    $("eb-l-reason").innerHTML = '<option value="">— pick —</option>' + (d.lostReasons || []).map(function (r) {
      return '<option value="' + escapeHtml(r.id) + '">' + escapeHtml(r.text) + "</option>";
    }).join("");
    $("eb-l-note").value = "";
    $("eb-lost-backdrop").classList.add("show");
  }

  /** Opens the ERP 1 record behind a card, where it is worked as it always was. */
  function ebGo(kind, id) {
    ebCloseCard();
    if (kind === "quotation") { openQuotation(id); return; }
    if (kind === "order") { openOrderModal(id); return; }
    if (kind === "opportunity") { openOpportunityModal(id); return; }
    if (kind === "enquiry") {
      if (enquiriesCache.some(function (x) { return x.id === id; })) { openEnquiryModal(id); return; }
      srv.withSuccessHandler(function (rows) { enquiriesCache = rows; openEnquiryModal(id); })
        .withFailureHandler(onServerError).listSpareEnquiries({ includeClosed: true });
      return;
    }
    if (kind === "lead") {
      var show = function () {
        if (leadsCache.some(function (x) { return x.id === id; })) { openLeadModal(id); return; }
        srv.withSuccessHandler(function (rows) { leadsCache = rows; openLeadModal(id); })
          .withFailureHandler(onServerError).listLeads({ includeClosed: true });
      };
      ensureLeadFormData();
      show();
    }
  }

  function ebMove(to) {
    var o = eb.open;
    if (!o) return;
    var run = function (note) {
      srv.withSuccessHandler(function (card) {
        var d = eb[o.desk].data;
        d.cards = d.cards.map(function (c) { return c.ref === card.ref ? card : c; });
        ebRender(o.desk);
        if (eb.open && eb.open.ref === card.ref) ebDrawCard(o.desk, card);
        showMsg("Moved to " + ebLabel(o.desk, card.stage) + ".", "success");
      }).withFailureHandler(onServerError).moveBoardCard({ ref: o.ref, to: to, note: note || "" });
    };
    if (to === "negotiation") {
      askDialog({
        title: "The customer is negotiating",
        message: "Say what they are discussing, so whoever picks it up knows. The quotation stays sent; ERP 1 shows it as Sent.",
        input: true, inputLabel: "What are they discussing?", placeholder: "e.g. Wants 5% off; asking for 30 days credit",
        okLabel: "Move to " + ebLabel(o.desk, "negotiation"),
        validate: function (v) { return String(v || "").trim().length < 5 ? "A few words, please." : ""; }
      }, function (note) { if (note !== null) run(note); });
      return;
    }
    run("");
  }

  // ================= SERVICE DUE CALLS =================
  // ELGi's weekly Service Due Report, worked machine by machine: the call, the spares
  // quotation sent whatever the answer, the follow-ups, and how it ended — a PO, or the reason
  // it did not happen. The two reasons stand out everywhere, because they are what the report
  // is read for. The server is ServiceDue.gs.
  var sdc = { data: null, listId: "", view: "open", selected: {}, open: null, shown: 150 };
  var SDC_PAGE = 150;
  // ERP 2.0 works each call from its row: what the customer said, a remark and the quotation's
  // type, without opening the call. Only on the 2.0 face (server/page.js marks the page); the
  // current and classic looks keep the row as it was.
  var SDC_INLINE = FACE_V2;

  function initServiceDueView() { loadServiceDue(); }

  function loadServiceDue(then) {
    srv.withSuccessHandler(function (d) {
      sdc.data = d;
      $("btn-sdc-import").style.display = d.canEdit ? "" : "none";
      fillServiceDueFilters();
      renderServiceDue();
      if (then) then();
    }).withFailureHandler(onServerError).getServiceDueScreen({ listId: sdc.listId, view: sdc.view });
  }

  function sdcToday() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function sdcDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ""));
    return m ? m[3] + "-" + m[2] + "-" + m[1] : "";
  }
  function sdcPerson(email) {
    var p = ((sdc.data && sdc.data.coordinators) || []).filter(function (x) { return x.email === email; })[0];
    return p ? p.name : (email || "");
  }
  var SDC_BADGE = {
    "To call": "badge-new", "Called": "badge-followup", "Quotation prepared": "badge-draft",
    "Quotation sent": "badge-sent", "Following up": "badge-sent", "PO received": "badge-won",
    "Not closed": "badge-lost", "PO rejected": "badge-lost"
  };
  function sdcBadge(status) {
    return '<span class="badge ' + (SDC_BADGE[status] || "badge-draft") + '">' + escapeHtml(status) + "</span>";
  }
  /** The reason a call was not closed, or a PO rejected — highlighted wherever it shows. */
  function sdcReason(c) {
    var r = c.notClosedReason || c.poRejectedReason || "";
    if (!r) return "";
    return '<div class="sdc-reason"><b>' + escapeHtml(c.status === "PO rejected" ? "PO rejected: " : "Not closed: ") +
      "</b>" + escapeHtml(r) + "</div>";
  }

  function fillServiceDueFilters() {
    var d = sdc.data;
    var keep = function (id) { return $(id).value; };
    $("sdc-list").innerHTML = '<option value="">Every week</option>' + d.lists.map(function (l) {
      return '<option value="' + escapeHtml(l.id) + '">Week of ' + escapeHtml(sdcDate(l.listDate)) +
        " · " + (Number(l.machineCount) || 0) + " machines</option>";
    }).join("");
    $("sdc-list").value = sdc.listId;
    $("sdc-view").value = sdc.view;
    var status = keep("sdc-status");
    $("sdc-status").innerHTML = '<option value="">Any status</option>' + d.statuses.map(function (s) {
      return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + "</option>";
    }).join("");
    $("sdc-status").value = status;
    var owner = keep("sdc-owner");
    var people = '<option value="">Everyone</option><option value="__me">Mine</option>' +
      d.coordinators.map(function (p) {
        return '<option value="' + escapeHtml(p.email) + '">' + escapeHtml(p.name) + "</option>";
      }).join("");
    $("sdc-owner").innerHTML = people;
    $("sdc-owner").value = owner;
    $("sdc-bulk-owner").innerHTML = d.coordinators.map(function (p) {
      return '<option value="' + escapeHtml(p.email) + '">' + escapeHtml(p.name) + "</option>";
    }).join("");
    $("btn-sdc-remove-list").style.display = sdc.listId && d.canEdit ? "" : "none";
  }

  // A wrong file uploaded: take that week back out. Calls already worked on stay.
  $("btn-sdc-remove-list").addEventListener("click", function () {
    var list = ((sdc.data && sdc.data.lists) || []).filter(function (l) { return l.id === sdc.listId; })[0];
    if (!list) return;
    askDialog({
      title: "Remove this upload?",
      message: "The upload for the week of " + sdcDate(list.listDate) + " (" + (Number(list.machineCount) || 0) +
        " machines) comes out. Calls nobody has worked on yet are deleted; any already called, quoted or " +
        "closed stay. Machines also on an earlier week go back to that week.",
      okLabel: "Remove upload",
      danger: true
    }, function () {
      var done = busyButton("btn-sdc-remove-list", "Removing…");
      srv.withSuccessHandler(function (r) {
        done();
        sdc.listId = "";
        sdc.selected = {};
        var notes = [];
        if (r.kept) notes.push(r.kept + (r.kept === 1 ? " call already worked on was" : " calls already worked on were") + " kept");
        if (r.carried) notes.push(r.carried + " also on an earlier week went back to it");
        showMsg("Upload for the week of " + sdcDate(r.listDate) + " removed: " + r.removed +
          (r.removed === 1 ? " call" : " calls") + " deleted." + (notes.length ? " " + notes.join("; ") + "." : ""), "success");
        loadServiceDue();
      }).withFailureHandler(function (err) { done(); onServerError(err); }).deleteServiceDueList(list.id);
    });
  });

  /** The calls the screen's own filters leave, on top of the server's week and open/closed. */
  function serviceDueShown() {
    var d = sdc.data;
    if (!d) return [];
    var status = $("sdc-status").value;
    var owner = $("sdc-owner").value === "__me" ? d.me : $("sdc-owner").value;
    var q = $("sdc-search").value.trim().toLowerCase();
    var overdue = $("sdc-overdue").checked;
    var due = $("sdc-due").checked;
    var today = sdcToday();
    return d.calls.filter(function (c) {
      if (status && c.status !== status) return false;
      if (owner && c.ownerEmail !== owner) return false;
      if (overdue && c.overdue !== "TRUE") return false;
      if (due && !(c.nextFollowUpDate && c.nextFollowUpDate <= today && !c.outcome)) return false;
      if (q) {
        var hay = [c.customerName, c.sdrCustomerName, c.fabNo, c.productModel, c.quoteNo].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderServiceDue() {
    var d = sdc.data;
    renderServiceDueTiles();

    var rows = serviceDueShown();
    var body = rows.slice(0, sdc.shown).map(sdcRowHtml).join("");
    $("sdc-tbody").innerHTML = body || '<tr><td colspan="' + (SDC_INLINE ? 10 : 9) + '" class="empty">' +
      (d.calls.length ? "Nothing matches these filters." :
        (d.lists.length ? "No calls here." : "No list uploaded yet. Press Upload weekly sheet and pick this week's Service Due Report.")) +
      "</td></tr>";
    $("sdc-more").innerHTML = rows.length > sdc.shown
      ? '<div style="text-align:center; margin:12px 0;"><button class="btn btn-sm" id="btn-sdc-more" type="button">Show ' +
        Math.min(SDC_PAGE, rows.length - sdc.shown) + " more of " + (rows.length - sdc.shown) + "</button></div>" : "";
    if ($("btn-sdc-more")) {
      $("btn-sdc-more").addEventListener("click", function () { sdc.shown += SDC_PAGE; renderServiceDue(); });
    }
    // Only what the filters leave stays ticked, so Assign never touches a call nobody can see.
    var inView = {};
    rows.forEach(function (c) { inView[c.id] = true; });
    Object.keys(sdc.selected).forEach(function (id) { if (!inView[id]) delete sdc.selected[id]; });
    renderServiceDueBulk();
  }

  /** The count of calls in each status, above the list; pressing one filters to it. */
  function renderServiceDueTiles() {
    var d = sdc.data;
    var counts = {};
    d.calls.forEach(function (c) { counts[c.status] = (counts[c.status] || 0) + 1; });
    var active = $("sdc-status").value;
    // ERP 2's totals for the list on 2.0: customers in it, called, quotations raised, converted.
    var strip = "";
    if (FACE_V2) {
      var custs = {};
      var called = 0;
      var quoted = [];
      var won = [];
      d.calls.forEach(function (c) {
        custs[String(c.customerId || c.customerName || c.id).toLowerCase()] = true;
        if (c.status !== "To call") called++;
        if (c.quoteNo || c.quotationId) quoted.push(c);
        if (c.status === "PO received") won.push(c);
      });
      var sum = function (list, k) { return list.reduce(function (n, c) { return n + (Number(c[k]) || 0); }, 0); };
      strip = '<div class="sdc-totals">' + [
        ["Customers in the list", Object.keys(custs).length, ""],
        ["Called", called, d.calls.length ? Math.round(called / d.calls.length * 100) + "% of the list" : ""],
        ["Quotations raised", quoted.length, sum(quoted, "quoteValue") ? fmtShort(sum(quoted, "quoteValue")) : ""],
        ["Converted", won.length, sum(won, "poValue") ? fmtShort(sum(won, "poValue")) + " won" : ""]
      ].map(function (t) {
        return '<div class="pd-tile"><span class="pd-label">' + escapeHtml(t[0]) + '</span><span class="pd-value">' + t[1] +
          '</span><span class="pd-sub">' + escapeHtml(t[2]) + "</span></div>";
      }).join("") + "</div>";
    }
    $("sdc-summary").innerHTML = strip + '<div class="sdc-tiles">' +
      '<button type="button" class="kpi-card sdc-tile' + (active ? "" : " on") + '" data-sdc-tile="">' +
        '<div class="kpi-label">All</div><div class="kpi-value">' + d.calls.length + "</div></button>" +
      d.statuses.map(function (s) {
        var bad = s === "Not closed" || s === "PO rejected";
        return '<button type="button" class="kpi-card sdc-tile' + (bad && counts[s] ? " alert" : "") +
          (active === s ? " on" : "") + '" data-sdc-tile="' + escapeHtml(s) + '">' +
          '<div class="kpi-label">' + escapeHtml(s) + '</div><div class="kpi-value">' + (counts[s] || 0) +
          "</div></button>";
      }).join("") + "</div>";
    $("sdc-summary").querySelectorAll("[data-sdc-tile]").forEach(function (b) {
      b.addEventListener("click", function () {
        $("sdc-status").value = b.dataset.sdcTile;
        sdc.shown = SDC_PAGE;
        renderServiceDue();
      });
    });
  }

  /** One call's row on the list. */
  function sdcRowHtml(c) {
    var d = sdc.data;
    var today = sdcToday();
    var limit = d.followUpLimit || 6;
    var name = c.customerName || c.sdrCustomerName;
    var dueNext = c.nextFollowUpDate && !c.outcome
      ? '<div class="' + (c.nextFollowUpDate <= today ? "sdc-late" : "sdc-muted") + '">Next ' +
        escapeHtml(sdcDate(c.nextFollowUpDate)) + "</div>" : "";
    return '<tr data-sdc="' + escapeHtml(c.id) + '">' +
      '<td><input type="checkbox" data-sdc-tick="' + escapeHtml(c.id) + '"' +
        (sdc.selected[c.id] ? " checked" : "") + " /></td>" +
      "<td><b>" + escapeHtml(name) + "</b>" +
        (c.customerId ? "" : '<div class="sdc-warn">Not in Customers yet</div>') +
        (c.previousOutcome ? '<div class="sdc-muted">Last time: ' + escapeHtml(c.previousOutcome) + "</div>" : "") +
      "</td>" +
      "<td>" + escapeHtml(c.productModel) + '<div class="mono sdc-muted">' + escapeHtml(c.fabNo) +
        (Number(c.listedCount) > 1 ? " · listed " + c.listedCount + "×" : "") + "</div></td>" +
      '<td class="sdc-due">' + sdcDueHtml(c.dueParts) + "</td>" +
      "<td>" + escapeHtml(sdcPerson(c.ownerEmail)) + "</td>" +
      (SDC_INLINE ? sdcInlineCells(c) :
      "<td>" + (c.callDate ? escapeHtml(sdcDate(c.callDate)) + '<div class="sdc-muted">' +
        escapeHtml(c.callResponse || "") + "</div>" : '<span class="sdc-muted">Not yet</span>') + "</td>" +
      "<td>" + (c.quoteNo ? sdcQuoteHtml(c) : '<span class="sdc-muted">—</span>') + "</td>") +
      "<td>" + (Number(c.followUpCount) || 0) + " of " + limit + dueNext + "</td>" +
      "<td>" + sdcBadge(c.status) + sdcReason(c) + "</td>" +
      "</tr>";
  }

  /** The quotation on a call: its number, value and when it went, and on 2.0 what it is for. */
  function sdcQuoteHtml(c) {
    return '<span class="mono">' + escapeHtml(c.quoteNo) + "</span>" +
      '<div class="sdc-muted">' + (c.quoteValue !== "" ? fmt(c.quoteValue) : "") +
      (c.sentDate ? " · sent " + escapeHtml(sdcDate(c.sentDate)) : "") + "</div>" +
      (SDC_INLINE && c.enquiryType && c.enquiryType !== "Spares"
        ? '<div class="sdc-type">' + escapeHtml(c.enquiryType) + "</div>" : "");
  }

  /**
   * 2.0's row: what the customer said, a remark and the quotation, each worked where it is.
   * A closed call, or someone who may only look, sees them as text.
   */
  function sdcInlineCells(c) {
    var d = sdc.data;
    var id = escapeHtml(c.id);
    var live = d.canEdit && !c.outcome;
    var said = live
      ? '<select class="sdc-inline" data-sdc-resp="' + id + '" aria-label="What they said">' +
          (c.callResponse ? "" : '<option value="">Not called yet</option>') +
          (d.responses || []).map(function (r) {
            return '<option value="' + escapeHtml(r) + '"' + (r === c.callResponse ? " selected" : "") + ">" +
              escapeHtml(r) + "</option>";
          }).join("") + "</select>" +
        (c.callDate ? '<div class="sdc-muted">' + escapeHtml(sdcDate(c.callDate)) + "</div>" : "")
      : (c.callDate ? escapeHtml(c.callResponse || "") + '<div class="sdc-muted">' + escapeHtml(sdcDate(c.callDate)) + "</div>"
        : '<span class="sdc-muted">Not yet</span>');
    var remark = live
      ? '<input class="sdc-inline sdc-remark" data-sdc-remark="' + id + '" value="' + escapeHtml(c.callNotes || "") +
        '" placeholder="Remark" aria-label="Remark" />'
      : (c.callNotes ? escapeHtml(c.callNotes) : '<span class="sdc-muted">—</span>');
    var quote = c.quoteNo ? sdcQuoteHtml(c)
      : !live ? '<span class="sdc-muted">—</span>'
      : !c.customerId ? '<span class="sdc-muted">Link the customer first</span>'
      : '<select class="sdc-inline" data-sdc-quote="' + id + '" aria-label="Prepare a quotation">' +
          '<option value="">Quote…</option>' + (d.quoteTypes || ["Spares"]).map(function (t) {
            return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + "</option>";
          }).join("") + "</select>";
    return "<td>" + said + "</td><td>" + remark + "</td><td>" + quote + "</td>";
  }

  /** Puts one call back on the list as the server now has it, leaving the other rows be. */
  function sdcPutRow(fresh) {
    var calls = (sdc.data && sdc.data.calls) || [];
    for (var i = 0; i < calls.length; i++) {
      if (calls[i].id !== fresh.id) continue;
      var keep = calls[i];
      Object.keys(keep).forEach(function (k) { if (fresh[k] !== undefined) keep[k] = fresh[k]; });
      var tr = document.querySelector('#sdc-tbody tr[data-sdc="' + String(fresh.id).replace(/"/g, "") + '"]');
      if (tr) {
        // A remark still being typed in this row survives the row being drawn again.
        var typing = document.activeElement;
        var draft = typing && tr.contains(typing) && typing.dataset && typing.dataset.sdcRemark
          ? { value: typing.value, start: typing.selectionStart, end: typing.selectionEnd } : null;
        var holder = document.createElement("tbody");
        holder.innerHTML = sdcRowHtml(keep);
        var row = holder.firstChild;
        if (row) {
          tr.parentNode.replaceChild(row, tr);
          var box = draft && row.querySelector("[data-sdc-remark]");
          if (box) {
            box.value = draft.value;
            box.focus();
            try { box.setSelectionRange(draft.start, draft.end); } catch (e) { /* not a text box */ }
          }
        }
      }
      break;
    }
    renderServiceDueTiles();
  }

  function sdcRowSave(input, okText, revert) {
    srv.withSuccessHandler(function (fresh) {
      sdcPutRow(fresh);
      showMsg(okText, "success");
    }).withFailureHandler(function (err) {
      if (revert) revert();
      onServerError(err);
    }).saveServiceDueCall(input);
  }

  if (SDC_INLINE) {
    // The header follows the row: what they said and a remark in place of the one Call column.
    (function () {
      var head = $("sdc-tbody").parentNode.querySelector("thead tr");
      var cells = head ? head.children : [];
      if (cells.length === 9 && /Call/.test(cells[5].textContent)) {
        cells[5].textContent = "What they said";
        var th = document.createElement("th");
        th.textContent = "Remark";
        head.insertBefore(th, cells[6]);
      }
    })();

    $("sdc-tbody").addEventListener("change", function (e) {
      var t = e.target;
      var c = function (id) { return ((sdc.data && sdc.data.calls) || []).filter(function (x) { return x.id === id; })[0]; };
      if (t.dataset.sdcResp) {
        var call = c(t.dataset.sdcResp);
        if (!call || !t.value) return;
        var remark = t.closest("tr").querySelector("[data-sdc-remark]");
        var was = call.callResponse || "";
        // A call logged from the row: today, unless one was already logged; the remark and the
        // person spoken to as they are.
        sdcRowSave({
          id: call.id, callResponse: t.value, callDate: call.callDate || sdcToday(),
          callNotes: remark ? remark.value : (call.callNotes || ""),
          contactName: call.contactName || "", contactId: call.contactId || ""
        }, "Saved: " + t.value + ".", function () { t.value = was; });
        return;
      }
      if (t.dataset.sdcRemark) {
        var rc = c(t.dataset.sdcRemark);
        if (!rc || t.value.trim() === String(rc.callNotes || "").trim()) return;
        var before = rc.callNotes || "";
        sdcRowSave({ id: rc.id, callNotes: t.value }, "Remark saved.", function () { t.value = before; });
        return;
      }
      if (t.dataset.sdcQuote) {
        var qc = c(t.dataset.sdcQuote);
        var type = t.value;
        if (!qc || !type) return;
        t.disabled = true;
        srv.withSuccessHandler(function (r) {
          loadServiceDue();
          showMsg((r.existing ? "Opening " : (r.enquiryType && r.enquiryType !== "Spares" ? r.enquiryType + " quotation " : "Quotation ")) +
            (r.quoteNo || "") + (r.existing ? "." : " raised for " + qc.fabNo + ". Add the lines, then e-mail it to the customer."), "success");
          openQuotation(r.quotationId);
        }).withFailureHandler(function (err) {
          t.disabled = false;
          t.value = "";
          onServerError(err);
        }).prepareServiceDueQuotation(qc.id, type);
      }
    });
    // Enter in a remark keeps it, like leaving the box.
    $("sdc-tbody").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.dataset && e.target.dataset.sdcRemark) e.target.blur();
    });
  }

  /** "Overdue: AF, OF · This month: AOS" with the overdue part in red. */
  function sdcDueHtml(text) {
    return String(text || "").split(" · ").map(function (part) {
      return /^Overdue:/.test(part) ? '<span class="sdc-late">' + escapeHtml(part) + "</span>" : escapeHtml(part);
    }).join("<br>") || '<span class="sdc-muted">—</span>';
  }

  /**
   * The bar above the table: Select all, for every call the filters leave (not only the rows
   * on screen), and once anything is ticked, who to give them to.
   */
  function renderServiceDueBulk() {
    var d = sdc.data;
    var shown = serviceDueShown();
    var n = Object.keys(sdc.selected).length;
    var picked = shown.filter(function (c) { return sdc.selected[c.id]; }).length;
    var all = shown.length > 0 && picked === shown.length;
    ["sdc-selectall", "sdc-all"].forEach(function (id) {
      $(id).checked = all;
      $(id).indeterminate = picked > 0 && !all;
      $(id).disabled = !shown.length;
    });
    $("sdc-selectall-text").textContent = "Select all " + shown.length;
    $("sdc-bulk").style.display = d && d.canEdit ? "" : "none";
    $("sdc-bulk").classList.toggle("on", n > 0);
    $("sdc-bulk-actions").style.display = n ? "inline-flex" : "none";
    $("sdc-bulk-count").textContent = n + (n === 1 ? " call ticked — assign to" : " calls ticked — assign to");
  }

  /** Ticks, or clears, every call the filters leave — all of them, not only the rows shown. */
  function selectAllServiceDue(on) {
    serviceDueShown().forEach(function (c) {
      if (on) sdc.selected[c.id] = true; else delete sdc.selected[c.id];
    });
    renderServiceDue();
  }

  $("sdc-tbody").addEventListener("click", function (e) {
    var tick = e.target.closest("[data-sdc-tick]");
    if (tick) {
      if (tick.checked) sdc.selected[tick.dataset.sdcTick] = true; else delete sdc.selected[tick.dataset.sdcTick];
      renderServiceDueBulk();
      return;
    }
    if (e.target.closest(".sdc-inline")) return;
    var row = e.target.closest("[data-sdc]");
    if (row) openServiceDueCall(row.dataset.sdc);
  });
  $("sdc-all").addEventListener("change", function () { selectAllServiceDue($("sdc-all").checked); });
  $("sdc-selectall").addEventListener("change", function () { selectAllServiceDue($("sdc-selectall").checked); });
  $("btn-sdc-clear").addEventListener("click", function () {
    sdc.selected = {};
    renderServiceDue();
  });
  $("btn-sdc-assign").addEventListener("click", function () {
    var ids = Object.keys(sdc.selected);
    var to = $("sdc-bulk-owner").value;
    var done = busyButton("btn-sdc-assign", "Assigning…");
    srv.withSuccessHandler(function (r) {
      done();
      sdc.selected = {};
      showMsg(r.assigned + (r.assigned === 1 ? " call" : " calls") + " given to " + sdcPerson(r.ownerEmail) + ".", "success");
      loadServiceDue();
    }).withFailureHandler(function (err) { done(); onServerError(err); }).assignServiceDueCalls(ids, to);
  });

  ["sdc-status", "sdc-owner", "sdc-overdue", "sdc-due"].forEach(function (id) {
    $(id).addEventListener("change", function () { sdc.shown = SDC_PAGE; renderServiceDue(); });
  });
  $("sdc-search").addEventListener("input", function () { sdc.shown = SDC_PAGE; renderServiceDue(); });
  $("sdc-list").addEventListener("change", function () { sdc.listId = $("sdc-list").value; sdc.shown = SDC_PAGE; loadServiceDue(); });
  $("sdc-view").addEventListener("change", function () { sdc.view = $("sdc-view").value; sdc.shown = SDC_PAGE; loadServiceDue(); });

  // ---- One machine's call ----
  function openServiceDueCall(id) {
    var show = function () {
      srv.withSuccessHandler(function (c) {
        sdc.open = c;
        sdcOutcomeMode = "";
        renderServiceDueCall();
        $("sdc-modal-backdrop").classList.add("show");
      }).withFailureHandler(onServerError).getServiceDueCall(id);
    };
    if (!quoteCustomers.length) loadQuoteCustomers(show); else show();
  }

  var sdcOutcomeMode = "";

  function sdcMsg(text, kind) {
    $("sdc-msg").innerHTML = text ? '<div class="msg msg-' + (kind || "error") + ' show" style="position:static;">' +
      '<span class="msg-text">' + escapeHtml(text) + "</span></div>" : "";
  }

  function renderServiceDueCall() {
    var c = sdc.open;
    var d = sdc.data || { coordinators: [], responses: [], modes: [], followUpLimit: 6 };
    var closed = !!c.outcome;
    sdcMsg("");
    $("sdc-title").textContent = c.customerName || c.sdrCustomerName;
    $("sdc-sub").textContent = c.productModel + " · Fab No " + c.fabNo + " · on the list " +
      (Number(c.listedCount) > 1 ? c.listedCount + " weeks, since " : "from ") + sdcDate(c.firstListDate);
    $("sdc-status-pill").innerHTML = sdcBadge(c.status);

    var fact = function (label, value) {
      return value ? '<div><span class="sdc-muted">' + escapeHtml(label) + "</span><br>" + escapeHtml(value) + "</div>" : "";
    };
    $("sdc-machine").innerHTML = '<div class="sdc-facts">' +
      fact("Warranty", c.warrantyType) + fact("AMC", c.amcType || "No AMC") + fact("Category", c.category) +
      fact("Last service call", [c.lastServiceCall, c.lastServiceComment].filter(Boolean).join(" — ")) +
      fact("Hours (HMR " + sdcDate(c.hmrDate) + ")", c.totalHours) +
      fact("Runs a day", c.runningHoursPerDay ? c.runningHoursPerDay + " h" : "") +
      fact("Service engineer", c.serviceEngineer) + "</div>" +
      '<div style="margin-top:8px;"><span class="sdc-muted">Due</span><br>' + sdcDueHtml(c.dueParts) +
        (c.dueDetail ? '<div class="sdc-muted mono" style="margin-top:4px;">' + escapeHtml(c.dueDetail) + "</div>" : "") + "</div>" +
      (c.previousOutcome ? '<div class="sdc-warn" style="margin-top:8px;">Last time this machine was on the list: ' +
        escapeHtml(c.previousOutcome) + "</div>" : "");

    $("sdc-customer").innerHTML = '<option value="">— not linked —</option>' + customerOptions(c.customerId);
    $("sdc-customer").value = c.customerId || "";
    $("sdc-customer-note").textContent = c.customerId
      ? (c.sdrCustomerName && c.sdrCustomerName !== c.customerName ? "ELGi's report calls them “" + c.sdrCustomerName + "”." : "")
      : "ELGi's report calls them “" + c.sdrCustomerName + "”. Pick their record — or add them in Customers first. The quotation needs it.";
    $("sdc-owner-pick").innerHTML = d.coordinators.map(function (p) {
      return '<option value="' + escapeHtml(p.email) + '">' + escapeHtml(p.name) + "</option>";
    }).join("") + (d.coordinators.some(function (p) { return p.email === c.ownerEmail; }) || !c.ownerEmail
      ? "" : '<option value="' + escapeHtml(c.ownerEmail) + '">' + escapeHtml(c.ownerEmail) + "</option>");
    $("sdc-owner-pick").value = c.ownerEmail || "";

    $("sdc-contacts").innerHTML = (c.contacts || []).length
      ? (c.contacts || []).map(function (p) {
          return '<span class="sdc-contact"><b>' + escapeHtml(p.name) + "</b>" +
            (p.phone ? ' · <a href="tel:' + escapeHtml(p.phone) + '">' + escapeHtml(p.phone) + "</a>" : "") +
            (p.email ? " · " + escapeHtml(p.email) : "") + "</span>";
        }).join("")
      : (c.customerId ? '<span class="sdc-muted">No contacts on their record. Add one in Customers so the quotation has an e-mail to go to.</span>' : "");
    $("sdc-contact-list").innerHTML = (c.contacts || []).map(function (p) {
      return '<option value="' + escapeHtml(p.name) + '"></option>';
    }).join("");

    $("sdc-call-date").value = c.callDate || sdcToday();
    $("sdc-call-contact").value = c.contactName || "";
    $("sdc-call-response").innerHTML = '<option value="">— pick —</option>' + d.responses.map(function (r) {
      return '<option value="' + escapeHtml(r) + '">' + escapeHtml(r) + "</option>";
    }).join("");
    $("sdc-call-response").value = c.callResponse || "";
    $("sdc-call-notes").value = c.callNotes || "";
    ["sdc-call-date", "sdc-call-contact", "sdc-call-response", "sdc-call-notes"].forEach(function (id) {
      $(id).disabled = closed;
    });

    // The quotation.
    if (c.quotationId) {
      $("sdc-quote").innerHTML = '<div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;">' +
        '<div><span class="mono"><b>' + escapeHtml(c.quoteNo) + "</b></span> · " +
          (c.quoteValue !== "" ? fmt(c.quoteValue) + " · " : "") + escapeHtml(c.quoteStatus) +
          (c.sentDate ? " · sent " + escapeHtml(sdcDate(c.sentDate)) : " · not sent yet") +
          (c.enquiryNo ? '<div class="sdc-muted">From enquiry ' + escapeHtml(c.enquiryNo) + "</div>" : "") + "</div>" +
        '<button class="btn btn-sm" id="btn-sdc-open-quote" type="button">Open quotation</button></div>';
      $("btn-sdc-open-quote").addEventListener("click", function () {
        $("sdc-modal-backdrop").classList.remove("show");
        openQuotation(c.quotationId);
      });
    } else {
      $("sdc-quote").innerHTML = (closed ? '<span class="sdc-muted">No quotation was raised.</span>' :
        '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">' +
          // 2.0 says what the offer is for — spares, an AMC renewal or a service — and its heading follows.
          (SDC_INLINE ? '<select id="sdc-quote-type" aria-label="Quotation for"' + (c.customerId ? "" : " disabled") + ">" +
            ((sdc.data && sdc.data.quoteTypes) || ["Spares"]).map(function (t) {
              return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + "</option>";
            }).join("") + "</select>" : "") +
          '<button class="btn btn-sm btn-primary" id="btn-sdc-quote" type="button"' + (c.customerId ? "" : " disabled") +
            ">" + (SDC_INLINE ? "Prepare quotation" : "Prepare spares quotation") + "</button>" +
          '<span class="sdc-muted">' + (c.customerId ? "Raises it for this machine — fab number and model on it — and opens it to add the parts and e-mail it."
            : "Link the customer record first.") + "</span></div>" +
        '<div style="display:flex; gap:8px; margin-top:8px; align-items:center;">' +
          '<span class="sdc-muted">Or one already made:</span>' +
          '<input id="sdc-link-no" class="mono" placeholder="Quotation number" style="max-width:260px;" />' +
          '<button class="btn btn-sm" id="btn-sdc-link" type="button">Link</button></div>');
      if ($("btn-sdc-quote")) $("btn-sdc-quote").addEventListener("click", prepareServiceDueQuote);
      if ($("btn-sdc-link")) $("btn-sdc-link").addEventListener("click", function () {
        sdcRun(function (h) { h.linkServiceDueQuotation(c.id, $("sdc-link-no").value); }, "Quotation linked.");
      });
    }

    // The follow-ups.
    var ups = c.followUps || [];
    var limit = d.followUpLimit || 6;

    $("sdc-followups").innerHTML = ups.length
      ? '<table class="sdc-fu"><thead><tr><th>#</th><th>Date</th><th>How</th><th>Spoke to</th><th>What was said</th>' +
        "<th>Answer</th><th>Next</th></tr></thead><tbody>" + ups.map(function (u) {
          return "<tr><td>" + escapeHtml(u.followUpNo) + "</td><td>" + escapeHtml(sdcDate(u.followUpDate)) + "</td><td>" +
            escapeHtml(u.mode) + "</td><td>" + escapeHtml(u.contactName) + "</td><td>" + escapeHtml(u.notes) +
            "</td><td>" + escapeHtml(u.response) + "</td><td>" + escapeHtml(sdcDate(u.nextFollowUpDate)) + "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<p class="sdc-muted" style="margin:0;">None yet.</p>';

    $("btn-sdc-save-call").style.display = d.canEdit === false ? "none" : "";
  }

  function renderServiceDueOutcome() {

      zone.innerHTML = '<div class="sdc-panel">' + sdcBadge(c.status) + " on " + escapeHtml(sdcDate(c.outcomeDate)) +

        (c.poDate ? " dated " + escapeHtml(sdcDate(c.poDate)) : "") +
