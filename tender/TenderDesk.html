<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tender Desk</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&display=swap">
<script>
  // The ERP's light / dark choice (web2/Shell.html keeps it as erp.theme), before anything is drawn.
  try { var th = localStorage.getItem('erp.theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
</script>
<!--
  THE TENDER DESK — a module of its own, with its own page (PIE, Nov 2026).

  The ERP's sign-in, people, tasks, files and AI, with clients of its own, behind a page of its
  own: Dashboard, Shortlisting, Tenders, PO execution, Tasks and Masters. The server keeps
  every record and every rule (src/Tenders.gs); this page draws what getTenderApp returns and
  sends each change back through one call, which answers with the fresh picture.

  It signs in with the ERP's own session (localStorage "pie.erp.session"), so moving between
  the ERP and the Tender Desk from the dashboard switch needs no second sign-in.
-->
<style>
@font-face{ font-family:'IBM Plex Sans'; font-style:normal; font-weight:400; font-display:swap; src:url('/fonts/plexsans-latin-400.woff2') format('woff2'); }
@font-face{ font-family:'IBM Plex Sans'; font-style:normal; font-weight:500; font-display:swap; src:url('/fonts/plexsans-latin-500.woff2') format('woff2'); }
@font-face{ font-family:'IBM Plex Sans'; font-style:normal; font-weight:600; font-display:swap; src:url('/fonts/plexsans-latin-600.woff2') format('woff2'); }
@font-face{ font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:swap; src:url('/fonts/plexmono-latin-400.woff2') format('woff2'); }
@font-face{ font-family:'Plus Jakarta Sans'; font-style:normal; font-weight:500 800; font-display:swap; src:url('/fonts/jakarta-latin-var.woff2') format('woff2'); }
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#EDF1EA; --line:#DAE0D5; --line-2:#C8D1C2;
  --ink:#13240F; --ink-2:#4B5948; --ink-3:#7A8776;
  --accent:#2E5E1A; --on-accent:#FFFFFF; --accent-soft:#E6F0DA; --lime:#8CC02A;
  --ok:#1F7A55; --ok-soft:#DDF1E7; --warn:#A86A12; --warn-soft:#FBEED6; --bad:#B8362F; --bad-soft:#F8E0DE; --info:#2C6795; --info-soft:#DEEBF6;
  --shadow:0 1px 2px rgba(19,36,15,.06),0 6px 24px rgba(19,36,15,.08);
  --f-display:"Lexend","Plus Jakarta Sans",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D140C; --surface:#142012; --surface-2:#1A2918; --line:#283A25; --line-2:#364C32;
  --ink:#E8EFE4; --ink-2:#AAB8A5; --ink-3:#7B8977;
  --accent:#9ED13C; --on-accent:#10200B; --accent-soft:#22361A; --lime:#9ED13C;
  --ok:#4CC18C; --ok-soft:#173326; --warn:#E3A84A; --warn-soft:#3A2C14; --bad:#F07A70; --bad-soft:#3D1D1A; --info:#73AEDD; --info-soft:#172B3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D140C; --surface:#142012; --surface-2:#1A2918; --line:#283A25; --line-2:#364C32;
  --ink:#E8EFE4; --ink-2:#AAB8A5; --ink-3:#7B8977;
  --accent:#9ED13C; --on-accent:#10200B; --accent-soft:#22361A; --lime:#9ED13C;
  --ok:#4CC18C; --ok-soft:#173326; --warn:#E3A84A; --warn-soft:#3A2C14; --bad:#F07A70; --bad-soft:#3D1D1A; --info:#73AEDD; --info-soft:#172B3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14.5px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12.5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* shell: a fixed rail beside a scrolling work area; on phones the rail is a strip across the top */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.brand{padding:4px 8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:16px;flex:none}
.brand .nm{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.15}
.brand .prod{font-size:11.5px;color:var(--ink-3)}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--ink)}
.nav-btn.on svg{color:var(--accent)}
.nav-btn .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:10px;padding:1px 7px;color:var(--ink-2)}
.nav-btn .ct.hot{background:var(--bad-soft);color:var(--bad)}
.rail-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
.top .crumbs{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.top .crumbs h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;max-width:280px;min-width:0}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:22px 24px 60px;display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}

/* the switch between the ERP and the Tender Desk */
.switch{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.switch a,.switch span{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:13px}
.switch .on{background:var(--accent);color:var(--on-accent)}
.switch a:hover{background:var(--surface-2);color:var(--ink)}

/* primitives */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ai{border-color:color-mix(in srgb,var(--lime) 70%,transparent);background:color-mix(in srgb,var(--lime) 14%,var(--surface))}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink)}
.icon-btn .dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 4px}
.mic-btn{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2,.card-h h3{flex:1;min-width:0}
.card-b{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*,.split>*,.kpis>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.01em}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ai{background:color-mix(in srgb,var(--lime) 18%,transparent);color:var(--ink)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;flex:none;font-family:var(--f-body)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:default}
.kpi[data-act]{cursor:pointer} .kpi[data-act]:hover{border-color:var(--line-2)}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}
table.t input:not([type=checkbox]),table.t select{width:100%;min-width:70px}
table.t input[type=checkbox]{width:16px;height:16px;min-width:0;margin:0;flex:none}
table.t input[id$="_name"][id^="m_clients_"],table.t input[id$="_name"][id^="m_suppliers_"]{min-width:240px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>label{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.f .req{color:var(--bad)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0}
textarea.in{min-height:64px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--lime) 30%,transparent)}
.in.miss{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad-soft) 45%,var(--surface))}
.in.lowc{background:color-mix(in srgb,var(--warn-soft) 80%,var(--surface));border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.in[readonly],.in:disabled{background:var(--surface-2);color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[disabled]{cursor:default}
.seg button.on.y{background:var(--ok-soft);color:var(--ok)} .seg button.on.n{background:var(--bad-soft);color:var(--bad)} .seg button.on.na{background:var(--surface-2);color:var(--ink)} .seg button.on.p{background:var(--warn-soft);color:var(--warn)}

.stepper{display:flex;gap:0;overflow-x:auto;padding:2px 2px 4px}
.step{flex:1;min-width:104px;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.step .bar{height:6px;border-radius:3px;background:var(--surface-2)}
.step.done .bar{background:var(--accent)} .step.cur .bar{background:var(--lime)}
.step .nm{font-size:12px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.step.done .nm{color:var(--ink-2)} .step.cur .nm{color:var(--ink);font-weight:600}

.gate{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.gate-h{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.gate ul{list-style:none;margin:0;padding:8px 16px 12px;display:flex;flex-direction:column;gap:2px}
.gate li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13px}
.gate li .ck{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px}
.gate li.ok .ck{background:var(--ok-soft);color:var(--ok)} .gate li.no .ck{background:var(--bad-soft);color:var(--bad)}
.gate li.ok span.t{color:var(--ink-2)}
.gate .ck svg{width:11px;height:11px;stroke-width:3}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .ct{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}

.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:600;font-size:13px}
.col-h .ct{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:500}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.tcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.tcard .tt{font-weight:600;font-size:13px;line-height:1.35}
.tcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}

.pbar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.qstack{display:grid;grid-template-columns:78px minmax(0,1fr) 46px;gap:6px 10px;align-items:center;font-size:12px}
.qstack .pbar{height:7px}
.qstack .pbar i.o{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}
.qstack .pbar i.p{background:color-mix(in srgb,var(--accent) 60%,var(--surface-2))}
.qstack .pbar i.d{background:color-mix(in srgb,var(--accent) 82%,var(--surface-2))}
.qstack .pbar i.v{background:var(--lime)}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px}

.lrow{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow .x{flex:1;min-width:0}
.lrow .x .a{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sev{width:4px;align-self:stretch;border-radius:2px;flex:none;background:var(--line)}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.info{background:var(--info)} .sev.ok{background:var(--ok)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}

.funnel{display:flex;flex-direction:column;gap:7px}
.funnel .fr{display:grid;grid-template-columns:130px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px}
.funnel .fb{height:20px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.funnel .fb i{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:3px}

.scrim{position:fixed;inset:0;background:rgba(10,18,9,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:640px;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{max-width:1060px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal-h h2{flex:1}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thinking{display:flex;gap:12px;align-items:center;padding:18px;border-radius:10px;background:color-mix(in srgb,var(--lime) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--lime) 40%,transparent)}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--lime);animation:pl 1.1s ease-in-out infinite;flex:none}
@keyframes pl{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.mic-big{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;margin:0 auto}
.mic-big svg{width:34px;height:34px}
.mic-big.rec{background:var(--bad);color:#fff;animation:pl 1.2s ease-in-out infinite}
.note{padding:10px 12px;border-radius:7px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px)}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,transparent,var(--lime),transparent);background-size:50% 100%;animation:bz 1s linear infinite}
@keyframes bz{0%{background-position:-50% 0}100%{background-position:150% 0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:60;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer .body{overflow-y:auto;flex:1}
.checkrow{display:flex;gap:8px;align-items:center;padding:4px 0}
.cp{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.cp:last-child{border-bottom:0}
.cp .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input[type=search]{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 8px;max-width:100%}
.ld-box{border-radius:var(--r);padding:14px 16px;background:var(--bad-soft);color:var(--bad);display:flex;flex-direction:column;gap:4px}
.ld-box.zero{background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:color-mix(in srgb,var(--lime) 30%,transparent);padding:1px 6px;border-radius:4px}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.tl .ev:last-child{border-bottom:0}
.docs{display:flex;flex-direction:column;gap:6px}
.docs a{overflow-wrap:anywhere}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.appr{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.appr:last-child{border-bottom:0}
.appr-main{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 360px}
.appr-t{font-weight:600;font-size:14.5px}
.appr-facts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2)}
.appr-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.splash{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.splash .card{max-width:460px;padding:28px}

@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand{border:0;margin:0;padding:0 8px 0 0;flex:none}
  .brand .prod,.brand .nm{display:none}
  .nav-btn{width:auto;flex:none;padding:7px 9px}
  .rail-foot{display:none}
  .g2,.hero{grid-template-columns:minmax(0,1fr)}
  .lrow{flex-wrap:wrap} .lrow .x{flex-basis:calc(100% - 40px)}
  .top,.content{padding-left:16px;padding-right:16px}
  .top .crumbs h1{font-size:18px}
  .who{max-width:170px}
  .mic-btn span{display:none}
  .cp{grid-template-columns:34px minmax(0,1fr)} .cp .seg{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app"><div class="splash"><div><span class="pulse" style="display:inline-block"></span><p class="muted">Opening the Tender Desk…</p></div></div></div>
<div id="overlay"></div>
<input type="file" id="filepick" hidden accept=".pdf,.png,.jpg,.jpeg,.webp">
<input type="file" id="csvpick" hidden accept=".csv,text/csv">
<script>
"use strict";
// ================= utils =================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const msDay = (s) => { const p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
const isDay = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
let TODAY = new Date().toISOString().slice(0, 10);
const addD = (n, base) => new Date(msDay(base || TODAY) + n * 864e5).toISOString().slice(0, 10);
const dd = (s) => isDay(s) ? Math.round((msDay(s) - msDay(TODAY)) / 864e5) : null;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fD = (s) => isDay(s) ? String(+s.slice(8, 10)).padStart(2, '0') + ' ' + MONTHS[+s.slice(5, 7) - 1] : '—';
const fDY = (s) => isDay(s) ? fD(s) + ' ' + s.slice(0, 4) : '—';
const num = (v) => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
const inr = (n) => (n === '' || n == null || isNaN(n)) ? '—' : '₹' + Math.round(+n).toLocaleString('en-IN');
const inrS = (n) => { n = +n || 0; const a = Math.abs(n); if (a >= 1e7) return '₹' + (n / 1e7).toFixed(2) + ' Cr'; if (a >= 1e5) return '₹' + (n / 1e5).toFixed(1) + ' L'; return inr(n); };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const blank = (v) => v === undefined || v === null || String(v).trim() === '';
function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach((k) => { if (a[k] == null) a[k] = /^\d+$/.test(k) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }

const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  tasks: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  back: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
  truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  clip: '<path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>'
};
const ic = (n, cls) => `<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const AVC = ['#2E5E1A', '#2C6795', '#8A4B9E', '#A86A12', '#1F7A55', '#B8362F', '#3B6F73', '#6B5B2E', '#5A4FA0'];

// ================= talking to the server =================
// The ERP's own session, so the switch from the ERP's dashboard needs no second sign-in.
const SESSION_KEY = 'pie.erp.session';
let token = null;
try { token = localStorage.getItem(SESSION_KEY); } catch (e) { token = null; }
function toErp(path) { location.href = path || '/dashboard'; }
function api(fn, args) {
  return fetch('/api/call', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, fn, args: args || [] }) })
    .then((r) => r.json().catch(() => ({})).then((b) => ({ r, b })))
    .then(({ r, b }) => {
      if (!r.ok) {
        const msg = (b && b.error) || ('HTTP ' + r.status);
        if (/SESSION_ENDED/.test(msg)) { toErp('/dashboard'); throw new Error('Your session has ended. Sign in again.'); }
        throw new Error(msg);
      }
      return b.ok;
    }, (err) => { throw (err && err.message) ? err : new Error('Could not reach the server. Check your connection.'); });
}
// Every change goes one after another, so answers never arrive out of order.
let queue = Promise.resolve();
let busyN = 0;
function setBusy(d) { busyN += d; let el = $('.busy'); if (busyN > 0 && !el) { el = document.createElement('div'); el.className = 'busy'; document.body.appendChild(el); } if (busyN <= 0 && el) el.remove(); }
function mutate(fn, args, after) {
  const run = () => {
    setBusy(1);
    return api(fn, args).then((res) => {
      setBusy(-1);
      if (res && res.state) S = res.state, TODAY = S.today || TODAY;
      if (after) after(res);
      render();
      if (res && res.message) toast(res.message);
      return res;
    }, (err) => {
      setBusy(-1);
      toast(err.message || String(err));
      return refresh().then(() => { throw err; });
    });
  };
  const p = queue.then(run, run);
  queue = p.catch(() => {});
  return p;
}
function refresh() { return api('getTenderApp').then((st) => { S = st; TODAY = S.today || TODAY; render(); }).catch(() => {}); }

// ================= state =================
let S = null;
const ui = { page: 'dashboard', id: null, tab: null, filters: { mine: false, q: '', prio: '', portal: '', view: 'board', tview: 'mine', tlink: '' },
  modal: null, drawer: false, form: {}, extract: null, voice: null, toast: null, mtab: 'members', newRow: {}, importNote: null };

// ================= lookups =================
const mem = (id) => S.members.find((m) => m.id === id);
const mName = (id) => (mem(id) || {}).name || (id ? id : '—');
const role = () => S.me.role;
// Shortlisting & Executive ('both') is Shortlisting and a Tender Executive at once. Admin is a
// separate grant (S.me.admin), not part of any role.
// PO Execution ('po') runs every PO: Items Entry's part and Fulfilment's part, as on the server.
const roleHas = (m, r) => m === r || (m === 'both' && (r === 'shortlist' || r === 'exec')) || (m === 'po' && (r === 'items' || r === 'fp'));
const has = (r) => roleHas(role(), r);
const ROLES = () => S.roles;
const cli = (id) => S.clients.find((c) => c.id === id);
const sup = (id) => S.suppliers.find((s) => s.id === id);
const portal = (id) => S.portals.find((p) => p.id === id);
const tender = (id) => S.tenders.find((t) => t.id === id);
const pobj = (id) => S.pos.find((p) => p.id === id);
const tStatus = (id) => S.taskStatuses.find((s) => s.id === id);
const DONE = 'Done';
const stageIdx = (k) => S.stages.findIndex((s) => s.k === k);
function av(id, size) {
  const m = mem(id); if (!m) return '';
  const i = S.members.indexOf(m);
  const ini = m.name.split(/\s+/).map((x) => x[0]).slice(0, 2).join('').toUpperCase();
  return `<span class="av" title="${esc(m.name)}" style="background:${AVC[i % AVC.length]}${size ? ';width:' + size + 'px;height:' + size + 'px' : ''}">${esc(ini)}</span>`;
}
function linkLabel(link) { if (!link) return ''; const k = link.slice(0, 1), id = link.slice(2); if (k === 't') { const t = tender(id); return t ? (t.no || 'Draft tender') : ''; } const p = pobj(id); return p ? 'PO ' + p.no : ''; }
function linkOwner(link) { if (!link) return ''; const k = link.slice(0, 1), id = link.slice(2); if (k === 't') return (tender(id) || {}).assignee || ''; const p = pobj(id); const it = p && p.items.find((i) => i.fp); return it ? it.fp : ''; }

// ================= tender display =================
function deadlineChip(t) {
  if (['submitted', 'opened', 'result'].includes(t.stage)) return '';
  const d = dd(t.lastDate); if (d == null) return '<span class="chip">No date</span>';
  if (d < 0) return `<span class="chip bad"><span class="d"></span>Overdue ${-d}d</span>`;
  if (d <= S.cfg.urgentDays) return `<span class="chip bad"><span class="d"></span>${d === 0 ? 'Due today' : d + 'd left'}</span>`;
  if (d <= S.cfg.alertDays) return `<span class="chip warn"><span class="d"></span>${d}d left</span>`;
  return `<span class="chip ok"><span class="d"></span>${d}d left</span>`;
}
const ckScore = (t) => t.ck || [0, S.checklist.length];
function stageLabel(t) { if (t.stage === 'result') return (S.results[t.result] || {}).l || 'Result'; return (S.stages.find((s) => s.k === t.stage) || {}).l || t.stage; }
function prioChip(p) { return p ? `<span class="chip ${p === 'High' ? 'bad' : p === 'Medium' ? 'warn' : ''}">${esc(p)}</span>` : ''; }
function stageChip(t) { if (t.stage === 'result') { const r = S.results[t.result] || {}; return `<span class="chip ${r.c || ''}">${esc(r.l || 'Result')}</span>`; } const i = stageIdx(t.stage); return `<span class="chip ${i === 1 || i === 3 ? 'info' : i >= 2 ? 'acc' : ''}">${esc(stageLabel(t))}</span>`; }
function dueChip(d, done) { if (done) return '<span class="chip ok">Complete</span>'; if (d == null) return ''; if (d < 0) return `<span class="chip bad">${-d}d overdue</span>`; if (d <= 14) return `<span class="chip warn">${d}d left</span>`; return `<span class="chip">${d}d left</span>`; }
const qtys = (it) => { const q = { ordered: 0, procured: 0, dispatched: 0, delivered: 0 }; (it.moves || []).forEach((m) => { if (q[m.t] !== undefined) q[m.t] += num(m.qty); }); return q; };
const itemVal = (it) => num(it.qty) * num(it.rate);
const pstageLabel = (p) => (S.pstages.find((s) => s.k === p.calc.stage) || {}).l || '';
const go = (page, id, tab) => `data-act="go" data-page="${page}"${id ? ` data-id="${esc(id)}"` : ''}${tab ? ` data-tab="${tab}"` : ''}`;
const refGo = (ref) => { const k = ref.slice(0, 1), id = ref.slice(2); return k === 't' ? go('tender', id) : k === 'p' ? go('po', id) : `data-act="openTask" data-id="${esc(id)}"`; };

// ================= form helpers =================
let RO = false;
const fid = (ref) => 'f_' + ref.replace(/[^a-zA-Z0-9]/g, '_');
function opts(list, cur, placeholder) { return `<option value="">${esc(placeholder == null ? 'Select…' : placeholder)}</option>` + list.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur == null ? '' : cur) ? ' selected' : ''}>${esc(l)}</option>`).join(''); }
function seg(ref, cur, choices, ro) {
  const cls = { Yes: 'y', No: 'n', NA: 'na', Partial: 'p' };
  return `<div class="seg" role="group">${choices.map((c) => `<button type="button" class="${cls[c] || 'y'}${cur === c ? ' on' : ''}" data-act="seg" data-ref="${esc(ref)}" data-v="${esc(c)}" aria-pressed="${cur === c}" ${(ro !== undefined ? ro : RO) ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div>`;
}
function F(label, ref, val, o) {
  o = o || {};
  const id = fid(ref); const t = o.type || 'text';
  // o.ro decides where it is given (Accounts may answer the EMD questions on a tender they cannot otherwise change).
  const ro = o.ro !== undefined ? !!o.ro : RO;
  const miss = o.req && blank(val) && o.showMiss;
  const cls = 'in' + (miss ? ' miss' : '') + (o.low ? ' lowc' : '');
  let ctl;
  if (t === 'select') ctl = `<select class="${cls}" id="${id}" data-ref="${esc(ref)}" ${ro ? 'disabled' : ''}>${opts(o.opts || [], val, o.ph)}</select>`;
  else if (t === 'textarea') ctl = `<textarea class="${cls}" id="${id}" data-ref="${esc(ref)}" ${ro ? 'readonly' : ''} placeholder="${esc(o.ph || '')}">${esc(val)}</textarea>`;
  else if (t === 'yesno') ctl = seg(ref, val, ['Yes', 'No'], ro);
  else if (t === 'yna') ctl = seg(ref, val, ['Yes', 'No', 'NA'], ro);
  else if (t === 'ynp') ctl = seg(ref, val, ['Yes', 'No', 'Partial'], ro);
  else if (t === 'client') {
    // The Tender Desk's own clients, picked by typing; "+ New" adds one without leaving the form.
    const c = cli(val);
    const list = 'dl_' + id;
    const first = (o.matches || []).map((m) => m.id);
    const rows = first.map(cli).filter(Boolean).concat(S.clients.filter((x) => first.indexOf(x.id) === -1));
    ctl = `<div class="row" style="gap:6px;flex-wrap:nowrap"><input class="${cls}" id="${id}" type="search" list="${list}" data-client="${esc(ref)}" value="${esc(c ? c.name : '')}" ${ro ? 'readonly' : ''} placeholder="${esc(o.ph || (S.clients.length ? 'Type to pick a client' : 'No clients yet – add one'))}" autocomplete="off">` +
      `<datalist id="${list}">${rows.map((x) => `<option value="${esc(x.name)}">${esc([x.short, x.city].filter(Boolean).join(' · '))}</option>`).join('')}</datalist>` +
      `${ro || !S.me.addClients ? '' : `<button type="button" class="btn sm" data-act="newClient" data-ref="${esc(ref)}" data-name="${esc(o.newName || '')}" title="Add a client to the list">${ic('plus')}New</button>`}</div>`;
  } else ctl = `<input class="${cls}" id="${id}" type="${t}" data-ref="${esc(ref)}" value="${esc(val)}" ${ro ? 'readonly' : ''} placeholder="${esc(o.ph || '')}" ${t === 'number' ? 'step="any" inputmode="decimal" min="0"' : ''}>`;
  return `<div class="f${o.wide ? ' wide' : ''}"><label for="${id}">${esc(label)}${o.req ? '<span class="req">*</span>' : ''}${o.low ? '<span class="ai-badge" title="AI was not sure – please check">check</span>' : ''}${o.hint ? `<span class="faint small">${esc(o.hint)}</span>` : ''}</label>${ctl}</div>`;
}
function cfFields(entity, obj, prefix, showMiss) {
  const fs = S.customFields.filter((f) => f.entity === entity);
  return fs.map((f) => {
    const ref = prefix + 'custom.' + f.id; const v = (obj.custom || {})[f.id];
    const type = f.type === 'select' ? 'select' : f.type === 'yesno' ? 'yna' : f.type === 'long' ? 'textarea' : f.type;
    const o = { type, req: !!f.gate, showMiss, hint: f.gate ? `needed for “${(S.stages.find((s) => s.k === f.gate) || {}).l || f.gate}”` : '' };
    if (type === 'select') o.opts = String(f.options || '').split(',').map((s) => s.trim()).filter(Boolean).map((s) => [s, s]);
    return F(f.label, ref, v, o);
  }).join('');
}
const L = (arr, key) => arr.map((x) => [x.id, x[key || 'name']]);
const membersOf = (r) => S.members.filter((m) => !r || roleHas(m.role, r)).map((m) => [m.id, m.name + (r ? (m.role !== r ? ' · ' + S.roles[m.role] : '') : ' · ' + S.roles[m.role])]);
function stepper(list, curKey, extra) {
  const ci = list.findIndex((s) => s.k === curKey);

function tenderFilter(list) {

  return list.filter((t) => (!f.mine || t.assignee === S.me.id) && (!f.prio || t.priority === f.prio) && (!f.portal || t.portal === f.portal)
    && (!q || [t.no, t.title, (cli(t.client) || {}).name, t.plant].join(' ').toLowerCase().includes(q)));
}
function vTenders() {
  const f = ui.filters; if (role() === 'exec' && !ui._minedef) { f.mine = true; ui._minedef = true; }
  const list = tenderFilter(S.tenders);
  const cols = [
    ['Shortlisting', (t) => t.stage === 'draft'], ['Awaiting approval', (t) => t.stage === 'approval'], ['Submission prep', (t) => t.stage === 'prep'], ['Bid approval', (t) => t.stage === 'bidcheck'],
    ['Submit on portal', (t) => t.stage === 'ready'], ['Submitted', (t) => t.stage === 'submitted'], ['Bid opened', (t) => t.stage === 'opened'],
    ['Won', (t) => t.stage === 'result' && t.result === 'won'], ['Lost / closed', (t) => t.stage === 'result' && t.result !== 'won']];
  const card = (t) => { const [a, b] = ckScore(t); const show = stageIdx(t.stage) >= 2 && t.stage !== 'result';
    return `<div class="tcard" ${go('tender', t.id)} role="button" tabindex="0"><div class="row" style="gap:6px">${prioChip(t.priority)}${deadlineChip(t)}<span class="spacer"></span>${av(t.assignee)}</div>
      <div class="tt">${esc(t.title || 'Untitled')}</div><div class="meta"><span class="mono">${esc(t.no)}</span></div>
      <div class="meta"><span>${esc((cli(t.client) || {}).short || '')}</span><span>·</span><span class="num">${inrS(t.estCost)}</span>${show ? `<span>·</span><span>CP ${a}/${b}</span>` : ''}</div>
      ${show ? `<div class="pbar" style="height:5px"><i style="width:${b ? a * 100 / b : 0}%"></i></div>` : ''}</div>`; };
  const board = `<div class="kan">${cols.map(([l, fn]) => { const items = list.filter(fn); return `<div class="col"><div class="col-h">${esc(l)}<span class="ct">${items.length}</span></div>${items.map(card).join('')}</div>`; }).join('')}</div>`;
  const table = `<div class="card tbl-wrap"><table class="t"><thead><tr><th>Tender</th><th>Client</th><th>Stage</th><th>Executive</th><th class="r">Est. cost</th><th>Last date</th><th>Checklist</th></tr></thead><tbody>
    ${list.map((t) => `<tr class="click" ${go('tender', t.id)}><td style="min-width:240px"><div style="font-weight:500">${esc(t.title || 'Untitled')}</div><div class="small faint mono">${esc(t.no)}</div></td><td>${esc((cli(t.client) || {}).name || '')}</td><td>${stageChip(t)}</td><td>${t.assignee ? av(t.assignee) + ' ' + esc(mName(t.assignee)) : '—'}</td><td class="r num">${inrS(t.estCost)}</td><td>${fD(t.lastDate)} ${deadlineChip(t)}</td><td class="num">${ckScore(t).join('/')}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No tenders match.</td></tr>'}
    </tbody></table></div>`;
  return `<div class="filters">
    <input type="search" id="tq" placeholder="Search number, title, client" value="${esc(f.q)}" data-filter="q" style="min-width:220px">
    <select id="tprio" data-filter="prio">${opts([['High', 'High'], ['Medium', 'Medium'], ['Low', 'Low']], f.prio, 'All priorities')}</select>
    <select id="tportal" data-filter="portal">${opts(L(S.portals), f.portal, 'All portals')}</select>

  </div>${f.view === 'board' ? board : table}`;

const low = (k) => { const c = ui.extract && ui.extract.conf ? ui.extract.conf[k] : null; return c != null && c < 0.85; };
function readFile(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 10 * 1024 * 1024) { reject(new Error('That file is ' + (file.size / 1048576).toFixed(1) + ' MB; the limit is 10 MB. Upload only the NIT / BOQ pages.')); return; }
    const fr = new FileReader();
    fr.onload = () => resolve({ name: file.name, dataUrl: String(fr.result) });
    fr.onerror = () => reject(new Error('That file could not be read.'));
    fr.readAsDataURL(file);
  });
}
function startExtract(kind, file) {
  const X = ui.extract = Object.assign(ui.extract || {}, { kind, status: 'reading', fileName: file.name, data: null, conf: {}, err: '', matches: [] });
  render();
  readFile(file).then((f) => {
    X.status = 'thinking'; render();
    return api(kind === 'tender' ? 'readTenderDocument' : 'readPoDocument', kind === 'tender' ? [f] : [f, X.tenderId || '']);
  }).then((out) => {
    if (ui.extract !== X) return;
    X.documentId = out.documentId; X.fileName = out.fileName || X.fileName;
    X.data = out.data; X.conf = out.conf || {}; X.matches = out.matches || []; X.aiOff = out.aiOff || '';
    X.status = 'review';
    if (kind === 'po') refreshPoChecks();
    render();
  }).catch((e) => { if (ui.extract !== X) return; X.status = 'error'; X.err = e.message || String(e); render(); });
}

function vVoice() {

    res = `${V.summary ? `<div class="note ok">${ic('check')}<span>${esc(V.summary)}</span></div>` : ''}` + V.actions.map((a, i) => {

      if (a.type === 'move') inner = `<div class="lbl">Quantity update</div><div style="font-weight:600">${esc(S.moves[a.movement] || a.movement)} · ${esc(a.qty)} on item #${esc(a.item)}</div><div class="small muted">PO ${esc(a.poNo)}${a.reference ? ' · ' + esc(a.reference) : ''}${a.date ? ' · ' + fD(a.date) : ''}</div>${a.errors && a.errors.length ? `<div class="small" style="color:var(--bad)">${esc(a.errors.join(' · '))}</div>` : ''}`;

  <div class="modal-b">
    <p class="muted" style="margin:0">Speak naturally: “Ask Rohan to call the supplier tomorrow about the balance 10 motors on PO 4417” or “Dispatched 20 RTDs on the GeM order, LR 77230”. AI turns it into tasks, quantity updates or notes for you to confirm.</p>
    <button class="mic-big${V.status === 'rec' ? ' rec' : ''}" data-act="micToggle" aria-label="${V.status === 'rec' ? 'Stop' : 'Start'} recording">${ic('mic')}</button>
    <div class="small faint" style="text-align:center">${V.status === 'rec' ? 'Listening… tap to stop' : V.micErr ? esc(V.micErr) : 'Tap to speak, or type / use your keyboard\'s dictation below'}</div>
    ${F('Transcript', 'v:text', V.text, { type: 'textarea', ph: 'Your note appears here' })}
    ${F('About', 'v:ctx', V.ctx, { type: 'select', opts: S.tenders.filter((t) => t.stage !== 'result' || t.result === 'won').map((t) => ['t:' + t.id, 'Tender ' + (t.no || t.title)]).concat(S.pos.map((p) => ['p:' + p.id, 'PO ' + p.no])), ph: 'Let AI work it out' })}
    ${res}
  </div><div class="modal-f">${V.status === 'result' && V.actions.some((a) => !a.applied && !(a.errors && a.errors.length) && !(a.type === 'note' && !a.link)) ? `<button class="btn" data-act="vApplyAll">Apply all</button>` : ''}<button class="btn pri" data-act="vProcess" ${blank(V.text) || V.status === 'thinking' ? 'disabled' : ''}>${ic('spark')}Organise with AI</button></div></div></div>`;
}
function micToggle() {
  const V = ui.voice;
  if (REC) { try { REC.stop(); } catch (e) {} REC = null; V.status = 'idle'; render(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { V.micErr = 'Speech input isn\'t supported in this browser. Use your keyboard\'s mic button or type.'; render(); return; }
  try {
    const r = new SR(); r.lang = 'en-IN'; r.continuous = true; r.interimResults = true;
    const base = V.text ? V.text + ' ' : '';
    r.onresult = (e) => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; V.text = base + s; const el = document.getElementById(fid('v:text')); if (el) el.value = V.text; const bt = document.querySelector('[data-act="vProcess"]'); if (bt) bt.disabled = blank(V.text); };
    r.onerror = (e) => { V.micErr = e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'The microphone isn\'t allowed here. Use your keyboard\'s dictation or type the note.' : 'Couldn\'t hear that. Try again or type.'; REC = null; V.status = 'idle'; render(); };
    r.onend = () => { if (REC) { REC = null; V.status = 'idle'; render(); } };
    r.start(); REC = r; V.status = 'rec'; V.micErr = ''; render();
  } catch (e) { V.micErr = 'The microphone isn\'t available here. Type or use keyboard dictation.'; render(); }
}
function vProcess() {
  const V = ui.voice; if (REC) { try { REC.stop(); } catch (e) {} REC = null; }
  V.status = 'thinking'; render();
  api('organiseTenderVoice', [V.text, V.ctx || '']).then((out) => {
    if (ui.voice !== V) return;
    V.summary = out.summary || ''; V.actions = out.actions || []; V.status = 'result'; render();
  }).catch((e) => { if (ui.voice !== V) return; V.status = 'error'; V.err = e.message; render(); });
}
function vApply(i) {
  const V = ui.voice, a = V.actions[i]; if (!a || a.applied) return Promise.resolve();
  let p;
  if (a.type === 'task') p = mutate('saveTenderTask', [{ title: a.title, assignee: a.assignee, due: a.due || addD(2), priority: a.priority || 'Medium', link: a.link || '', checklist: (a.checklist || []).map((t) => ({ t, d: false })), source: 'voice' }]);
  else if (a.type === 'move') p = mutate('recordPoMove', [a.poId, a.itemId, { t: a.movement, qty: a.qty, date: a.date, ref: a.reference, sup: a.sup, voice: true }]);
  else p = mutate('addTenderNote', [a.link, a.text]);
  return p.then(() => { a.applied = true; render(); }).catch(() => {});
}

// ================= quantity updates =================
function validateMove(it, f) {
  const E = []; const q = qtys(it); const n = num(f.qty);
  const cap = { ordered: num(it.qty) - q.ordered, procured: q.ordered - q.procured, dispatched: q.procured - q.dispatched, delivered: q.dispatched - q.delivered }[f.t];
  if (!S.moves[f.t]) E.push('Choose what happened');
  else if (!(n > 0)) E.push('Enter a quantity above 0');
  else if (n > cap) E.push(cap <= 0 ? ({ ordered: 'Full PO quantity is already ordered', procured: 'Nothing ordered is waiting to be procured', dispatched: 'Nothing procured is waiting to be dispatched', delivered: 'Nothing dispatched is waiting to be delivered' })[f.t] : `Only ${cap} ${it.uom} can be ${f.t} now`);
  if (blank(f.ref)) E.push(({ ordered: 'Supplier PO number is required', procured: 'GRN / material-ready reference is required', dispatched: 'LR number is required', delivered: 'DM / acknowledgement number is required' })[f.t] || 'Reference required');
  if (f.t === 'ordered' && !f.sup) E.push('Choose the supplier');
  if (!f.date) E.push('Enter the date'); else if (f.date > TODAY) E.push('Date cannot be in the future');
  return E;
}
function vMove() {
  const f = ui.form; const p = pobj(f.po); const it = p && p.items.find((i) => i.id === f.it);
  if (!it) return '';
  const q = qtys(it);
  const E = validateMove(it, f);
  const cap = { ordered: it.qty - q.ordered, procured: q.ordered - q.procured, dispatched: q.procured - q.dispatched, delivered: q.dispatched - q.delivered };
  const refL = { ordered: 'Supplier PO number', procured: 'GRN / material-ready ref.', dispatched: 'LR number & transporter', delivered: 'DM / acknowledgement no.' }[f.t];
  return `<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="Update quantities"><div class="modal-h"><h2>Update item #${esc(it.sr)}</h2><button class="icon-btn" data-act="closeModal" aria-label="Close">${ic('x')}</button></div><div class="modal-b">
    <div><div style="font-weight:600">${esc(it.desc)}</div><div class="small faint">PO ${esc(p.no)} · PO qty ${esc(it.qty)} ${esc(it.uom)}</div></div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th></th><th class="r">Done</th><th class="r">Can add now</th></tr></thead><tbody>
      ${Object.keys(S.moves).map((k) => `<tr><td>${esc(S.moves[k])}</td><td class="r num">${q[k]} / ${esc(it.qty)}</td><td class="r num">${cap[k]}</td></tr>`).join('')}</tbody></table></div>
    <div class="f"><label>What happened</label><div class="seg">${Object.entries(S.moves).map(([k, l]) => `<button type="button" class="y${f.t === k ? ' on' : ''}" data-act="moveType" data-v="${k}" ${cap[k] <= 0 ? 'disabled style="opacity:.4"' : ''}>${esc(l)}</button>`).join('')}</div></div>
    <div class="fgrid">${F('Quantity (' + it.uom + ')', 'n:qty', f.qty, { type: 'number', req: 1, hint: cap[f.t] > 0 ? `max ${cap[f.t]}` : '' })}${F('Date', 'n:date', f.date, { type: 'date', req: 1 })}
      ${F(refL || 'Reference', 'n:ref', f.ref, { req: 1, ph: f.t === 'dispatched' ? 'e.g. LR 88213 · VRL Logistics' : '' })}${f.t === 'ordered' ? F('Supplier', 'n:sup', f.sup, { type: 'select', opts: L(S.suppliers), req: 1, ph: S.suppliers.length ? 'Select…' : 'Add suppliers in Masters' }) : ''}</div>
    ${E.length && f.touched ? `<div class="note bad">${ic('alert')}<span>${E.map(esc).join('<br>')}</span></div>` : ''}
  </div><div class="modal-f"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="moveSave" ${E.length ? 'disabled' : ''}>Record</button></div></div></div>`;

function readablePassword() {
  const w = ['amber', 'cedar', 'copper', 'delta', 'falcon', 'garnet', 'harbour', 'indigo', 'jasper', 'lantern', 'marble', 'quartz', 'saffron', 'teak', 'walnut', 'zephyr'];
  const r = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  return w[r(w.length)] + '-' + w[r(w.length)] + '-' + (10 + r(90));
}

/** A field was changed: drawn at once, sent to the server, and the server's answer drawn. */
function setRef(ref, v) {
  const P = ref.split(':');
  const kind = P[0];
  if (kind === 't') {
    const t = tender(P[1]); if (!t) return;
    const path = P.slice(2).join(':');
    if (path !== 'eligText') setPath(t, path, v);
    mutate('saveTenderField', [t.id, path, v]);
    return;
  }
  if (kind === 'p') {
    const p = pobj(P[1]); if (!p) return;
    const path = P.slice(2).join(':');
    if (/^items\./.test(path)) { const bits = path.split('.'); const it = p.items.find((i) => i.id === bits[1]); if (it) it[bits[2]] = v; } else setPath(p, path, v);
    mutate('savePoField', [p.id, path, v]);
    return;
  }
  if (kind === 'm') {
    const k = P[1], id = P[2], f = P[3];
    const M = MASTERS[k];
    const row = id === 'new' ? ui.newRow[k] : S[k].find((x) => x.id === id);
    if (!row) return;
    row[f] = v;
    if (blank(row[M.name])) { if (id === 'new') render(); return; }
    const send = Object.assign({}, row); if (send.id === 'new') delete send.id;
    mutate('saveTenderMaster', [M.list, send], () => { if (id === 'new') ui.newRow[k] = null; });
    return;
  }
  if (kind === 'cfg') { const o = {}; o[P[1]] = v; mutate('saveTenderRules', [o]); return; }
  if (kind === 'x') { setPath(ui.extract.data, P[1], v); if (ui.extract.kind === 'po') refreshPoChecks(); soft(); return; }
  if (kind === 'xt') { ui.extract[P[1]] = v; return; }
  if (kind === 'n') { ui.form[P[1]] = v; ui.form.touched = true; soft(); return; }
  if (kind === 'v') { ui.voice[P[1]] = v; return; }
  if (kind === 'k') {
    setPath(ui.task, P[1], v);
    if (P[1] === 'link' && v && !ui.task.id) { const own = linkOwner(v); if (own) ui.task.assignee = own; }
    soft();
  }
}

// A CSV, read in the browser: the first line is the headings, quotes and commas as Excel writes them.
function parseCsv(text) {
  // Each row keeps the line of the file it started on, so a skipped one is reported where it is.
  const rows = []; let row = []; let cell = ''; let q = false; let line = 1; let start = 1;
  const t = String(text || '').replace(/^\uFEFF/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"' && t[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else { if (c === '\n') line++; cell += c; }
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cell); row.line = start; rows.push(row); row = []; cell = ''; line++; start = line; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); row.line = start; rows.push(row); }
  const clean = rows.filter((r) => r.some((x) => String(x).trim() !== ''));
  if (!clean.length) return [];
  const head = clean[0].map((h) => String(h).trim());
  return clean.slice(1).map((r) => { const o = { _line: r.line }; head.forEach((h, i) => { if (h) o[h] = (r[i] || '').trim(); }); return o; });
}

  decline(d) { ui.form = {}; ui.modal = { type: 'decline', id: d.id }; render(); },
  rejectSave() { const m = ui.modal; ui.modal = null; mutate('declineTender', [m.id, m.type, ui.form.note, ui.form.note2 || '']); },
  newTender() { ui.extract = null; mutate('newTender', [], (res) => { if (res && res.id) { ui.page = 'tender'; ui.id = res.id; ui.tab = 'details'; history.pushState(null, '', pathFor()); } }); },
  addTItem(d) { mutate('tenderItemLine', [d.id, 'add']); },
  delTItem(d) { mutate('tenderItemLine', [d.id, 'del', +d.i]); },
  brief(d) { toast('Writing the brief…'); mutate('tenderBrief', [d.id]); },
  attach(d) { pickFor = { kind: d.kind, id: d.id }; $('#filepick').click(); },
  rmDoc(d) { if (confirm('Remove this document?')) mutate('removeTenderFile', [d.id]); },

  extractOpen(d) { ui.extract = { kind: d.kind, status: 'pick', tenderId: d.tender || '' }; ui.voice = null; render(); },
  pickFile() { pickFor = null; $('#filepick').click(); },
  extractPick(d) { pickFor = null; ui.extract = { kind: d.kind, status: 'pick', tenderId: '' }; render(); $('#filepick').click(); },
  extractRetry() { ui.extract.status = 'pick'; render(); },
  poManual() { const X = ui.extract; X.kind = 'po'; X.status = 'review'; X.data = blankPo(X.tenderId); X.conf = {}; X.documentId = ''; X.fileName = ''; X.aiOff = ''; refreshPoChecks(); render(); },
  xAddItem() { const d = ui.extract.data; d.items.push(ui.extract.kind === 'po' ? { sr: d.items.length + 1, code: '', desc: '', qty: '', uom: 'Nos', rate: '', amount: '', due: d.dueDate || '', fp: '' } : { desc: '', qty: '', uom: 'Nos', spec: '' }); if (ui.extract.kind === 'po') refreshPoChecks(); render(); },
  xDelItem(d) { ui.extract.data.items.splice(+d.i, 1); if (ui.extract.kind === 'po') refreshPoChecks(); render(); },
  xSave(d) {
    const X = ui.extract;
    if (X.kind === 'tender') {
      mutate('saveTenderFromDocument', [X.data, X.documentId || '', d.send === '1'], (res) => { ui.extract = null; if (res && (res.id || res.state)) { const id = res.id; if (id) { ui.page = 'tender'; ui.id = id; ui.tab = 'details'; history.pushState(null, '', pathFor()); } } });
    } else {
      mutate('createTenderPo', [X.data, X.documentId || ''], (res) => { ui.extract = null; if (res && res.id) { ui.page = 'po'; ui.id = res.id; ui.tab = 'items'; history.pushState(null, '', pathFor()); } });
    }
  },

  voice() { const ctx = ui.page === 'tender' ? 't:' + ui.id : ui.page === 'po' ? 'p:' + ui.id : ''; ui.voice = { status: 'idle', text: '', ctx, actions: [] }; ui.extract = null; ui.modal = null; ui.task = null; ui.drawer = false; render(); },
  micToggle() { micToggle(); },
  vProcess() { vProcess(); },
  vApply(d) { vApply(+d.i); },
  vApplyAll() { const V = ui.voice; V.actions.reduce((p, a, i) => p.then(() => (!a.applied && !(a.errors && a.errors.length) && !(a.type === 'note' && !a.link)) ? vApply(i) : null), Promise.resolve()).then(() => toast('All actions applied')); },

  move(d) {
    const p = pobj(d.po); const it = p.items.find((i) => i.id === d.it); const q = qtys(it);
    ui.form = { po: d.po, it: d.it, t: q.ordered < it.qty ? 'ordered' : q.procured < q.ordered ? 'procured' : q.dispatched < q.procured ? 'dispatched' : 'delivered', qty: '', date: TODAY, ref: '', sup: it.supplier || '' };
    ui.modal = { type: 'move' }; render();
  },
  moveType(d) { ui.form.t = d.v; render(); },
  moveSave() {
    const f = ui.form; const p = pobj(f.po); const it = p.items.find((i) => i.id === f.it);
    if (validateMove(it, f).length) { f.touched = true; render(); return; }
    ui.modal = null;
    mutate('recordPoMove', [f.po, f.it, { t: f.t, qty: f.qty, date: f.date, ref: f.ref, sup: f.sup }]);
  },
  addRow(d) { mutate('poLine', [d.po, d.list, 'add']); },
  delRow(d) { mutate('poLine', [d.po, d.list, 'del', +d.i]); },
  closePO(d) { mutate('closeTenderPo', [d.id]); },

  newTask(d) { ui.task = newTaskDraft(d.link || ''); render(); setTimeout(() => { const el = document.getElementById(fid('k:title')); if (el) el.focus(); }, 30); },
  openTask(d) { const k = S.tasks.find((x) => x.id === d.id); if (!k) return; ui.task = JSON.parse(JSON.stringify(k)); ui.drawer = false; render(); },
  kSave() {
    const k = ui.task; if (blank(k.title) || !k.assignee) return;
    ui.task = null;
    mutate('saveTenderTask', [k]).catch(() => { ui.task = k; render(); });
  },
  kDelete() { const k = ui.task; if (!confirm('Delete this task?')) return; ui.task = null; mutate('deleteTenderTask', [k.id]); },
  kAddStep() { const el = $('#kstep'); if (!el || blank(el.value)) return; ui.task.checklist.push({ t: el.value.trim(), d: false }); el.value = ''; render(); setTimeout(() => { const s = $('#kstep'); if (s) s.focus(); }, 0); },
  kDelStep(d) { ui.task.checklist.splice(+d.i, 1); render(); },
  kComment() { const el = $('#kcomment'); if (!el || blank(el.value)) return; const k = ui.task; const text = el.value.trim(); mutate('commentTenderTask', [k.id, text], () => { const fresh = S.tasks.find((x) => x.id === k.id); if (fresh && ui.task) ui.task.comments = fresh.comments; }); },

  mAdd(d) { const M = MASTERS[d.k]; const row = { id: 'new' }; M.cols.forEach(([f]) => { row[f] = ''; }); if (d.k === 'customFields') { row.entity = 'tender'; row.type = 'text'; } ui.newRow[d.k] = row; render(); setTimeout(() => { const el = document.getElementById(`m_${d.k}_new_${M.name}`); if (el) el.focus(); }, 0); },
  mDelAsk(d) { ui.confirmDel = d.id; render(); },
  mDelKeep() { ui.confirmDel = null; render(); },
  mDelCancel(d) { ui.newRow[d.k] = null; render(); },
  mDel(d) { ui.confirmDel = null; mutate('deleteTenderMaster', [MASTERS[d.k].list, d.id]); },
  memberNew() { ui.form = { name: '', username: '', designation: '', role: 'exec', password: readablePassword() }; ui.modal = { type: 'member' }; render(); setTimeout(() => { const el = document.getElementById('f_n_name'); if (el) el.focus(); }, 30); },
  pwMake() { ui.form.password = readablePassword(); render(); },
  memberSave() {
    const f = ui.form; ui.modal = null;
    mutate('createTenderMember', [{ name: f.name, username: f.username, designation: f.designation, role: f.role, password: f.password }], (res) => {
      if (res && res.username) ui.made = { name: f.name, username: res.username, password: f.password };
    }).catch(() => { ui.form = f; ui.modal = { type: 'member' }; render(); });
  },
  memberPw(d) { ui.form = { password: readablePassword() }; ui.modal = { type: 'memberPw', id: d.id }; render(); },
  memberPwSave() { const id = ui.modal.id; const pw = ui.form.password; ui.modal = null; const who = mem(id) || {}; mutate('setTenderMemberPassword', [id, pw], () => { ui.made = { name: who.name, username: who.username, password: pw }; }); },
  memberClose(d) { if (confirm('Close ' + mName(d.id) + '’s account? They can no longer sign in. Their tenders and tasks stay as they are.')) mutate('saveTenderMember', [d.id, null, false]); },
  signOut() {
    fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) }).catch(() => {}).then(() => {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      location.href = '/';
    });
  },
  madeSeen() { ui.made = null; render(); },
  memberOn() { const el = $('#madd'); if (!el || !el.value) return; mutate('saveTenderMember', [el.value, null, true]); },
  memberOff(d) { if (confirm('Take ' + mName(d.id) + ' off the Tender Desk? Their tenders and tasks stay as they are.')) mutate('saveTenderMember', [d.id, null, false]); }
};

// ================= start =================
(function start() {
  if (!token) { toErp('/dashboard'); return; }
  const r = fromPath(location.pathname); ui.page = r.page; ui.id = r.id;
  api('getTenderApp').then((st) => { S = st; TODAY = S.today || TODAY; render(); }).catch((err) => {
    $('#app').innerHTML = `<div class="splash"><div class="card"><h2>The Tender Desk could not open</h2><p class="muted">${esc(err.message)}</p><a class="btn pri" href="/dashboard">${ic('back')}Back to the ERP</a></div></div>`;
  });
})();
</script>
</body>
</html>
