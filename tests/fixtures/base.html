<script>
/**
 * The server, faked, for a browser that has no Apps Script behind it.
 *
 * `google.script.run` is the only door the client goes through, so standing in for it here
 * means the real JavaScript.html runs unmodified — the thing under test is the actual client,
 * not a copy that has drifted from it.
 *
 * Every call is recorded in `window.__calls` as { fn, args }, which is how a test asserts that
 * pressing a button sent what it should have, and how many round trips a screen costs.
 *
 * Responses come from `window.__data`: a value is returned as-is, a function is called with
 * the arguments and its return used. A test overrides either before the app boots.
 */
(function () {
  // The app reads this before anything else; without it the sign-in screen shows instead.
  try { window.localStorage.setItem("pie.erp.session", "test-token"); } catch (e) { }

  window.__calls = [];
  window.__failNext = null;

  var CUSTOMERS = [
    { id: "CU-1", customerCode: "C0001", name: "Topworth Urja", gstin: "27AAECV1234F1Z5",
      active: "TRUE", addresses: [], contacts: [], paymentTerms: "NET30" },
    { id: "CU-2", customerCode: "C0002", name: "Kalyani Steels", gstin: "27AAACK5678M1Z9",
      active: "TRUE", addresses: [], contacts: [], paymentTerms: "NET30" }
  ];

  var ENQUIRIES = [
    { id: "SE-1", enquiryNo: "SE2610-0001", customerId: "CU-1", customerName: "Topworth Urja",
      contactName: "Mr Pathak", contactPhone: "9822737001", contactEmail: "",
      status: "New", urgency: "Normal", productModel: "EQ 18", serialNo: "",
      requirementText: "Air filter and separator", items: [], source: "Phone",
      expectedDeliveryDate: "", ownerEmail: "p@pie.in", ownerName: "Priya",
      createdAt: "2026-10-06" }
  ];

  var QUOTE = {
    id: "QT-9", quoteNo: "PIE/ELGI/QUOT/26-27/401", revision: "R0", date: "2026-10-06",
    businessStream: "Spare Sales", customerId: "CU-1", customerName: "Topworth Urja",
    status: "Draft", locked: false, validityDays: 30, validUntil: "2026-11-05",
    paymentTerms: "100% advance", deliveryTerms: "Ex-Works", deliveryPeriod: "2-3 weeks",
    warrantyTerms: "", notes: "", packageDiscountPct: 0, pfAmount: 0, taxMode: "Extra",
    subtotal: 0, discountAmt: 0, taxAmt: 0, grand: 0, items: [], specGaps: []
  };

  // ERP 2.0's enquiry board (EnquiryBoard.gs), a few cards on each desk. Invented.
  var BOARD_STAGES = [
    { key: "enquiry", label: "Enquiry received", how: "hand" },
    { key: "requirement", label: "Requirement understood", how: "hand" },
    { key: "quoted", label: "Quotation prepared", how: "auto", when: "a quotation is prepared" },
    { key: "sent", label: "Quotation sent", how: "auto", when: "the quotation is sent" },
    { key: "negotiation", label: "In negotiation", how: "hand", when: "the customer is discussing the offer" },
    { key: "approved", label: "Approved by customer", how: "auto", when: "the quotation is marked won" },
    { key: "po", label: "PO received", how: "auto", when: "an order is raised on the PO" },
    { key: "won", label: "Sales order (WON)", how: "auto", when: "the order clears the credit check" },
    { key: "procurement", label: "Material procurement", how: "auto", when: "material is reserved, short or ready" },
    { key: "dispatched", label: "Dispatched", how: "auto", when: "the goods leave" }
  ];
  function boardCard(ref, stage, extra) {
    return Object.assign({ ref: ref, kind: ref.indexOf("LD:") === 0 ? "lead" : ref.indexOf("QT:") === 0 ? "quotation" : "enquiry",
      id: ref.slice(3), no: ref.slice(3), date: "2026-10-20", lastDate: "2026-10-20", customerId: "CU-1",
      customerName: "Topworth Urja", what: "EG 99 · FAB-1", detail: "", type: "Spares", urgency: "Normal",
      source: "Phone", ownerEmail: "p@pie.in", ownerName: "Priya", followUp: "", followUpLabel: "Expected",
      stage: stage, closedWhy: "", value: "", moves: [], opportunityId: "", quote: null, quoteCount: 0,
      order: null, dispatch: null }, extra || {});
  }
  var BOARD_CARDS = {
    spare: [
      boardCard("SE:E1", "enquiry", { no: "SE2610-0001", moves: ["requirement"], followUp: "2026-10-01", urgency: "Breakdown" }),
      boardCard("SE:E2", "requirement", { no: "SE2610-0002", moves: ["enquiry"], ownerEmail: "d@pie.in", ownerName: "Dhriti" }),
      boardCard("SE:E3", "sent", { no: "SE2610-0003", value: 12500, moves: ["negotiation"], type: "AMC renewal",
        quote: { id: "QT-3", quoteNo: "SPARE/26/0003", revision: "R0", status: "Submitted", date: "2026-10-21", sentDate: "2026-10-22" }, quoteCount: 1 }),
      boardCard("SE:E4", "po", { no: "SE2610-0004", value: 20060,
        quote: { id: "QT-4", quoteNo: "SPARE/26/0004", revision: "R0", status: "Won", date: "2026-10-10", sentDate: "2026-10-11" }, quoteCount: 1,
        order: { id: "SO-4", orderNo: "SO/26/0004", status: "Credit Hold", poNo: "PO-4", creditHold: true } }),
      boardCard("SE:E5", "lost", { no: "SE2610-0005", closedWhy: "Lost: Price too high" }),
      boardCard("QT:Q6", "quoted", { no: "SPARE/26/0006", what: "", source: "No enquiry logged", value: 4100,
        quote: { id: "QT-6", quoteNo: "SPARE/26/0006", revision: "R0", status: "Draft", date: "2026-10-25", sentDate: "" }, quoteCount: 1 })
    ],
    compressor: [
      boardCard("LD:L1", "enquiry", { no: "LD2610-0001", what: "2 × 30 kW screw", followUpLabel: "Next action", moves: ["requirement"] }),
      boardCard("LD:L2", "negotiation", { no: "LD2610-0002", what: "Dryer for line 2", value: 410000, moves: ["sent"],
        quote: { id: "QT-7", quoteNo: "COMP/26/0007", revision: "R1", status: "Negotiating", date: "2026-10-12", sentDate: "2026-10-13" }, quoteCount: 1 })
    ]
  };

  window.__data = {
    getEnquiryBoard: function (opts) {
      var desk = opts && opts.stream === "Compressor Sales" ? "compressor" : "spare";
      return { stream: opts && opts.stream, stages: BOARD_STAGES.map(function (s) { return Object.assign({ id: "" }, s); }),
        closed: { key: "lost", label: "Rejected / Lost", id: "" }, cards: BOARD_CARDS[desk].map(function (c) { return Object.assign({}, c); }),
        recentDays: 90, canMove: true, canRename: false, me: "p@pie.in" };
    },
    moveBoardCard: function (input) {
      var all = BOARD_CARDS.spare.concat(BOARD_CARDS.compressor);
      var c = all.filter(function (x) { return x.ref === input.ref; })[0];
      var back = { requirement: ["enquiry"], enquiry: ["requirement"], negotiation: ["sent"], sent: ["negotiation"] };
      c.stage = input.to;
      c.moves = back[input.to] || [];
      return Object.assign({}, c);
    },
    bootstrap: { name: "Priya", email: "p@pie.in", role: "Sales Coordinator",
      businessStream: "Spare Sales", appName: "ELGi Sales ERP",
      appSubtitle: "Compressor & Spare Sales", appMark: "EL", build: "test" },

    listCustomers: function () { return CUSTOMERS; },
    // The enquiry screen asks for everything it needs in one call, which is the shape the
    // rest of the portal should be moving towards.
    spareSalesScreen: function () {
      return { enquiries: ENQUIRIES, customers: CUSTOMERS, lostReasons: [], knownModels: [] };
    },
    listPeople: { salesEngineers: [], coordinators: [{ email: "p@pie.in", name: "Priya" }],
      serviceCoordinators: [], serviceEngineers: [], management: [] },
    // Advisory only. Missing it wedged the save silently: the success handler calls .filter on
    // whatever came back, so a null answer throws inside the handler where the failure handler
    // cannot see it.
    findDuplicateCustomers: [],
    listSpareEnquiries: function () { return ENQUIRIES; },

    // Three parts, so the catalogue header has something to count. The real tab holds
    // 13,587, which is exactly why the count had to go on the screen at all.
    listSpares: [
      { id: "SP-1", partNo: "B010505390017", description: "Air oil separator",
        productGroup: "RCD Spares", category: "Filter", uom: "Nos", price: 713,
        active: "TRUE", onHand: 0, reserved: 0, available: 0, alternates: [], compatibility: [] },
      { id: "SP-2", partNo: "959439", description: "Oil filter element",
        productGroup: "OFSAC", category: "Filter", uom: "Nos", price: 154,
        active: "TRUE", onHand: 0, reserved: 0, available: 0, alternates: [], compatibility: [] },
      { id: "SP-3", partNo: "12437260", description: "Intake valve kit",
        productGroup: "RCD Spares", category: "Kit", uom: "Set", price: 6233,
        active: "TRUE", onHand: 0, reserved: 0, available: 0, alternates: [], compatibility: [] }
    ],
    listProducts: [],
    listProductGroups: [],
    listLostReasons: [],
    // Empty rather than absent: a null here throws inside the screen's success handler.
    listLeads: [],
    listOpportunities: [],
    listDispatches: [],
    listKnownModels: [],
    getConfigLists: { LeadSource: [], Urgency: [] },
    listActiveUsers: [{ email: "p@pie.in", name: "Priya", role: "Sales Coordinator" }],

    // Saving a customer mints one and files it, so the hand-off back to the enquiry has
    // something real to select.
    saveCustomer: function (obj) {
      // The id after the spread: a new customer arrives as { id: null }, and spreading that
      // over the minted id handed back a customer nobody could select.
      var saved = Object.assign({ customerCode: "C000" + (CUSTOMERS.length + 1), addresses: [],
        contacts: [], active: "TRUE" }, obj, { id: obj.id || "CU-" + (CUSTOMERS.length + 1) });
      CUSTOMERS.push(saved);
      return saved;
    },
    saveCustomerWithDetails: function (input) {
      return window.__data.saveCustomer(input.customer);
    },

    saveSpareEnquiry: function (obj) {
      var saved = Object.assign({ id: obj.id || "SE-2",
        enquiryNo: obj.id ? "SE2610-0001" : "SE2610-0002", items: [], status: "New" }, obj);
      if (!obj.id) ENQUIRIES.push(saved);
      return saved;
    },
    createQuotationFromEnquiry: function () { return QUOTE; },
    getQuotation: QUOTE,
    saveQuotationHeader: QUOTE,

    getDashboard: { generatedAt: "2026-10-06T09:00:00Z", stream: "", role: "Sales Coordinator",
      headline: { openOrderCount: 0, openOrderValue: 0, weightedPipeline: 0, outstanding: 0,
        overdueAmount: 0, overduePct: 0, invoicedThisMonth: 0, collectedThisMonth: 0,
        openQuotationCount: 1, openQuotationValue: 0 },
      exceptions: [], streams: [], funnel: [], ageing: [], recent: [], leadCount: 0 }
  };

  function respond(name, args, ok, fail) {
    window.__calls.push({ fn: name, args: args });
    setTimeout(function () {
      if (window.__failNext === name) {
        window.__failNext = null;
        fail(new Error("deliberate failure for " + name));
        return;
      }
      var entry = window.__data[name];
      if (entry === undefined) {
        // Louder than returning undefined: a screen quietly rendering nothing because the
        // fixture is missing an answer is a test that passes for the wrong reason.
        console.warn("fixture has no answer for " + name);
        ok(null);
        return;
      }
      ok(typeof entry === "function" ? entry.apply(null, args) : entry);
    }, 0);
  }

  function chain(handlers) {
    return {
      withSuccessHandler: function (fn) {
        return chain({ ok: fn, fail: handlers.fail });
      },
      withFailureHandler: function (fn) {
        return chain({ ok: handlers.ok, fail: fn });
      },
      call: function (token, name, args) {
        respond(name, args || [], handlers.ok || function () { },
          handlers.fail || function () { });
      }
    };
  }

  window.google = { script: { run: chain({}), host: { close: function () { } } } };
})();
</script>
